name: Settings rendered followup
'on':
  pull_request:
    paths:
    - .github/workflows/settings-render-followup.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: settings-render-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  settings-render:
    name: Windows / Settings rendered followup
    if: github.head_ref == 'codex/story-day-qualification-20261023'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Preserve source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        ref: caaf565a892fba89f6336c967ff69d06bee5cac3
        fetch-depth: 2
        persist-credentials: true
    - name: Record pinned source
      run: |
        $ErrorActionPreference = 'Stop'
        if ((git rev-parse HEAD) -cne 'caaf565a892fba89f6336c967ff69d06bee5cac3') { throw 'Candidate mismatch' }
        if ((git rev-parse 'HEAD^{tree}') -cne '750c15dbd27fe21c9aa50579e1e58b6b64989e94') { throw 'Candidate tree mismatch' }
        New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
        @{candidate='caaf565a892fba89f6336c967ff69d06bee5cac3'; tree=(git rev-parse 'HEAD^{tree}'); controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; event='${{ github.sha }}'; run_id='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
    - name: Prepare disposable checkout for credential cleanup
      run: |
        $ErrorActionPreference = 'Stop'
        # These legacy tooling gitlinks have no .gitmodules URLs. Git's
        # submodule foreach reads the index even with sparse checkout.
        # The source commit and working files remain unchanged.
        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git submodule foreach --recursive 'true'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install Godot 4.6.3 standard
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
        Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
        # SHA256 published with the official 4.6.3-stable release asset.
        $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Godot archive checksum mismatch.'
        }
        $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
        Expand-Archive -LiteralPath $archive -DestinationPath $editor
        $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
        "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & $console --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Import project
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
        $env:APPDATA = Join-Path $output 'import-user/appdata'
        $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
        $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
        $importExit = $LASTEXITCODE
        @{exit_code=$importExit} | ConvertTo-Json | Set-Content "$output/import-process.json"
        if ($importExit -ne 0) { exit $importExit }
        if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
          throw 'Project import reported script errors; inspect import.log.'
        }
    - name: Restore committed project settings after editor import
      run: |
        # Dialogic's editor scan rewrites its timeline lookup during import.
        # Execute the committed configuration with the freshly imported assets.
        git restore -- project.godot
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Render ordinary Settings and Pause custody
      timeout-minutes: 8
      run: |-
        ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'settings-render' -LogName 'settings-render.log' -EvidenceLogPath '.godot/ci/settings-render.jsonl' -TimeoutSeconds 360 -KeepRoot -Rendered -GodotArgs @('--script', 'res://tests/ui/render_settings_shared.gd')
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Refresh and independently check native caller inventories
      timeout-minutes: 12
      run: |-
        ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify native Settings captures and inventories
      run: |
        $ErrorActionPreference = 'Stop'
        @'
        import collections,json,pathlib,re,struct,subprocess,xml.etree.ElementTree as ET,zlib
        out=pathlib.Path('.godot/ci')
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='caaf565a892fba89f6336c967ff69d06bee5cac3'
        assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()=='750c15dbd27fe21c9aa50579e1e58b6b64989e94'
        assert json.loads((out/'import-process.json').read_text(encoding='utf-8-sig'))['exit_code']==0
        reports=[]
        def processes(name,count):
            events=[json.loads(x) for x in (out/(name+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if x.strip()]
            assert len(events)==count and all(e['exit_code']==0 for e in events),(name,events)
            return events
        def png(path,dimensions=None):
            data=path.read_bytes();assert len(data)>1000 and data[:8]==b'\x89PNG\r\n\x1a\n',str(path)
            cursor=8;chunks=[];compressed=b'';actual=None
            while cursor<len(data):
                length=struct.unpack('>I',data[cursor:cursor+4])[0];kind=data[cursor+4:cursor+8];payload=data[cursor+8:cursor+8+length]
                crc=struct.unpack('>I',data[cursor+8+length:cursor+12+length])[0]
                assert zlib.crc32(kind+payload)&0xffffffff==crc,str(path)
                chunks.append(kind)
                if kind==b'IHDR': actual=struct.unpack('>II',payload[:8]);assert all(n>0 for n in actual)
                if kind==b'IDAT': compressed+=payload
                cursor+=12+length
            assert chunks[0]==b'IHDR' and chunks[-1]==b'IEND' and cursor==len(data) and zlib.decompress(compressed),str(path)
            if dimensions is not None: assert actual==tuple(dimensions),(str(path),actual,dimensions)
            return {'path':str(path),'dimensions':actual,'bytes':len(data)}

        events=processes('settings-render',1)

        folder=pathlib.Path(events[0]['user_dir'])/'evidence/settings_shared'
        m=json.loads((folder/'settings-shared-measurements.json').read_text(encoding='utf-8-sig'))
        assert m['ok'] is True and not m['failure'] and m['captures']==11 and len(m['samples'])==11
        expected={(locale,size,'desktop-accessibility') for locale in ['en','zh_CN','zh_HK'] for size in [100,125,150]}
        expected.update({('en',100,'pause-preview'),('en',100,'pause-entered')})
        assert {(s['locale'],s['text_percent'],s['state']) for s in m['samples']}==expected
        assert {p.name for p in folder.glob('*.png')}=={s['file'] for s in m['samples']}
        pngs=[png(folder/s['file'],s['native_size']) for s in m['samples']]
        assert 'SETTINGS_SHARED_RENDER_VERIFIED captures=11' in pathlib.Path('.godot/phase2r_logs/settings-render.log').read_text(encoding='utf-8-sig')
        inventory_outputs={'evidence/phase_2r/runtime/'+owner+'_surface.json' for owner in ['game_state','save_manager']}
        for owner in ['game_state','save_manager']:
            for mode in ['generate','check']:
                processes('public-surfaces/'+owner+'-'+mode,1)
                log=pathlib.Path('.godot/phase2r_logs/cloud-public-surface-'+owner+'-'+mode+'.log').read_text(encoding='utf-8-sig')
                assert log.splitlines().count('SURFACE_INVENTORY: PASS')==1
            generated=pathlib.Path('evidence/phase_2r/runtime/'+owner+'_surface.json')
            assert generated.read_bytes()==(out/'public-surfaces'/(owner+'_surface.json')).read_bytes()
            inventory=json.loads(generated.read_text());assert inventory['ok'] and not inventory['errors']

        for p in [out/'import.log']+list(pathlib.Path('.godot/phase2r_logs').glob('*.log')):
            assert not re.search(r'SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character',p.read_text(encoding='utf-8-sig'),re.M),str(p)
        allowed={'.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1'}
        allowed.update(inventory_outputs)
        changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
        assert not changed-allowed,changed
        untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','--','autoload','scripts','scenes','tests'],text=True).splitlines()
        assert not [p for p in untracked if pathlib.Path(p).suffix in {'.gd','.tscn'}],untracked
        (out/'qualification-gate.json').write_text(json.dumps({'source':'caaf565a892fba89f6336c967ff69d06bee5cac3','tree':'750c15dbd27fe21c9aa50579e1e58b6b64989e94','reports':reports,'pngs':pngs,'changed':sorted(changed)},indent=2))
        print(json.dumps(reports))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Retain native evidence from isolated roots
      if: always()
      run: |
        $ErrorActionPreference = 'Stop'
        @'
        import json,pathlib,shutil
        out=pathlib.Path('.godot/ci')
        for p in sorted(out.glob('*.jsonl')):
            events=[json.loads(x) for x in p.read_text(encoding='utf-8-sig').splitlines() if x.strip()]
            for i,event in enumerate(events):
                source=pathlib.Path(event['test_root']).resolve()
                assert source.is_relative_to(pathlib.Path('.godot').resolve()),str(source)
                if source.is_dir():
                    destination=out/'native'/p.stem/str(i)
                    if i and events[i-1]['test_root']==event['test_root']: continue
                    shutil.copytree(source,destination,dirs_exist_ok=True)
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Retain original evidence and native UID provenance
      if: always()
      run: |
        $ErrorActionPreference = 'Stop'
        @'
        import hashlib,json,pathlib,subprocess,zipfile
        out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
        records=[]
        for p in pathlib.Path('tests/integration').glob('authored_week*.gd.uid'):
            target=out/'native-uids'/p.name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(p.read_bytes())
            tracked=subprocess.run(['git','ls-files','--error-unmatch','--',str(p)],capture_output=True).returncode==0
            records.append({'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'provenance':'candidate_tracked' if tracked else 'cloud_editor_import','source':'caaf565a892fba89f6336c967ff69d06bee5cac3','source_tree':'750c15dbd27fe21c9aa50579e1e58b6b64989e94'})
        (out/'uid-provenance.json').write_text(json.dumps(records,indent=2))
        (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
        manifest_source=subprocess.check_output(['git','ls-tree','-r','HEAD'],text=True)
        (out/'source-tree.txt').write_text(manifest_source)
        files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts and p.name not in ['original-evidence.zip','retained-hashes.json']]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
        manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
        retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
        archive=out/'original-evidence.zip'
        with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as z:
            for p in files:z.write(p,p.relative_to('.godot').as_posix())
        with zipfile.ZipFile(archive) as z:assert z.testzip() is None
        print(json.dumps({'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()}))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload original evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: settings-render-followup-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/original-evidence.zip
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
