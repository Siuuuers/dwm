name: Bundle serialization qualification
on:
  push:
    branches: [codex/bundle-checks-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundle-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        lane: [focused, compatibility, recall, comparison]
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and verify current inventories
        if: matrix.lane == 'focused'
        run: ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads
      - name: Verify bundle, registration, recall and canonical contracts
        if: matrix.lane == 'focused'
        run: |
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId bundle-focused -LogName bundle-focused.log -EvidenceLogPath .godot/ci/bundle-focused.jsonl -TimeoutSeconds 1100 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_scene_event_contract.gd,res://tests/unit/test_scene_registration_v2.gd,res://tests/unit/test_scene_challenge_recall.gd,res://tests/unit/test_canonical_writer_compatibility.gd', '-gexit', '-glog=1', '-gjunit_xml_file=res://.godot/ci/bundle-focused.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify focused census
        if: matrix.lane == 'focused'
        shell: python {0}
        run: |
          import json, re, xml.etree.ElementTree as ET
          from pathlib import Path
          files = [
              'tests/unit/test_scene_event_contract.gd',
              'tests/unit/test_scene_registration_v2.gd',
              'tests/unit/test_scene_challenge_recall.gd',
              'tests/unit/test_canonical_writer_compatibility.gd',
          ]
          expected = sorted(name for path in files for name in re.findall(r'^func (test_\w+)\(', Path(path).read_text(), re.M))
          root = ET.parse('.godot/ci/bundle-focused.xml').getroot()
          cases = list(root.iter('testcase'))
          assert expected and sorted(c.get('name') for c in cases) == expected
          assert all(c.get('status') == 'pass' for c in cases)
          assert not list(root.iter('failure')) + list(root.iter('error')) + list(root.iter('skipped'))
          result = {'tests': len(cases), 'assertions': sum(int(c.get('assertions', 0)) for c in cases), 'expected_names': expected}
          Path('.godot/ci/bundle-focused-result.json').write_text(json.dumps(result, indent=2) + '\n')
          print('BUNDLE_FOCUSED_VERIFIED', result['tests'], result['assertions'])
      - name: Verify installed fixture composition
        if: matrix.lane == 'compatibility'
        env:
          DWM_SCENE_READING_FIXTURE: '1'
        run: |
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId bundle-compatibility -LogName bundle-compatibility.log -EvidenceLogPath .godot/ci/bundle-compatibility.jsonl -TimeoutSeconds 1100 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_bundle_compatibility.gd', '-gexit', '-glog=1', '-gjunit_xml_file=res://.godot/ci/bundle-compatibility.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed fixture census
        if: matrix.lane == 'compatibility'
        shell: python {0}
        run: |
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          expected = sorted(re.findall(r'^func (test_\w+)\(', Path('tests/integration/test_scene_bundle_compatibility.gd').read_text(), re.M))
          root = ET.parse('.godot/ci/bundle-compatibility.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(expected) == 4 and sorted(c.get('name') for c in cases) == expected
          assert all(c.get('status') == 'pass' for c in cases)
          assert not list(root.iter('failure')) + list(root.iter('error')) + list(root.iter('skipped'))
          print('BUNDLE_COMPATIBILITY_VERIFIED', len(cases), sum(int(c.get('assertions', 0)) for c in cases))
      - name: Verify native recalled closure after fresh-process Load
        if: matrix.lane == 'recall'
        run: |
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId recall-native -Rendered -LogName recall-create.log -EvidenceLogPath .godot/ci/recall-native.jsonl -TimeoutSeconds 1100 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_challenge_recall_create.gd', '-gexit', '-glog=1', '-gjunit_xml_file=res://.godot/ci/recall-create.xml') -NextLogName recall-load.log -NextGodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_challenge_recall_load.gd', '-gexit', '-glog=1', '-gjunit_xml_file=res://.godot/ci/recall-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native recall census
        if: matrix.lane == 'recall'
        shell: python {0}
        run: |
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          for phase in ('create', 'load'):
              expected = re.findall(r'^func (test_\w+)\(', Path(f'tests/integration/test_scene_challenge_recall_{phase}.gd').read_text(), re.M)
              root = ET.parse(f'.godot/ci/recall-{phase}.xml').getroot()
              cases = list(root.iter('testcase'))
              assert len(expected) == 1 and [c.get('name') for c in cases] == expected
              assert all(c.get('status') == 'pass' for c in cases)
              assert not list(root.iter('failure')) + list(root.iter('error')) + list(root.iter('skipped'))
              print('BUNDLE_NATIVE_RECALL_VERIFIED', phase, len(cases), sum(int(c.get('assertions', 0)) for c in cases))
      - name: Verify matched comparison runtime scope
        if: matrix.lane == 'comparison'
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = 'ba7ecd57afaadac5f25df14d24300037e57edec6'
          git fetch --no-tags --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = @(git diff --name-only $baseline HEAD -- autoload scripts scenes dialogic localization project.godot)
          if ($LASTEXITCODE -ne 0 -or $paths.Count -ne 1 -or $paths[0] -cne 'scripts/domain/narrative/SceneEventContract.gd') {
            throw 'Matched runtime must differ only in SceneEventContract.'
          }
      - name: Compare complete fresh Save and Load
        if: matrix.lane == 'comparison'
        timeout-minutes: 45
        run: ./tools/testing/Invoke-FreshSaveLoadComparison.ps1 -BaseRef ba7ecd57afaadac5f25df14d24300037e57edec6
      - name: Preserve preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-checks-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/
            .godot/phase2r_logs/
            evidence/phase_2r/runtime/game_state_surface.json
            evidence/phase_2r/runtime/save_manager_surface.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
