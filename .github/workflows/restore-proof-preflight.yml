name: Retained package font resource diagnostic
on:
  push:
    branches: [codex/font-pack-diagnostic-20261024]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: font-scale-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        renderer: [ProjectDefault]
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify retained artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $metadata = gh api repos/Siuuuers/dwm/actions/artifacts/12554007624 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $metadata.expired -or $metadata.name -cne 'steam-localized-package' -or
              $metadata.workflow_run.id -ne 40078754096 -or $metadata.size_in_bytes -ne 110646112 -or
              $metadata.digest -cne 'sha256:b0ec6364ec358516ece538405da0092f86155a09d7a2d1aaae6cc218de4f8a58') { throw 'Retained artifact identity mismatch.' }
          $metadata | ConvertTo-Json -Depth 20 | Set-Content "$env:RUNNER_TEMP/font-pack-artifact.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12554007624
          run-id: 40078754096
          github-token: ${{ github.token }}
          repository: Siuuuers/dwm
          path: ${{ runner.temp }}/retained-font-package
          merge-multiple: true
      - name: Probe exact packaged font resources under editor
        timeout-minutes: 7
        run: ./tools/testing/Invoke-PackFontDiagnostic.ps1 -PackagePath "$env:RUNNER_TEMP/retained-font-package"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-pack-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/font-pack-evidence/
            ${{ runner.temp }}/font-pack-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
