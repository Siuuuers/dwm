name: Verify P-L document curation (temporary)
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/pl-curation/**', '.github/workflows/pl-curation.yml']
permissions:
  contents: write
jobs:
  curate:
    if: github.repository == 'Siuuuers/dwm' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'story/pl-workspace-foundation-2026-10-01'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify and publish only the reviewed curation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess,tarfile,io,shutil,sys
          from pathlib import Path
          base='3b553e1a3d986fa0de3be4a529f895cba4d9acca'
          archive='62fd8bf3966e4df7e03bf52952c6905284845284'
          branch='story/pl-workspace-foundation-2026-10-01'
          head=os.environ['PR_HEAD']
          env=os.environ.copy()
          token=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+token,GIT_AUTHOR_NAME='github-actions[bot]',GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',GIT_COMMITTER_NAME='github-actions[bot]',GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','init','objects'],check=True)
          def git(*args,data=None):
              return subprocess.run(['git','-C','objects',*args],input=data,stdout=subprocess.PIPE,env=env,check=True).stdout
          def h(data):return hashlib.sha256(data).hexdigest()
          git('remote','add','origin','https://github.com/Siuuuers/dwm.git')
          git('fetch','--no-tags','origin',base,archive,head)
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]==head
          assert git('ls-remote','origin','refs/heads/archive/pl-narrative-sources-2026-10-01').decode().split()[0]==archive
          assert h(git('show',archive+':docs/story-auditions/Our_PL.md'))=='9dd985c686b5a2b9c3f01184f738eef05d7db49d63afa3999213390e5406b8a6'
          helpers=git('diff','--no-renames','--name-only',base,head).decode().splitlines()
          expected_helpers={'.github/pl-curation/curate.py','.github/pl-curation/verify.py','.github/pl-curation/plan.json','.github/workflows/pl-curation.yml'}
          assert set(helpers)==expected_helpers
          Path('runner').mkdir();Path('receipt').mkdir()
          for n in ['curate.py','verify.py','plan.json']:
              Path('runner',n).write_bytes(git('show',head+':.github/pl-curation/'+n))
          assert git('rev-parse',head+':.github/pl-curation/curate.py').decode().strip()=='f21038478a0c22fe2ddddbef34571ec3874e9038'
          assert git('rev-parse',head+':.github/pl-curation/verify.py').decode().strip()=='efee2a95216355bf180a319b5542766a99718e6f'
          plan=json.loads(Path('runner/plan.json').read_text());assert plan['base']==base and plan['archive']==archive
          Path('candidate').mkdir()
          data=git('archive',base,'story','docs','AGENTS.md','CLAUDE.md')
          with tarfile.open(fileobj=io.BytesIO(data)) as tf:tf.extractall('candidate',filter='data')
          original={p.relative_to('candidate').as_posix():p.read_bytes() for p in Path('candidate').rglob('*') if p.is_file()}
          for p,v in plan['changes'].items():assert h(original[p])==v['before'],p
          Path('receipt/TRACKED-TREE.txt').write_bytes(git('ls-tree','-r',base))
          subprocess.run([sys.executable,'runner/curate.py','candidate'],check=True)
          shutil.copy('runner/verify.py','candidate/story/maintenance/verify_consolidation.py')
          subprocess.run([sys.executable,'runner/verify.py','--root','candidate','--snapshot','--known-tree','receipt/TRACKED-TREE.txt','--report','receipt/verification.json'],check=True)
          report=json.loads(Path('receipt/verification.json').read_text())
          assert report['passed']==plan['checks'] and report['relative_links_checked']==plan['links']
          output={p.relative_to('candidate').as_posix():p.read_bytes() for p in Path('candidate').rglob('*') if p.is_file()}
          assert set(output)==set(original), 'Curation must not create or remove story files'
          changed={p:h(v) for p,v in output.items() if v!=original[p]}
          expected={p:v['after'] for p,v in plan['changes'].items()}
          if changed!=expected:
              Path('receipt/output-difference.json').write_text(json.dumps({'actual':changed,'expected':expected},indent=2))
              raise AssertionError('Generated documents differ from locally reviewed fingerprints')
          git('read-tree',head)
          for p in changed:
              bs=git('hash-object','-w','--stdin',data=output[p]).decode().strip()
              git('update-index','--add','--cacheinfo','100644,'+bs+','+p)
          for p in expected_helpers- {'.github/workflows/pl-curation.yml'}:git('update-index','--force-remove','--',p)
          assert not git('ls-files','--','docs/story-auditions/').strip()
          tree=git('write-tree').decode().strip()
          assert set(git('diff','--no-renames','--name-only',head,tree).decode().splitlines())==set(changed)|(expected_helpers-{'.github/workflows/pl-curation.yml'})
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]==head
          commit=git('commit-tree',tree,'-p',head,data=b'docs(story): curate useful relationship development before merge\n\nRetain current scenes, meaningful alternative passages and local reasons; archive duplicate responses and administrative history. No new narrative decisions or runtime changes.\n').decode().strip()
          git('push','origin',commit+':refs/heads/'+branch)
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]==commit
          receipt={'publication_commit':commit,'tree':tree,'base':base,'archive':archive,'changed_paths':sorted(changed),'checks':report,'temporary_workflow_cleanup_pending':True,'merged':False}
          Path('receipt/publication.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          Path('receipt/TRACKED-TREE.txt').write_bytes(git('ls-tree','-r',commit))
          for p in changed:
              q=Path('receipt/overlay',p);q.parent.mkdir(parents=True,exist_ok=True);q.write_bytes(output[p])
          print('PUBLICATION_COMMIT='+commit)
          print('Curation verified and pushed to PR3 only; no merge or runtime edits.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pl-curation-verification
          path: receipt/
          if-no-files-found: error
          retention-days: 14
