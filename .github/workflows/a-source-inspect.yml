name: Export pinned A controller source
on:
  push:
    branches: ['codex/a-source-inspect-20261010']
    paths: ['.github/workflows/a-source-inspect.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Export verified current payload only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64, gzip, hashlib, json, pathlib, urllib.request
          controller = 'ed31b87b036dc3a211299be4e9681970b14533db'
          root = 'https://raw.githubusercontent.com/Siuuuers/dwm/' + controller + '/'
          def read(path):
              with urllib.request.urlopen(root + path, timeout=60) as response:
                  return response.read()
          source = read('tools/cloud/scene-playable-candidate.json')
          payload = json.loads(source.decode('utf-8-sig'))
          patch = gzip.decompress(base64.b64decode(payload['patch_gzip_base64'], validate=True))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == payload['patch_sha256'] == '1d6cb95788894ef8a95f8525c500b95f97c004f0305c95e1f86f9b428ca63335'
          out = pathlib.Path('source-export'); out.mkdir()
          (out/'scene-playable-candidate.json').write_bytes(source)
          (out/'candidate.patch').write_bytes(patch)
          (out/'windows-tests.yml').write_bytes(read('.github/workflows/windows-tests.yml'))
          (out/'origin.json').write_text(json.dumps({'controller':controller,'base':payload['base'],'patch_sha256':digest},indent=2),encoding='utf-8')
          print((out/'origin.json').read_text())
          for block in patch.decode('utf-8').split('diff --git ')[1:]:
              if any(name in block.splitlines()[0] for name in ['ScenePlayableProducerFixture.gd', 'ScenePlayableFixture.gd', 'SceneNewRunFixture.gd']):
                  print('diff --git ' + block)
          print('Export bytes:', sum(p.stat().st_size for p in out.iterdir()))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: exact-controller-source-ed31b87
          path: source-export/
          if-no-files-found: error
          retention-days: 3
