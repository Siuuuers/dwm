name: Inspect current playable failure source
on:
  push:
    branches: ['codex/a-source-inspect-20261010']
    paths: ['.github/workflows/a-source-inspect.yml']
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Extract original current-run fixture evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, os, pathlib, shutil, urllib.request, zipfile
          artifact_id = 11672685856
          expected = '063aa6d0b32f837a249e6aacaded8149e5b1a26fe523b27e94a8cb760b7f45a5'
          url = f'https://api.github.com/repos/Siuuuers/dwm/actions/artifacts/{artifact_id}/zip'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          archive = pathlib.Path(os.environ['RUNNER_TEMP'])/'current-original.zip'
          with urllib.request.urlopen(request, timeout=180) as response, archive.open('wb') as target:
              shutil.copyfileobj(response, target)
          digest = hashlib.sha256()
          with archive.open('rb') as source:
              for block in iter(lambda: source.read(1024*1024), b''): digest.update(block)
          assert digest.hexdigest() == expected, 'Original artifact digest mismatch'
          out = pathlib.Path('source-export'); out.mkdir()
          selected = []
          def inspect(path, label, depth=0):
              with zipfile.ZipFile(path) as source:
                  names = source.namelist()
                  print('ARCHIVE', label, 'members', len(names), 'first', names[:40])
                  for entry in source.infolist():
                      name = entry.filename
                      leaf = pathlib.PurePosixPath(name).name
                      wanted = leaf in {'ScenePlayableFixture.gd', 'ScenePlayableProducerFixture.gd', 'SceneNewRunFixture.gd', 'SceneRestartFixture.gd', 'candidate-origin.json', 'candidate-source.json', 'origin.json', 'scene-playable-candidate.json'}
                      small_log = entry.file_size < 200000 and (leaf.endswith('.log') or leaf.endswith('manifest.json'))
                      if (wanted or small_log) and not entry.is_dir():
                          data = source.read(entry)
                          target = out/(str(len(selected)) + '-' + leaf)
                          target.write_bytes(data)
                          selected.append({'archive': label, 'member': name, 'export': target.name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
                          if leaf.endswith('.gd'):
                              print('SOURCE', label, name)
                              for index, line in enumerate(data.decode('utf-8-sig').splitlines(), 1):
                                  print(f'{index}: {line}')
                      elif leaf.endswith('.zip') and depth < 2:
                          nested = pathlib.Path(os.environ['RUNNER_TEMP'])/f'nested-{depth}-{len(selected)}.zip'
                          with source.open(entry) as stream, nested.open('wb') as target: shutil.copyfileobj(stream,target)
                          inspect(nested, label+'/'+name, depth+1)
                          nested.unlink()
          inspect(archive, str(artifact_id))
          assert any(row['member'].endswith(('ScenePlayableFixture.gd','ScenePlayableProducerFixture.gd')) for row in selected), 'Failed-run fixture not retained'
          (out/'inspection.json').write_text(json.dumps({'artifact_id':artifact_id,'artifact_sha256':expected,'selected':selected},indent=2),encoding='utf-8')
          print('Selected', len(selected), 'small original evidence members')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-run-38050263178-2-fixtures
          path: source-export/
          if-no-files-found: error
          retention-days: 3
