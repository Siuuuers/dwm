        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Load -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export/DWM-windows-x86_64-validation.zip') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit 'a25fae335247ba8074ea01d44990b3c6cd00f8ba' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-load') -Accessibility Always -Audio Dummy -CreatorReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create/result.json') -ProfileSaveLoad -ContinueAfterQuiet -TraceDay5 -NativeReadyCaptions
          $code = $LASTEXITCODE
          $watch.Stop()
          @{mode='Load'; exit_code=$code; elapsed_seconds=$watch.Elapsed.TotalSeconds; expected_source='a25fae335247ba8074ea01d44990b3c6cd00f8ba'; unchanged_result='.godot/ci/exported-load/result.json'} | ConvertTo-Json | Set-Content '.godot/ci/load-process.json'
          if ($code -ne 0) { exit $code }
          $result = Get-Content '.godot/ci/exported-load/result.json' -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw 'Load did not pass its original gate' }
      - name: Preserve original player outcomes and source cleanliness
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = [Collections.Generic.List[string]]::new()
          $outcomes = [Collections.Generic.List[object]]::new()
          foreach ($mode in @('capability','create','load')) {
            $path = ".godot/ci/exported-$mode/result.json"
            if (-not (Test-Path -LiteralPath $path)) { $failures.Add("Missing $mode result"); continue }
            $result = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $outcomes.Add(@{mode=$mode; result=$path; ok=$result.ok; exit_code=$result.exit_code; clean_player_exit=$result.clean_player_exit; forced_cleanup=$result.forced_cleanup})
            if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { $failures.Add("$mode failed its original gate") }
          }
          if ('${{ steps.capability.outcome }}' -ne 'success') { $failures.Add('Capability driver process or step failed') }
          if ('${{ steps.create.outcome }}' -ne 'success') { $failures.Add('Create driver process or step failed') }
          if ('${{ steps.load.outcome }}' -ne 'success') { $failures.Add('Load driver process or step failed') }
          if ('${{ steps.ending-recovery.outcome }}' -ne 'success') { $failures.Add('Focused ending recovery or method/XML gate failed') }
          $focusedPath = '.godot/ci/focused-results.json'
          if (-not (Test-Path -LiteralPath $focusedPath)) { $failures.Add('Missing focused ending recovery result') }
          else {
            $focused = @(Get-Content -LiteralPath $focusedPath -Raw | ConvertFrom-Json)
            if ($focused.Count -ne 1 -or $focused[0].id -cne 'ending-recovery' -or -not $focused[0].ok -or $focused[0].exit_code -ne 0 -or $focused[0].tests -ne 11 -or $focused[0].timeout_seconds -ne 180) { $failures.Add('Focused ending recovery result failed its original suite gate') }
          }
          if ('${{ steps.candidate-package.outcome }}' -ne 'success') { $failures.Add('Diagnostic executable package retention failed') }
          $allowed = @('.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1')
          foreach ($path in @(git diff HEAD --name-only)) { if ($path -notin $allowed) { $failures.Add("Unexpected tracked change: $path") } }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{ok=($failures.Count -eq 0); scope='Original bounded driver gates; passive traces are diagnostic evidence'; original_outcomes=$outcomes.ToArray(); failures=$failures.ToArray()} | ConvertTo-Json -Depth 8 | Set-Content '.godot/ci/diagnostic-acceptance.json'
          if ($failures.Count -ne 0) { throw ($failures -join '; ') }
      - name: Retain original native dump and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-load-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/native-crash/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain original outcomes focused tests and publication evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,re,subprocess,zipfile
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          status=subprocess.run(['git','status','--porcelain'],capture_output=True,text=True)
          (out/'final-status.txt').write_text(status.stdout+status.stderr)
          for p in pathlib.Path('.godot/phase2r_logs').glob('*'):
              if p.is_file():
                  target=out/'focused-logs'/p.name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(p.read_bytes())
          primary=out/'exported-load/game.stdout.log'
          summary={'scope':'Passive ending publication; original result.json remains authoritative','candidate':'a25fae335247ba8074ea01d44990b3c6cd00f8ba','reference':'337c2d43e9ff508575f772b1c1b7cf5679be8d0f','primary_stream':primary.relative_to(out).as_posix(),'passive_trace_gate':{'DWM_SAVE_LOAD_PROFILE':'1','DWM_SAVE_LOAD_CONTEXT':'exported-load-phase-diagnostic'},'publication_records':[],'profile_records':[],'parse_errors':[]}
          if primary.is_file():
              raw=primary.read_bytes()
              summary['primary_stream_bytes']=len(raw)
              summary['primary_stream_sha256']=hashlib.sha256(raw).hexdigest()
              for line_number,line in enumerate(raw.decode('utf-8-sig',errors='replace').splitlines(),1):
                  matched=re.search(r'(DWM_(?:CHECKPOINT_PROFILE|SAVE_LOAD_PROFILE|ENDING_PUBLICATION_TRACE)) (\{.*\})',line)
                  if matched:
                      try:
                          record={'line':line_number,'marker':matched[1],'data':json.loads(matched[2])}
                          bucket='publication_records' if matched[1]=='DWM_ENDING_PUBLICATION_TRACE' else 'profile_records'
                          summary[bucket].append(record)
                      except json.JSONDecodeError as error:summary['parse_errors'].append({'line':line_number,'text':line,'error':str(error)})
          summary['publication_record_count']=len(summary['publication_records'])
          summary['profile_record_count']=len(summary['profile_records'])
          (out/'ending-publication-trace.json').write_text(json.dumps(summary,indent=2))
          # Retain all original evidence streams and full source snapshots.
          # Only the primary stdout stream is projected above; no duplicate sums.
          files=sorted(p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts and 'package' not in p.parts and p.suffix not in ['.zip','.dmp'] and p.name!='retained-hashes.json')
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>16*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
