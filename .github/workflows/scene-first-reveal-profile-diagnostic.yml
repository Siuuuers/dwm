name: Publish validated authored week Windows build
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-validated-windows-folder
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: 2146c4435041c2b4ccc467a526f7b127d3980a2f
      EXPORT_RUN_ID: 39843283227
      EXPORT_ARTIFACT_ID: 12454556049
      EXPORT_ZIP_SHA256: b766618089b74b65bfc25475287ae2b7873da38d07e51f6a7a78c437d88bec5c
      BUILD_BRANCH: builds/windows-playable-20261023
      EXPECTED_BUILD_PARENT: cfbfd70f8ac79bfb0e1e81f8bd6ef05a9ef0e9a9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 2146c4435041c2b4ccc467a526f7b127d3980a2f
          persist-credentials: true
      - name: Verify source, successful export, artifact identity, and existing build parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          mkdir -p "$RUNNER_TEMP/authored-week-publication"
          gh api "repos/Siuuuers/dwm/actions/runs/$EXPORT_RUN_ID" > "$RUNNER_TEMP/authored-week-publication/export-run.json"
          gh api "repos/Siuuuers/dwm/actions/artifacts/$EXPORT_ARTIFACT_ID" > "$RUNNER_TEMP/authored-week-publication/export-artifact.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'authored-week-publication'
          run = json.loads((root / 'export-run.json').read_text())
          artifact = json.loads((root / 'export-artifact.json').read_text())
          if str(run['id']) != os.environ['EXPORT_RUN_ID'] or run['status'] != 'completed' or run['conclusion'] != 'success':
              raise SystemExit('Export run is not the specified completed success')
          if str(artifact['id']) != os.environ['EXPORT_ARTIFACT_ID'] or artifact.get('expired') is not False or str(artifact['workflow_run']['id']) != os.environ['EXPORT_RUN_ID']:
              raise SystemExit('Export artifact identity/run/expiry mismatch')
          if not artifact['name'].startswith('authored-week-windows-export-' + os.environ['EXPORT_RUN_ID'] + '-'):
              raise SystemExit('Unexpected export artifact name')
          PY
          remote="$(git ls-remote --exit-code origin "refs/heads/$BUILD_BRANCH" | cut -f1)"
          test "$remote" = "$EXPECTED_BUILD_PARENT"
          git fetch --no-tags origin "refs/heads/$BUILD_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_BUILD_PARENT"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12454556049
          run-id: 39843283227
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-artifact
          merge-multiple: true
      - name: Verify the unique inner ZIP and stage validated runtime bytes
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/validated-artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path
          root = Path(os.environ['ARTIFACT_ROOT'])
          candidates = list(root.rglob('DWM-windows-x86_64-validation.zip'))
          if len(candidates) != 1:
              raise SystemExit('Expected exactly one inner Windows validation ZIP')
          archive = candidates[0]
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != os.environ['EXPORT_ZIP_SHA256']:
              raise SystemExit('Inner export ZIP checksum mismatch')
          with zipfile.ZipFile(archive) as z:
              receipt = json.loads(z.read('validation.json'))
          if receipt.get('commit') != os.environ['SOURCE_SHA'] or receipt.get('ok') is not True or receipt.get('smoke', {}).get('ok') is not True or receipt.get('pack_audit', {}).get('ok') is not True:
              raise SystemExit('Inner validation receipt does not qualify this exact source')
          staged = Path(os.environ['RUNNER_TEMP']) / 'steam-staged'
          subprocess.run([sys.executable, 'tools/packaging/prepare_steam_build.py', str(archive), str(staged)], check=True)
          result = json.loads((staged / 'package-receipt.json').read_text())
          if result['source_commit'] != os.environ['SOURCE_SHA'] or result['runtime_bytes_unchanged'] is not True:
              raise SystemExit('Staged package source/custody mismatch')
          result.update(export_run_id=os.environ['EXPORT_RUN_ID'], export_artifact_id=os.environ['EXPORT_ARTIFACT_ID'], export_zip_sha256=actual, previous_build_commit=os.environ['EXPECTED_BUILD_PARENT'])
          (staged / 'package-receipt.json').write_text(json.dumps(result, indent=2) + '\n')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'authored-week-publication'
          (evidence / 'input-validation.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (evidence / 'package-receipt.json').write_bytes((staged / 'package-receipt.json').read_bytes())
          PY
      - name: Replace runtime files on the existing build branch parent
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/build-publish" "$EXPECTED_BUILD_PARENT"
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          staged = Path(os.environ['RUNNER_TEMP']) / 'steam-staged'
          build = Path(os.environ['RUNNER_TEMP']) / 'build-publish'
          game = build / 'game-build'
          # Replace only the previous runtime package. Keep the administrative
          # Steam review checklist and all parent history.
          for name in ['DWM.exe', 'DWM.pck']:
              old = game / name
              if old.exists(): old.unlink()
          if (game / 'licenses').exists(): shutil.rmtree(game / 'licenses')
          shutil.copytree(staged / 'game-build', game, dirs_exist_ok=True)
          shutil.copyfile(staged / 'package-receipt.json', build / 'package-receipt.json')
          for source in (staged / 'game-build').rglob('*'):
              if not source.is_file(): continue
              target = game / source.relative_to(staged / 'game-build')
              if hashlib.sha256(target.read_bytes()).digest() != hashlib.sha256(source.read_bytes()).digest():
                  raise SystemExit('Published staging changed runtime bytes: ' + str(target))
          for file in game.rglob('*'):
              if file.is_file() and file.stat().st_size >= 104857600:
                  raise SystemExit('File exceeds GitHub regular Git limit: ' + str(file))
          source_sha = os.environ['SOURCE_SHA']
          run_id = os.environ['EXPORT_RUN_ID']
          artifact_id = os.environ['EXPORT_ARTIFACT_ID']
          zip_sha = os.environ['EXPORT_ZIP_SHA256']
          (build / 'BUILD_README.md').write_text(f'''# Authored seven-day Windows development build

          Launch game-build/DWM.exe with DWM.pck beside it. Keep licenses/.
          Runtime source: {source_sha}.
          Source branch: codex/seven-day-story-20261023 (draft PR #43).
          Export evidence: https://github.com/Siuuuers/dwm/actions/runs/{run_id}
          Export artifact: https://github.com/Siuuuers/dwm/actions/runs/{run_id}/artifacts/{artifact_id}
          Validated input ZIP SHA256: {zip_sha}.

          This unsigned Windows x64 development build contains the authored Day1–Day7
          adaptation. Export evidence covers package-data integrity and isolated
          headless startup. It is not Steam approval, an installed Steam test, or
          whole-game graphical acceptance. See the source PR for scoped test evidence
          and remaining limitations. No public release or source merge is performed.

          Edit story source in dialogic/timelines/authored_week/Day1.dtl through
          Day7.dtl via its authoring pipeline, regenerate registration, then re-export.
          Loose source assets beside the executable do not override the PCK.
          This content revision requires fresh test saves; older saves are retained,
          and no automatic migration is claimed.

          Upload only DWM.exe, DWM.pck, and licenses/** as Steam depot content.
          Configure DWM.exe as the launch executable. Steam AppID and DepotID are
          account-specific. Steam API integration is optional; no SDK belongs here.

          game-build/STEAM_BUILD_REVIEW.md is retained from the preceding template
          build as a checklist; its recorded source hashes, paths, and earlier
          qualification describe that historical build. This README and the adjacent
          package-receipt.json identify the current package.
          Do not merge this binary delivery branch into source branches.
          '''.replace('\n          ', '\n'))
          roots = {p.name for p in build.iterdir() if p.name != '.git'}
          if roots != {'BUILD_README.md', 'game-build', 'package-receipt.json'}:
              raise SystemExit('Unexpected top-level build content: ' + repr(roots))
          PY
          git -C "$RUNNER_TEMP/build-publish" add -f -- game-build BUILD_README.md package-receipt.json
          git -C "$RUNNER_TEMP/build-publish" diff --cached --check
          git -C "$RUNNER_TEMP/build-publish" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/build-publish" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/build-publish" commit -m "build: update validated authored seven-day Windows package"
          test "$(git -C "$RUNNER_TEMP/build-publish" rev-parse HEAD^)" = "$EXPECTED_BUILD_PARENT"
      - name: Verify remote parent and push one non-force build commit
        run: |
          set -euo pipefail
          remote="$(git ls-remote --exit-code origin "refs/heads/$BUILD_BRANCH" | cut -f1)"
          if [ "$remote" != "$EXPECTED_BUILD_PARENT" ]; then
            echo 'Build branch moved; refusing publication. Inspect its new head before retrying.'
            exit 1
          fi
          build_commit="$(git -C "$RUNNER_TEMP/build-publish" rev-parse HEAD)"
          git -C "$RUNNER_TEMP/build-publish" push origin "HEAD:refs/heads/$BUILD_BRANCH"
          published="$(git ls-remote --exit-code origin "refs/heads/$BUILD_BRANCH" | cut -f1)"
          test "$published" = "$build_commit"
          BUILD_COMMIT="$build_commit" python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {key.lower(): os.environ[key] for key in ['BUILD_COMMIT', 'BUILD_BRANCH', 'EXPECTED_BUILD_PARENT', 'SOURCE_SHA', 'EXPORT_RUN_ID', 'EXPORT_ARTIFACT_ID', 'EXPORT_ZIP_SHA256']}
          receipt.update(non_force_push=True, source_merged=False, steam_published=False)
          (Path(os.environ['RUNNER_TEMP']) / 'authored-week-publication' / 'publication.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authored-week-build-publication-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/authored-week-publication/
            ${{ runner.temp }}/steam-staged/game-build.zip
            ${{ runner.temp }}/steam-staged/package-receipt.json
