name: Scene Bootstrap fresh-process candidate

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile-first-reveal:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BASE_SHA: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
          path: source
          fetch-depth: 0

      - name: Apply reviewed scene Pause Load candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = os.environ['BASE_SHA']
          assert git('rev-parse','HEAD') == base
          assert git('ls-remote','origin','refs/heads/codex/scene-runtime-integration-20261009').split()[0] == base
          patch = pathlib.Path('../controller/tools/cloud/scene-first-reveal-resumable.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'd821ccbca69a84b15fe759a28c03a0b29634e6da10180290243ea27940189081'
          out = pathlib.Path('.godot/ci'); out.mkdir(parents=True, exist_ok=True)
          (out/'candidate.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','--binary',str(out/'candidate.patch')], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          paths = git('diff','--cached','--name-only').splitlines()
          assert paths == ['addons/dialogic/Modules/Style/subsystem_styles.gd', 'autoload/ApplicationBootstrap.gd', 'autoload/DialogicBridge.gd', 'autoload/GameState.gd', 'autoload/ProfileManager.gd', 'autoload/SaveManager.gd', 'autoload/SceneRouter.gd', 'scenes/narrative/SceneHost.tscn', 'scripts/application/backup/BackupPresentationPort.gd', 'scripts/application/lifecycle/ProductionPauseController.gd', 'scripts/application/minesweeper/MinesweeperBoardGenerationPort.gd', 'scripts/application/narrative/SaveManagerNarrativeCheckpointPort.gd', 'scripts/application/restore/RouteRestoreParticipant.gd', 'scripts/application/run/DatingChallengeEnvelope.gd', 'scripts/application/run/DatingPhysicalOwner.gd', 'scripts/domain/minesweeper/MinesweeperBoardGenerator.gd', 'scripts/profile/DatingAttemptLedger.gd', 'tests/diagnostics/style_refusal_shutdown_probe.gd', 'tests/diagnostics/style_shutdown_probe.gd', 'tests/integration/scene_bootstrap_restart_child.gd', 'tests/integration/scene_first_reveal_connected_child.gd', 'tests/integration/test_pause_backup_host.gd', 'tests/integration/test_scene_bootstrap_host.gd', 'tests/integration/test_scene_bootstrap_restart_create.gd', 'tests/integration/test_scene_bootstrap_restart_load.gd', 'tests/integration/test_scene_caption_style_refusal.gd', 'tests/integration/test_scene_first_reveal_connected_ahead.gd', 'tests/integration/test_scene_first_reveal_connected_create.gd', 'tests/integration/test_scene_first_reveal_connected_load.gd', 'tests/integration/test_scene_first_reveal_selected_create.gd', 'tests/integration/test_scene_pause_load.gd', 'tests/integration/test_scene_pause_quick_load.gd', 'tests/integration/test_scene_pause_write_refusal.gd', 'tests/support/SceneCaptionStyleRefusalFixture.gd', 'tests/support/SceneChallengeFixture.gd', 'tests/support/SceneFirstRevealConnectedFixture.gd', 'tests/support/ScenePauseLoadFixture.gd', 'tests/support/ScenePauseLoadTestBase.gd', 'tests/unit/test_scene_absence.gd', 'tests/unit/test_scene_first_reveal.gd']
          receipt = {'base':base,'controller':os.environ['CONTROLLER_SHA'],'patch_sha256':hashlib.sha256(patch).hexdigest(),'paths':paths,'publication':'disabled diagnostic'}
          (out/'candidate-origin.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8

      - name: Import and freeze exact candidate
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Diagnose atomic first Reveal Profile entry'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); parent=(git rev-parse HEAD^) } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8

      - name: Real Bootstrap same-files fresh-process Load
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $create = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_bootstrap_restart_create.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/bootstrap-create.xml')
          $load = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_bootstrap_restart_load.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/bootstrap-load.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'bootstrap-restart' -LogName 'bootstrap-create.log' -GodotArgs $create -NextLogName 'bootstrap-load.log' -NextGodotArgs $load -EvidenceLogPath '.godot/ci/bootstrap-restart.jsonl' -TimeoutSeconds 180 -KeepRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($entry in @(@('scene-bootstrap','tests/integration/test_scene_bootstrap_host.gd'), @('legacy-bootstrap','tests/unit/test_application_bootstrap.gd'))) {
            $name = $entry[0]
            $script = $entry[1]
            $args = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$script",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$name.xml")
            & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId $name -LogName "$name.log" -GodotArgs $args -EvidenceLogPath ".godot/ci/$name.jsonl" -TimeoutSeconds 180
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify executed census and source identity
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections
          import json
          import pathlib
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          out = pathlib.Path('.godot/ci')
          suites = {'bootstrap-create': 'tests/integration/test_scene_bootstrap_restart_create.gd', 'bootstrap-load': 'tests/integration/test_scene_bootstrap_restart_load.gd', 'scene-bootstrap': 'tests/integration/test_scene_bootstrap_host.gd', 'legacy-bootstrap': 'tests/unit/test_application_bootstrap.gd'}
          counts = {}
          for lane, script in suites.items():
              expected = re.findall(r'^func (test_\w+)\(', pathlib.Path(script).read_text(encoding='utf-8'), re.M)
              root = ET.parse(out/(lane+'.xml')).getroot()
              rows = list(root.iter('testcase'))
              assert collections.Counter(r.attrib['name'] for r in rows) == collections.Counter(expected), (lane, 'census')
              assert rows and all(r.attrib.get('classname') == script and r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in rows), lane
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']), lane
              log = pathlib.Path('.godot/phase2r_logs')/(lane+'.log')
              text = log.read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character', text), lane
              counts[lane] = {'cases':len(rows), 'assertions':sum(int(r.attrib['assertions']) for r in rows)}
          creator = json.loads((out/'bootstrap-create-proof.json').read_text(encoding='utf-8-sig'))
          reader = json.loads((out/'bootstrap-load-proof.json').read_text(encoding='utf-8-sig'))
          assert creator['phase'] == 'create' and reader['phase'] == 'load'
          assert creator['process_id'] == reader['creator_process_id'] != reader['process_id']
          assert creator['ready_count'] == reader['ready_count'] == 1
          assert reader['destination_branch'] != creator['source_branch']
          for key in ['user_dir','slot_sha256','autosave_sha256','profile_sha256','profile','reading_session','command_receipts','source_run','source_branch']:
              assert creator[key] == reader[key], key
          records = [json.loads(line) for line in (out/'bootstrap-restart.jsonl').read_text(encoding='utf-8-sig').splitlines() if line.strip()]
          assert len(records) == 2 and all(r['exit_code'] == 0 for r in records)
          assert records[0]['user_dir'] == records[1]['user_dir']
          assert records[0]['test_root'] == records[1]['test_root']
          assert records[0]['ended_at_utc'] <= records[1]['started_at_utc']
          assert not subprocess.check_output(['git','diff','--name-only'], text=True).strip()
          assert not subprocess.check_output(['git','diff','--cached','--name-only'], text=True).strip()
          result = {
              'status':'passed',
              'source':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'lanes':counts,
              'total_cases':sum(v['cases'] for v in counts.values()),
              'total_xml_assertions':sum(v['assertions'] for v in counts.values()),
              'scope':'Two distinct processes, same physical user/save files, full FINAL Bootstrap services with TEST registration; selected Text Load and unchanged save/Profile bytes. No authored production content or rendered E2E claim.',
          }
          (out/'gate.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in origin['paths']:
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-first-reveal-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

