name: Author option-slot registration
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / Author option-slot registration
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 92ff43931a8915f2f8ca7d96fb9733dd065e7e31
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '92ff43931a8915f2f8ca7d96fb9733dd065e7e31') { throw 'Candidate mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='92ff43931a8915f2f8ca7d96fb9733dd065e7e31'; tree='2e7cd4fff65b6b1ba8e3f3f10411c527a4a2cbea'; controller='${{ github.event.pull_request.head.sha }}'; base='92ff43931a8915f2f8ca7d96fb9733dd065e7e31'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate B option slots through existing compiler and registration
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/unit/test_scene_author_option_slots.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/author-slots.xml')
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'author-slots' -LogName 'author-slots.log' -GodotArgs $arguments -EvidenceLogPath '.godot/ci/author-slots.jsonl' -TimeoutSeconds 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact source census and clean execution
        run: |
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci');script='tests/unit/test_scene_author_option_slots.gd'
          root=ET.parse(out/'author-slots.xml').getroot();rows=list(root.iter('testcase'))
          expected=re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(encoding='utf-8'),re.M)
          assert len(expected)==2
          assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter((script,n) for n in expected)
          assert not any(list(root.iter(t)) for t in ['failure','error','skipped'])
          assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows)
          exits=[json.loads(l) for l in (out/'author-slots.jsonl').read_text(encoding='utf-8-sig').splitlines()]
          assert len(exits)==1 and exits[0]['exit_code']==0
          log=pathlib.Path('.godot/phase2r_logs/author-slots.log').read_text(encoding='utf-8-sig')
          assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log)
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert not changed-{'.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1'},changed
          report={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tests':len(rows),'assertions':sum(int(r.attrib['assertions']) for r in rows),'clean_exits':len(exits),'changed':sorted(changed)}
          (out/'gate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original bounded evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          out=pathlib.Path('.godot/ci')
          for source in ["tests/templates/scene_sequence/AUTHOR_GUIDE.md","tests/fixtures/dialogic/scene_author_option_slots.dtl","tests/templates/scene_sequence/OptionSlotTemplates.gd","tests/unit/test_scene_author_option_slots.gd"]:
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(source).read_bytes())
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>8*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
