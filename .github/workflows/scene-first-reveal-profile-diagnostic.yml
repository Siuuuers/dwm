name: Scene Challenge manifest-cache acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  challenge-acceptance:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BASE_SHA: f8b873bd5e0df1dbab2ffaec9301c87d487de74e
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 92cac93440448edfd5309fe599a0991622ad74a1
          path: source
          fetch-depth: 8
      - name: Verify exact candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='92cac93440448edfd5309fe599a0991622ad74a1'
          assert git('rev-parse','HEAD^{tree}')=='b220e38d58834aaf789ad3821e7ea33c85f7267b'
          out=pathlib.Path('.godot/ci'); out.mkdir(parents=True,exist_ok=True)
          paths=git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').splitlines()
          assert set(paths)=={'scripts/domain/minesweeper/MinesweeperBoardGenerator.gd','tests/unit/test_minesweeper_budget_cache.gd','tests/unit/test_minesweeper_budget_cache.gd.uid'},paths
          (out/'candidate-origin.json').write_text(json.dumps({'base':os.environ['BASE_SHA'],'candidate':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'controller':os.environ['CONTROLLER_SHA'],'paths':paths}),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8


      - name: Import and verify source remains frozen
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Import failed' }
          git restore --worktree -- project.godot
          & './tools/testing/Invoke-PublicSurfaceValidation.ps1' -Regenerate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import subprocess,json,pathlib
          expected={'evidence/phase_2r/runtime/game_state_surface.json','evidence/phase_2r/runtime/save_manager_surface.json'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed and changed <= expected, changed
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip()
          prefix='tests/unit/test_minesweeper_budget_cache.gd:'
          changes={}
          def remove_new_sites(value, removed):
              if isinstance(value,list):
                  result=[]
                  for item in value:
                      if isinstance(item,str) and item.startswith(prefix): removed.append(item)
                      else: result.append(remove_new_sites(item,removed))
                  return result
              if isinstance(value,dict): return {k:remove_new_sites(v,removed) for k,v in value.items()}
              return value
          for name,lines in [('game_state',[185]),('save_manager',[5,113])]:
              path='evidence/phase_2r/runtime/'+name+'_surface.json'
              before=json.loads(subprocess.check_output(['git','show','HEAD:'+path],text=True))
              after=json.loads(pathlib.Path(path).read_text())
              removed=[]
              assert remove_new_sites(after,removed)==before,name
              assert sorted(removed)==sorted(prefix+str(n) for n in lines),(name,removed)
              changes[name]=removed
          pathlib.Path('.godot/ci/inventory-refresh.json').write_text(json.dumps(changes,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add evidence/phase_2r/runtime/game_state_surface.json evidence/phase_2r/runtime/save_manager_surface.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Freeze regenerated canonical inventories for manifest cache tests'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git status --porcelain | Out-String).Trim()) { throw 'Source drifted after canonical inventory freeze' }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}') } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8
      - name: Run focused acceptance suites
        run: |
          $cases = @(
            @{Name='budget-cache'; Script='tests/unit/test_minesweeper_budget_cache.gd'},
            @{Name='board-generator'; Script='tests/unit/test_minesweeper_board_generator.gd'},
            @{Name='scene-first-reveal'; Script='tests/unit/test_scene_first_reveal.gd'}
          )
          foreach ($case in $cases) {
            $name = $case.Name
            $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$($case.Script)",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/${name}.xml")
            & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId $name -LogName "${name}.log" -GodotArgs $arguments -EvidenceLogPath ".godot/ci/${name}.jsonl" -TimeoutSeconds 600
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify exact census refusals and clean source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          frozen=json.loads((out/'candidate-commit.json').read_text(encoding='utf-8-sig'))
          pending={'test_begin_debug_returns_generator_budget_unavailable_while_the_budget_manifest_is_absent','test_run_debug_slice_returns_generator_budget_unavailable_while_the_budget_manifest_is_absent'}
          result={'source':frozen['source'],'tree':frozen['tree'],'scope':'manifest caches and original Challenge certification/refusal/retry; no broad CI or whole-game acceptance','passed':0,'pending':0,'assertions':0,'suites':[]}
          for name,script in [('budget-cache','tests/unit/test_minesweeper_budget_cache.gd'),('board-generator','tests/unit/test_minesweeper_board_generator.gd'),('scene-first-reveal','tests/unit/test_scene_first_reveal.gd')]:
              expected=re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(),re.M)
              root=ET.parse(out/(name+'.xml')).getroot();rows=list(root.iter('testcase'))
              assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter((script,n) for n in expected),name
              assert not any(list(root.iter(tag)) for tag in ['failure','error']),name
              passed=0;skipped=0;assertions=0
              for row in rows:
                  if row.attrib['name'] in pending and name=='board-generator':
                      assert row.find('skipped') is not None,row.attrib
                      skipped+=1
                  else:
                      assert row.find('skipped') is None and row.attrib.get('status')=='pass' and int(row.attrib.get('assertions','0'))>0,row.attrib
                      passed+=1;assertions+=int(row.attrib['assertions'])
              assert skipped==(2 if name=='board-generator' else 0)
              children=[json.loads(s) for s in (out/(name+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if s.strip()]
              assert len(children)==1 and children[0]['exit_code']==0,name
              log=pathlib.Path('.godot/phase2r_logs',name+'.log').read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log),name
              result['passed']+=passed;result['pending']+=skipped;result['assertions']+=assertions
              result['suites'].append({'name':name,'passed':passed,'pending':skipped,'assertions':assertions,'child':children[0]})
          assert result['passed']==50 and result['pending']==2,result
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==frozen['tree']
          (out/'gate.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in subprocess.check_output(['git','diff','--name-only',origin['base'],'HEAD'],text=True).splitlines():
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-challenge-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

