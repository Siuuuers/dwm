# Inert until source and packet pins are replaced and reviewed.
name: Seven DTL playable template qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: caption-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PRODUCT_SHA: bede2256ac689d23523f65b65df23ac72e7c0eab
      PACKET_SHA: a4f3788f03712a9fe58a74ed56b27adb032809e8
      MANIFEST_SHA256: 61315ab40fc448ad551e0c2d7e069a7b7fc4925d6452991eb4ec9bd55a366c9f
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: bede2256ac689d23523f65b65df23ac72e7c0eab
      - name: Pin external qualification packet and clean source
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'seven-evidence'
          $harness = Join-Path $env:RUNNER_TEMP 'seven-harness'
          New-Item -ItemType Directory -Force $output,$harness | Out-Null
          if ($env:PRODUCT_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:PACKET_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'REVIEWED_PINS_REQUIRED' }
          $base = "https://raw.githubusercontent.com/Siuuuers/dwm/$env:PACKET_SHA/evidence/phase_2r/seven_files_20261023/packet"
          $manifest = Join-Path $harness 'manifest.json'
          Invoke-WebRequest "$base/manifest.json" -OutFile $manifest
          if ((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:MANIFEST_SHA256) { throw 'PACKET_MANIFEST_MISMATCH' }
          foreach ($entry in (Get-Content $manifest -Raw | ConvertFrom-Json)) {
            if ($entry.name -cnotmatch '^[A-Za-z0-9_.-]+$') { throw 'PACKET_NAME_INVALID' }
            $path = Join-Path $harness $entry.name
            Invoke-WebRequest "$base/$($entry.name)" -OutFile $path
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $entry.sha256) { throw 'PACKET_HASH_MISMATCH' }
            if ($entry.name.EndsWith('.ps1')) {
              $tokens=$null; $parseErrors=$null
              $null=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$parseErrors)
              if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
            }
          }
          Copy-Item $harness (Join-Path $output 'harness') -Recurse
          "SEVEN_HARNESS=$harness" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{product=$env:PRODUCT_SHA; packet=$env:PACKET_SHA; event='${{ github.sha }}'; controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; run='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'; powershell=$PSVersionTable.PSVersion.ToString()} | ConvertTo-Json | Set-Content (Join-Path $output 'origin.json') -Encoding utf8
          python (Join-Path $harness 'capture_seven.py') --root $env:GITHUB_WORKSPACE --output $output --source $env:PRODUCT_SHA --phase before
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_BEFORE_FAILED' }
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $output = Join-Path $env:RUNNER_TEMP 'seven-evidence'
          & $console --version *> (Join-Path $output 'godot-version.txt')
          $code = $LASTEXITCODE
          @{archive_sha256=$expected; executable=$console; executable_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant(); version_exit=$code} | ConvertTo-Json | Set-Content (Join-Path $output 'editor.json') -Encoding utf8
          if ($code -ne 0) { throw "GODOT_VERSION_EXIT: $code" }
      - name: Official import with isolated user directory
        id: import
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $logRoot = Join-Path $env:GITHUB_WORKSPACE '.godot/phase2r_logs'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'seven-import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'seven-import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'seven-import-user/test-root'
          New-Item -ItemType Directory -Force $logRoot,$env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          $args = @('--headless','--path',('"' + $env:GITHUB_WORKSPACE + '"'),'--import','--log-file',('"' + (Join-Path $logRoot 'seven-import.log') + '"'))
          $child = Start-Process -FilePath $env:GODOT_CONSOLE_PATH -ArgumentList $args -PassThru -RedirectStandardOutput (Join-Path $logRoot 'seven-import.stdout.log') -RedirectStandardError (Join-Path $logRoot 'seven-import.stderr.log')
          $exited = $child.WaitForExit(480000)
          if (-not $exited) { $child.Kill($true); $child.WaitForExit(); throw 'IMPORT_DEADLINE_480S' }
          $child.Refresh()
          @{exit_code=$child.ExitCode; pid=$child.Id; timeout_seconds=480} | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'seven-evidence/import-process.json')
          if ($child.ExitCode -ne 0) { throw "IMPORT_EXIT: $($child.ExitCode)" }
          if (Select-String -Path (Join-Path $logRoot 'seven-import.log') -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character') { throw 'IMPORT_DIAGNOSTIC' }
      - name: Retain imported files then restore exact project settings
        if: always() && steps.import.outcome != 'skipped'
        run: |
          python (Join-Path $env:SEVEN_HARNESS 'capture_seven.py') --root $env:GITHUB_WORKSPACE --output (Join-Path $env:RUNNER_TEMP 'seven-evidence') --source $env:PRODUCT_SHA --phase import
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_IMPORT_FAILED' }
      - name: Native registration generation and fresh-process validation
        id: generation
        timeout-minutes: 6
        run: |
          $helper = Join-Path $env:SEVEN_HARNESS 'Invoke-IsolatedGodot.ps1'
          try {
            $env:DWM_SCENE_READING_FIXTURE = '1'
            & $helper -RepositoryRoot $env:GITHUB_WORKSPACE -SuiteId 'seven-generate' -LogName 'seven-generate.log' -GodotArgs @('-s','res://tools/authoring/ExportSevenDayRegistration.gd') -TimeoutSeconds 120 -EvidenceLogPath '.godot/ci/seven-generate-isolation.jsonl'
            if ($LASTEXITCODE -ne 0) { throw "GENERATION_EXIT: $LASTEXITCODE" }
          } finally { Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue }
          & $helper -RepositoryRoot $env:GITHUB_WORKSPACE -SuiteId 'seven-validate' -LogName 'seven-validate.log' -GodotArgs @('-s','res://tools/authoring/ExportSevenDayRegistration.gd','--','--validate-seven-day-export') -TimeoutSeconds 120 -EvidenceLogPath '.godot/ci/seven-validate-isolation.jsonl'
          if ($LASTEXITCODE -ne 0) { throw "VALIDATION_EXIT: $LASTEXITCODE" }
          foreach ($log in @('seven-generate.log','seven-validate.log')) {
            if (Select-String -Path (Join-Path '.godot/phase2r_logs' $log) -Pattern 'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character') { throw 'GENERATION_OR_VALIDATION_DIAGNOSTIC' }
          }
      - name: Freeze generated working-source receipts
        id: freeze
        run: |
          python (Join-Path $env:SEVEN_HARNESS 'capture_seven.py') --root $env:GITHUB_WORKSPACE --output (Join-Path $env:RUNNER_TEMP 'seven-evidence') --source $env:PRODUCT_SHA --phase generated
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_GENERATED_FAILED' }
      - name: Seven-file template compiler and registration tests
        timeout-minutes: 4
        run: |
          & (Join-Path $env:SEVEN_HARNESS 'Invoke-SevenDayTemplates.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedSource $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "TEMPLATE_TEST_EXIT: $LASTEXITCODE" }
      - name: Rendered New Game Day4 save fresh Load ending and Title
        timeout-minutes: 10
        run: |
          & (Join-Path $env:SEVEN_HARNESS 'Invoke-EndingLoadBoundary-240.ps1') -RepositoryRoot $env:GITHUB_WORKSPACE -ExpectedSource $env:PRODUCT_SHA
          if ($LASTEXITCODE -ne 0) { throw "CONNECTED_TEST_EXIT: $LASTEXITCODE" }
      - name: Verify working source unchanged by qualification
        if: always() && steps.freeze.outcome == 'success'
        run: |
          python (Join-Path $env:SEVEN_HARNESS 'capture_seven.py') --root $env:GITHUB_WORKSPACE --output (Join-Path $env:RUNNER_TEMP 'seven-evidence') --source $env:PRODUCT_SHA --phase after
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_AFTER_FAILED' }
      - name: Retain native generated outputs even on failure
        if: always()
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'seven-evidence/last-registration'
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item 'data/manifests/scene_story_registration.json','data/manifests/scene_ending_reading_catalogue.json' $target
      - name: Preserve source generation and qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-file-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/seven-evidence
            ${{ github.workspace }}/.godot/ci
            ${{ github.workspace }}/.godot/phase2r_logs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
