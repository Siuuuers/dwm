name: Five-outcome challenge and saved recall
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / Five-outcome challenge and saved recall
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 5fa2a2d7fa770dbd5f87d3a1ace338405b0ad804
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '5fa2a2d7fa770dbd5f87d3a1ace338405b0ad804') { throw 'Candidate mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='5fa2a2d7fa770dbd5f87d3a1ace338405b0ad804'; tree='bc30cb2d5425fc1a569c15f3bbd0db7cd98dce39'; controller='${{ github.event.pull_request.head.sha }}'; base='5fa2a2d7fa770dbd5f87d3a1ace338405b0ad804'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify five outcomes and retained recall on isolated Windows processes
        timeout-minutes: 15
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $runner = Join-Path $env:GITHUB_WORKSPACE 'tools/testing/Invoke-IsolatedGodot.ps1'
          $evidence = '.godot/ci/challenge-recall-processes.jsonl'
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE $evidence) -Force -ErrorAction SilentlyContinue
          # Registration is installed by the fixture. Proven wrapper roots select test_manual;
          # each rendered child then starts the actual FINAL services itself.
          Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue
          $units = @('tests/unit/test_scene_challenge_recall.gd', 'tests/unit/test_scene_five_outcomes.gd', 'tests/unit/test_scene_challenge.gd')
          $create = 'tests/integration/test_scene_challenge_recall_create.gd'
          $load = 'tests/integration/test_scene_challenge_recall_load.gd'
          $expected = [ordered]@{}
          $counts = @(5,6,22,1,1)
          $paths = @($units) + @($create,$load)
          for ($i = 0; $i -lt $paths.Count; $i++) {
            $script = $paths[$i]
            $names = @(Select-String -LiteralPath $script -Pattern '^func (test_[A-Za-z0-9_]+)\(' | ForEach-Object { $_.Matches[0].Groups[1].Value })
            if ($names.Count -ne $counts[$i]) { throw "SOURCE_CENSUS_CHANGED: $script" }
            $expected[$script] = $names
          }
          $expected | ConvertTo-Json -Depth 5 | Set-Content "$output/challenge-recall-census.json"
          function Args-For([string[]]$Scripts, [string]$Report) {
            @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=', ('-gtest=' + (($Scripts | ForEach-Object { 'res://' + $_ }) -join ',')), '-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$Report.xml")
          }
          $unitArgs = @(Args-For $units 'challenge-recall-unit')
          $createArgs = @(Args-For @($create) 'challenge-recall-create')
          $loadArgs = @(Args-For @($load) 'challenge-recall-load')
          & $runner -SuiteId 'challenge-recall-unit' -LogName 'challenge-recall-unit.log' -GodotArgs $unitArgs -EvidenceLogPath $evidence -TimeoutSeconds 480 -KeepRoot
          if ($LASTEXITCODE -ne 0) { throw "UNIT_PROCESS_EXIT: $LASTEXITCODE" }
          & $runner -SuiteId 'challenge-recall-native' -LogName 'challenge-recall-create.log' -GodotArgs $createArgs -NextLogName 'challenge-recall-load.log' -NextGodotArgs $loadArgs -EvidenceLogPath $evidence -TimeoutSeconds 240 -KeepRoot -Rendered
          if ($LASTEXITCODE -ne 0) { throw "NATIVE_PROCESS_EXIT: $LASTEXITCODE" }
          function Assert-Report([string]$Report, [string[]]$Scripts) {
            [xml]$xml = Get-Content -LiteralPath "$output/$Report.xml" -Raw
            $suites = @($xml.SelectNodes('//testsuite'))
            if ($suites.Count -ne $Scripts.Count) { throw "SUITE_COUNT: $Report" }
            if ($xml.SelectNodes('//failure | //error | //skipped').Count -ne 0 -or $xml.SelectNodes('//*[@failures != "0" or @errors != "0" or @skipped != "0"]').Count -ne 0) { throw "UNCLEAN_REPORT: $Report" }
            $total = 0
            foreach ($script in $Scripts) {
              $suite = @($suites | Where-Object { $_.GetAttribute('name') -ceq $script })
              if ($suite.Count -ne 1) { throw "SUITE_IDENTITY: $script" }
              $cases = @($suite[0].SelectNodes('./testcase'))
              $names = @($expected[$script])
              if ($cases.Count -ne $names.Count -or [int]$suite[0].GetAttribute('tests') -ne $names.Count) { throw "CASE_COUNT: $script" }
              foreach ($name in $names) {
                $case = @($cases | Where-Object { $_.GetAttribute('name') -ceq $name })
                if ($case.Count -ne 1 -or $case[0].GetAttribute('classname') -cne $script -or $case[0].GetAttribute('status') -cne 'pass' -or [int]$case[0].GetAttribute('assertions') -le 0) { throw "CASE_IDENTITY_OR_STATUS: $script/$name" }
              }
              $total += $names.Count
            }
            if ($xml.SelectNodes('//testcase').Count -ne $total) { throw "UNEXPECTED_CASES: $Report" }
          }
          Assert-Report 'challenge-recall-unit' $units
          Assert-Report 'challenge-recall-create' @($create)
          Assert-Report 'challenge-recall-load' @($load)
          $records = @(Get-Content (Join-Path $env:GITHUB_WORKSPACE $evidence) | ForEach-Object { ConvertFrom-Json $_ })
          if ($records.Count -ne 3) { throw 'PROCESS_CENSUS' }
          $labels = @('unit','create','load')
          $scriptsByProcess = @(@($units), @($create), @($load))
          for ($i = 0; $i -lt 3; $i++) {
            $record = $records[$i]
            $expectedSuite = if ($i -eq 0) { 'challenge-recall-unit' } else { 'challenge-recall-native' }
            $log = Join-Path $env:GITHUB_WORKSPACE ('.godot/phase2r_logs/challenge-recall-' + $labels[$i] + '.log')
            $gtest = '-gtest=' + (($scriptsByProcess[$i] | ForEach-Object { 'res://' + $_ }) -join ',')
            if ($record.suite_id -cne $expectedSuite -or [int]$record.exit_code -ne 0 -or [IO.Path]::GetFullPath($record.log_path) -cne [IO.Path]::GetFullPath($log) -or @($record.argv | Where-Object { $_ -ceq $gtest }).Count -ne 1) { throw "PROCESS_MAPPING: $i" }
            if ([DateTimeOffset]::Parse($record.ended_at_utc) -lt [DateTimeOffset]::Parse($record.started_at_utc)) { throw 'PROCESS_TIME_ORDER' }
            if (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character|crash|Segmentation fault' -Quiet) { throw "PROCESS_ERROR_LOG: $log" }
          }
          if ($records[1].test_root -cne $records[2].test_root -or $records[1].user_dir -cne $records[2].user_dir -or [DateTimeOffset]::Parse($records[2].started_at_utc) -lt [DateTimeOffset]::Parse($records[1].ended_at_utc)) { throw 'FRESH_LOAD_SHARED_ROOT_ORDER' }
          git rev-parse HEAD | Set-Content "$output/challenge-recall-source-sha.txt"
          if ($LASTEXITCODE -ne 0) { throw 'SOURCE_SHA_FAILED' }
          Write-Output 'CHALLENGE_RECALL_PASSED: 35 exact tests, 3 clean processes, native shared-root Save/Load.'
      
      - name: Regenerate canonical inventories and check reproducibility
        run: ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads
      - name: Verify inventory drift and read-only contracts
        run: ./tools/testing/Invoke-CloudTests.ps1 -Suite public_surfaces
      - name: Verify bounded source changes and exact census
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          script='tests/unit/tooling/test_public_surface_inventory.gd'
          expected=re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(encoding='utf-8'),re.M)
          root=ET.parse(out/'public_surfaces.xml').getroot(); rows=list(root.iter('testcase'))
          assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter((script,n) for n in expected)
          assert not any(list(root.iter(t)) for t in ['failure','error','skipped'])
          assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows)
          allowed={'.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1','evidence/phase_2r/runtime/game_state_surface.json','evidence/phase_2r/runtime/save_manager_surface.json'}
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert not changed-allowed,changed
          for p in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',p.read_text(encoding='utf-8-sig')),str(p)
          exits=[]
          for p in out.rglob('*.jsonl'):
              for line in p.read_text(encoding='utf-8-sig').splitlines():
                  if line.strip():
                      item=json.loads(line); assert item['exit_code']==0,item; exits.append(item)
          assert len(exits)==8,len(exits)
          report={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tests':len(rows),'assertions':sum(int(r.attrib['assertions']) for r in rows),'clean_exits':len(exits),'changed':sorted(changed)}
          (out/'gate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original bounded evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          out=pathlib.Path('.godot/ci')
          for source in ["autoload/DialogicBridge.gd","autoload/GameState.gd","scripts/application/run/DatingPhysicalOwner.gd","scripts/domain/narrative/SceneEventContract.gd","scripts/narrative/DialogicEntryManifest.gd","tests/fixtures/dialogic/scene_challenge_recall.dtl","tests/integration/scene_challenge_recall_child.gd","tests/integration/test_scene_challenge_recall_create.gd","tests/integration/test_scene_challenge_recall_load.gd","tests/support/SceneChallengeRecallFixture.gd","tests/unit/test_scene_challenge_recall.gd","tests/unit/test_scene_five_outcomes.gd"] + ['tools/runtime/PublicSurfaceInventory.gd','tools/runtime/generate_public_surface_inventory.gd','tools/testing/Invoke-PublicSurfaceValidation.ps1','tests/unit/tooling/test_public_surface_inventory.gd','evidence/phase_2r/runtime/game_state_required_surface.json','evidence/phase_2r/runtime/save_manager_required_surface.json','evidence/phase_2r/runtime/game_state_surface.json','evidence/phase_2r/runtime/save_manager_surface.json']:
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(source).read_bytes())
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          files += [p for p in pathlib.Path('.godot/phase2r_tests').rglob('*.json') if 'challenge-recall-' in str(p)]
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>8*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
