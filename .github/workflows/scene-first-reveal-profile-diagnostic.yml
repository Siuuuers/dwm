name: Scene selected absence recovery candidate

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile-first-reveal:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      BASE_SHA: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
          path: source
          fetch-depth: 0

      - name: Apply reviewed resumable first-Reveal candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = os.environ['BASE_SHA']
          assert git('rev-parse','HEAD') == base
          assert git('ls-remote','origin','refs/heads/codex/scene-runtime-integration-20261009').split()[0] == base
          patch = pathlib.Path('../controller/tools/cloud/scene-first-reveal-resumable.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'ed3eb673cd285b4c67cba371844d2e5fdfa23399485ead68d06844bf8d9099f7'
          out = pathlib.Path('.godot/ci'); out.mkdir(parents=True, exist_ok=True)
          (out/'candidate.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','--binary',str(out/'candidate.patch')], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          paths = git('diff','--cached','--name-only').splitlines()
          assert paths == ['autoload/DialogicBridge.gd', 'autoload/GameState.gd', 'scripts/application/minesweeper/MinesweeperBoardGenerationPort.gd', 'scripts/application/narrative/SaveManagerNarrativeCheckpointPort.gd', 'scripts/application/run/DatingChallengeEnvelope.gd', 'scripts/application/run/DatingPhysicalOwner.gd', 'scripts/domain/minesweeper/MinesweeperBoardGenerator.gd', 'scripts/profile/DatingAttemptLedger.gd', 'tests/integration/scene_first_reveal_connected_child.gd', 'tests/integration/test_scene_first_reveal_connected_ahead.gd', 'tests/integration/test_scene_first_reveal_connected_create.gd', 'tests/integration/test_scene_first_reveal_connected_load.gd', 'tests/integration/test_scene_first_reveal_selected_create.gd', 'tests/support/SceneChallengeFixture.gd', 'tests/support/SceneFirstRevealConnectedFixture.gd', 'tests/unit/test_scene_absence.gd', 'tests/unit/test_scene_first_reveal.gd']
          receipt = {'base':base,'controller':os.environ['CONTROLLER_SHA'],'patch_sha256':hashlib.sha256(patch).hexdigest(),'paths':paths,'publication':'disabled diagnostic'}
          (out/'candidate-origin.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8

      - name: Import and freeze exact candidate
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Diagnose atomic first Reveal Profile entry'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); parent=(git rev-parse HEAD^) } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8

      - name: Focused owner Profile and persistence regressions
        timeout-minutes: 50
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = './tools/testing/Invoke-IsolatedGodot.ps1'
          $failed = $false
          $tests = @(
            ,@('absence','tests/unit/test_scene_absence.gd')
          )
          foreach ($entry in $tests) {
            $name = $entry[0]
            $script = $entry[1]
            Write-Host "DWM_LANE_BEGIN $name $([DateTime]::UtcNow.ToString('o'))"
            $args = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$script",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$name.xml")
            & $runner -SuiteId "scene-$name" -LogName "$name.log" -GodotArgs $args -EvidenceLogPath ".godot/ci/$name.jsonl" -TimeoutSeconds 1200
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host "DWM_LANE_END $name exit=$LASTEXITCODE $([DateTime]::UtcNow.ToString('o'))"
          }
          foreach ($mode in @('normal','profile_ahead','selected_absence')) {
            $child = if ($mode -eq 'normal') { 'connected_create' } elseif ($mode -eq 'profile_ahead') { 'connected_ahead' } else { 'selected_create' }
            $create = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://tests/integration/test_scene_first_reveal_$child.gd",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/connected-$mode-create.xml")
            $load = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_first_reveal_connected_load.gd','-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/connected-$mode-load.xml")
            & $runner -SuiteId "connected-$mode" -LogName "connected-$mode-create.log" -GodotArgs $create -NextLogName "connected-$mode-load.log" -NextGodotArgs $load -EvidenceLogPath ".godot/ci/connected-$mode.jsonl" -TimeoutSeconds 600 -KeepRoot
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'One or more focused engine children failed' }

      - name: Verify executed census and source identity
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections
          import json
          import pathlib
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          out = pathlib.Path('.godot/ci')
          suites = {'absence':'tests/unit/test_scene_absence.gd'}
          for mode in ['normal','profile_ahead','selected_absence']:
              suites['connected-'+mode+'-create'] = 'tests/integration/test_scene_first_reveal_'+({'normal':'connected_create','profile_ahead':'connected_ahead','selected_absence':'selected_create'}[mode])+'.gd'
              suites['connected-'+mode+'-load'] = 'tests/integration/test_scene_first_reveal_connected_load.gd'
          counts = {}
          for lane, script in suites.items():
              expected = re.findall(r'^func (test_\w+)\(', pathlib.Path(script).read_text(encoding='utf-8'), re.M)
              root = ET.parse(out/(lane+'.xml')).getroot()
              rows = list(root.iter('testcase'))
              assert collections.Counter(r.attrib['name'] for r in rows) == collections.Counter(expected), (lane, 'census')
              assert rows and all(r.attrib.get('classname') == script and r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in rows), lane
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']), lane
              log = pathlib.Path('.godot/phase2r_logs')/(lane+'.log')
              text = log.read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character', text), lane
              counts[lane] = {'cases':len(rows), 'assertions':sum(int(r.attrib['assertions']) for r in rows)}
          assert not subprocess.check_output(['git','diff','--name-only'], text=True).strip()
          assert not subprocess.check_output(['git','diff','--cached','--name-only'], text=True).strip()
          result = {
              'status':'passed',
              'source':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'lanes':counts,
              'total_cases':sum(v['cases'] for v in counts.values()),
              'total_xml_assertions':sum(v['assertions'] for v in counts.values()),
              'scope':'real selected pre-Reveal continuation after source-slot overwrite; Profile and Run refusal; same-process destination re-admission precedence; fresh-process selected unfinished Load; no rendered panel or same-branch OS crash claim',
          }
          (out/'gate.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in origin['paths']:
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-first-reveal-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

