name: Focused Gallery register fixture

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: gallery-register-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gallery-register:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Focused Gallery register fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DWM_CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/playable-journeys
    steps:
      - uses: actions/checkout@v7
        with:
          # Same disposable-index workaround as the Windows jobs above.
          ref: 27fe2eb5dbea6345e62d83c611146a2e5199a944
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Verify pinned source and retain provenance
        run: |
          test "$(git rev-parse HEAD)" = "27fe2eb5dbea6345e62d83c611146a2e5199a944"
          test "$(git rev-parse HEAD^{tree})" = "ed3493c40dc36d8346e42ee60d466e01bcc53ee3"
          mkdir -p .godot/ci/gallery-version-register
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path(".godot/ci/gallery-version-register/provenance.json").write_text(json.dumps({
              "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "controller": os.environ["DWM_CONTROLLER_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW_SHA"],
              "event": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"]
          }, indent=2) + "\n")
          PY
      - name: Install Godot and software display
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$archive"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"
          editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$editor"
          echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"
          "$editor" --version
      - name: Start and verify native Linux speech service
        timeout-minutes: 2
        run: bash tools/testing/start_cloud_speech.sh
      - name: Upload native speech environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/cloud-speech/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Import project
        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          set +e
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          process_exit=$?
          set -e
          printf '{"exit_code":%s}\n' "$process_exit" > ".godot/ci/gallery-version-register/import-process.json"
          test "$process_exit" -eq 0
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then
            exit 1
          fi
          # Dialogic's editor scan rewrites its timeline lookup during import.
          git restore -- project.godot
      - name: Render witnessed-version register fixtures
        timeout-minutes: 5
        env:
          DWM_GALLERY_REGISTER_OUTPUT: ${{ github.workspace }}/.godot/ci/gallery-version-register
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/gallery-version-register/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/gallery-version-register/test-root
        run: |
          mkdir -p "$DWM_GALLERY_REGISTER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          set +e
          timeout 240s xvfb-run -a "$GODOT_CONSOLE_PATH" --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility --audio-driver Dummy --log-file "$DWM_GALLERY_REGISTER_OUTPUT/render.log" --script res://tests/ui/render_gallery_version_register.gd
          process_exit=$?
          set -e
          printf '{"exit_code":%s}\n' "$process_exit" > ".godot/ci/gallery-version-register/render-process.json"
          test "$process_exit" -eq 0
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_GALLERY_REGISTER_OUTPUT/render.log"; then
            exit 1
          fi
          grep -E '^GALLERY_VERSION_REGISTER_RENDER_VERIFIED tuples=18 evidence=' "$DWM_GALLERY_REGISTER_OUTPUT/render.log"
      - name: Verify rendered evidence census
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".godot/ci/gallery-version-register")
          d = json.loads((root / "measurements.json").read_text())
          assert d["ok"] is True and not d["failures"]
          assert d["collapsed_counts"] == [0, 1]
          assert d["requested_tuples"] == 18 and len(d["samples"]) == 18
          expected = {(l, n, p) for l in ("en", "zh_CN", "zh_HK") for n in (100, 125, 150) for p in ("AfterHours", "Midnight")}
          assert {(s["locale"], s["percent"], s["palette"]) for s in d["samples"]} == expected
          assert len(list(root.glob("*.png"))) == 18
          for s in d["samples"]:
              assert (root / s["file"]).is_file()
              assert s["inspection_writes"] == 0 and s["replay_starts"] == 0
          receipts = d["setup_receipts"]
          assert len(receipts) == 9
          assert [r["expected_count"] for r in receipts if "owner_variants" in r] == [0, 1, 2]
          for r in receipts:
              if "owner_variants" in r:
                  assert r["owner_variants"]["ok"] is True
                  assert len(r["owner_variants"]["value"]["records"]) == r["expected_count"]
          for phase in ("import", "render"):
              assert json.loads((root / (phase + "-process.json")).read_text())["exit_code"] == 0
          print("GALLERY_FIXTURE_EVIDENCE_VERIFIED samples=18 setup_receipts=9")
          PY
      - name: Retain import log
        if: always()
        run: |
          if test -f "$DWM_RENDER_OUTPUT/import.log"; then
            cp "$DWM_RENDER_OUTPUT/import.log" .godot/ci/gallery-version-register/import.log
          fi
      - name: Upload witnessed-version register evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-version-register-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/gallery-version-register/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
