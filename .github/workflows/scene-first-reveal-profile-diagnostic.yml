name: Native-ready caption observation
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / Native-ready caption observation
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: b59b9d548f352895ac89b6aa55b80822358f8b69
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne 'b59b9d548f352895ac89b6aa55b80822358f8b69') { throw 'Candidate mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -cne '82cafaf91f939be1545d7cd61c8770e687273e97') { throw 'Candidate tree mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='b59b9d548f352895ac89b6aa55b80822358f8b69'; tree='82cafaf91f939be1545d7cd61c8770e687273e97'; controller='${{ github.event.pull_request.head.sha }}'; base='459dbe5ea8fb40f28388876f512145c7c2f26774'; package_source='63f1e4dbfe649039881d138541abd377a8639778'; package_artifact=12135278742} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse external driver without execution
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools/testing/Invoke-ExportedGameplay.ps1'), [ref]$tokens, [ref]$errors)
          @{ ok=($errors.Count -eq 0); errors=@($errors | ForEach-Object { @{ message=$_.Message; line=$_.Extent.StartLineNumber; text=$_.Extent.Text } }) } | ConvertTo-Json -Depth 5 | Set-Content '.godot/ci/driver-parse.json'
          if ($errors.Count -ne 0) { $errors | Format-List; throw 'Driver parse failed' }
      - name: Parse separate native diagnostic
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools/testing/Probe-ExportedWindow.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | Format-List; throw 'Native diagnostic parse failed' }
      - name: Verify original-deadline acceptance boundaries
        run: |
          & pwsh -NoProfile -File ./tests/tooling/Test-ExportedGameplayDeadline.ps1 -DriverPath ./tools/testing/Invoke-ExportedGameplay.ps1 -OutputPath .godot/ci/deadline-tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the retained corrected package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12135278742
          run-id: 39124502119
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: .godot/ci/windows-export
      - name: Verify retained package identity
        run: |
          $ErrorActionPreference = 'Stop'
          $export = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export'
          $receipt = Get-Content (Join-Path $export 'validation.json') -Raw | ConvertFrom-Json
          $expected = 'ef5f3f19980064080a84a28bcae9f97db4feb41934a9f007bc828172394f3431'
          if (-not $receipt.ok -or $receipt.commit -cne '63f1e4dbfe649039881d138541abd377a8639778' -or $receipt.archive.sha256 -cne $expected) { throw 'Retained export receipt mismatch' }
          $archive = Join-Path $export $receipt.archive.file
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'Retained export hash mismatch' }
          "DWM_EXPORT_SHA=$expected" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Probe explicit cloud accessibility and audio
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $export = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export'
          $receipt = Get-Content (Join-Path $export 'validation.json') -Raw | ConvertFrom-Json
          if (-not $receipt.ok -or $receipt.commit -cne '63f1e4dbfe649039881d138541abd377a8639778' -or $receipt.archive.sha256 -cne $env:DWM_EXPORT_SHA) { throw 'Export receipt mismatch' }
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Capability -ArchivePath (Join-Path $export $receipt.archive.file) -ExpectedArchiveSha256 $receipt.archive.sha256 -ExpectedCommit '63f1e4dbfe649039881d138541abd377a8639778' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-capability-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-capability') -Accessibility Always -Audio Dummy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content '.godot/ci/exported-capability/result.json' -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup) { throw 'Capability not successful' }
      - name: Create Day4 save through the exported UI
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Create -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export/DWM-windows-x86_64-validation.zip') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit '63f1e4dbfe649039881d138541abd377a8639778' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create') -CapabilityReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-capability/result.json') -Accessibility Always -Audio Dummy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh Load, witness Save, Back, ending and normal exit
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Load -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export/DWM-windows-x86_64-validation.zip') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit '63f1e4dbfe649039881d138541abd377a8639778' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-load') -CreatorReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create/result.json') -Accessibility Always -Audio Dummy -ProfileSaveLoad -ContinueAfterQuiet -TraceDay5 -NativeReadyCaptions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify three bounded player exits and source cleanliness
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('capability','create','load')) {
            $result = Get-Content ".godot/ci/exported-$mode/result.json" -Raw | ConvertFrom-Json
            if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw "Exported $mode did not pass" }
          }
          $allowed = @('.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1')
          foreach ($path in @(git diff HEAD --name-only)) { if ($path -notin $allowed) { throw "Unexpected tracked change: $path" } }
      - name: Retain original bounded capability evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          out=pathlib.Path('.godot/ci')
          for source in ['tests/tooling/Test-ExportedGameplayDeadline.ps1','scripts/application/backup/BackupPresentationPort.gd','autoload/SaveManager.gd','tools/testing/Probe-ExportedWindow.ps1','scripts/ui/BackupApp.gd','tests/unit/test_backup_presentation.gd','tools/testing/Invoke-ExportedGameplay.ps1','tools/testing/Invoke-WindowsExportValidation.ps1','project.godot','export_presets.cfg']:
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(source).read_bytes())
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts and 'package' not in p.parts and p.suffix!='.zip']
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>16*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
