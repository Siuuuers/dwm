name: Load caption memory qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / Load caption memory
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 1ecf0d1e145281a188492b81bd03fb476ff48d37
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '1ecf0d1e145281a188492b81bd03fb476ff48d37') { throw 'Candidate mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='1ecf0d1e145281a188492b81bd03fb476ff48d37'; tree='14e994c26e3562d4df780c3df1cbac1147f65d86'; controller='${{ github.event.pull_request.head.sha }}'; base='b86414491c5d9d865ae716d342461a2cc8ea70fa'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused caption memory and Day4 Load checks
        run: |
          $ErrorActionPreference = 'Stop'
          $lanes = @(
            @{Name='memory'; Script='tests/unit/test_scene_caption_memory.gd'; Filter='test_memory_is_current_occurrence_only_and_projection_is_pure'; Rendered=$false},
            @{Name='scrollback'; Script='tests/integration/test_witnessed_caption_runtime.gd'; Filter='test_full_scrollback_reprojection_keeps_native_state_and_three_caption_window'; Rendered=$false},
            @{Name='retained'; Script='tests/integration/test_witnessed_caption_runtime.gd'; Filter='test_silent_retained_reprojection_and_remeasurement_preserve_reveal_history_and_manual_scroll'; Rendered=$false}
          )
          $failed = $false
          foreach ($lane in $lanes) {
            $args = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$($lane.Script)",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$($lane.Name).xml")
            if ($lane.Filter) { $args += "-gunit_test_name=$($lane.Filter)" }
            & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId $lane.Name -LogName "$($lane.Name).log" -GodotArgs $args -EvidenceLogPath ".godot/ci/$($lane.Name).jsonl" -TimeoutSeconds 240 -Rendered:$lane.Rendered
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          $createArgs = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_seven_day_connected_create.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/day4-create.xml')
          $loadArgs = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_seven_day_connected_load.gd','-gunit_test_name=test_fresh_load_restores_day4_caption_window_only','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/day4-load.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'day4' -LogName 'day4-create.log' -GodotArgs $createArgs -NextGodotArgs $loadArgs -NextLogName 'day4-load.log' -EvidenceLogPath '.godot/ci/day4.jsonl' -TimeoutSeconds 240 -Rendered
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - name: Verify exact selected census and source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          lanes=[('memory', 'tests/unit/test_scene_caption_memory.gd', 'test_memory_is_current_occurrence_only_and_projection_is_pure'), ('scrollback', 'tests/integration/test_witnessed_caption_runtime.gd', 'test_full_scrollback_reprojection_keeps_native_state_and_three_caption_window'), ('retained', 'tests/integration/test_witnessed_caption_runtime.gd', 'test_silent_retained_reprojection_and_remeasurement_preserve_reveal_history_and_manual_scroll'), ('day4-create', 'tests/integration/test_scene_seven_day_connected_create.gd', ''), ('day4-load', 'tests/integration/test_scene_seven_day_connected_load.gd', 'test_fresh_load_restores_day4_caption_window_only')]
          result={'source':'1ecf0d1e145281a188492b81bd03fb476ff48d37','tree':'14e994c26e3562d4df780c3df1cbac1147f65d86','tests':0,'assertions':0,'suites':[]}
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==result['source']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==result['tree']
          changed=subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines()
          assert not set(changed)-{'.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1'},changed
          for name,script,select in lanes:
              expected=[n for n in re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(encoding="utf-8"),re.M) if select in n]
              root=ET.parse(out/(name+'.xml')).getroot();rows=list(root.iter('testcase'))
              assert expected and collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter((script,n) for n in expected),name
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']),name
              assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows),name
              log=pathlib.Path('.godot/phase2r_logs',name+'.log').read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log),name
              children=[json.loads(s) for s in (out/(('day4' if name.startswith('day4-') else name)+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if s.strip()]
              assert len(children)==(2 if name.startswith('day4-') else 1) and all(c['exit_code']==0 for c in children),name
              count=sum(int(r.attrib['assertions']) for r in rows)
              result['tests']+=len(rows);result['assertions']+=count
              result['suites'].append({'name':name,'script':script,'filter':select,'tests':len(rows),'assertions':count})
          assert result['tests']==5
          assert (out/'computer-seven-day-day4-restored-full.png').is_file()
          (out/'gate.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain bounded Load evidence
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          out=pathlib.Path('.godot/ci')
          for source in ["autoload/DialogicBridge.gd", "scripts/narrative/SoloReadingSession.gd", "scripts/ui/witnessed/WitnessedCaptionLayer.gd", "tests/unit/test_scene_caption_memory.gd", "tests/unit/test_scene_publication_cursor.gd", "tests/support/SceneDayReadingFixture.gd", "tests/integration/test_witnessed_caption_runtime.gd", "tests/integration/scene_seven_day_connected_child.gd", "tests/integration/scene_later_caption_child.gd", "tests/integration/test_scene_seven_day_connected_create.gd", "tests/integration/test_scene_seven_day_connected_load.gd"]:
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(source).read_bytes())
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>8*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for offset in range(0,len(encoded),3000):print('DWM_EVIDENCE_CHUNK '+encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          for p in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              for line in p.read_text(encoding='utf-8-sig').splitlines():
                  if any(s in line for s in ['[Failed]','SCRIPT ERROR:','ERROR:','Passing Tests','Failing Tests','Asserts','Exiting with code']):print(p.name,line[:1500])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-load-memory-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci
            .godot/phase2r_logs
            !.godot/ci/import-user
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
