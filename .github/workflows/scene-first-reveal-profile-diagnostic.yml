name: Scene desktop first-Reveal connected acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile-first-reveal:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BASE_SHA: 281c70086033fe7100e12a6d28f186bae8d3c4a8
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: dca44f662ec939c1c547c79a15a8f6da12c6929e
          path: source
          fetch-depth: 0

      - name: Verify exact scene desktop candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD') == 'dca44f662ec939c1c547c79a15a8f6da12c6929e'
          assert git('rev-parse','HEAD^{tree}') == '2231b0aeefe8c48c33727d46a80ea8e5f2bb8cde'
          assert git('rev-parse','HEAD^') == 'b40e689a2897e1f97372dc3e1ea132cbef16e07a'
          out = pathlib.Path('.godot/ci'); out.mkdir(parents=True, exist_ok=True)
          paths = git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').splitlines()
          assert set(paths) == set(["autoload/ApplicationBootstrap.gd", "scripts/application/minesweeper/SaveManagerDesktopBoardPort.gd", "tests/unit/test_save_manager_desktop_first_reveal_port.gd", "tests/integration/scene_desktop_first_reveal_child.gd", "tests/integration/test_scene_desktop_first_reveal_create.gd", "tests/integration/test_scene_desktop_first_reveal_load.gd", "tests/unit/test_save_manager_desktop_first_reveal_port.gd.uid", "tests/integration/scene_desktop_first_reveal_child.gd.uid", "tests/integration/test_scene_desktop_first_reveal_create.gd.uid", "tests/integration/test_scene_desktop_first_reveal_load.gd.uid", "evidence/phase_2r/runtime/game_state_surface.json", "evidence/phase_2r/runtime/save_manager_surface.json"])
          (out/'candidate-origin.json').write_text(json.dumps({'base':os.environ['BASE_SHA'],'candidate':git('rev-parse','HEAD'),'controller':os.environ['CONTROLLER_SHA'],'paths':paths},indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8

      - name: Import and freeze exact candidate
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          & './tools/testing/Invoke-PublicSurfaceValidation.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert not git('diff','--name-only') and not git('diff','--cached','--name-only')
          assert not git('ls-files','--others','--exclude-standard')
          assert git('rev-parse','HEAD') == 'dca44f662ec939c1c547c79a15a8f6da12c6929e'
          assert git('rev-parse','HEAD^{tree}') == '2231b0aeefe8c48c33727d46a80ea8e5f2bb8cde'
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); parent=(git rev-parse HEAD^) } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8

      - name: Run connected rendered creator and cold loader pairs
        run: |
          $ErrorActionPreference = 'Stop'
          $pairs = @(
            @{Name='desktop-first-reveal'; Prefix='tests/integration/test_scene_desktop_first_reveal_'},
            @{Name='optional-never-started'; Prefix='tests/integration/test_scene_optional_never_started_'}
          )
          foreach ($pair in $pairs) {
            $name = $pair.Name
            $createArgs = @('--rendering-method','gl_compatibility','--audio-driver','Dummy','-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$($pair.Prefix)create.gd",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/${name}-create.xml")
            $loadArgs = @('--rendering-method','gl_compatibility','--audio-driver','Dummy','-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$($pair.Prefix)load.gd",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/${name}-load.xml")
            & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId $name -LogName "${name}-create.log" -GodotArgs $createArgs -NextGodotArgs $loadArgs -NextLogName "${name}-load.log" -EvidenceLogPath ".godot/ci/${name}.jsonl" -TimeoutSeconds 600 -Rendered
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify complete focused census proofs and frozen source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections, json, pathlib, re, subprocess, xml.etree.ElementTree as ET
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          out = pathlib.Path('.godot/ci')
          def read(name): return json.loads((out/name).read_text(encoding='utf-8-sig'))
          frozen = read('candidate-commit.json')
          assert frozen['parent'] == 'b40e689a2897e1f97372dc3e1ea132cbef16e07a'
          assert frozen['source'] == git('rev-parse','HEAD') and frozen['tree'] == git('rev-parse','HEAD^{tree}')
          assert frozen['tree'] == '2231b0aeefe8c48c33727d46a80ea8e5f2bb8cde'
          result = {'scope':'connected pairs only; broader CI remains blocked; optional first-Reveal unit suite timeout unresolved','status':'passed','source':frozen['source'],'tree':frozen['tree'],'candidate':'dca44f662ec939c1c547c79a15a8f6da12c6929e','candidate_tree':'2231b0aeefe8c48c33727d46a80ea8e5f2bb8cde','cases':0,'assertions':0,'suites':[],'prior_verified':{'run':38773783369,'cases':22,'assertions':202,'counted_in_this_gate':False},'unresolved':{'suite':'tests/unit/test_scene_first_reveal.gd','run':38773783369,'exit_code':124,'timeout_seconds':600}}
          cases = [["desktop-first-reveal-create", "tests/integration/test_scene_desktop_first_reveal_create.gd"], ["desktop-first-reveal-load", "tests/integration/test_scene_desktop_first_reveal_load.gd"], ["optional-never-started-create", "tests/integration/test_scene_optional_never_started_create.gd"], ["optional-never-started-load", "tests/integration/test_scene_optional_never_started_load.gd"]]
          for name,script in cases:
              expected = [(script,n) for n in re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(),re.M)]
              root = ET.parse(out/(name+'.xml')).getroot()
              rows = list(root.iter('testcase'))
              assert expected and collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows) == collections.Counter(expected), name
              assert all(r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in rows),name
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']),name
              log = pathlib.Path('.godot/phase2r_logs',name+'.log').read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log),name
              count = sum(int(r.attrib['assertions']) for r in rows)
              result['cases'] += len(rows); result['assertions'] += count
              result['suites'].append({'name':name,'cases':len(rows),'assertions':count})
          for name,prefix in [["desktop-first-reveal", "tests/integration/test_scene_desktop_first_reveal_"], ["optional-never-started", "tests/integration/test_scene_optional_never_started_"]]:
              children = [json.loads(s) for s in (out/(name+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if s.strip()]
              assert len(children)==2 and all(r['exit_code']==0 for r in children),name
              assert children[0]['user_dir']==children[1]['user_dir'] and children[0]['test_root']==children[1]['test_root'],name
              for child,phase in zip(children,['create','load']):
                  assert '-gtest=res://'+prefix+phase+'.gd' in child['argv']
                  assert '--headless' not in child['argv']
                  assert '--rendering-method' in child['argv'] and 'gl_compatibility' in child['argv']
          create = read('scene-desktop-first-reveal-create-proof.json'); loaded = read('scene-desktop-first-reveal-load-proof.json')
          assert create['phase']=='create' and loaded['phase']=='load'
          assert create['process_id'] != loaded['process_id'] and loaded['creator_process_id']==create['process_id']
          assert create['user_dir']==loaded['user_dir']
          assert create['ready_count']==loaded['ready_count']==1
          assert create['refused_writes']==loaded['refused_writes']==1
          for key in ['file_hashes','run','profile','reading_session']: assert create[key]==loaded[key],key
          assert loaded['destination_branch'] != create['run']['lifecycle']['branch_id']
          assert create['file_hashes'] and all(re.fullmatch('[a-f0-9]{64}',v) for v in create['file_hashes'].values())
          oc = read('optional-never_started-create-proof.json'); ol = read('optional-never_started-load-proof.json')
          assert oc['mode']==ol['mode']=='never_started' and oc['outcome']==ol['outcome']=='never_started'
          assert oc['creator_process_id']==ol['creator_process_id'] and oc['creator_process_id'] != ol['loader_process_id']
          assert oc['creator_ready_count']==ol['ready_count']==1
          for key in ['closure','profile','record','slot_sha256']: assert oc[key]==ol[key],key
          assert re.fullmatch('[a-f0-9]{64}',oc['slot_sha256']) and oc['refusals']==0
          assert not git('diff','--name-only') and not git('diff','--cached','--name-only')
          assert not git('ls-files','--others','--exclude-standard')
          assert git('rev-parse','HEAD^{tree}')==frozen['tree']
          (out/'gate.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in subprocess.check_output(['git','diff','--name-only',origin['base'],'HEAD'],text=True).splitlines():
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-desktop-connected-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
