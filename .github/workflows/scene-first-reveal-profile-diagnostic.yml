name: Scene title template consent and recovery

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile-first-reveal:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BASE_SHA: 20bb737ab536539889d2482273012ef7e03e27e9
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: ac0686f9dedcce5d22ccf01ac7cd51f8797472ea
          path: source
          fetch-depth: 0

      - name: Verify exact title-template candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD') == 'ac0686f9dedcce5d22ccf01ac7cd51f8797472ea'
          assert git('rev-parse','HEAD^{tree}') == 'b8f70ce736f214fafecc010980a98f567e03d49a'
          assert git('rev-parse','HEAD^') == '676e953d9d465cbfb9fbdcb10bc2876e4edbe9c7'
          out = pathlib.Path('.godot/ci'); out.mkdir(parents=True, exist_ok=True)
          paths = git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').splitlines()
          assert len(paths) == 7
          (out/'candidate-origin.json').write_text(json.dumps({'base':os.environ['BASE_SHA'],'candidate':git('rev-parse','HEAD'),'controller':os.environ['CONTROLLER_SHA'],'paths':paths},indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8

      - name: Import and freeze exact candidate
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Freeze title template candidate'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); parent=(git rev-parse HEAD^) } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8

      - name: Rendered title template consent and retry
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_title_template.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/title-template.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'scene-title-template' -LogName 'title-template.log' -GodotArgs $arguments -EvidenceLogPath '.godot/ci/title-template.jsonl' -TimeoutSeconds 240 -Rendered
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Existing legacy prepared New Run compatibility
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_prepared_new_run.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/prepared-legacy.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'title-prepared-legacy' -LogName 'prepared-legacy.log' -GodotArgs $arguments -EvidenceLogPath '.godot/ci/prepared-legacy.jsonl' -TimeoutSeconds 240
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact title test census and retry evidence
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections, json, pathlib, re, subprocess, xml.etree.ElementTree as ET
          out = pathlib.Path('.godot/ci')
          script = 'tests/integration/test_scene_title_template.gd'
          expected = [(script,n) for n in re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(),re.M)]
          root = ET.parse(out/'title-template.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(expected) == 1
          assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in cases) == collections.Counter(expected)
          assert all(r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in cases)
          assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped'])
          log = pathlib.Path('.godot/phase2r_logs/title-template.log').read_text(encoding='utf-8-sig')
          assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log)
          children = [json.loads(line) for line in (out/'title-template.jsonl').read_text(encoding='utf-8-sig').splitlines() if line.strip()]
          assert len(children) == 1 and children[0]['exit_code'] == 0
          proof = json.loads((out/'title-template-proof.json').read_text(encoding='utf-8-sig'))
          assert proof['refusals'] == 1 and proof['ready_count'] == 2
          assert proof['first_assignment']['form'] != proof['second_assignment']['form']
          assert proof['second_assignment']['creation_transaction_id'] == proof['retry_transaction']
          assert len(proof['actions']) == 9
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          assert not subprocess.check_output(['git','diff','--cached','--name-only'],text=True).strip()
          result = {'status':'passed','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'cases':len(cases),'xml_assertions':sum(int(r.attrib['assertions']) for r in cases),'scope':'FINAL title pointer creation, cancellation, stale consent, physical autosave refusal and exact creation retry; labelled replaceable TEST content.'}
          legacy_script = 'tests/integration/test_prepared_new_run.gd'
          legacy_expected = [(legacy_script,n) for n in re.findall(r'^func (test_\w+)\(',pathlib.Path(legacy_script).read_text(),re.M)]
          legacy_root = ET.parse(out/'prepared-legacy.xml').getroot()
          legacy_cases = list(legacy_root.iter('testcase'))
          assert len(legacy_expected) == 10
          assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in legacy_cases) == collections.Counter(legacy_expected)
          assert all(r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in legacy_cases)
          assert not any(list(legacy_root.iter(tag)) for tag in ['failure','error','skipped'])
          assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',pathlib.Path('.godot/phase2r_logs/prepared-legacy.log').read_text(encoding='utf-8-sig'))
          legacy_children = [json.loads(line) for line in (out/'prepared-legacy.jsonl').read_text(encoding='utf-8-sig').splitlines() if line.strip()]
          assert len(legacy_children) == 1 and legacy_children[0]['exit_code'] == 0
          result['legacy_preparation'] = {'cases':len(legacy_cases),'xml_assertions':sum(int(r.attrib['assertions']) for r in legacy_cases)}
          (out/'gate.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in subprocess.check_output(['git','diff','--name-only',origin['base'],'HEAD'],text=True).splitlines():
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-title-template-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
