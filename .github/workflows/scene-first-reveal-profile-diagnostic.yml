name: Scene optional Challenge remaining recovery acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  profile-first-reveal:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BASE_SHA: 3ae6d9138fb53c388380c78550cf6082eafc0ea3
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: 0d3464691bfa13f4cd0fdfe368906b0de2079e53
          path: source
          fetch-depth: 0

      - name: Verify exact optional-Challenge candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json, os, pathlib, subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD') == '0d3464691bfa13f4cd0fdfe368906b0de2079e53'
          assert git('rev-parse','HEAD^{tree}') == 'a4cb2a7694df188b6c863f807dfe91987f4dea6e'
          assert git('rev-parse','HEAD^') == '9222cb72c6d63d054f057263dc97185250d29a5d'
          out = pathlib.Path('.godot/ci'); out.mkdir(parents=True, exist_ok=True)
          paths = git('diff','--name-only',os.environ['BASE_SHA'],'HEAD').splitlines()
          assert set(paths) == set(["autoload/DialogicBridge.gd","autoload/GameState.gd","autoload/SaveManager.gd","evidence/phase_2r/runtime/game_state_required_surface.json","evidence/phase_2r/runtime/game_state_surface.json","evidence/phase_2r/runtime/save_manager_required_surface.json","evidence/phase_2r/runtime/save_manager_surface.json","scripts/application/narrative/SaveManagerNarrativeCheckpointPort.gd","scripts/application/run/DatingPhysicalOwner.gd","scripts/infrastructure/save/DesktopContinuationOperationJournal.gd","scripts/ui/witnessed/WitnessedCaptionLayer.gd","tests/integration/scene_optional_child.gd","tests/integration/scene_optional_child.gd.uid","tests/integration/test_scene_optional_never_opened_create.gd","tests/integration/test_scene_optional_never_opened_create.gd.uid","tests/integration/test_scene_optional_never_opened_load.gd","tests/integration/test_scene_optional_never_opened_load.gd.uid","tests/integration/test_scene_optional_never_started_create.gd","tests/integration/test_scene_optional_never_started_create.gd.uid","tests/integration/test_scene_optional_never_started_load.gd","tests/integration/test_scene_optional_never_started_load.gd.uid","tests/integration/test_scene_optional_selected_absence_create.gd","tests/integration/test_scene_optional_selected_absence_create.gd.uid","tests/integration/test_scene_optional_selected_absence_load.gd","tests/integration/test_scene_optional_selected_absence_load.gd.uid","tests/integration/test_scene_optional_unfinished_create.gd","tests/integration/test_scene_optional_unfinished_create.gd.uid","tests/integration/test_scene_optional_unfinished_load.gd","tests/integration/test_scene_optional_unfinished_load.gd.uid","tests/unit/test_scene_creation_storage_recovery.gd","tests/unit/test_scene_creation_storage_recovery.gd.uid"])
          (out/'candidate-origin.json').write_text(json.dumps({'base':os.environ['BASE_SHA'],'candidate':git('rev-parse','HEAD'),'controller':os.environ['CONTROLLER_SHA'],'paths':paths},indent=2),encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8

      - name: Import and freeze exact candidate
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          & './tools/testing/Invoke-PublicSurfaceValidation.ps1' 
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(git ls-files --others --exclude-standard).Count -ne 0) { throw 'Import changed frozen source' }
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Freeze optional Challenge candidate'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); parent=(git rev-parse HEAD^) } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8

      - name: Challenge owners and startup recovery checks
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = @(
            @{Name='unit-absence'; Script='tests/unit/test_scene_absence.gd'},
            @{Name='unit-creation-storage-recovery'; Script='tests/unit/test_scene_creation_storage_recovery.gd'},
            @{Name='unit-scene-new-run-journal'; Script='tests/unit/test_scene_new_run_journal.gd'},
            @{Name='unit-scene-restore-journal'; Script='tests/unit/test_scene_restore_journal.gd'},
            @{Name='unit-scene-bootstrap-recovery'; Script='tests/unit/test_scene_bootstrap_recovery.gd'},
            @{Name='integration-new-run-pair'; Script='tests/integration/test_new_run_pair_durability.gd'},
            @{Name='integration-new-run-startup'; Script='tests/integration/test_new_run_startup_publication.gd'}
          )
          foreach ($case in $cases) {
            $name = $case.Name
            $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$($case.Script)",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/${name}.xml")
            & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId $name -LogName "${name}.log" -GodotArgs $arguments -EvidenceLogPath ".godot/ci/${name}.jsonl" -TimeoutSeconds 600
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify exact census, physical proof and clean source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections, json, pathlib, re, subprocess, xml.etree.ElementTree as ET
          out = pathlib.Path('.godot/ci')
          result = {'scope':'remaining recovery suites; rendered and Challenge evidence retained separately from run102 on identical tree','status':'passed','source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'cases':0,'assertions':0}
          cases = []
          cases += [["unit-absence","tests/unit/test_scene_absence.gd"],["unit-creation-storage-recovery","tests/unit/test_scene_creation_storage_recovery.gd"],["unit-scene-new-run-journal","tests/unit/test_scene_new_run_journal.gd"],["unit-scene-restore-journal","tests/unit/test_scene_restore_journal.gd"],["unit-scene-bootstrap-recovery","tests/unit/test_scene_bootstrap_recovery.gd"],["integration-new-run-pair","tests/integration/test_new_run_pair_durability.gd"],["integration-new-run-startup","tests/integration/test_new_run_startup_publication.gd"]]
          for name,script in cases:
              expected = [(script,n) for n in re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(),re.M)]
              root = ET.parse(out/(name+'.xml')).getroot()
              rows = list(root.iter('testcase'))
              assert expected and collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows) == collections.Counter(expected),name
              assert all(r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in rows),name
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']),name
              log = pathlib.Path('.godot/phase2r_logs',name+'.log').read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log),name
              result['cases'] += len(rows)
              result['assertions'] += sum(int(r.attrib['assertions']) for r in rows)
          for c in ["unit-absence","unit-creation-storage-recovery","unit-scene-new-run-journal","unit-scene-restore-journal","unit-scene-bootstrap-recovery","integration-new-run-pair","integration-new-run-startup"]:
              children = [json.loads(s) for s in (out/(c+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if s.strip()]
              assert len(children) == (1 if c.startswith(('unit-','integration-')) else 2) and all(r['exit_code'] == 0 for r in children),c
              if len(children) == 2: assert children[0]['user_dir'] == children[1]['user_dir']
          assert not subprocess.check_output(['git','diff','--name-only'],text=True).strip()
          assert not subprocess.check_output(['git','diff','--cached','--name-only'],text=True).strip()
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip() == 'a4cb2a7694df188b6c863f807dfe91987f4dea6e'
          (out/'gate.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in subprocess.check_output(['git','diff','--name-only',origin['base'],'HEAD'],text=True).splitlines():
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-optional-challenge-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
