name: Pinned consumer sibling traversal regression
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  traversal-regression:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DWM_SOURCE_SHA: 27dd7a7d0e2c064451d40aa4ce44fdca751be878
    steps:
      - name: Preserve exact source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 27dd7a7d0e2c064451d40aa4ce44fdca751be878
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: tools/diagnostics/ending-publication-20261019/traversal-regression
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Bind isolated test source
        run: |
          if ((git rev-parse HEAD) -cne $env:DWM_SOURCE_SHA) { throw 'Source mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -cne '133a34ae5445e67764241a62b268b14ef74d5ac7') { throw 'Source tree mismatch' }
          New-Item -ItemType Directory -Force '.godot/traversal' | Out-Null
          @{source=$env:DWM_SOURCE_SHA;tree='133a34ae5445e67764241a62b268b14ef74d5ac7';controller='${{ github.event.pull_request.head.sha }}';diagnostic_only=$true;game_executed=$false} | ConvertTo-Json | Set-Content '.godot/traversal/origin.json' -Encoding utf8NoBOM
      - name: Demonstrate original failures and verify bounded correction
        run: |
          python tools/diagnostics/ending-publication-20261019/traversal-regression/run.py .godot/traversal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original and corrected logs and sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-traversal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/traversal/
            !.godot/traversal/target/**
            !.godot/traversal/vendor/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
