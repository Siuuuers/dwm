name: Ending applied consumer diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / committed AccessKit state
    runs-on: windows-2022
    # Native compilation has a separate ceiling. Original player deadlines below are unchanged.
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 42c8a32e20a29e6f97d49d3f7fed5d00eb100771
          fetch-depth: 2
          persist-credentials: true
      - name: Bind the diagnostic tools and unchanged game harness
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '42c8a32e20a29e6f97d49d3f7fed5d00eb100771') { throw 'Diagnostic tool source mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -cne '4c4ef98d8496b09e070ef4a9aa244de18de8d427') { throw 'Diagnostic tool tree mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch --no-tags --depth=1 origin 81847d8b1560340a3a7769223cee0b46c6bdc0f9 '${{ github.event.pull_request.head.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original/controller source fetch failed' }
          @'
          import hashlib,json,pathlib,subprocess
          game='81847d8b1560340a3a7769223cee0b46c6bdc0f9'
          tools='42c8a32e20a29e6f97d49d3f7fed5d00eb100771'
          controller='${{ github.event.pull_request.head.sha }}'
          prefix='tools/diagnostics/ending-publication-20261019/'
          out=pathlib.Path('.godot/ci')
          game_tree=subprocess.check_output(['git','rev-parse',game+'^{tree}'],text=True).strip()
          if game_tree!='4581a9f12d63684836c722f72cffd533491f3c06':raise RuntimeError('Frozen game tree mismatch')
          changed=subprocess.check_output(['git','diff','--name-only',game,tools],text=True).splitlines()
          if not changed or any(not name.startswith(prefix) for name in changed):raise RuntimeError('Diagnostic tools alter frozen game/harness paths')
          shared=['tools/testing/Invoke-ExportedGameplay.ps1','tools/testing/Probe-ExportedWindow.ps1','tools/testing/Invoke-IsolatedGodot.ps1','tools/testing/Invoke-WindowsExportValidation.ps1','tests/tooling/Test-ExportedGameplayDeadline.ps1','project.godot','export_presets.cfg','scripts/ui/EndingScene.gd','scripts/ui/witnessed/WitnessedCaptionLayer.gd','scripts/ui/witnessed/WitnessedAccessibleCaption.gd','scripts/ui/witnessed/WitnessedSourceCanvas.gd']
          pins={}
          for name in shared+changed:
              data=pathlib.Path(name).read_bytes()
              source=game if name in shared else tools
              committed=subprocess.check_output(['git','show',source+':'+name])
              if data!=committed:raise RuntimeError('Working bytes differ from pin: '+name)
              target=out/'source'/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              pins[name]={'source_commit':source,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob':subprocess.check_output(['git','rev-parse',source+':'+name],text=True).strip()}
          source=out/'source/controller.yml'
          source.write_bytes(subprocess.check_output(['git','show',controller+':.github/workflows/scene-first-reveal-profile-diagnostic.yml']))
          origin={'game_commit':game,'game_tree':game_tree,'tool_source':tools,'tool_tree':'4c4ef98d8496b09e070ef4a9aa244de18de8d427','controller':controller,'engine_base':'35e80b3a8822a9df9be390814b62f44c0a9c69e8','engine_tree':'499fa231ee5d21878988a4a9cb881749def3946d','original_run':39155624496,'original_artifact':12146662424,'diagnostic':'Separately built native observer; original official Load remains failed','shared_source_pins':pins,'changed_paths':changed,'driver_modes':['Capability','Create','Load'],'step_timeout_seconds':30,'journey_timeout_seconds':480,'outer_timeout_minutes_per_mode':10,'renderer':'ProjectDefault','accessibility':'Always','audio':'Dummy','load_flags':['ProfileSaveLoad','ContinueAfterQuiet','TraceDay5','NativeReadyCaptions'],'trace_environment':'GODOT_ACCESSKIT_CONSUMER_TRACE_PATH','trace_scope':'Load only; natural committed consumer updates/focus; no Navigate hook or refresh'}
          (out/'audit-origin.json').write_text(json.dumps(origin,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set the diagnostic tool path
        run: |
          "PUBLICATION_TOOLS=$env:GITHUB_WORKSPACE/tools/diagnostics/ending-publication-20261019" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Parse all new PowerShell and the unchanged native driver
        run: |
          $ErrorActionPreference = 'Stop'
          $records = @()
          $paths = @('tools/testing/Invoke-ExportedGameplay.ps1','tools/testing/Probe-ExportedWindow.ps1',"$env:PUBLICATION_TOOLS/Build-NativePublicationProbe.ps1","$env:PUBLICATION_TOOLS/New-NativeDiagnosticPackage.ps1","$env:PUBLICATION_TOOLS/Build-ConsumerSdk.ps1")
          foreach ($path in $paths) {
            $tokens=$null; $errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile([IO.Path]::GetFullPath($path),[ref]$tokens,[ref]$errors)
            $records += @{path=$path;ok=($errors.Count -eq 0);errors=@($errors | ForEach-Object { @{message=$_.Message;line=$_.Extent.StartLineNumber;text=$_.Extent.Text} })}
          }
          $records | ConvertTo-Json -Depth 6 | Set-Content '.godot/ci/powershell-parse.json' -Encoding utf8NoBOM
          if (@($records | Where-Object { -not $_.ok }).Count -ne 0) { throw 'PowerShell source parsing failed' }
      - name: Check applied-state reader and synthetic binding
        run: |
          & python -m unittest discover -s "$env:PUBLICATION_TOOLS/consumer_analysis" -p 'test_*.py' -v 2>&1 | Tee-Object -FilePath '.godot/ci/consumer-reader-tests.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify unchanged original player deadlines
        run: |
          & pwsh -NoProfile -File ./tests/tooling/Test-ExportedGameplayDeadline.ps1 -DriverPath ./tools/testing/Invoke-ExportedGameplay.ps1 -OutputPath .godot/ci/deadline-tests.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download the frozen original game package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '12146662424'
          run-id: '39155624496'
          github-token: ${{ github.token }}
          repository: Siuuuers/dwm
          path: .godot/original-game-artifact
      - name: Verify retained package availability and byte identity before building
        run: |
          $packages = @(Get-ChildItem .godot/original-game-artifact -Recurse -Filter DWM-windows-x86_64-validation.zip -File)
          if ($packages.Count -ne 1 -or $packages[0].Length -ne 99457801 -or (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne '7c3053d2073fc3caee98dc5c038e720d5e860952375039d0db054dcd14812eb8') { throw 'Retained original package mismatch' }
      - name: Fetch the exact C SDK source
        uses: actions/checkout@v7
        with:
          repository: AccessKit/accesskit-c
          ref: 72460cd52d1b24492393cdf54a6f19d2fd63e258
          path: .godot/consumer-sdk-source
          fetch-depth: 1
          persist-credentials: false
      - name: Check and build the patched Windows consumer SDK
        id: consumer-sdk
        timeout-minutes: 25
        run: |
          & "$env:PUBLICATION_TOOLS/Build-ConsumerSdk.ps1" -SourceRoot .godot/consumer-sdk-source -ProbeRoot "$env:PUBLICATION_TOOLS/consumer-probe" -HeaderPath "$env:PUBLICATION_TOOLS/native-probe/reference/thirdparty/accesskit/include/accesskit.h" -OutputPath .godot/ci/consumer-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the exact patched SDK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/consumer-sdk/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Fetch the exact public source for the separate native build
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: 35e80b3a8822a9df9be390814b62f44c0a9c69e8
          path: .godot/native-engine
          fetch-depth: 1
          persist-credentials: false
      - name: Compile the reviewed opt-in native observer
        id: native-build
        timeout-minutes: 100
        run: |
          & "$env:PUBLICATION_TOOLS/Build-NativePublicationProbe.ps1" -EngineRoot .godot/native-engine -ProbeRoot "$env:PUBLICATION_TOOLS/native-probe" -OutputPath .godot/ci/native-build -DependencyPath "$env:RUNNER_TEMP/dwm-native-publication-deps" -ConsumerSdkPath .godot/ci/consumer-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain the built native template before packaging
        id: template-retention
        uses: actions/upload-artifact@v4
        with:
          name: consumer-native-template-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/native-engine/bin/*
            !.godot/native-engine/bin/obj/**
            .godot/ci/native-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Build and validate the explicitly diagnostic package
        id: package
        timeout-minutes: 5
        run: |
          & "$env:PUBLICATION_TOOLS/New-NativeDiagnosticPackage.ps1" -OriginalArtifactPath .godot/original-game-artifact -EngineRoot .godot/native-engine -OutputPath .godot/ci/native-diagnostic -BuildReceipt .godot/ci/native-build/build-receipt.json -ConsumerProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content '.godot/ci/native-diagnostic/validation.json' -Raw | ConvertFrom-Json
          if (-not $receipt.ok -or -not $receipt.diagnostic -or $receipt.commit -cne '81847d8b1560340a3a7769223cee0b46c6bdc0f9') { throw 'Diagnostic package receipt mismatch' }
          "DWM_EXPORT_SHA=$($receipt.archive.sha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Retain exact diagnostic executable package
        id: package-retention
        uses: actions/upload-artifact@v4
        with:
          name: consumer-native-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/native-diagnostic/DWM-windows-x86_64-diagnostic.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Run original capability gates on the diagnostic native package
        id: capability
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Capability -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/native-diagnostic/DWM-windows-x86_64-diagnostic.zip') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit '81847d8b1560340a3a7769223cee0b46c6bdc0f9' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-capability-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-capability') -Accessibility Always -Audio Dummy
          $code = $LASTEXITCODE; $watch.Stop()
          @{mode='Capability';exit_code=$code;elapsed_seconds=$watch.Elapsed.TotalSeconds;diagnostic_native=$true;trace_enabled=$false} | ConvertTo-Json | Set-Content '.godot/ci/capability-process.json'
          if ($code -ne 0) { exit $code }
          $result=Get-Content '.godot/ci/exported-capability/result.json' -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw 'Capability failed its original gate' }
      - name: Create the original Day4 save on the diagnostic native package
        id: create
        if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $watch = [Diagnostics.Stopwatch]::StartNew()
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Create -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/native-diagnostic/DWM-windows-x86_64-diagnostic.zip') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit '81847d8b1560340a3a7769223cee0b46c6bdc0f9' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create') -Accessibility Always -Audio Dummy -CapabilityReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-capability/result.json')
          $code = $LASTEXITCODE; $watch.Stop()
          @{mode='Create';exit_code=$code;elapsed_seconds=$watch.Elapsed.TotalSeconds;diagnostic_native=$true;trace_enabled=$false} | ConvertTo-Json | Set-Content '.godot/ci/create-process.json'
          if ($code -ne 0) { exit $code }
          $result=Get-Content '.godot/ci/exported-create/result.json' -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw 'Create failed its original gate' }
      - name: Capture naturally committed consumer state during the original Load journey
        id: load
        if: ${{ !cancelled() && steps.create.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $traceRoot = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/consumer-trace'
          New-Item -ItemType Directory -Path $traceRoot | Out-Null
          $env:GODOT_ACCESSKIT_CONSUMER_TRACE_PATH = Join-Path $traceRoot 'trace-{pid}.jsonl'
          $watch = [Diagnostics.Stopwatch]::StartNew()
          try {
            & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Load -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/native-diagnostic/DWM-windows-x86_64-diagnostic.zip') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit '81847d8b1560340a3a7769223cee0b46c6bdc0f9' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-load') -Accessibility Always -Audio Dummy -CreatorReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create/result.json') -ProfileSaveLoad -ContinueAfterQuiet -TraceDay5 -NativeReadyCaptions
            $code = $LASTEXITCODE
          } finally {
            Remove-Item Env:GODOT_ACCESSKIT_CONSUMER_TRACE_PATH
            $watch.Stop()
          }
          @{mode='Load';exit_code=$code;elapsed_seconds=$watch.Elapsed.TotalSeconds;diagnostic_native=$true;trace_enabled=$true;trace_pattern='consumer-trace/trace-{pid}.jsonl'} | ConvertTo-Json | Set-Content '.godot/ci/load-process.json'
          if ($code -ne 0) { exit $code }
          $result=Get-Content '.godot/ci/exported-load/result.json' -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw 'Load failed its original gate' }
      - name: Bind applied-state observations without changing original outcomes
        id: replay
        if: always()
        run: |
          & python "$env:PUBLICATION_TOOLS/consumer_analysis/bind_consumer.py" --evidence .godot/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve original player gates and diagnostic source custody
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = [Collections.Generic.List[string]]::new()
          $outcomes = [Collections.Generic.List[object]]::new()
          foreach ($mode in @('capability','create','load')) {
            $path = ".godot/ci/exported-$mode/result.json"
            if (-not (Test-Path -LiteralPath $path)) { $failures.Add("Unexecuted or missing $mode result"); continue }
            $result=Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $outcomes.Add(@{mode=$mode;result=$path;ok=$result.ok;exit_code=$result.exit_code;clean_player_exit=$result.clean_player_exit;forced_cleanup=$result.forced_cleanup})
            if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { $failures.Add("$mode failed its original gate on diagnostic native") }
          }
          foreach ($step in @(@{name='consumer-sdk';outcome='${{ steps.consumer-sdk.outcome }}'},@{name='native-build';outcome='${{ steps.native-build.outcome }}'},@{name='template-retention';outcome='${{ steps.template-retention.outcome }}'},@{name='package';outcome='${{ steps.package.outcome }}'},@{name='package-retention';outcome='${{ steps.package-retention.outcome }}'},@{name='capability';outcome='${{ steps.capability.outcome }}'},@{name='create';outcome='${{ steps.create.outcome }}'},@{name='load';outcome='${{ steps.load.outcome }}'},@{name='replay';outcome='${{ steps.replay.outcome }}'})) {
            if ($step.outcome -ne 'success') { $failures.Add("$($step.name) step did not succeed") }
          }
          $allowed = @('.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1')
          foreach ($path in @(git diff HEAD --name-only)) { if ($path -notin $allowed) { $failures.Add("Unexpected tracked game/tools change: $path") } }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{ok=($failures.Count -eq 0);scope='Unchanged original player gates on a separately built diagnostic native executable';official_original_load_ok=$false;official_acceptance_established=$false;original_gate_outcomes_on_diagnostic_native=$outcomes.ToArray();failures=$failures.ToArray()} | ConvertTo-Json -Depth 8 | Set-Content '.godot/ci/diagnostic-acceptance.json'
          if ($failures.Count -ne 0) { throw ($failures -join '; ') }
      - name: Seal original evidence for durable retention
        if: always()
        run: |
          & python "$env:PUBLICATION_TOOLS/retain_evidence.py" --evidence .godot/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/
            !.godot/ci/**/package/**
            !.godot/ci/**/smoke-user/**
            !.godot/ci/**/*.zip
            !.godot/ci/consumer-sdk/lib/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  retained-fixture-qualification:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 3b98a73f1ee271bbc6e733c7665ad0a3e8e75db7
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '3b98a73f1ee271bbc6e733c7665ad0a3e8e75db7' -or (git rev-parse 'HEAD^{tree}') -cne '507c82e9315abe1732c29ba2b83fe5deae4f5036') { throw 'Fixture source pin mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{source='3b98a73f1ee271bbc6e733c7665ad0a3e8e75db7';tree='507c82e9315abe1732c29ba2b83fe5deae4f5036';controller='${{ github.event.pull_request.head.sha }}';scope='B retained fixture correction and same-process isolation'} | ConvertTo-Json | Set-Content '.godot/ci/fixture-origin.json'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify retained fixtures and same-process isolation
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $cases = @(
            @{Suite='test_frozen_run_context'; Method='test_v6_does_not_backfill_absent_cache_and_v7_refuses_generated_dating_gap'; Count=1}
            @{Suite='test_frozen_run_context'; Method='test_saved_dating_binds_run_board_and_effect_but_keeps_original_branch_and_tier'; Count=1}
            @{Suite='test_frozen_run_context'; Method='test_present_dating_cache_is_exact_and_requires_its_reached_phases'; Count=1}
            @{Suite='test_frozen_run_context'; Method='test_semantic_checkpoint_cannot_disagree_with_its_saved_canonical_projection'; Count=1}
            @{Suite='test_frozen_run_context'; Method='test_strict_prepared_condition_candidate_requires_its_generated_dating_cache_without_repair'; Count=1}
            @{Suite='test_frozen_run_context'; Method='test_strict_semantic_checkpoint_requires_both_discriminators_and_preserves_generic_restart'; Count=1}
            @{Suite='test_run_snapshot_schema'; Method='test_v8_requires_generated_contact_context_before_preparing_a_detached_candidate'; Count=1}
            @{Suite='test_retained_frozen_context_fixture'; Method=''; Count=5}
          )
          $index = 0
          foreach ($case in $cases) {
            $index++
            $id = "retained-fixture-$index"
            $godotArguments = @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', "-gtest=res://tests/unit/$($case.Suite).gd", '-gexit', '-glog=2', "-gjunit_xml_file=res://.godot/ci/$id.xml")
            if ($case.Method) { $godotArguments += "-gunit_test_name=$($case.Method)" }
            & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId $id -LogName "$id.log" -EvidenceLogPath ".godot/ci/$id.jsonl" -TimeoutSeconds 180 -GodotArgs $godotArguments
            if ($LASTEXITCODE -ne 0) { throw "$id failed with exit $LASTEXITCODE" }
            [xml]$report = Get-Content -LiteralPath ".godot/ci/$id.xml" -Raw
            $executed = @($report.SelectNodes('//testcase'))
            if ($executed.Count -ne $case.Count) { throw "$id expected $($case.Count) cases, got $($executed.Count)" }
            if ($report.SelectNodes('//failure | //error | //skipped').Count -ne 0) { throw "$id reported failed or skipped tests" }
            if ($case.Method -and $executed[0].name -cne $case.Method) { throw "$id ran an unexpected test" }
          }
      - name: Retain fixture source and verify tracked bytes
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force '.godot/ci/fixture-source' | Out-Null
          $records = @()
          foreach ($path in @('tests/unit/test_frozen_run_context.gd','tests/unit/test_run_snapshot_schema.gd','tests/support/RetainedFrozenContextFixture.gd','tests/unit/test_retained_frozen_context_fixture.gd','tools/testing/Invoke-IsolatedGodot.ps1')) {
            $target = Join-Path '.godot/ci/fixture-source' $path
            New-Item -ItemType Directory -Force (Split-Path $target) | Out-Null
            Copy-Item $path $target
            $records += @{path=$path;sha256=(Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant();blob=(git rev-parse "HEAD:$path")}
          }
          $records | ConvertTo-Json -Depth 4 | Set-Content '.godot/ci/fixture-source-manifest.json'
          $allowed = @('.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1')
          foreach ($path in @(git diff HEAD --name-only)) { if ($path -notin $allowed) { throw "Fixture tracked source changed: $path" } }
      - name: Upload fixture qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retained-fixture-qualification
          path: |
            .godot/ci/fixture-origin.json
            .godot/ci/fixture-source/
            .godot/ci/fixture-source-manifest.json
            .godot/ci/import.log
            .godot/ci/retained-fixture-*.xml
            .godot/ci/retained-fixture-*.jsonl
            .godot/phase2r_logs/retained-fixture-*.log
          if-no-files-found: error
