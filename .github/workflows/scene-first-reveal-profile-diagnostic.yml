name: Focused Gallery caption collection

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: gallery-caption-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gallery-caption:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Focused Gallery caption collection
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DWM_CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/playable-journeys
    steps:
      - uses: actions/checkout@v7
        with:
          # Same disposable-index workaround as the Windows jobs above.
          ref: 7aee979d5d7e66d66169800f0cb619a3a259a1e8
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Verify pinned source and retain provenance
        run: |
          test "$(git rev-parse HEAD)" = "7aee979d5d7e66d66169800f0cb619a3a259a1e8"
          test "$(git rev-parse HEAD^{tree})" = "f37214d64c0b4d9103c0c04b43c83fe041334b26"
          mkdir -p .godot/ci/gallery-caption-collection
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path(".godot/ci/gallery-caption-collection/provenance.json").write_text(json.dumps({
              "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "controller": os.environ["DWM_CONTROLLER_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW_SHA"],
              "event": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"]
          }, indent=2) + "\n")
          PY
      - name: Install Godot and software display
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$archive"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"
          editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$editor"
          echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"
          "$editor" --version
      - name: Start and verify native Linux speech service
        timeout-minutes: 2
        run: bash tools/testing/start_cloud_speech.sh
      - name: Upload native speech environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/cloud-speech/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Import project
        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          set +e
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          process_exit=$?
          set -e
          printf '{"exit_code":%s}\n' "$process_exit" > ".godot/ci/gallery-caption-collection/import-process.json"
          test "$process_exit" -eq 0
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then
            exit 1
          fi
          # Dialogic's editor scan rewrites its timeline lookup during import.
          git restore -- project.godot
      - name: Render admitted Gallery caption collection
        timeout-minutes: 5
        env:
          DWM_GALLERY_COLLECTION_OUTPUT: ${{ github.workspace }}/.godot/ci/gallery-caption-collection
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/gallery-caption-collection/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/gallery-caption-collection/test-root
        run: |
          mkdir -p "$DWM_GALLERY_COLLECTION_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          set +e
          timeout 240s xvfb-run -a "$GODOT_CONSOLE_PATH" --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility --audio-driver Dummy --log-file "$DWM_GALLERY_COLLECTION_OUTPUT/render.log" --script res://tests/ui/render_gallery_caption_collection.gd -- --phase2r-bootstrap-mode=final
          process_exit=$?
          set -e
          printf '{"exit_code":%s}\n' "$process_exit" > ".godot/ci/gallery-caption-collection/render-process.json"
          test "$process_exit" -eq 0
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_GALLERY_COLLECTION_OUTPUT/render.log"; then
            exit 1
          fi
          grep -E '^GALLERY_CAPTION_COLLECTION_RENDER_VERIFIED captures=95 evidence=' "$DWM_GALLERY_COLLECTION_OUTPUT/render.log"
      - name: Verify rendered evidence census
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".godot/ci/gallery-caption-collection")
          d = json.loads((root / "measurements.json").read_text())
          assert d["ok"] is True and not d["failures"]
          expected_status = {f"status-{f}-{l}-{n}-{v}.png" for f in ("pixel", "readable") for l in ("en", "zh_CN", "zh_HK", "ja", "ko") for n in (100, 125, 150) for v in ("added", "failed", "uncertain")}
          expected_actual = {n + ".png" for n in ("first-visible", "second-visible-not-collectable", "restarted-visible", "failed-real", "uncertain-real")}
          assert len(d["samples"]) == 95
          assert {v["file"] for v in d["samples"]} == expected_status | expected_actual
          assert {v.name for v in root.glob("*.png")} == expected_status | expected_actual
          receipts = d["setup_results"]
          assert len(receipts) == 23
          for r in receipts:
              if r["stage"] == "startup": assert r["result"]["ready"] is True
              elif "result" in r: assert r["result"]["ok"] is True
          versions = next(r for r in receipts if r["stage"] == "version_selection")
          assert len(set(versions["versions"])) == 2 and versions["selected"] in versions["versions"]
          context = next(r["context"] for r in receipts if r["stage"] == "return_context")
          assert context["record"] == "ending.alone" and context["signature"] == versions["selected"]
          assert context["index"] > 0 and context["paper"] > 0
          assert {r["attempt"] for r in d["publications"]} == {1, 2, 3, 4, 5}
          for phase in ("import", "render"):
              assert json.loads((root / (phase + "-process.json")).read_text())["exit_code"] == 0
          print("GALLERY_CAPTION_EVIDENCE_VERIFIED samples=95 setup_receipts=23")
          PY
      - name: Retain import log
        if: always()
        run: |
          if test -f "$DWM_RENDER_OUTPUT/import.log"; then
            cp "$DWM_RENDER_OUTPUT/import.log" .godot/ci/gallery-caption-collection/import.log
          fi
      - name: Upload Gallery caption collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-caption-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/gallery-caption-collection/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
