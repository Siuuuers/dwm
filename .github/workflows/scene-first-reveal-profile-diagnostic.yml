name: Seven-day connected ending qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  connected:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      BASE_SHA: 027a70dff8ee45bc43dfae3be592430c39147721
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: f56171e6e663f3164a6ef1be0c50a3c95a465408
          path: source
          fetch-depth: 16
      - name: Verify exact candidate source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json,os,pathlib,subprocess
          subprocess.check_call(['git','cat-file','-e',os.environ['BASE_SHA']])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='f56171e6e663f3164a6ef1be0c50a3c95a465408'
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          (out/'candidate-origin.json').write_text(json.dumps({'base':os.environ['BASE_SHA'],'candidate':'f56171e6e663f3164a6ef1be0c50a3c95a465408','controller':os.environ['CONTROLLER_SHA'],'scope':'seven-day connected terminal persistence and rendered restart proof'}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8



      - name: Import and freeze generated test identities
        id: freeze
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          $env:DWM_SCENE_READING_FIXTURE = '1'
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId connected-import-fixture -LogName import.log -GodotArgs @('--import') -EvidenceLogPath .godot/ci/import-fixture.jsonl -TimeoutSeconds 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String ".godot/phase2r_logs/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Import failed' }
          git restore --worktree -- project.godot
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId connected-export -LogName export-registration.log -GodotArgs @('-s','res://tools/authoring/ExportSevenDayRegistration.gd') -EvidenceLogPath .godot/ci/export-registration.jsonl -TimeoutSeconds 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String ".godot/phase2r_logs/export-registration.log" -Pattern 'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Registration export failed' }
          Remove-Item Env:DWM_SCENE_READING_FIXTURE
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId connected-import -LogName import-connected.log -GodotArgs @('--import') -EvidenceLogPath .godot/ci/import-connected.jsonl -TimeoutSeconds 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String ".godot/phase2r_logs/import-connected.log" -Pattern 'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Connected import failed' }
          git restore --worktree -- project.godot
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId connected-validate-registration -LogName validate-registration.log -GodotArgs @('-s','res://tools/authoring/ExportSevenDayRegistration.gd','--','--validate-seven-day-export') -EvidenceLogPath .godot/ci/validate-registration.jsonl -TimeoutSeconds 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String ".godot/phase2r_logs/validate-registration.log" -Pattern 'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Exported registration validation failed' }
          $validationMarkers = @(Get-Content .godot/phase2r_logs/validate-registration.log | Where-Object { $_ -ceq 'SEVEN_DAY_EXPORT_VALIDATED first_target_id=target.Day1' })
          if ($validationMarkers.Count -ne 1) { throw 'Export validation pass marker missing or repeated' }
          & './tools/testing/Invoke-PublicSurfaceValidation.ps1' -Regenerate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json,os,re,subprocess,pathlib
          added=subprocess.check_output(['git','diff','--name-only','--diff-filter=A',os.environ['BASE_SHA'],'HEAD','--','*.gd'],text=True).splitlines()
          tracked=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          uids=sorted(p+'.uid' for p in added if p+'.uid' not in tracked)
          exported=['data/manifests/scene_story_registration.json','data/manifests/scene_ending_reading_catalogue.json']
          surfaces=['evidence/phase_2r/runtime/game_state_surface.json','evidence/phase_2r/runtime/save_manager_surface.json']
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= set(exported+surfaces),(changed,exported+surfaces)
          actual=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          resource_uids=sorted(p for p in actual if p.endswith('.dtl.uid') and p[:-4] in tracked)
          for name in resource_uids:
              assert re.fullmatch(rb'uid://[a-z0-9]+\n',pathlib.Path(name).read_bytes()),name
          expected=set(uids+resource_uids+[p for p in exported if p not in tracked])
          assert actual==expected,(sorted(actual),sorted(expected))
          for name in uids+resource_uids+exported+surfaces: assert pathlib.Path(name).is_file(),name
          pathlib.Path('.godot/ci/generated-files.json').write_text(json.dumps({'uids':uids,'resource_uids':resource_uids,'exported':exported,'surfaces':surfaces,'added_scripts':added},indent=2))
          subprocess.check_call(['git','add',*uids,*resource_uids,*exported,*surfaces])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'Freeze connected registration, identities and surface inventories'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{ source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}') } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8
      - name: Run focused terminal and authoring suites
        run: |
          $cases = @(
            @{Name='terminal-lifecycle'; Script='tests/unit/test_scene_terminal_lifecycle.gd'},
            @{Name='terminal-presentation'; Script='tests/unit/test_scene_terminal_presentation.gd'},
            @{Name='terminal-snapshot'; Script='tests/unit/test_scene_terminal_snapshot.gd'},
            @{Name='sequence-authoring'; Script='tests/unit/test_scene_sequence_authoring.gd'},
            @{Name='seven-day-templates'; Script='tests/unit/test_seven_day_templates.gd'}
          )
          $failed = $false
          foreach ($case in $cases) {
            $name = $case.Name
            $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$($case.Script)",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/${name}.xml")
            & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId $name -LogName "${name}.log" -GodotArgs $arguments -EvidenceLogPath ".godot/ci/${name}.jsonl" -TimeoutSeconds 240
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Render connected creation and fresh-process Load
        if: ${{ !cancelled() && steps.freeze.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue
          $create = @('--rendering-method','gl_compatibility','--audio-driver','Dummy','-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_seven_day_connected_create.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/connected-create.xml')
          $load = @('--rendering-method','gl_compatibility','--audio-driver','Dummy','-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_seven_day_connected_load.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/connected-load.xml')
          $terminalLoad = @('--rendering-method','gl_compatibility','--audio-driver','Dummy','-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_seven_day_terminal_load.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/terminal-load.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'connected' -LogName 'connected-create.log' -GodotArgs $create -NextGodotArgs $load -NextLogName 'connected-load.log' -ThirdGodotArgs $terminalLoad -ThirdLogName 'terminal-load.log' -EvidenceLogPath '.godot/ci/connected.jsonl' -TimeoutSeconds 600 -Rendered
          exit $LASTEXITCODE
      - name: Verify exact test census and frozen source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          frozen=json.loads((out/'candidate-commit.json').read_text(encoding='utf-8-sig'))
          result={'source':frozen['source'],'tree':frozen['tree'],'passed':0,'assertions':0,'suites':[]}
          suites=[('terminal-load','tests/integration/test_scene_seven_day_terminal_load.gd'),('terminal-lifecycle','tests/unit/test_scene_terminal_lifecycle.gd'),('terminal-presentation','tests/unit/test_scene_terminal_presentation.gd'),('terminal-snapshot','tests/unit/test_scene_terminal_snapshot.gd'),('connected-create','tests/integration/test_scene_seven_day_connected_create.gd'),('connected-load','tests/integration/test_scene_seven_day_connected_load.gd'),('sequence-authoring','tests/unit/test_scene_sequence_authoring.gd'),('seven-day-templates','tests/unit/test_seven_day_templates.gd')]
          for name,script in suites:
              expected=re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(),re.M)
              root=ET.parse(out/(name+'.xml')).getroot();rows=list(root.iter('testcase'))
              assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter((script,n) for n in expected),name
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']),name
              assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows),name
              count=sum(int(r.attrib['assertions']) for r in rows)
              log=pathlib.Path('.godot/phase2r_logs',name+'.log').read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',log),name
              result['passed']+=len(rows);result['assertions']+=count
              result['suites'].append({'name':name,'passed':len(rows),'assertions':count})
          for name in ['terminal-lifecycle','terminal-presentation','terminal-snapshot','sequence-authoring','seven-day-templates','connected']:
              children=[json.loads(s) for s in (out/(name+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if s.strip()]
              assert len(children)==(3 if name=='connected' else 1) and all(c['exit_code']==0 for c in children),name
              if name=='connected':
                  assert len({c['test_root'] for c in children})==1 and len({c['user_dir'] for c in children})==1
                  assert len({c['log_path'] for c in children})==3
                  assert all(children[i]['ended_at_utc']<=children[i+1]['started_at_utc'] for i in range(2))
          for proof in ['scene-seven-day-create-proof.json','scene-seven-day-load-proof.json','scene-seven-day-terminal-load-proof.json']:
              assert (out/proof).is_file(),proof
              json.loads((out/proof).read_text(encoding='utf-8-sig'))
          assert list(out.glob('computer-seven-day-*.png')), 'Missing rendered evidence'
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==frozen['tree']
          (out/'gate.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Summarize rendered failures
        if: always()
        run: |
          @'
          import pathlib
          for p in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              print('LOG_RESULT',p.name)
              for line in p.read_text(encoding='utf-8',errors='replace').splitlines():
                  if any(word in line for word in ['ENDING_HANDOFF_FAILURE','[Failed]','SCRIPT ERROR:','ERROR:','Passing Tests','Failing Tests','Asserts','Exiting with code']):
                      print(line[:2000])
          '@ | python -
      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          if (out/'candidate-origin.json').exists():
              origin = json.loads((out/'candidate-origin.json').read_text(encoding='utf-8-sig'))
              for name in subprocess.check_output(['git','diff','--name-only',origin['base'],'HEAD'],text=True).splitlines():
                  source = pathlib.Path(name)
                  if source.exists():
                      target = out/'source'/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(source.read_bytes())
              (out/'final-candidate.patch').write_bytes(subprocess.check_output(['git','diff',origin['base'],'--binary']))
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          # Preserve bounded test evidence even when GitHub artifact quota is full.
          # Only these generated test files are included; never runner environment.
          import base64
          import io
          import zipfile
          payload = io.BytesIO()
          with zipfile.ZipFile(payload, 'w', zipfile.ZIP_DEFLATED) as archive:
              for root in [out, pathlib.Path('.godot/phase2r_logs')]:
                  if root.exists():
                      for p in sorted(root.rglob('*')):
                          if p.is_file() and 'import-user' not in p.parts:
                              archive.write(p, p.relative_to('.godot').as_posix())
          data = payload.getvalue()
          if len(data) > 8 * 1024 * 1024:
              raise RuntimeError('Evidence exceeds bounded log fallback; artifact retention required')
          print('DWM_EVIDENCE_BEGIN ' + json.dumps({'bytes':len(data), 'sha256':hashlib.sha256(data).hexdigest()}))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 3000):
              print('DWM_EVIDENCE_CHUNK ' + encoded[offset:offset+3000])
          print('DWM_EVIDENCE_END')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-day-connected-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

