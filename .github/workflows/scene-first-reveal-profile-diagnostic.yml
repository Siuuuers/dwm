name: Publish validated Windows build folder
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-validated-windows-folder
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5eee8406f4c2c466ac05d03c489c7cdd1cbc1164
          persist-credentials: true
      - name: Clean malformed legacy gitlinks from disposable index
        run: git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12445803960
          run-id: 39825608353
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-artifact
          merge-multiple: true
      - name: Verify and stage existing validated bytes
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/validated-artifact
        run: |
          set -euo pipefail
          archive="$ARTIFACT_ROOT/dwm/dwm/.godot/ci/windows-export/DWM-windows-x86_64-validation.zip"
          echo "8420129c411b82051432ba01aebbb4ab62a0d2c2519ce0fd8934885945796f28  $archive" | sha256sum -c -
          python tools/packaging/prepare_steam_build.py "$archive" "$RUNNER_TEMP/steam-staged"
          cp -R "$RUNNER_TEMP/steam-staged/game-build" game-build
          cp "$RUNNER_TEMP/steam-staged/package-receipt.json" package-receipt.json
          python - <<'PY'
          from pathlib import Path
          for p in Path("game-build").rglob("*"):
              if p.is_file() and p.stat().st_size >= 104857600:
                  raise SystemExit("File exceeds GitHub regular Git limit: " + str(p))
          Path("BUILD_README.md").write_text("""# Windows playable template build
          
          Launch game-build/DWM.exe with DWM.pck beside it. Keep licenses/.
          This branch contains only the validated Windows x64 build and its receipt.
          Runtime source: 82d42d3524ac0cdcc90e7c7ae7f69298d5046bcc.
          Export evidence: https://github.com/Siuuuers/dwm/actions/runs/39825608353
          
          This is a playable template, not a Steam-approved final-content build.
          Replace art, music, and Day1-Day7 scripts in source branch codex/art-media-20261023,
          then re-export. Loose source assets beside the EXE do not override its PCK.
          Upload the contents of game-build as the Steam Windows depot content.
          Configure DWM.exe as the launch executable. Steam AppID and DepotID are account-specific.
          Steam API integration is optional; no SDK directory belongs in this build.
          Do not merge this binary delivery branch into the source branches.
          """)
          PY
      - name: Push new build-only branch
        run: |
          set -euo pipefail
          branch=builds/windows-playable-20261023
          if git ls-remote --exit-code origin "refs/heads/$branch"; then
            echo "Build branch already exists; refusing to overwrite it."
            exit 1
          fi
          git read-tree --empty
          git add -f game-build BUILD_README.md package-receipt.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "build: preserve validated Windows playable template folder"
          git push origin "HEAD:refs/heads/$branch"
