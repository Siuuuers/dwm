name: Source discovery and Windows startup qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  windows-export:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / isolated source discovery and exported startup
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: e55254dbbafbbfe90f0adc9098e9ca2b79c14708
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Verify exact candidate and fresh import boundary
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -cne 'e55254dbbafbbfe90f0adc9098e9ca2b79c14708') { throw 'Wrong source commit' }
          if ((git rev-parse 'HEAD^{tree}').Trim() -cne 'e166e051cc5a19c5996f6d70d5c6f0005c5d4be7') { throw 'Wrong source tree' }
          if (Test-Path '.godot') { throw 'Import cache must be absent' }
          $marker = 'evidence/phase_2r/title_timing_20261019/source/.gdignore'
          if (-not (Test-Path -LiteralPath $marker) -or (Get-Item -LiteralPath $marker).Length -ne 0) { throw 'Marker missing or nonempty' }
          New-Item -ItemType Directory '.godot/ci/discovery' | Out-Null
          @{source='e55254dbbafbbfe90f0adc9098e9ca2b79c14708'; tree='e166e051cc5a19c5996f6d70d5c6f0005c5d4be7'; base='29d9322b537c4a1f461b24c6ff23ce75ed8aa021'; event=$env:GITHUB_SHA; controller='${{ github.event.pull_request.head.sha }}'; fresh_cache=$true} | ConvertTo-Json | Set-Content '.godot/ci/discovery/origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          $importExit = $LASTEXITCODE
          if (Test-Path '.godot/global_script_class_cache.cfg') { Copy-Item '.godot/global_script_class_cache.cfg' '.godot/ci/discovery/import-global_script_class_cache.cfg' }
          @{exit_code=$importExit} | ConvertTo-Json | Set-Content "$output/discovery/import-process.json"
          if ($importExit -ne 0) { exit $importExit }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify generated classes and raw evidence access
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'verify-source-discovery.gd'
          @'
          extends SceneTree
          
          func _initialize() -> void:
              var cache := ConfigFile.new()
              if cache.load("res://.godot/global_script_class_cache.cfg") != OK:
                  fail("Cannot read generated class map")
                  return
              var entries: Variant = cache.get_value("", "list", null)
              if not entries is Array:
                  fail("Invalid generated class map")
                  return
              var wanted := {
                  "EndingScene": "res://scripts/ui/EndingScene.gd",
                  "SaveManagerCheckpointPort": "res://scripts/application/run/SaveManagerCheckpointPort.gd"
              }
              var seen := {}
              for entry: Variant in entries:
                  if not entry is Dictionary:
                      fail("Malformed class entry")
                      return
                  var path := str(entry.get("path", ""))
                  var name := str(entry.get("class", ""))
                  if path.begins_with("res://evidence/phase_2r/title_timing_20261019/source/"):
                      fail("Retained source registered: " + path)
                      return
                  if wanted.has(name):
                      if seen.has(name) or path != wanted[name]:
                          fail("Duplicate or noncanonical class: " + name)
                          return
                      seen[name] = path
              if seen.size() != wanted.size():
                  fail("Missing canonical classes")
                  return
              var root := "res://evidence/phase_2r/title_timing_20261019/"
              var manifest: Variant = JSON.parse_string(FileAccess.get_file_as_string(root + "source-manifest.json"))
              if not manifest is Dictionary or not manifest.get("files") is Array:
                  fail("Invalid retained manifest")
                  return
              var count := 0
              for row: Variant in manifest["files"]:
                  var path: String = root + str(row["path"])
                  var file := FileAccess.open(path, FileAccess.READ)
                  if file == null or file.get_length() != int(row["bytes"]) or FileAccess.get_sha256(path) != str(row["sha256"]):
                      fail("Retained evidence missing or changed: " + path)
                      return
                  file.close()
                  count += 1
              if count != 20:
                  fail("Unexpected retained manifest census")
                  return
              print("DISCOVERY_AND_RAW_EVIDENCE_VERIFIED count=20")
              quit(0)
          
          func fail(message: String) -> void:
              push_error(message)
              quit(1)
          
          '@ | Set-Content -LiteralPath $probe -Encoding utf8NoBOM
          Copy-Item $probe '.godot/ci/discovery/verify-source-discovery.gd'
          Copy-Item '.godot/global_script_class_cache.cfg' '.godot/ci/discovery/global_script_class_cache.cfg'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'discovery-user/appdata'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'discovery-user/localappdata'
          New-Item -ItemType Directory -Force $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --script $probe --log-file "$env:GITHUB_WORKSPACE/.godot/ci/discovery/probe.log"
          $probeExit = $LASTEXITCODE
          @{exit_code=$probeExit} | ConvertTo-Json | Set-Content '.godot/ci/discovery/probe-process.json'
          if ($probeExit -ne 0) { throw "Discovery probe exit $probeExit" }
          $log = Get-Content '.godot/ci/discovery/probe.log' -Raw
          if ($log -match '(?m)SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character') { throw 'Discovery probe errors' }
          if ($log -notmatch 'DISCOVERY_AND_RAW_EVIDENCE_VERIFIED count=20') { throw 'Missing discovery receipt' }
      - name: Cache pinned export templates
        id: export-templates-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dwm-godot-templates/Godot_v4.6.3-stable_export_templates.tpz
          key: godot-4.6.3-export-templates-3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8
      - name: Download verified Godot export templates
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'dwm-godot-templates'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $archive = Join-Path $folder 'Godot_v4.6.3-stable_export_templates.tpz'
          if (-not (Test-Path -LiteralPath $archive)) {
            Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz' -OutFile $archive
          }
          $expected = '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot export templates checksum mismatch.'
          }
          "GODOT_EXPORT_TEMPLATES_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Retain verified export templates for subsequent runs
        if: steps.export-templates-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dwm-godot-templates/Godot_v4.6.3-stable_export_templates.tpz
          key: godot-4.6.3-export-templates-3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8
      - name: Export and launch isolated Windows executable
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-WindowsExportValidation.ps1
          if (-not $?) { throw 'Existing export validation failed' }
          $report = Get-Content '.godot/ci/windows-export/validation.json' -Raw | ConvertFrom-Json
          if ($report.ok -isnot [bool] -or $report.ok -ne $true -or $report.smoke.ok -isnot [bool] -or $report.smoke.ok -ne $true -or $report.pack_audit.ok -isnot [bool] -or $report.pack_audit.ok -ne $true -or $report.commit -cne 'e55254dbbafbbfe90f0adc9098e9ca2b79c14708') { throw 'Missing export success receipts' }
          Copy-Item '.godot/global_script_class_cache.cfg' '.godot/ci/discovery/post-export-global_script_class_cache.cfg'
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --script (Join-Path $env:RUNNER_TEMP 'verify-source-discovery.gd') --log-file "$env:GITHUB_WORKSPACE/.godot/ci/discovery/post-export-probe.log"
          $probeExit = $LASTEXITCODE
          @{exit_code=$probeExit} | ConvertTo-Json | Set-Content '.godot/ci/discovery/post-export-probe-process.json'
          $log = Get-Content '.godot/ci/discovery/post-export-probe.log' -Raw
          if ($probeExit -ne 0 -or $log -match '(?m)SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character' -or $log -notmatch 'DISCOVERY_AND_RAW_EVIDENCE_VERIFIED count=20') { throw 'Post-export discovery or raw evidence failure' }

      - name: Upload Windows validation build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/discovery/
            .godot/ci/import.log
            .godot/ci/windows-export/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

