name: Backup refresh notification regression
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / Backup refresh notification regression
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 8a431447b3fffa180b4cdd22fdc8f74a40e95d77
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '8a431447b3fffa180b4cdd22fdc8f74a40e95d77') { throw 'Candidate mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='8a431447b3fffa180b4cdd22fdc8f74a40e95d77'; tree='8aa17066accfc5ae8877780b50007acc16df0aea'; controller='${{ github.event.pull_request.head.sha }}'; base='8a431447b3fffa180b4cdd22fdc8f74a40e95d77'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove duplicate-refresh regression on the original view
        run: |
          $ErrorActionPreference = 'Stop'
          git restore --source=318e77ff454e6035d2ac1dbb7ef68885681a9ff4 -- scripts/ui/BackupApp.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId refresh-baseline -LogName refresh-baseline.log -EvidenceLogPath .godot/ci/baseline.jsonl -TimeoutSeconds 240 -GodotArgs @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/unit/test_backup_presentation.gd','-gunit_test_name=test_save_refresh_consumes_only_its_views_queued_notification','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/baseline.xml')
          $code = $LASTEXITCODE
          git restore --source=HEAD -- scripts/ui/BackupApp.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$xml = Get-Content .godot/ci/baseline.xml -Raw
          if ($code -eq 0 -or $xml.SelectNodes('//testcase').Count -ne 1 -or $xml.SelectNodes('//failure').Count -ne 1 -or $xml.SelectNodes('//error').Count -ne 0) { throw 'Expected exactly one baseline regression failure' }
          if (Select-String .godot/phase2r_logs/refresh-baseline.log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load' -Quiet) { throw 'Baseline script error' }
          @{expected_failure=$true;exit_code=$code} | ConvertTo-Json | Set-Content .godot/ci/baseline-disposition.json
      - name: Qualify fresh projection and existing backup custody
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($suite in @('tests/unit/test_backup_presentation.gd','tests/integration/test_scene_backup_inspection.gd','tests/integration/test_pause_backup_host.gd')) {
            $name = [IO.Path]::GetFileNameWithoutExtension($suite)
            & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId $name -LogName "$name.log" -EvidenceLogPath ".godot/ci/$name.jsonl" -TimeoutSeconds 480 -GodotArgs @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$suite",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$name.xml")
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            [xml]$xml = Get-Content ".godot/ci/$name.xml" -Raw
            $expected = @(Select-String -Path $suite -Pattern '^func test_').Count
            if ($xml.SelectNodes('//testcase').Count -ne $expected -or $xml.SelectNodes('//failure | //error | //skipped').Count -ne 0) { throw "Incomplete or failing suite $name" }
            if (Select-String ".godot/phase2r_logs/$name.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw "Script errors $name" }
          }
          $allowed = @('.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1')
          foreach ($path in @(git diff HEAD --name-only)) { if ($path -notin $allowed) { throw "Unexpected tracked change: $path" } }
      - name: Retain original regression evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          out=pathlib.Path('.godot/ci')
          for source in ['scripts/application/backup/BackupPresentationPort.gd','scripts/ui/BackupApp.gd','tests/unit/test_backup_presentation.gd','tests/integration/test_scene_backup_inspection.gd','tests/integration/test_pause_backup_host.gd','tools/testing/Invoke-IsolatedGodot.ps1']:
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(source).read_bytes())
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for folder in [out,pathlib.Path('.godot/phase2r_logs')] for p in folder.rglob('*') if p.is_file() and 'import-user' not in p.parts]
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>16*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
