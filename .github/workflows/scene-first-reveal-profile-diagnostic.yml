name: Detached Backup Load qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    name: Windows / Detached Backup Load qualification
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: bb167aa1b5692f6bf5ceb6789201f38d4f86360a
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne 'bb167aa1b5692f6bf5ceb6789201f38d4f86360a') { throw 'Candidate mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='bb167aa1b5692f6bf5ceb6789201f38d4f86360a'; tree='5d8760adfab81274c85ae0da3c586d42b233f4f5'; controller='${{ github.event.pull_request.head.sha }}'; base='bb167aa1b5692f6bf5ceb6789201f38d4f86360a'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse external driver without execution
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'tools/testing/Invoke-ExportedGameplay.ps1'), [ref]$tokens, [ref]$errors)
          @{ ok=($errors.Count -eq 0); errors=@($errors | ForEach-Object { @{ message=$_.Message; line=$_.Extent.StartLineNumber; text=$_.Extent.Text } }) } | ConvertTo-Json -Depth 5 | Set-Content '.godot/ci/driver-parse.json'
          if ($errors.Count -ne 0) { $errors | Format-List; throw 'Driver parse failed' }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify detached Backup and attached recovery
        run: |
          $ErrorActionPreference = 'Stop'
          $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/unit/test_backup_presentation.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/backup.xml')
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'backup-lifetime' -LogName 'backup.log' -GodotArgs $arguments -EvidenceLogPath '.godot/ci/backup.jsonl' -TimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import collections,json,pathlib,re,xml.etree.ElementTree as ET
          script='tests/unit/test_backup_presentation.gd'
          expected=re.findall(r'^func (test_\w+)\(',pathlib.Path(script).read_text(),re.M)
          root=ET.parse('.godot/ci/backup.xml').getroot();rows=list(root.iter('testcase'))
          assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter((script,n) for n in expected)
          assert not any(list(root.iter(t)) for t in ['failure','error','skipped'])
          assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows)
          logs=list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          for p in logs: assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',p.read_text(encoding='utf-8-sig')),str(p)
          exits=[json.loads(l) for l in pathlib.Path('.godot/ci/backup.jsonl').read_text(encoding='utf-8-sig').splitlines() if l.strip()]
          assert len(exits)==1 and exits[0]['exit_code']==0,exits
          print('BACKUP_LIFETIME_VERIFIED',len(rows),sum(int(r.attrib['assertions']) for r in rows))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache matching standard export templates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot-4.6.3-templates.tpz
          key: godot-standard-export-templates-4.6.3-3fbe2c0e2dec9d53
      - name: Build candidate with existing Windows export validator
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3-templates.tpz'
          if (-not (Test-Path $archive)) { Invoke-WebRequest 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz' -OutFile $archive }
          & ./tools/testing/Invoke-WindowsExportValidation.ps1 -TemplatesArchive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content '.godot/ci/windows-export/validation.json' -Raw | ConvertFrom-Json
          if (-not $receipt.ok -or $receipt.commit -cne 'bb167aa1b5692f6bf5ceb6789201f38d4f86360a') { throw 'Candidate export mismatch' }
          "DWM_ARCHIVE_SHA256=$($receipt.archive.sha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Retain exact candidate export
        uses: actions/upload-artifact@v4
        with:
          name: exported-backup-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/windows-export/
          include-hidden-files: true
          retention-days: 7
      - name: Prepare native crash collection on disposable runner
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/native-crash'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $debugger = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Debuggers/x64/cdb.exe'
          if (-not (Test-Path -LiteralPath $debugger)) {
            $setup = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
            Invoke-WebRequest 'https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe' -OutFile $setup
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'SDK installer signature invalid' }
            @{ sha256=(Get-FileHash $setup -Algorithm SHA256).Hash; signer=$signature.SignerCertificate.Subject } | ConvertTo-Json | Set-Content (Join-Path $out 'installer.json')
            $install = Start-Process -FilePath $setup -ArgumentList @('/features','OptionId.WindowsDesktopDebuggers','/quiet','/norestart') -PassThru
            if (-not $install.WaitForExit(480000)) { $install.Kill($true); throw 'Debugger install timeout' }
            if ($install.ExitCode -notin @(0,3010)) { throw "Debugger install failed: $($install.ExitCode)" }
          }
          if (-not (Test-Path -LiteralPath $debugger)) { throw 'CDB unavailable; no duplicate gameplay run without diagnostic capability' }
          @{path=$debugger; sha256=(Get-FileHash $debugger -Algorithm SHA256).Hash; version=(Get-Item $debugger).VersionInfo.FileVersion} | ConvertTo-Json | Set-Content (Join-Path $out 'debugger.json')
          "DWM_CDB_PATH=$debugger" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DWM.exe'
          if (Test-Path $key) { throw 'Unexpected existing DWM dump configuration' }
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -Value $out -PropertyType ExpandString | Out-Null
          New-ItemProperty -Path $key -Name DumpType -Value 1 -PropertyType DWord | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -Value 3 -PropertyType DWord | Out-Null
          @{dump_folder=$out; dump_type=1; configured_utc=[DateTime]::UtcNow.ToString('o')} | ConvertTo-Json | Set-Content (Join-Path $out 'setup.json')
      - name: Probe explicit cloud accessibility and audio
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $export = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export'
          $receipt = Get-Content (Join-Path $export 'validation.json') -Raw | ConvertFrom-Json
          if (-not $receipt.ok -or $receipt.commit -cne 'bb167aa1b5692f6bf5ceb6789201f38d4f86360a' -or $receipt.archive.sha256 -cne $env:DWM_ARCHIVE_SHA256) { throw 'Export receipt mismatch' }
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Capability -ArchivePath (Join-Path $export $receipt.archive.file) -ExpectedArchiveSha256 $receipt.archive.sha256 -ExpectedCommit 'bb167aa1b5692f6bf5ceb6789201f38d4f86360a' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-capability-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-capability') -Accessibility Always -Audio Dummy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = Get-Content '.godot/ci/exported-capability/result.json' -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup) { throw 'Capability not successful' }
      - name: Create Day4 save through the exported UI
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Create -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export/DWM-windows-x86_64-validation.zip') -ExpectedArchiveSha256 $env:DWM_ARCHIVE_SHA256 -ExpectedCommit 'bb167aa1b5692f6bf5ceb6789201f38d4f86360a' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create') -CapabilityReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-capability/result.json') -Accessibility Always -Audio Dummy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh-process selected-slot Load and ending journey
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Load -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/windows-export/DWM-windows-x86_64-validation.zip') -ExpectedArchiveSha256 $env:DWM_ARCHIVE_SHA256 -ExpectedCommit 'bb167aa1b5692f6bf5ceb6789201f38d4f86360a' -UserRoot (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-load') -CreatorReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create/result.json') -Accessibility Always -Audio Dummy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify three bounded player exits and source cleanliness
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($mode in @('capability','create','load')) {
            $result = Get-Content ".godot/ci/exported-$mode/result.json" -Raw | ConvertFrom-Json
            if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw "Exported $mode did not pass" }
          }
          $allowed = @('.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1')
          foreach ($path in @(git diff HEAD --name-only)) { if ($path -notin $allowed) { throw "Unexpected tracked change: $path" } }
      - name: Analyze native crash evidence without altering the failed result
        if: always()
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/native-crash'
          if (-not (Test-Path $out)) { exit 0 }
          $events = @(Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-25); Id=1000,1001 } -ErrorAction SilentlyContinue | Where-Object { $_.Message -match 'DWM.exe' } | ForEach-Object { @{ id=$_.Id; time=$_.TimeCreated.ToUniversalTime().ToString('o'); message=$_.Message; xml=$_.ToXml() } })
          ConvertTo-Json -InputObject $events -Depth 8 | Set-Content (Join-Path $out 'application-events.json')
          $dumps = @(Get-ChildItem $out -Filter '*.dmp' -File)
          $manifest = @($dumps | ForEach-Object { @{file=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          ConvertTo-Json -InputObject $manifest -Depth 5 | Set-Content (Join-Path $out 'dumps.json')
          if ($dumps.Count -eq 0) { Write-Host 'NO_NATIVE_DUMP_CAPTURED'; exit 0 }
          foreach ($dump in $dumps) {
            $stdout = Join-Path $out ($dump.BaseName + '.cdb.stdout.log')
            $stderr = Join-Path $out ($dump.BaseName + '.cdb.stderr.log')
            $symbols = Join-Path $env:RUNNER_TEMP 'dwm-symbols'
            $images = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-load/package'
            $arguments = @('-z',('"'+$dump.FullName+'"'),'-y',('"srv*'+$symbols+'*https://msdl.microsoft.com/download/symbols"'),'-i',('"'+$images+'"'),'-c','".symopt+ 0x40; !analyze -v; .ecxr; kv 40; lm; u @rip-20 @rip+40; q"')
            $probe = Start-Process -FilePath $env:DWM_CDB_PATH -ArgumentList $arguments -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $completed = $probe.WaitForExit(180000)
            if (-not $completed) { $probe.Kill($true); $probe.WaitForExit() }
            @{ completed=$completed; exit_code=$probe.ExitCode; dump=$dump.Name } | ConvertTo-Json | Set-Content (Join-Path $out ($dump.BaseName+'.analysis.json'))
            Get-Content $stdout | Select-Object -Last 160 | Write-Host
          }
      - name: Retain original native dump and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-load-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/native-crash/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain original bounded capability evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,zipfile
          out=pathlib.Path('.godot/ci')
          for source in ['scripts/ui/BackupApp.gd','tests/unit/test_backup_presentation.gd','tools/testing/Invoke-ExportedGameplay.ps1','tools/testing/Invoke-WindowsExportValidation.ps1','project.godot','export_presets.cfg']:
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(pathlib.Path(source).read_bytes())
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts and 'package' not in p.parts and p.suffix not in ('.zip','.dmp')]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          if len(data)>16*1024*1024:raise RuntimeError('Bounded evidence too large')
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
