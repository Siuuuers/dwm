name: One-shot Next focused cloud proof

on:
  push:
    branches: [codex/next-cloud-20261002]

permissions:
  contents: read

concurrency:
  group: reading-rail-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surfaces:
    name: Windows / public API surface contracts
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e6bae0835f70d599c215c3b97dc877b2885ddb1d
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record fixture and schema version census
        run: |
          @'
          import json, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          paths = subprocess.check_output([
              "git", "ls-files", "-z", "--", "autoload/", "scripts/", "tests/",
              "tools/testing/", ".github/workflows/"
          ]).decode("utf-8").split("\0")
          patterns = {
              "legacy_prepared_fixture": r"\bv[1-6]_desktop_prepared\.json\b",
              "historical_day3_seed": r"valid_day3\.json",
              "backup_fixture_helper": r"BackupSnapshotFixture",
              "run_document_version": r"\b(?:schema_version|SCHEMA_VERSION|DOCUMENT_VERSION)\b",
              "empty_contacts_literal": r"\bcontacts\b[\"']?\s*[:=]\s*\{\s*\}",
          }
          compiled = {key: re.compile(value) for key, value in patterns.items()}
          records = []
          scanned = 0
          for name in sorted(paths):
              path = root / name
              if path.suffix not in {".gd", ".ps1", ".py", ".yml", ".yaml"} or not path.is_file():
                  continue
              scanned += 1
              for number, line in enumerate(path.read_text(encoding="utf-8-sig").splitlines(), 1):
                  families = [key for key, pattern in compiled.items() if pattern.search(line)]
                  if families:
                      records.append({"path": name, "line": number, "families": families, "text": line})
          report = {
              "checkout_ref": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "policy": "Observational census only; historical, refusal and Profile references require review, not automatic failure.",
              "scanned_files": scanned, "patterns": patterns, "matches": records,
          }
          output = root / ".godot/ci/public-surfaces/fixture-version-census.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          for record in records:
              print("FIXTURE_VERSION_CENSUS_MATCH: " + json.dumps(record))
          print("FIXTURE_VERSION_CENSUS_SUMMARY: " + json.dumps({
              "checkout_ref": report["checkout_ref"], "scanned_files": scanned,
              "matching_lines": len(records), "logged_lines": len(records),
              "complete_artifact": ".godot/ci/public-surfaces/fixture-version-census.json",
              "policy": report["policy"],
          }))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated runner contracts and timeout diagnostics
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/tooling/Test-InvokeIsolatedGodot.ps1
      - name: Generate affected public inventories for review
        timeout-minutes: 10
        run: ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads
      - name: Verify public inventory drift and read-only contracts
        timeout-minutes: 10
        run: ./tools/testing/Invoke-CloudTests.ps1 -Suite public_surfaces
      - name: Upload canonical inventories and retirement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surfaces-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/import.log
            .godot/ci/public-surfaces/
            .godot/ci/public_surfaces.xml
            .godot/ci/public_surfaces.jsonl
            .godot/ci/isolation-timeout.jsonl
            .godot/phase2r_logs/cloud-isolation-timeout.log*
            .godot/phase2r_logs/cloud-public-surface-*.log
            .godot/phase2r_logs/cloud-public_surfaces.log*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  focused-tests:
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [reading_delivery, dating, persistence, settings, checkpoint_diagnostics, localization]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e6bae0835f70d599c215c3b97dc877b2885ddb1d
          # The schedule-gate contract inspects its immutable historical seals.
          fetch-depth: ${{ (matrix.suite == 'new_account' || matrix.suite == 'desktop') && '0' || '1' }}
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run focused regression suite
        timeout-minutes: 10
        env:
          DWM_CI_SUITE: ${{ matrix.suite }}
        run: ./tools/testing/Invoke-CloudTests.ps1 -Suite $env:DWM_CI_SUITE
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/*.log
            .godot/ci/*.jsonl
            .godot/ci/*.json
            .godot/ci/*.xml
            .godot/ci/storage-refusal/
            .godot/phase2r_logs/cloud-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  reading-rail-journey:
    name: Rendered eight-process Solo reading and Next proof
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/reading-rail-import/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/reading-rail-import/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/reading-rail
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e6bae0835f70d599c215c3b97dc877b2885ddb1d
          # Same disposable-index workaround as the Windows jobs above.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Install Godot and software display
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$archive"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"
          editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$editor"
          echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"
          "$editor" --version
      - name: Start and verify native Linux speech service
        timeout-minutes: 2
        run: bash tools/testing/start_cloud_speech.sh
      - name: Upload native speech environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/cloud-speech/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Import project
        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then
            exit 1
          fi
          # Dialogic's editor scan rewrites its timeline lookup during import.
          git restore -- project.godot
      - name: Exercise real Solo reading Save and fresh-process Load
        timeout-minutes: 25
        run: python3 tools/testing/run_reading_rail_journey.py
      - name: Upload Solo reading reports, exact save bytes and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-rail-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/reading-rail/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  rendered-desktop:
    name: Rendered desktop and dialogue / Linux software OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/render-user/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/render-user/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/desktop-scaling
    steps:
      - uses: actions/checkout@v7
        with:
          ref: e6bae0835f70d599c215c3b97dc877b2885ddb1d
          # Same disposable-index workaround as the Windows jobs above.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Install Godot and software display
        timeout-minutes: 12
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$archive"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"
          editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$editor"
          echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"
          "$editor" --version
      - name: Start and verify native Linux speech service
        timeout-minutes: 2
        run: bash tools/testing/start_cloud_speech.sh
      - name: Upload native speech environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/cloud-speech/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Import project
        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then
            exit 1
          fi
          # Dialogic's editor scan rewrites its timeline lookup during import.
          git restore -- project.godot
      - name: Render and verify desktop scaling
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_desktop_scaling.gd
          grep 'DESKTOP_SCALING_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 38, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 38 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-scaling-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/desktop-scaling/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Render and verify delivery and dialogue
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/delivery-dialogue-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/delivery-dialogue-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/delivery-dialogue
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_delivery_dialogue.gd
          grep 'DELIVERY_DIALOGUE_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 25, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 25 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload delivery and dialogue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-dialogue-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/delivery-dialogue/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Render and verify Angela stat overlay
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/angela-overlay-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/angela-overlay-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/angela-overlay
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_angela_overlay.gd
          grep 'ANGELA_OVERLAY_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 10, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 10 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload Angela stat overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angela-overlay-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/angela-overlay/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Japanese and Korean catalogs
        run: python3 tools/localization/validate_japanese_korean_catalogs.py
      - name: Render and verify Japanese and Korean UI
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/japanese-korean-ui-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/japanese-korean-ui-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/japanese-korean-ui
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_japanese_korean_ui.gd
          grep 'JAPANESE_KOREAN_UI_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
