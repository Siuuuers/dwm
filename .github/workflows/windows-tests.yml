name: Scene playable route-context diagnostic (no publication)
on:
  pull_request:
    paths:
      - 'tools/cloud/scene-playable-candidate.json'
      - 'tools/cloud/scene-playable-diagnostics.patch'
      - '.github/workflows/windows-tests.yml'
permissions:
  contents: read
concurrency:
  group: scene-runtime-integration-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  diagnose:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      BASE_SHA: 69a5cdd70261692b7f1b1e2d4550155141ca6375
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
      - uses: actions/checkout@v7
        with:
          ref: 69a5cdd70261692b7f1b1e2d4550155141ca6375
          path: source
          fetch-depth: 0
      - name: Apply pinned original and bounded diagnostic correction
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base=os.environ['BASE_SHA']
          assert git('rev-parse','HEAD')==base
          assert git('ls-remote','origin','refs/heads/codex/scene-runtime-integration-20261009').split()[0]==base, 'A advanced; reconcile'
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          payload=json.loads(pathlib.Path('../controller/tools/cloud/scene-playable-candidate.json').read_text())
          patch=gzip.decompress(base64.b64decode(payload['patch_gzip_base64'],validate=True))
          assert payload['base']==base
          assert hashlib.sha256(patch).hexdigest()==payload['patch_sha256']=='1d6cb95788894ef8a95f8525c500b95f97c004f0305c95e1f86f9b428ca63335'
          original=out/'original-candidate.patch';original.write_bytes(patch)
          repair=pathlib.Path('../controller/tools/cloud/scene-playable-diagnostics.patch')
          assert hashlib.sha256(repair.read_bytes()).hexdigest()=='ffa72c4127cedc81bc1f1bb110ee0a45e3e7e6fd8a9674f1834606973ede2222'
          for p in (original,repair):
              subprocess.run(['git','apply','--check',str(p)],check=True)
              subprocess.run(['git','apply','--index',str(p)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          expected={'tests/integration/scene_playable_child.gd':'54d36ec7baedb0b7748de1fb5fcf34620e49baee',
                    'tests/support/ScenePlayableFixture.gd':'0a9e68ccb3a88f83ee8ef612e76b38cdc4de93ab'}
          for path,blob in expected.items(): assert git('hash-object',path)==blob,(path,'postimage mismatch')
          paths=git('diff','--cached','--name-only').splitlines()
          allowed={'autoload/DialogicBridge.gd','autoload/GameState.gd','scripts/application/narrative/SaveManagerNarrativeCheckpointPort.gd',
              'tests/support/SceneNewRunFixture.gd','tests/support/ScenePlayableFixture.gd','tests/unit/test_scene_playable_preparation.gd',
              'tests/integration/scene_playable_child.gd',*('tests/integration/test_scene_playable_'+n+'.gd' for n in ['create','load','dropped_ack','native_refusal'])}
          assert set(paths)==allowed,paths
          composed=subprocess.check_output(['git','diff','--cached','--binary','--full-index'])
          (out/'candidate.patch').write_bytes(composed)
          (out/'diagnostic-correction.patch').write_bytes(repair.read_bytes())
          receipt={'base':base,'controller':os.environ['CONTROLLER_SHA'],'event':os.environ['EVENT_SHA'],
              'original_patch_sha256':payload['patch_sha256'],'patch_sha256':hashlib.sha256(composed).hexdigest(),
              'repair_sha256':hashlib.sha256(repair.read_bytes()).hexdigest(),'paths':paths,'publication_enabled':False,
              'scope':'one changed normal-create diagnostic; not full physical Save/Load acceptance'}
          (out/'candidate-origin.json').write_text(json.dumps(receipt,indent=2));print(json.dumps(receipt))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8
      - name: Import candidate in isolated user directories
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze and retain exact selected diagnostic source
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import json,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          out=pathlib.Path('.godot/ci');origin=json.loads((out/'candidate-origin.json').read_text());paths=origin['paths']
          for name in paths:
              uid=pathlib.Path(name+'.uid')
              if uid.exists(): subprocess.run(['git','add','--',str(uid)],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Diagnose playable route context with corrected stored-receipt tests'],check=True)
          assert git('rev-parse','HEAD^')==origin['base'] and not git('diff','--name-only')
          names=git('diff-tree','--no-commit-id','--name-only','-r','HEAD').splitlines()
          assert all(n in paths or (n.endswith('.gd.uid') and n[:-4] in paths) for n in names)
          selected=set(names)|{'scripts/application/run/SaveManagerCheckpointPort.gd','scripts/domain/run/RunSnapshotSchema.gd',
              'scripts/domain/narrative/SceneEventContract.gd','scripts/narrative/FrozenRunContext.gd',
              'tests/support/SceneRestartFixture.gd','tools/testing/Invoke-IsolatedGodot.ps1'}
          receipt={'source':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':git('rev-parse','HEAD^'),
              'blobs':{n:git('rev-parse','HEAD:'+n) for n in names},'selected_source_blobs':{n:git('rev-parse','HEAD:'+n) for n in sorted(selected)}}
          (out/'candidate-commit.json').write_text(json.dumps(receipt,indent=2))
          subprocess.run(['git','archive','--format=zip','--output=.godot/ci/source-inspection.zip','HEAD','--',*sorted(selected)],check=True)
          print(json.dumps(receipt))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run one changed physical creator diagnostic
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_playable_create.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/normal-create.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'playable-normal-diagnostic' -LogName 'normal-create.log' -GodotArgs $args -EvidenceLogPath '.godot/ci/normal.jsonl' -TimeoutSeconds 180 -KeepRoot
          $childExit = $LASTEXITCODE
          if (Test-Path '.godot/phase2r_logs/normal-create.log') {
            Select-String '.godot/phase2r_logs/normal-create.log' -Pattern 'SCENE_PLAYABLE_|SCRIPT ERROR:|invalid_gameplay|\[Failed\]' | ForEach-Object { $_.Line }
          }
          if ($childExit -ne 0) { exit $childExit }
          if (Select-String '.godot/phase2r_logs/normal-create.log' -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Strict diagnostic script-error gate' }
          if ((git diff --name-only) -or (git diff --cached --name-only)) { throw 'Diagnostic changed tracked source' }
      - name: Retain complete small diagnostics on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,pathlib,subprocess
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout)
          files={}
          for root in [out,pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name!='retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-playable-context-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Prepare disposable indexes for checkout cleanup
        if: always()
        run: |
          foreach ($repo in @('.', '../controller')) {
            if (-not (Test-Path "$repo/.git")) { continue }
            git -C $repo update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
