name: Retain playable contract original evidence
on:
  pull_request:
permissions:
  contents: write
  actions: read
concurrency:
  group: scene-runtime-integration-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  retain:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: true
      - uses: actions/checkout@v7
        with:
          ref: 36fd3b7683ac42395977bda035ab530dabd1c53f
          path: evidence
          persist-credentials: true
      - name: Retain and verify the original completed-run artifact without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C evidence rev-parse HEAD).Trim() -cne '36fd3b7683ac42395977bda035ab530dabd1c53f') { throw 'Evidence parent changed.' }
          python controller/tools/cloud/retain_scene_playable_evidence.py evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath controller/tools/cloud/scene-playable-result-evidence.md -Destination evidence/evidence/scene_playable_result_2026_10_10/README.md
          $paths = @('evidence/scene_playable_result_2026_10_10/README.md', 'evidence/scene_playable_result_2026_10_10/original-scene-playable-result-37979744715-1.zip', 'evidence/scene_playable_result_2026_10_10/retention-verification.json')
          $changed = @(git -C evidence ls-files --others --exclude-standard)
          if ((@($changed | Sort-Object -CaseSensitive) -join "`n") -cne (@($paths | Sort-Object -CaseSensitive) -join "`n")) { throw 'Unexpected evidence path set.' }
          git -C evidence diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C evidence config user.name 'github-actions[bot]'
          git -C evidence config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C evidence add -- $paths
          git -C evidence commit -m 'docs(evidence): retain original playable contract cloud artifact and limits'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ref = 'refs/heads/codex/scene-runtime-evidence-20261009'
          $live = @(git -C evidence ls-remote --heads origin $ref)
          if ($LASTEXITCODE -ne 0 -or $live.Count -ne 1 -or $live[0].Split("`t")[0] -cne '36fd3b7683ac42395977bda035ab530dabd1c53f') { throw 'Evidence ref advanced; reconcile instead of overwriting.' }
          git -C evidence push origin "HEAD:$ref"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output ('EVIDENCE_COMMIT=' + (git -C evidence rev-parse HEAD).Trim())
      - name: Prepare disposable indexes for checkout cleanup
        if: always()
        run: |
          foreach ($repo in @('controller', 'evidence')) {
            if (-not (Test-Path -LiteralPath "$repo/.git")) { continue }
            git -C $repo update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $repo submodule foreach --recursive 'true'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload retention verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playable-contract-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/evidence/scene_playable_result_2026_10_10/retention-verification.json
          if-no-files-found: warn
          retention-days: 7
