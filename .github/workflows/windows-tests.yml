name: A G scene bundle compatibility proof
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: scene-bundle-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [compatibility, scene-reading, scene-registration, g-identity, legacy-core, legacy-notification, legacy-next]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes at checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 90a7319072a6c5c0703f093d16edf52e2cb04e73
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and record immutable source before import
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne '90a7319072a6c5c0703f093d16edf52e2cb04e73') { throw 'Wrong source commit.' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne 'a1712ca59c81edc40cce5b688e6d2e4e0b1b3eb6') { throw 'Wrong source tree.' }

          $aHead = 'c8e07e4a1215097506d5483ee9d0d436e5b8021c'
          $gHead = '08a2caa3108c625e890cf1a1c802d7529be6d54b'
          $base = 'b37d662403398139fc2b1029853b236c334f59a0'
          $newTest = 'tests/integration/test_scene_bundle_compatibility.gd'
          $parents = @((git rev-list --parents -n 1 HEAD).Trim().Split(' '))
          if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 2 -or $parents[1] -cne $aHead) { throw 'Composition must have exactly the immutable A source parent.' }
          git fetch --no-tags origin $gHead
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch immutable G constituent.' }
          $aPaths = @(
            'autoload/DialogicBridge.gd',
            'schemas/manifests/dialogic-scene-entries.schema.json',
            'scripts/application/restore/NarrativeRestoreParticipant.gd',
            'scripts/data/DialogicTimelineCatalog.gd',
            'scripts/narrative/DialogicEntryManifest.gd',
            'scripts/narrative/DialogicRuntimeAdapter.gd',
            'scripts/narrative/FrozenPresentationContext.gd',
            'scripts/narrative/FrozenRunContext.gd',
            'scripts/narrative/NarrativeCaptionLedger.gd',
            'scripts/narrative/ReadingTraversalOperation.gd',
            'scripts/narrative/SoloReadingSession.gd',
            'tests/fixtures/dialogic/scene_day_terminal.dtl',
            'tests/fixtures/dialogic/scene_reading_registration.json',
            'tests/integration/test_scene_day_reading.gd',
            'tests/support/SceneDayReadingFixture.gd',
            'tests/unit/test_narrative_caption_ledger.gd',
            'tests/unit/test_scene_reading_registration.gd',
            'tests/unit/test_scene_runtime_activation.gd'
          )
          $gPaths = @(
            'scripts/application/desktop/DesktopIdentityNonceIssuer.gd',
            'scripts/application/run/CausalDayAdvanceIdentityPort.gd',
            'scripts/domain/desktop/DesktopContinuationRemapper.gd',
            'scripts/domain/narrative/SceneEventContract.gd',
            'scripts/infrastructure/identity/DesktopIssuerRootStore.gd',
            'tests/fixtures/dialogic/scene_reading_registration_compat.json',
            'tests/integration/test_causal_day_advance_identity_recovery.gd',
            'tests/support/SceneTransitionIdentityFixture.gd',
            'tests/unit/test_causal_day_advance_identity_port.gd',
            'tests/unit/test_desktop_issuer_root_store.gd',
            'tests/unit/test_scene_event_contract.gd',
            'tests/unit/test_scene_transition_identity.gd'
          )
          function Assert-ExactPaths($ExpectedPaths, $ActualPaths, $Label) {
            $expectedSorted = @($ExpectedPaths | Sort-Object -CaseSensitive)
            $actualSorted = @($ActualPaths | Sort-Object -CaseSensitive)
            if (($expectedSorted -join "`n") -cne ($actualSorted -join "`n")) { throw "Wrong path set: $Label" }
          }
          $actualA = @(git diff --name-only $base $aHead)
          if ($LASTEXITCODE -ne 0) { throw 'A comparison failed.' }
          Assert-ExactPaths $aPaths $actualA 'A delta'
          $actualG = @(git diff --name-only $base $gHead)
          if ($LASTEXITCODE -ne 0) { throw 'G comparison failed.' }
          Assert-ExactPaths $gPaths $actualG 'G delta'
          $actualComposition = @(git diff --name-only $aHead HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Composition comparison failed.' }
          Assert-ExactPaths (@($gPaths) + @($newTest)) $actualComposition 'composition delta'
          $wholeDelta = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Whole source comparison failed.' }
          Assert-ExactPaths (@($aPaths) + @($gPaths) + @($newTest)) $wholeDelta 'whole source delta'
          $constituents = @()
          foreach ($group in @(@{head=$aHead; paths=$aPaths}, @{head=$gHead; paths=$gPaths})) {
            foreach ($path in $group.paths) {
              $original = (git rev-parse "$($group.head):$path").Trim()
              if ($LASTEXITCODE -ne 0) { throw "Missing immutable constituent: $path" }
              $current = (git rev-parse "HEAD:$path").Trim()
              if ($LASTEXITCODE -ne 0 -or $current -cne $original) { throw "Constituent blob differs: $path" }
              $bytesBlob = (git hash-object --no-filters -- $path).Trim()
              if ($LASTEXITCODE -ne 0 -or $bytesBlob -cne $original) { throw "Checked-out constituent bytes differ: $path" }
              $constituents += [ordered]@{path=$path; source=$group.head; blob=$original; bytes=(Get-Item -LiteralPath $path).Length; sha256=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()}
            }
          }
          $originalFixture = (git rev-parse "$($aHead):tests/fixtures/dialogic/scene_reading_registration.json").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve A fixture.' }
          $copiedFixture = (git rev-parse "HEAD:tests/fixtures/dialogic/scene_reading_registration_compat.json").Trim()
          if ($LASTEXITCODE -ne 0 -or $copiedFixture -cne $originalFixture) { throw 'G compatibility fixture differs from A fixture.' }
          New-Item -ItemType Directory -Force -Path '.godot/ci' | Out-Null
          [ordered]@{a_head=$aHead; g_head=$gHead; base=$base; parent=$parents[1]; source=$source; source_tree=$tree; extra_test=$newTest; constituent_files=$constituents; exact_changed_paths=$wholeDelta} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath '.godot/ci/composition-receipt.json' -Encoding utf8
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout is dirty before import.' }
          New-Item -ItemType Directory -Force -Path '.godot/ci' | Out-Null
          [ordered]@{
            source_sha = $source; source_tree = $tree; controller_event_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            suite = '${{ matrix.suite }}'; scope = 'exact A plus G composition; nonwired compatibility only'
          } | ConvertTo-Json | Set-Content -LiteralPath '.godot/ci/source-receipt.json' -Encoding utf8
      - name: Prepare disposable index for checkout cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Godot archive checksum mismatch.' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $exeHash = (Get-FileHash -LiteralPath $console -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -cne '63b3b2208819714c9677fbfdd8217c5b7dee8ecf5f383502e826bc9e2227ff5a') { throw 'Godot console checksum mismatch.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{ archive_sha256 = $archiveHash; console_sha256 = $exeHash; version = $version } | ConvertTo-Json | Set-Content -LiteralPath '.godot/ci/engine-receipt.json' -Encoding utf8
      - name: Import source
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -LiteralPath "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Project import reported errors.' }
      - name: Restore committed project settings after import
        run: |
          git restore --source=HEAD --worktree -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute isolated explicit GUT scripts
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $suite = '${{ matrix.suite }}'
          # Each matrix job is a fresh Godot process. Scene registration selection
          # cannot leak into legacy readers or another fixture's immutable caches.
          $scripts = switch ($suite) {
            'scene-registration' { @('tests/unit/test_scene_reading_registration.gd') }
            'scene-reading' { @('tests/integration/test_scene_day_reading.gd', 'tests/unit/test_scene_runtime_activation.gd') }
            'compatibility' { @('tests/integration/test_scene_bundle_compatibility.gd') }
            'g-identity' { @('tests/unit/test_scene_event_contract.gd', 'tests/unit/test_causal_day_advance_identity_port.gd', 'tests/unit/test_desktop_issuer_root_store.gd', 'tests/unit/test_desktop_continuation_remapper.gd', 'tests/unit/test_scene_transition_identity.gd', 'tests/integration/test_causal_day_advance_identity_recovery.gd') }
            'legacy-core' { @('tests/unit/test_narrative_caption_ledger.gd', 'tests/unit/test_solo_reading_session.gd', 'tests/unit/test_frozen_run_context.gd', 'tests/unit/test_frozen_presentation_context.gd', 'tests/unit/test_dialogic_entry_manifest.gd', 'tests/unit/test_reading_restore_admission.gd', 'tests/unit/test_reading_next_checkpoint.gd') }
            'legacy-notification' { @('tests/integration/test_scene_next_notification.gd') }
            'legacy-next' { @('tests/integration/test_dialogic_next_traversal.gd', 'tests/integration/test_narrative_caption_ledger_runtime.gd') }
            default { throw 'Unknown focused suite.' }
          }
          $scripts = @($scripts)
          $paths = @($scripts | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing requested test: $_" }
            "res://$_"
          })
          $gutArguments = @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', "-gtest=$($paths -join ',')", '-gexit', '-glog=2', "-gjunit_xml_file=res://.godot/ci/$suite.xml")
          # GUT rejects unknown user arguments, so select the debug-only fixture
          # through the child process environment instead of its CLI parser.
          if ($suite -in @('scene-reading', 'compatibility')) { $env:DWM_SCENE_READING_FIXTURE = '1' }
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId "scene-bundle-controller-$suite" -LogName "$suite.log" -EvidenceLogPath ".godot/ci/$suite.jsonl" -TimeoutSeconds 480 -GodotArgs $gutArguments
          $result = $LASTEXITCODE
          $log = ".godot/phase2r_logs/$suite.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($result -ne 0) { exit $result }
          if (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load' -Quiet) { throw 'Focused suite reported script errors.' }
          $sourceScript = ''
          $sourceTest = ''
          $surrogateDiagnostics = 0
          foreach ($line in Get-Content -LiteralPath $log) {
            if ($line.StartsWith('res://tests/', [StringComparison]::Ordinal)) { $sourceScript = $line; $sourceTest = '' }
            if ($line.StartsWith('* test_', [StringComparison]::Ordinal)) { $sourceTest = $line.Substring(2) }
            if ($line -notmatch '^(?:ERROR: )?(?:Unicode parsing error\b|Unexpected NUL character\b)') { continue }
            # The retained negative fixture constructs one unpaired surrogate deliberately.
            if ($suite -eq 'g-identity' -and $surrogateDiagnostics -eq 0 -and
                $sourceScript -ceq 'res://tests/unit/test_desktop_continuation_remapper.gd' -and
                $sourceTest -ceq 'test_prepare_rejects_a_source_id_that_is_not_canonically_representable' -and
                $line -ceq 'Unicode parsing error: Unpaired lead surrogate (d800 [eol])') {
              $surrogateDiagnostics += 1
              continue
            }
            throw "Unexpected Unicode/NUL diagnostic in $sourceScript / ${sourceTest}: $line"
          }
          if ($suite -eq 'g-identity' -and $surrogateDiagnostics -ne 1) { throw 'Expected exactly one retained surrogate fixture diagnostic.' }
          if ($suite -eq 'g-identity') { Write-Output 'EXPECTED_SURROGATE_DIAGNOSTIC_VERIFIED count=1' }
          $report = ".godot/ci/$suite.xml"
          if (-not (Test-Path -LiteralPath $report)) { throw 'Missing original JUnit XML.' }
          [xml]$xml = Get-Content -LiteralPath $report -Raw
          $cases = $xml.SelectNodes('//testcase').Count
          if ($cases -le 0) { throw 'No test cases executed.' }
          if ($xml.SelectNodes('//failure | //error | //skipped').Count -ne 0) { throw 'Failures, errors or skips in focused proof.' }
          $reported = @($xml.SelectNodes('//testsuite') | Where-Object { $_.SelectNodes('./testcase').Count -gt 0 })
          if ($reported.Count -ne $paths.Count) { throw 'Requested/reported script count mismatch.' }
          foreach ($path in $paths) {
            $relative = $path.Replace('res://', '')
            $matching = @($reported | Where-Object { $_.GetAttribute('name').Replace('res://', '') -ceq $relative })
            if ($matching.Count -ne 1 -or $matching[0].SelectNodes('./testcase').Count -le 0) { throw "Requested nonempty script not reported: $path" }
          }
          [ordered]@{ suite = $suite; cases = $cases; requested_scripts = $paths; reported_scripts = @($reported | ForEach-Object { $_.GetAttribute('name') }) } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath ".godot/ci/$suite-summary.json" -Encoding utf8
      - name: Verify tracked source remains unchanged
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          # Only the two documented index-only malformed gitlink removals are
          # excluded. Generated ignored/untracked import and UID files are not
          # tracked-source edits; every tracked file is compared with HEAD.
          git diff --exit-code HEAD -- . ':(exclude).claude/skills/godot-prompter/1.10.0' ':(exclude).claude/skills/superpowers/6.1.1'
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source drifted during proof.' }
          git status --short --untracked-files=no | Set-Content -LiteralPath '.godot/ci/tracked-status.txt' -Encoding utf8
      - name: Hash original evidence even on failure
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.godot/ci' | Out-Null
          $roots = @('.godot/ci', '.godot/phase2r_logs')
          $files = @($roots | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -File -Force } | Where-Object { $_.Name -cne 'original-file-hashes.json' -and $_.Extension -in @('.log', '.json', '.jsonl', '.xml', '.txt') } | Sort-Object FullName)
          $manifest = @($files | ForEach-Object { [ordered]@{path=[IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_.FullName).Replace('\', '/'); bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath '.godot/ci/original-file-hashes.json' -Encoding utf8
      - name: Upload original logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-bundle-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/*.log
            .godot/ci/*.json
            .godot/ci/*.jsonl
            .godot/ci/*.xml
            .godot/ci/tracked-status.txt
            .godot/phase2r_logs/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
