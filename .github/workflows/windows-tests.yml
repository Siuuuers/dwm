              output.write(f"self_talk={str(self_talk).lower()}\n")
              output.write("focused=" + str(focused).lower() + "\n")
              output.write("comparison=" + str(comparison).lower() + "\n")

  focused-tests:
    # Independent suites use committed source; inventory verification remains a
    # separate required result and cannot be satisfied by diagnostic regeneration.
    needs: test-scope
    if: ${{ needs.test-scope.result == 'success' }}
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: ${{ matrix.suite == 'current_terminal_fixture' && 35 || 20 }}
    strategy:
