# TEMPORARY A VERIFICATION: never merge this workflow into integration.
# Detached preparation only; Director must release the exact commit before ref advance.
# Restore canonical workflow blob 643ff7794f8f602fb261df583705e4475d5c9ee4 from 73094c05645d3d2ff0315581fd3d6f94b41fca22.
name: Worker A History exit verification (temporary)
'on':
  push:
    branches:
    - codex/parallel-history-exit
    paths:
    - .github/workflows/windows-tests.yml
permissions:
  contents: read
concurrency:
  group: worker-a-verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker-a-verification:
    name: Worker A / bounded diagnostic (not strict acceptance)
    if: ${{ github.event.before == '73094c05645d3d2ff0315581fd3d6f94b41fca22' && github.event.forced == false &&
      github.event.deleted == false }}
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DWM_EXPECTED_HEAD: ${{ github.sha }}
      DWM_EXPECTED_PARENT: 73094c05645d3d2ff0315581fd3d6f94b41fca22
    steps:
    - name: Checkout the released push commit
      id: checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: 'true'
    - name: Bind exact checkout and frozen sources; retain canonical workflow bytes
      id: identity
      shell: python {0}
      run: |
        import hashlib, json, os, pathlib, re, subprocess
        root = pathlib.Path.cwd()
        out = root / '.godot/ci/worker-a-verification'
        out.mkdir(parents=True, exist_ok=False)
        def git(*args):
            return subprocess.check_output(['git', *args], cwd=root)
        def blob(data):
            return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
        base = '73094c05645d3d2ff0315581fd3d6f94b41fca22'
        workflow = '.github/workflows/windows-tests.yml'
        canonical = '643ff7794f8f602fb261df583705e4475d5c9ee4'
        head = git('rev-parse', 'HEAD').decode().strip()
        expected = os.environ.get('DWM_EXPECTED_HEAD', '')
        parent = os.environ['DWM_EXPECTED_PARENT']
        event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
        parents = git('rev-list', '--parents', '-n', '1', head).decode().split()
        if (parents != [head, parent] or event.get('before') != parent
                or event.get('after') != head or event.get('forced') is not False
                or event.get('deleted') is not False):
            raise SystemExit('A_DIAGNOSTIC_UNRELEASED_PUSH_TRANSITION')
        if (not re.fullmatch('[0-9a-f]{40}', expected) or head != expected
                or head != os.environ['GITHUB_SHA']
                or os.environ['GITHUB_REF'] != 'refs/heads/codex/parallel-history-exit'
                or os.environ['GITHUB_REPOSITORY'] != 'Siuuuers/dwm'
                or os.environ['GITHUB_EVENT_NAME'] != 'push'):
            raise SystemExit('A_DIAGNOSTIC_CHECKOUT_NOT_RELEASED_TARGET')
        subprocess.check_call(['git', 'merge-base', '--is-ancestor', base, head])
        changed = git('diff', '--name-only', base, head).decode().splitlines()
        if changed != [workflow]:
            raise SystemExit('A_DIAGNOSTIC_NON_WORKFLOW_COMMIT_DELTA: ' + repr(changed))
        frozen = {'autoload/DialogicBridge.gd': 'cfe48e0c7945f0e1586591666b8aacf54e0d8000', 'localization/ui/en.json': '2e671d9922c17c85b7a9e046d70c6d429d18132f', 'localization/ui/ja.json': '652423b710b8c5c83d9c72d305e673f0abedf35e', 'localization/ui/ko.json': '5f15c096af26551d41c2008fd1fb2a82677ef749', 'localization/ui/zh_CN.json': '272236fe4aa992648d0dab3d3fa843f830bd550a', 'localization/ui/zh_HK.json': '1582935148d792b8fece7083e1e07f65e929d4ac', 'scripts/application/ending/GalleryReplayOwner.gd': '46451cbfc1be71c208c868df51b9976e9889d2e4', 'scripts/ui/GalleryScene.gd': '7a0b4f02b9bc42e24576755fa25422bfe648a230', 'scripts/ui/MenuScene.gd': '765d4d52187bc2fb97a45bd21e2a6b4e3fdc470d', 'scripts/ui/gallery/GalleryCanvas.gd': 'ed67fb06feafe734a1ca694449a6f92045fc3b4d', 'tests/integration/test_gallery_caption_collection.gd': '0d9a629a256b1f8822120125178a248a81ddf4cb', 'tests/ui/render_gallery_caption_collection.gd': '05df9b6294db53fb36f72fe163b50e65714eebfc', 'tests/unit/test_gallery_replay_owner.gd': '46e91d434a1867671c0842894bd3f0989605ffc2', 'tools/testing/Invoke-PublicSurfaceValidation.ps1': 'ad46c78cd5be9da80b650feae95b892d7798415d', 'tools/testing/Invoke-CloudTests.ps1': 'b1172ddae0c96d6574a67bf4c5fd903649a6afec', 'tools/testing/Invoke-IsolatedGodot.ps1': 'a11e890b47d51f3a850d7ee04aaa5e0aeb56a9bd', 'tools/localization/UiLiteralAudit.gd': 'b4a093e0814bce0bea1144edcd9be640ae24e5bc', 'tools/runtime/generate_public_surface_inventory.gd': '38c227593a047a9812251f73d576482eb1a29306', 'tests/integration/test_menu_gallery_host.gd': 'ab3886bc6896af6cf80dedeb90aee7ce36ed0b11', 'tests/unit/test_new_acc_title_lifetime.gd': '5569539f1fb6652bd4f257cf353d0a45ba4587ee'}
        for name in [workflow, 'project.godot']:
            frozen[name] = git('rev-parse', head + ':' + name).decode().strip()
        records = {}
        for name, expected_blob in frozen.items():
            committed = git('rev-parse', head + ':' + name).decode().strip()
            data = (root / name).read_bytes()
            if committed != expected_blob or blob(data) != expected_blob:
                raise SystemExit('A_DIAGNOSTIC_SOURCE_MISMATCH: ' + name)
            records[name] = {'git_blob': committed, 'sha256': hashlib.sha256(data).hexdigest()}
        restored = git('cat-file', 'blob', base + ':' + workflow)
        if blob(restored) != canonical:
            raise SystemExit('A_DIAGNOSTIC_CANONICAL_WORKFLOW_MISMATCH')
        (out / 'canonical-windows-tests.yml').write_bytes(restored)
        report = {
            'checkout': head, 'source_candidate': base, 'commit_changed_paths': changed,
            'expected_parent': parent, 'push_before': event['before'], 'push_after': event['after'],
            'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'ref': os.environ['GITHUB_REF'], 'event': os.environ['GITHUB_EVENT_NAME'],
            'frozen_files': records, 'canonical_workflow_blob': canonical,
            'canonical_workflow_sha256': hashlib.sha256(restored).hexdigest(),
            'scope': 'Temporary diagnostic; not a strict gate or an integration candidate',
        }
        (out / 'source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        print('A_DIAGNOSTIC_SOURCE_BOUND ' + head)
    - name: Prepare disposable checkout for credential cleanup
      id: cleanup
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/worker-a-verification'
        git status --porcelain --untracked-files=no | Set-Content "$output/status-before-cleanup.txt" -Encoding utf8
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git submodule foreach --recursive 'true'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git diff --cached --raw | Set-Content "$output/index-after-cleanup.txt" -Encoding utf8
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install pinned Godot 4.6.3 standard
      id: install
      timeout-minutes: 5
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
        Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
        $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Godot archive checksum mismatch.'
        }
        $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
        Expand-Archive -LiteralPath $archive -DestinationPath $editor
        $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
        "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & $console --version | Tee-Object -FilePath '.godot/ci/worker-a-verification/godot-version.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Import project with isolated data roots and strict log checks
      id: import
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
        $env:APPDATA = Join-Path $output 'import-user/appdata'
        $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
        $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
          throw 'Project import reported script or Unicode errors; inspect import.log.'
        }
    - name: Restore committed project settings after attempted import
      id: restore
      if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.import.outcome != 'skipped' }}
      run: |
        # Restoration is cleanup, not evidence that an unsuccessful import passed.
        git restore -- project.godot
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Regenerate and check BOTH runtime surface inventories
      id: inventories
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        # Reuse the complete existing wrapper, including both generators/checks,
        # retirement audit, isolated processes, strict logs and recoverable payloads.
        pwsh -NoProfile -File ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads *>&1 |
          Tee-Object -FilePath '.godot/ci/worker-a-verification/inventory-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Audit UI literal ownership and retain generated reports
      id: literals
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
      timeout-minutes: 4
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/ui-literal-audit'
        New-Item -ItemType Directory -Force -Path $output | Out-Null
        # Existing isolated runner supplies headless/path/log and fresh user roots.
        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'worker-a-ui-literals' -LogName 'worker-a-ui-literals.log' -EvidenceLogPath '.godot/ci/ui-literal-audit/process.jsonl' -TimeoutSeconds 180 -GodotArgs @('--script','res://tools/localization/UiLiteralAudit.gd') *>&1 | Tee-Object -FilePath "$output/driver.log"
        $result = $LASTEXITCODE
        foreach ($name in @('ui_literal_disposition','script_ui_disposition')) {
          $source = "evidence/phase_2r/localization/$name.json"
          if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source -Destination "$output/$name.json" }
        }
        if ($result -ne 0) { exit $result }
        $log = '.godot/phase2r_logs/worker-a-ui-literals.log'
        if (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'UI literal audit reported errors.' }
        foreach ($name in @('ui_literal_disposition','script_ui_disposition')) {
          $report = Get-Content -LiteralPath "$output/$name.json" -Raw | ConvertFrom-Json
          if (@($report.failures).Count -ne 0 -or @($report.records).Count -eq 0) { throw "UI literal audit failed: $name" }
        }
        Write-Host 'UI_LITERAL_AUDIT_VERIFIED'
    - name: Recheck frozen source after generators and before tests
      id: pre_tests
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
      shell: python {0}
      run: |
        import hashlib, json, pathlib, subprocess
        root = pathlib.Path.cwd()
        out = root / '.godot/ci/worker-a-verification'
        source = json.loads((out / 'source.json').read_text(encoding='utf-8'))
        def git(*args):
            return subprocess.check_output(['git', *args], cwd=root)
        allowed = {'evidence/phase_2r/runtime/game_state_surface.json',
                   'evidence/phase_2r/runtime/save_manager_surface.json',
                   'evidence/phase_2r/localization/ui_literal_disposition.json',
                   'evidence/phase_2r/localization/script_ui_disposition.json'}
        working = git('diff', '--name-only').decode().splitlines()
        staged = git('diff', '--cached', '--name-status').decode().splitlines()
        cleanup = ['D\t.claude/skills/godot-prompter/1.10.0', 'D\t.claude/skills/superpowers/6.1.1']
        changed_frozen = [name for name, record in source['frozen_files'].items()
                          if not (root / name).is_file() or hashlib.sha256((root / name).read_bytes()).hexdigest() != record['sha256']]
        untracked = git('ls-files', '--others', '--exclude-standard').decode().splitlines()
        valid = set(working) <= allowed and sorted(staged) == cleanup and not changed_frozen and not untracked
        report = {'ok': valid, 'working_changed_paths': working, 'staged_changes': staged,
                  'changed_frozen_files': changed_frozen, 'untracked_nonignored': untracked,
                  'status_porcelain': git('status', '--porcelain', '--untracked-files=no').decode()}
        (out / 'pre-tests-source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        if not valid:
            raise SystemExit('A_DIAGNOSTIC_UNEXPECTED_SOURCE_MUTATION')
    - name: Run existing Menu and Title test bodies
      id: test_bodies
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_menu_gallery_host.gd,res://tests/unit/test_new_acc_title_lifetime.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/worker-a-test-bodies.xml')
        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'worker-a-test-bodies' -LogName 'worker-a-test-bodies.log' -EvidenceLogPath '.godot/ci/worker-a-test-bodies.jsonl' -TimeoutSeconds 480 -GodotArgs $arguments *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/test-bodies-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (Select-String -LiteralPath '.godot/phase2r_logs/worker-a-test-bodies.log' -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Supplemental tests reported errors.' }
    - name: Run existing reading_delivery suite
      id: reading_delivery
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        pwsh -NoProfile -File ./tools/testing/Invoke-CloudTests.ps1 -Suite reading_delivery *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/reading_delivery-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run existing endings suite
      id: endings
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        pwsh -NoProfile -File ./tools/testing/Invoke-CloudTests.ps1 -Suite endings *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/endings-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run existing settings suite
      id: settings
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        pwsh -NoProfile -File ./tools/testing/Invoke-CloudTests.ps1 -Suite settings *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/settings-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run existing persistence suite
      id: persistence
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        pwsh -NoProfile -File ./tools/testing/Invoke-CloudTests.ps1 -Suite persistence *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/persistence-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run existing localization suite
      id: localization
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        pwsh -NoProfile -File ./tools/testing/Invoke-CloudTests.ps1 -Suite localization *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/localization-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run existing public_surfaces suite
      id: public_surfaces
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        pwsh -NoProfile -File ./tools/testing/Invoke-CloudTests.ps1 -Suite public_surfaces *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/public_surfaces-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Render existing real Menu Gallery exit journey and locale projections
      id: render
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/gallery-caption-collection'
        $env:DWM_GALLERY_COLLECTION_OUTPUT = $output
        $env:APPDATA = Join-Path $output 'appdata'
        $env:LOCALAPPDATA = Join-Path $output 'localappdata'
        $env:DWM_TEST_ROOT = Join-Path $output 'test-root'
        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
        & $env:GODOT_CONSOLE_PATH --path $env:GITHUB_WORKSPACE --rendering-method gl_compatibility --audio-driver Dummy --log-file "$output/render.log" --script res://tests/ui/render_gallery_caption_collection.gd -- --phase2r-bootstrap-mode=final *>&1 | Tee-Object -FilePath '.godot/ci/worker-a-verification/render-driver.log'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (Select-String -LiteralPath "$output/render.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Gallery renderer reported errors.' }
        $markers = @(Get-Content -LiteralPath "$output/render.log" | Where-Object { $_ -cmatch '^GALLERY_CAPTION_COLLECTION_RENDER_VERIFIED' })
        if ($markers.Count -ne 1) { throw 'Gallery renderer did not report exactly one success marker.' }
    - name: Check raw XML coverage and distinguish real outcomes from projections
      id: reports
      if: ${{ !cancelled() && steps.pre_tests.outcome == 'success' }}
      shell: python {0}
      run: |
        import itertools, json, pathlib, re, xml.etree.ElementTree as ET
        root = pathlib.Path.cwd()
        out = root / '.godot/ci/worker-a-verification'
        failures, reports = [], {}
        for suite in ['reading_delivery','endings','settings','persistence','localization','public_surfaces','worker-a-test-bodies']:
            path = root / ('.godot/ci/' + suite + '.xml')
            if not path.is_file():
                failures.append(suite + ': missing XML'); continue
            tree = ET.parse(path)
            cases = tree.findall('.//testcase')
            invalid = tree.findall('.//failure') + tree.findall('.//error') + tree.findall('.//skipped')
            reports[suite] = {'cases': len(cases), 'failures_errors_skips': len(invalid)}
            if not cases or invalid: failures.append(suite + ': empty/failed/error/skipped report')
            if suite in ['reading_delivery', 'worker-a-test-bodies']:
                scripts = (['tests/integration/test_gallery_caption_collection.gd','tests/unit/test_gallery_replay_owner.gd']
                           if suite == 'reading_delivery' else ['tests/integration/test_menu_gallery_host.gd','tests/unit/test_new_acc_title_lifetime.gd'])
                for script in scripts:
                    expected = set(re.findall(r'^func (test_\w+)\(', (root/script).read_text(encoding='utf-8'), re.M))
                    observed = {case.get('name') for group in tree.findall('.//testsuite') if pathlib.PurePosixPath(group.get('name','').replace('\\','/')).name == pathlib.PurePosixPath(script).name for case in group.findall('testcase')}
                    reports[suite][script] = {'expected': sorted(expected), 'observed': sorted(observed)}
                    if not expected or expected != observed: failures.append(script + ': test body execution mismatch')
        folder = root / '.godot/ci/gallery-caption-collection'
        path = folder / 'measurements.json'
        render = {}
        if not path.is_file(): failures.append('missing render measurements')
        else:
            render = json.loads(path.read_text(encoding='utf-8'))
            if render.get('ok') is not True or render.get('failures') or not render.get('samples'): failures.append('render failed or empty')
            files = [s['file'] for s in render.get('samples', [])]
            expected = {'status-%s-%s-%d-%s.png' % t for t in itertools.product(['pixel','readable'],['en','zh_CN','zh_HK','ja','ko'],[100,125,150],['added','failed','uncertain'])}
            actual = {name for name in files if name.startswith('status-')}
            if expected != actual: failures.append('projection tuple set mismatch')
            real = {'first-visible.png','second-visible-not-collectable.png','restarted-visible.png','failed-real.png','uncertain-real.png'}
            if not real <= set(files) or len(files) != len(set(files)): failures.append('real journey captures missing or duplicate filenames')
            for name in files:
                p = folder / name
                if p.parent != folder or not p.is_file() or p.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n': failures.append('invalid capture: '+name)
            render = {'projection_files': sorted(actual), 'real_journey_files': sorted(set(files)-actual), 'checks': render.get('checks'), 'visual_review_performed': False}
        (out/'report-validation.json').write_text(json.dumps({'ok':not failures,'failures':failures,'xml':reports,'render':render},indent=2)+'\n',encoding='utf-8')
        if failures: raise SystemExit('; '.join(failures))
    - name: Verify source custody after all diagnostic consumers
      id: post_tests
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
      shell: python {0}
      run: |
        import hashlib, json, pathlib, subprocess
        root = pathlib.Path.cwd()
        out = root / '.godot/ci/worker-a-verification'
        source = json.loads((out / 'source.json').read_text(encoding='utf-8'))
        def git(*args):
            return subprocess.check_output(['git', *args], cwd=root)
        allowed = {'evidence/phase_2r/runtime/game_state_surface.json',
                   'evidence/phase_2r/runtime/save_manager_surface.json',
                   'evidence/phase_2r/localization/ui_literal_disposition.json',
                   'evidence/phase_2r/localization/script_ui_disposition.json'}
        working = git('diff', '--name-only').decode().splitlines()
        staged = git('diff', '--cached', '--name-status').decode().splitlines()
        cleanup = ['D\t.claude/skills/godot-prompter/1.10.0', 'D\t.claude/skills/superpowers/6.1.1']
        changed_frozen = [name for name, record in source['frozen_files'].items()
                          if not (root / name).is_file() or hashlib.sha256((root / name).read_bytes()).hexdigest() != record['sha256']]
        untracked = git('ls-files', '--others', '--exclude-standard').decode().splitlines()
        valid = set(working) <= allowed and sorted(staged) == cleanup and not changed_frozen and not untracked
        report = {'ok': valid, 'working_changed_paths': working, 'staged_changes': staged,
                  'changed_frozen_files': changed_frozen, 'untracked_nonignored': untracked,
                  'status_porcelain': git('status', '--porcelain', '--untracked-files=no').decode()}
        (out / 'post-tests-source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
        if not valid:
            raise SystemExit('A_DIAGNOSTIC_UNEXPECTED_SOURCE_MUTATION')
    - name: Retain independent outcomes and raw artifact hashes
      id: outcomes
      if: ${{ always() }}
      timeout-minutes: 3
      shell: python {0}
      env:
        DWM_STEPS_JSON: ${{ toJSON(steps) }}
      run: |
        import hashlib, json, os, pathlib
        root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
        out = root / '.godot/ci/worker-a-verification'
        out.mkdir(parents=True, exist_ok=True)
        steps = json.loads(os.environ['DWM_STEPS_JSON'])
        required = ['checkout', 'identity', 'cleanup', 'install', 'import', 'restore', 'inventories', 'literals', 'pre_tests', 'test_bodies', 'reading_delivery', 'endings', 'settings', 'persistence', 'localization', 'public_surfaces', 'render', 'reports', 'post_tests']
        complete = all(steps.get(name, {}).get('outcome') == 'success' for name in required)
        report = {'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                  'event_sha':os.environ['GITHUB_SHA'],'steps':steps,'required_steps':required,
                  'classification':'DIAGNOSTIC_ONLY' if complete else 'FAILED_OR_INCOMPLETE_DIAGNOSTIC',
                  'strict_acceptance':False,'visual_review_performed':False,
                  'scope':'Snapshot before artifact upload and checkout post-job; inspect those separately'}
        (out/'outcomes.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
        snapshots=out/'raw-working-generated-reports'
        snapshots.mkdir(exist_ok=True)
        # Raw snapshots may be inherited or partial after failure, never generation proof.
        for name in ['runtime/game_state_surface.json','runtime/save_manager_surface.json','localization/ui_literal_disposition.json','localization/script_ui_disposition.json']:
            path=root/'evidence/phase_2r'/name
            if path.is_file(): (snapshots/path.name).write_bytes(path.read_bytes())
        files=set()
        for folder in [root/'.godot/ci',root/'.godot/phase2r_logs']:
            if folder.is_dir(): files.update(p for p in folder.rglob('*') if p.is_file())
        manifest=[{'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(files) if p.name!='artifact-files.sha256.json']
        (out/'artifact-files.sha256.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
        print(json.dumps(report))
        if not complete: raise SystemExit('A_DIAGNOSTIC_FAILED_OR_INCOMPLETE')
    - name: Upload all diagnostic evidence even after failure
      id: artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: worker-a-history-exit-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          .godot/ci/
          .godot/phase2r_logs/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
