name: Scene owner composition and read-only log proof
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: scene-owner-composition-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  focused:
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [new-browsing]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source bytes at checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 2fb4ddd29fd289c9f37a007c39be5803e0aeb467
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and record immutable source before import
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cne '2fb4ddd29fd289c9f37a007c39be5803e0aeb467') { throw 'Wrong source commit.' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cne '228bf8738f5bfdcac761c17159d8f99db68c6901') { throw 'Wrong source tree.' }

          $base = '90a7319072a6c5c0703f093d16edf52e2cb04e73'
          $aHead = 'd2aacc316920a4198763b4835333b6535e601001'
          $gHead = '1185f44539c52b9e8085ef51743056f92ac704d1'
          $parents = @((git rev-list --parents -n 1 HEAD).Trim().Split(' '))
          if ($LASTEXITCODE -ne 0 -or $parents.Count -ne 2 -or $parents[1] -cne 'e92dc02e0858579b13efa58e96d9233b0e50b8bf') { throw 'UI correction requires exact composed parent.' }
          $previousTree = (git rev-parse 'e92dc02e0858579b13efa58e96d9233b0e50b8bf^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $previousTree -cne '8633fb01c8a36d25f2507f422b5c16e28ee69c1b') { throw 'Previous browsing fixture tree mismatch.' }
          $originalTree = (git rev-parse 'b3e7bfcce7a21138ed96113ec636a53e560286bb^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $originalTree -cne 'adad5cc1a33f923366b5352e24a08efe44f1fc9d') { throw 'Composed parent tree mismatch.' }
          $correctionPaths = @(git diff --name-only 'b3e7bfcce7a21138ed96113ec636a53e560286bb' HEAD)
          if ($LASTEXITCODE -ne 0 -or $correctionPaths.Count -ne 1 -or $correctionPaths[0] -cne 'tests/integration/test_scene_log_readonly.gd') { throw 'Only browsing fixture correction is authorized.' }
          git fetch --no-tags origin $gHead
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch immutable G constituent.' }
          foreach ($pin in @(@{commit=$base; tree='a1712ca59c81edc40cce5b688e6d2e4e0b1b3eb6'}, @{commit=$aHead; tree='cc0e213d8472a3ac4c55f1a698fed635dc0457c7'}, @{commit=$gHead; tree='91d13c40f772e080f2a9dcce526504b9936bcb22'})) {
            $actualTree = (git rev-parse "$($pin.commit)^{tree}").Trim()
            if ($LASTEXITCODE -ne 0 -or $actualTree -cne $pin.tree) { throw 'Immutable constituent tree mismatch.' }
          }
          $aPaths = @(
            'autoload/DialogicBridge.gd',
            'scripts/narrative/DialogicRuntimeAdapter.gd',
            'tests/integration/test_scene_day_reading.gd',
            'tests/integration/test_scene_held_source.gd',
            'tests/support/SceneHeldSourceFixture.gd'
          )
          $gPaths = @(
            'autoload/ProfileManager.gd',
            'scripts/application/narrative/SaveManagerNarrativeCheckpointPort.gd',
            'scripts/application/run/DatingChallengeEnvelope.gd',
            'scripts/application/run/DatingPhysicalOwner.gd',
            'scripts/application/run/DatingPresentationPort.gd',
            'scripts/profile/DatingAttemptLedger.gd',
            'tests/integration/scene_challenge_restart.gd',
            'tests/support/SceneChallengeFixture.gd',
            'tests/unit/test_profile_dating_attempts.gd',
            'tests/unit/test_scene_challenge.gd',
            'tests/unit/test_scene_checkpoint_ack.gd'
          )
          $newTests = @('tests/integration/test_scene_owner_composition.gd', 'tests/support/SceneOwnerCompositionFixture.gd', 'tests/integration/test_scene_log_readonly.gd')
          function Assert-ExactPaths($ExpectedPaths, $ActualPaths, $Label) {
            if ((@($ExpectedPaths | Sort-Object -CaseSensitive) -join "`n") -cne (@($ActualPaths | Sort-Object -CaseSensitive) -join "`n")) { throw "Wrong path set: $Label" }
          }
          $actualA = @(git diff --name-only $base $aHead)
          if ($LASTEXITCODE -ne 0) { throw 'A comparison failed.' }
          Assert-ExactPaths $aPaths $actualA 'A five-file delta'
          $actualG = @(git diff --name-only $base $gHead)
          if ($LASTEXITCODE -ne 0) { throw 'G comparison failed.' }
          Assert-ExactPaths $gPaths $actualG 'G eleven-file delta'
          $actualComposition = @(git diff --name-only $aHead HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Composition comparison failed.' }
          Assert-ExactPaths (@($gPaths) + @($newTests)) $actualComposition 'composition fourteen-file delta'
          $wholeDelta = @(git diff --name-only $base HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Whole source comparison failed.' }
          Assert-ExactPaths (@($aPaths) + @($gPaths) + @($newTests)) $wholeDelta 'whole nineteen-file delta'
          $files = @()
          foreach ($group in @(@{head=$aHead; paths=$aPaths}, @{head=$gHead; paths=$gPaths})) {
            foreach ($path in $group.paths) {
              $original = (git rev-parse "$($group.head):$path").Trim()
              if ($LASTEXITCODE -ne 0) { throw "Missing constituent blob: $path" }
              $current = (git rev-parse "HEAD:$path").Trim()
              if ($LASTEXITCODE -ne 0 -or $current -cne $original) { throw "Changed frozen constituent: $path" }
              $files += [ordered]@{path=$path; source=$group.head; blob=$original}
            }
          }
          $added = @(git diff --name-only --diff-filter=A $aHead HEAD)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect additions.' }
          foreach ($path in $newTests) {
            if ($path -cnotin $added) { throw "New allocated test must be an addition: $path" }
          }
          foreach ($path in $wholeDelta) {
            $blob = (git rev-parse "HEAD:$path").Trim()
            if ($LASTEXITCODE -ne 0) { throw "Missing source blob: $path" }
            $bytesBlob = (git hash-object --no-filters -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $bytesBlob -cne $blob) { throw "Checked-out source bytes differ: $path" }
          }
          New-Item -ItemType Directory -Force -Path '.godot/ci' | Out-Null
          [ordered]@{base=$base; a_head=$aHead; g_head=$gHead; parent=$parents[1]; source=$source; source_tree=$tree; constituent_files=$files; new_tests=$newTests; exact_changed_paths=$wholeDelta} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath '.godot/ci/composition-receipt.json' -Encoding utf8
          git diff --exit-code HEAD --
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout is dirty before import.' }
          New-Item -ItemType Directory -Force -Path '.godot/ci' | Out-Null
          [ordered]@{
            source_sha = $source; source_tree = $tree; controller_event_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT
            suite = '${{ matrix.suite }}'; scope = 'real Bridge/RuntimeAdapter/checkpoint-port composition over isolated checkpoint storage seam; no save-format activation'
          } | ConvertTo-Json | Set-Content -LiteralPath '.godot/ci/source-receipt.json' -Encoding utf8
      - name: Prepare disposable index for checkout cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Godot archive checksum mismatch.' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $exeHash = (Get-FileHash -LiteralPath $console -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -cne '63b3b2208819714c9677fbfdd8217c5b7dee8ecf5f383502e826bc9e2227ff5a') { throw 'Godot console checksum mismatch.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [ordered]@{ archive_sha256 = $archiveHash; console_sha256 = $exeHash; version = $version } | ConvertTo-Json | Set-Content -LiteralPath '.godot/ci/engine-receipt.json' -Encoding utf8
      - name: Import source
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -LiteralPath "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Project import reported errors.' }
      - name: Restore committed project settings after import
        run: |
          git restore --source=HEAD --worktree -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute isolated explicit GUT scripts
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $suite = '${{ matrix.suite }}'
          # Each matrix job is a fresh Godot process. Scene registration selection
          # cannot leak into legacy readers or another fixture's immutable caches.
          $scripts = switch ($suite) {
            'new-protocol' { @('tests/integration/test_scene_owner_composition.gd') }
            'new-browsing' { @('tests/integration/test_scene_log_readonly.gd') }
            'retained-scene' { @('tests/integration/test_scene_day_reading.gd', 'tests/integration/test_scene_held_source.gd', 'tests/unit/test_scene_runtime_activation.gd') }
            'checkpoint-ack' { @('tests/unit/test_scene_checkpoint_ack.gd', 'tests/unit/test_reading_next_checkpoint.gd') }
            'native-neighbors' { @('tests/integration/test_dialogic_next_traversal.gd', 'tests/integration/test_narrative_caption_ledger_runtime.gd', 'tests/integration/test_narrative_reading_frontier_runtime.gd') }
            default { throw 'Unknown focused suite.' }
          }
          $scripts = @($scripts)
          $paths = @($scripts | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "Missing requested test: $_" }
            "res://$_"
          })
          $gutArguments = @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', "-gtest=$($paths -join ',')", '-gexit', '-glog=2', "-gjunit_xml_file=res://.godot/ci/$suite.xml")
          # GUT rejects unknown user arguments, so select the debug-only fixture
          # through the child process environment instead of its CLI parser.
          if ($suite -in @('new-protocol', 'new-browsing', 'retained-scene')) { $env:DWM_SCENE_READING_FIXTURE = '1' }
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId "scene-owner-composition-controller-$suite" -LogName "$suite.log" -EvidenceLogPath ".godot/ci/$suite.jsonl" -TimeoutSeconds 480 -GodotArgs $gutArguments
          $result = $LASTEXITCODE
          $log = ".godot/phase2r_logs/$suite.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($result -ne 0) { exit $result }
          if (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load' -Quiet) { throw 'Focused suite reported script errors.' }
          if (Select-String -LiteralPath $log -Pattern 'Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Unexpected Unicode/NUL diagnostic.' }
          $report = ".godot/ci/$suite.xml"
          if (-not (Test-Path -LiteralPath $report)) { throw 'Missing original JUnit XML.' }
          [xml]$xml = Get-Content -LiteralPath $report -Raw
          $cases = $xml.SelectNodes('//testcase').Count
          if ($cases -le 0) { throw 'No test cases executed.' }
          if ($xml.SelectNodes('//failure | //error | //skipped').Count -ne 0) { throw 'Failures, errors or skips in focused proof.' }
          $reported = @($xml.SelectNodes('//testsuite') | Where-Object { $_.SelectNodes('./testcase').Count -gt 0 })
          if ($reported.Count -ne $paths.Count) { throw 'Requested/reported script count mismatch.' }
          foreach ($path in $paths) {
            $relative = $path.Replace('res://', '')
            $matching = @($reported | Where-Object { $_.GetAttribute('name').Replace('res://', '') -ceq $relative })
            if ($matching.Count -ne 1 -or $matching[0].SelectNodes('./testcase').Count -le 0) { throw "Requested nonempty script not reported: $path" }
          }
          [ordered]@{ suite = $suite; cases = $cases; requested_scripts = $paths; reported_scripts = @($reported | ForEach-Object { $_.GetAttribute('name') }) } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath ".godot/ci/$suite-summary.json" -Encoding utf8
      - name: Verify tracked source remains unchanged
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          # Only the two documented index-only malformed gitlink removals are
          # excluded. Generated ignored/untracked import and UID files are not
          # tracked-source edits; every tracked file is compared with HEAD.
          git diff --exit-code HEAD -- . ':(exclude).claude/skills/godot-prompter/1.10.0' ':(exclude).claude/skills/superpowers/6.1.1'
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source drifted during proof.' }
          git status --short --untracked-files=no | Set-Content -LiteralPath '.godot/ci/tracked-status.txt' -Encoding utf8
      - name: Hash original evidence even on failure
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.godot/ci' | Out-Null
          $roots = @('.godot/ci', '.godot/phase2r_logs')
          $files = @($roots | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -File -Force } | Where-Object { $_.Name -cne 'original-file-hashes.json' -and $_.Extension -in @('.log', '.json', '.jsonl', '.xml', '.txt') } | Sort-Object FullName)
          $manifest = @($files | ForEach-Object { [ordered]@{path=[IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $_.FullName).Replace('\', '/'); bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath '.godot/ci/original-file-hashes.json' -Encoding utf8
      - name: Upload original logs and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-owner-composition-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/*.log
            .godot/ci/*.json
            .godot/ci/*.jsonl
            .godot/ci/*.xml
            .godot/ci/tracked-status.txt
            .godot/phase2r_logs/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
