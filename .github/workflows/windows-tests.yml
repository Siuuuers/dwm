        suite: ${{ fromJSON((needs.test-scope.outputs.dtl_content == 'true' || needs.test-scope.outputs.dtl_first == 'true') && '["dtl_first_authoring","scene_inline_presentation","scene_inline_audio_unit","scene_inline_audio_transition","scene_inline_audio_transport","authored_week","named_presentation","bilingual_reading","dialogue_library","self_talk_journey","self_talk_transport","self_talk_skip","scene_native_restore","scene_current_creation","scene_day_history","scene_direct_controls","scene_multiple_thoughts","scene_contacts","current_quick_load","scene_player_position","scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced","scene_checkpoint_ack","scene_current_snapshot","scene_caption_challenge","current_title","scene_controls_localization"]' || needs.test-scope.outputs.inline_audio == 'true' && '["scene_inline_audio_unit","scene_inline_audio_transition","scene_inline_audio","scene_inline_audio_transport","authored_week","named_presentation","bilingual_reading","self_talk_journey","self_talk_transport","self_talk_skip","scene_native_restore","scene_current_creation","scene_day_history","scene_direct_controls","scene_multiple_thoughts","scene_contacts","current_quick_load","scene_player_position","scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced"]' || needs.test-scope.outputs.readability == 'true' && '["backup_current_build","scene_apps","scene_computer","self_talk_ui","scene_direct_controls","scene_day_history","current_quick_load","settings","minesweeper","shop","desktop","localization","reading_delivery","dialogue_library","bilingual_reading","self_talk_choices","authored_self_talk_choices","scene_controls_localization","current_title","new_account","persistence","scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced","scene_caption_challenge"]' || needs.test-scope.outputs.reading_layout == 'true' && '["bilingual_reading","self_talk_review","self_talk_ui","self_talk_journey","self_talk_transport","scene_controls_localization","scene_direct_controls","scene_caption_challenge","scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced","reading_delivery","settings","endings"]' || needs.test-scope.outputs.bilingual_reading == 'true' && '["bilingual_reading","dialogue_library","authored_week","scene_checkpoint_ack","scene_story_localization","settings","persistence","current_title","current_quick_load","scene_native_restore","scene_multiple_thoughts","scene_direct_controls","scene_controls_localization","self_talk_unit","self_talk_skip","self_talk_journey","self_talk_transport","self_talk_choices","authored_self_talk_choices","scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced","reading_delivery","localization"]' || needs.test-scope.outputs.dialogue_library == 'true' && '["dialogue_library","authored_week","scene_checkpoint_ack","scene_content_update_wording","scene_story_localization","named_presentation","settings","persistence","new_account","current_title","current_quick_load","scene_native_restore","scene_transition_journey","self_talk_journey","scene_multiple_thoughts","scene_direct_controls","scene_controls_localization","scene_passage_catalogue","scene_passage_connected","reading_delivery","localization"]' || needs.test-scope.outputs.playtest_polish == 'true' && '["shop_cosmetic_journey","self_talk_choices","authored_self_talk_choices","self_talk_unit","self_talk_runtime","self_talk_ui","self_talk_skip","self_talk_journey","self_talk_review","self_talk_transport","scene_multiple_thoughts","scene_contacts","scene_apps","scene_computer","scene_controls_localization","scene_caption_challenge","scene_direct_controls","save_ink_pixels","save_ink_journey","save_ink_storage","save_ink_backup_refresh","current_quick_load","scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced","settings","desktop","current_title"]' || needs.test-scope.outputs.save_ink == 'true' && '["save_ink_journey","save_ink_pixels","save_ink_storage","save_ink_backup_refresh","current_quick_load","current_title","self_talk_journey","scene_transition_journey","scene_apps"]' || needs.test-scope.outputs.scene_transition == 'true' && '["scene_transition_pixels","scene_transition_journey","scene_transition_auto","scene_transition_reduced","self_talk_journey","self_talk_transport","self_talk_skip","scene_apps","scene_day_history","scene_direct_controls","current_title","scene_controls_localization"]' || needs.test-scope.outputs.shop_cosmetics == 'true' && '["shop_cosmetic_unit","shop_cosmetic_layout","shop_cosmetic_buy","shop_cosmetic_supportz","shop_cosmetic_legacy","shop_cosmetic_blank","shop_cosmetic_journey","scene_apps","scene_same_day_supportz","self_talk_journey","current_title","scene_controls_localization"]' || needs.test-scope.outputs.self_talk == 'true' && '["self_talk_unit","self_talk_runtime","self_talk_ui","self_talk_skip","self_talk_journey","self_talk_review","self_talk_transport","scene_day_history","scene_direct_controls","scene_later_caption","scene_caption_challenge","scene_passage_catalogue","scene_passage_connected","scene_story_localization","scene_controls_localization","current_title","scene_apps"]' || needs.test-scope.outputs.focused == 'true' && '["timeline_resources","backup_presentation","profile_parse","authored_week","scene_backup_inspection","scene_progress_schema","current_title"]' || '["bilingual_reading","dialogue_library","self_talk_choices","authored_self_talk_choices","named_presentation","minesweeper","shop","desktop","settings","checkpoint_diagnostics","new_account","reading_delivery","localization","dating","persistence","endings","audio","scene_desktop_first_reveal","scene_round_checkpoint","scene_shop_checkpoint","scene_story_localization","scene_controls_localization","scene_apps","current_title","scene_backup_inspection","scene_progress_schema","authored_week","scene_five_outcomes","timeline_resources","profile_parse","backup_current_build","current_terminal_fixture","current_quick_load","scene_direct_controls","scene_multiple_thoughts","scene_challenge_recall","scene_same_day_supportz","scene_player_position","scene_native_restore","scene_day_history","scene_later_caption","scene_caption_challenge","scene_audio_connected","scene_save_metadata","scene_passage_connected","scene_passage_catalogue","scene_contacts","scene_current_creation","scene_current_frames","scene_current_challenge","scene_current_snapshot","scene_content_update_wording","scene_content_update_deleted_line","scene_content_update_deleted_checkpoint","scene_content_update_history","scene_content_update_active_board","scene_content_update_transfer_active","scene_content_update_transfer_terminal","scene_content_update_resolved_unfinished","scene_content_update_completed_appended","scene_content_update_completed_deleted","scene_content_update_invalid_choice","scene_content_update_invalid_choice_missing_default","scene_content_contracts","scene_checkpoint_ack","scene_owner_composition"]') }}
        include: ${{ fromJSON(needs.test-scope.outputs.dtl_content == 'true' && '[{"suite":"scene_content_update_wording"},{"suite":"scene_content_update_deleted_line"},{"suite":"scene_content_update_deleted_checkpoint"},{"suite":"scene_content_update_history"},{"suite":"scene_content_update_active_board"},{"suite":"scene_content_update_transfer_active"},{"suite":"scene_content_update_transfer_terminal"},{"suite":"scene_content_update_resolved_unfinished"},{"suite":"scene_content_update_completed_appended"},{"suite":"scene_content_update_completed_deleted"},{"suite":"scene_content_update_invalid_choice"},{"suite":"scene_content_update_invalid_choice_missing_default"}]' || '[]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          # The schedule-gate contract inspects its immutable historical seals.
          fetch-depth: ${{ (matrix.suite == 'new_account' || matrix.suite == 'desktop') && '0' || '1' }}
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native fresh and reset display defaults
        if: matrix.suite == 'settings'
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/window-mode-native'
          $env:APPDATA = Join-Path $output 'appdata'
          $env:LOCALAPPDATA = Join-Path $output 'localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --path $env:GITHUB_WORKSPACE --rendering-method gl_compatibility --audio-driver Dummy --log-file "$output/render.log" --script res://tests/manual/verify_window_mode_native.gd -- --phase2r-bootstrap-mode=test_manual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/render.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load' -Quiet) { throw 'Native display verification reported script errors.' }
          if (-not (Select-String -Path "$output/render.log" -Pattern 'WINDOW_MODE_NATIVE_VERIFIED checks=\d+ ok=true' -Quiet)) { throw 'Native display verification did not complete.' }
      - name: Run focused regression suite
        id: focused_regression
        timeout-minutes: ${{ matrix.suite == 'current_terminal_fixture' && 30 || 10 }}
        env:
          DWM_CI_SUITE: ${{ matrix.suite }}
        run: ./tools/testing/Invoke-CloudTests.ps1 -Suite $env:DWM_CI_SUITE
      - name: Run bilingual choices with a fresh registration and profile
        # Share checkout/import, but never mix fixture and authored registration in one process.
        if: ${{ !cancelled() && matrix.suite == 'bilingual_reading' && steps.focused_regression.outcome != 'skipped' }}
        timeout-minutes: 10
        run: ./tools/testing/Invoke-CloudTests.ps1 -Suite bilingual_choices
      - name: Verify interrupted Load leaves persistent files unchanged
        if: matrix.suite == 'persistence'
        timeout-minutes: 10
        run: |
          foreach ($point in @('prefix', 'completed')) {
            ./tools/testing/Invoke-SceneInterruptionProof.ps1 -Point $point
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $evidence = ".godot/ci/direct-load-interruption/$point"
            New-Item -ItemType Directory -Force -Path $evidence | Out-Null
            Copy-Item '.godot/ci/scene-interrupt*' $evidence
          }
      - name: Render Settings uncertain-write journey
        if: matrix.suite == 'settings'
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/settings-failure-render'
          $env:APPDATA = Join-Path $output 'appdata'
          $env:LOCALAPPDATA = Join-Path $output 'localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --path $env:GITHUB_WORKSPACE --rendering-method gl_compatibility --audio-driver Dummy --log-file "$output/render.log" --script res://tests/ui/render_settings_shared.gd -- --settings-write-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/render.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Settings journey reported script errors.' }
          if (-not (Select-String -Path "$output/render.log" -Pattern 'SETTINGS_SHARED_RENDER_VERIFIED captures=3' -Quiet)) { throw 'Settings failure journey did not complete.' }
      - name: Render bottom bar and caption geometry
        if: matrix.suite == 'scene_controls_localization'
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/scene-controls-render'
          $env:APPDATA = Join-Path $output 'appdata'
          $env:LOCALAPPDATA = Join-Path $output 'localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'test-root'
          $env:DWM_RENDER_OUTPUT = $output
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --path $env:GITHUB_WORKSPACE --rendering-method gl_compatibility --audio-driver Dummy --log-file "$output/render.log" --script res://tests/ui/render_scene_controls_localization.gd -- --phase2r-bootstrap-mode=test_manual
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/render.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Bottom bar render reported script errors.' }
          $report = Get-Content "$output/results.json" -Raw | ConvertFrom-Json
          if (-not $report.ok -or $report.renderer -eq 'headless' -or $report.failures.Count -ne 0 -or $report.samples.Count -ne 80 -or $report.captures -ne 80) { throw 'Bottom bar geometry evidence is incomplete.' }
          $captures = @(Get-ChildItem $output -Filter '*.png')
          if ($captures.Count -ne 80 -or @($captures | Where-Object { $_.Length -eq 0 }).Count -ne 0) { throw 'Bottom bar screenshots are incomplete.' }
      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/*.log
            .godot/ci/*.jsonl
            .godot/ci/*.json
            .godot/ci/*.xml
            .godot/ci/storage-refusal/
            .godot/ci/direct-load-interruption/
            .godot/ci/settings-failure-render/
            .godot/ci/window-mode-native/
            .godot/ci/scene-controls-render/
            .godot/ci/backup-operations/
            .godot/ci/backup-ui/
            .godot/ci/current-terminal-fixture/
            .godot/ci/*.png
            .godot/phase2r_logs/current-terminal-*.log
            .godot/phase2r_logs/terminal-fixture-registration.log
            .godot/phase2r_logs/cloud-*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  startup-load-comparison:
    needs: test-scope
    # PR evidence already covers this source; do not repeat the slow matched run after merging.
    if: github.event_name == 'pull_request' && needs.test-scope.outputs.comparison == 'true'
    name: Windows / matched startup and Load
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compare baseline and candidate readiness
        timeout-minutes: 35
        env:
          DWM_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./tools/testing/Invoke-StartupLoadComparison.ps1 -BaseRef $env:DWM_BASE_REF
      - name: Upload matched readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-load-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/startup-load-comparison/
            .godot/phase2r_logs/startup-load-*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

