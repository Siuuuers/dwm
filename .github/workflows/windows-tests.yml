name: Scene Challenge first Reveal diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/windows-tests.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: scene-runtime-integration-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  first-reveal-diagnostic:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 38
    env:
      BASE_SHA: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
          path: source
          fetch-depth: 0

      - name: Recover frozen candidate packet
        uses: actions/download-artifact@v4
        with:
          name: scene-first-reveal-38092016425-1
          path: inherited
          github-token: ${{ github.token }}
          repository: Siuuuers/dwm
          run-id: 38092016425

      - name: Reconstruct and correct bounded candidate
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          def git(*args: str) -> str:
              return subprocess.check_output(['git', *args], text=True).strip()

          def replace_exact(path: pathlib.Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count == 1, (label, count)
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          base = os.environ['BASE_SHA']
          assert git('rev-parse', 'HEAD') == base
          live = git('ls-remote', 'origin', 'refs/heads/codex/scene-runtime-integration-20261009').split()[0]
          assert live == base, ('A advanced; reconcile before testing', live)

          inherited = pathlib.Path('../inherited')
          origins = list(inherited.rglob('candidate-origin.json'))
          assert len(origins) == 1, origins
          origin_path = origins[0]
          origin = json.loads(origin_path.read_text(encoding='utf-8'))
          raw_path = origin_path.with_name('candidate.patch')
          raw = raw_path.read_bytes()
          assert origin['base'] == base
          assert origin['controller'] == '8a1ce85f479afc2236fced14f88c87587e2d799e'
          assert hashlib.sha256(raw).hexdigest() == '0b3c19fb4637f179beb00dcdff1711e4ab65ef3501fe75917521031cbc25c2ee'

          tab_escapes = 0
          continuations = 0
          corrected_lines = []
          for line in raw.decode('utf-8').splitlines(keepends=True):
              if line.startswith('+') and not line.startswith('+++'):
                  tab_escapes += line.count('\\t')
                  line = line.replace('\\t', '\t')
                  newline = '\r\n' if line.endswith('\r\n') else ('\n' if line.endswith('\n') else '')
                  body = line[:-len(newline)] if newline else line
                  if body.endswith('\\\\'):
                      body = body[:-1]
                      continuations += 1
                  line = body + newline
              corrected_lines.append(line)
          assert tab_escapes == 251, tab_escapes
          assert continuations == 6, continuations

          output = pathlib.Path('.godot/ci')
          output.mkdir(parents=True, exist_ok=True)
          decoded = ''.join(corrected_lines).encode('utf-8')
          decoded_path = output / 'candidate-decoded.patch'
          decoded_path.write_bytes(decoded)
          subprocess.run(['git', 'apply', '--index', '--binary', str(decoded_path)], check=True)

          test_path = pathlib.Path('tests/unit/test_scene_first_reveal.gd')
          replace_exact(
              test_path,
              '\tvar record := f.record().duplicate(true)\n\tvar attempt := f.attempt().value.duplicate(true)\n\tvar checkpoints := f.authority.checkpoints.size()\n',
              '\tvar record: Dictionary = f.record().duplicate(true)\n\tvar attempt: Dictionary = f.attempt().value.duplicate(true)\n\tvar checkpoints: int = f.authority.checkpoints.size()\n',
              'explicit duplicate types',
          )
          replace_exact(
              test_path,
              '\tassert_eq(view.value.phase, "never_started")\n',
              '\tassert_eq(view.value.phase, "never_started")\n\tassert_eq(view.value.host, "canonical_solo")\n',
              'idle host assertion',
          )

          envelope_path = pathlib.Path('scripts/application/run/DatingChallengeEnvelope.gd')
          replace_exact(
              envelope_path,
              '\tvar forced_cell := int(envelope.forced_cell)\n\tif envelope.preparation is Dictionary:\n\t\tforced_cell = int(envelope.preparation.get("forced_cell", -1))\n\tif forced_cell < 0: return false\n\tvar begun: Dictionary = GENERATOR.begin_debug_at_cell(spec, forced_cell)\n\tif not begun.ok: return false\n',
              '\tvar forced_cell: int = int(envelope.forced_cell)\n\tif envelope.preparation is Dictionary:\n\t\tforced_cell = int(envelope.preparation.get("forced_cell", -1))\n\tif forced_cell < 0: return false\n\t# Preserve byte-identical replay for historical random-forced entries. Only a\n\t# genuinely different player-selected cell uses the explicit-cell constructor.\n\tvar begun: Dictionary = GENERATOR.begin_debug(spec)\n\tif not begun.ok: return false\n\tif int(begun.value.preparation.forced_cell) != forced_cell:\n\t\tbegun = GENERATOR.begin_debug_at_cell(spec, forced_cell)\n\t\tif not begun.ok: return false\n',
              'historical preparation replay',
          )

          owner_path = pathlib.Path('scripts/application/run/DatingPhysicalOwner.gd')
          replace_exact(
              owner_path,
              '\tvar view: Dictionary = _pull_scene(physical_token)\n\tif not view.get("ok", false): return view\n\tif view.value.get("phase") != "never_started": return view\n\tvar preview: Dictionary = _scene_unstarted_board()\n\tif not preview.get("ok", false): return preview\n\tvar value: Dictionary = view.value.duplicate(true)\n\tvalue.actions = ["reveal"]\n',
              '\tvar view: Dictionary = _pull_scene(physical_token)\n\tif not view.get("ok", false): return view\n\tvar profile: Dictionary = _scene_board_profile()\n\tif not profile.get("ok", false): return profile\n\tvar value: Dictionary = view.value.duplicate(true)\n\tvalue.host = str(profile.value.difficulty_id)\n\tif value.get("phase") != "never_started": return _ok(value)\n\tvar preview: Dictionary = _scene_unstarted_board()\n\tif not preview.get("ok", false): return preview\n\tvalue.actions = ["reveal"]\n',
              'registered worksheet host',
          )

          subprocess.run(['git', 'add', '--all'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          paths = git('diff', '--cached', '--name-only').splitlines()
          allowed = {
              'scripts/application/minesweeper/MinesweeperBoardGenerationPort.gd',
              'scripts/application/run/DatingChallengeEnvelope.gd',
              'scripts/application/run/DatingPhysicalOwner.gd',
              'scripts/domain/minesweeper/MinesweeperBoardGenerator.gd',
              'tests/support/SceneChallengeFixture.gd',
              'tests/unit/test_scene_first_reveal.gd',
          }
          assert set(paths) == allowed, paths
          final_patch = subprocess.check_output(['git', 'diff', '--cached', '--binary'])
          (output / 'candidate-corrected.patch').write_bytes(final_patch)
          receipt = {
              'base': base,
              'controller': os.environ['CONTROLLER_SHA'],
              'inherited_run': 38092016425,
              'inherited_raw_patch_sha256': hashlib.sha256(raw).hexdigest(),
              'decoded_patch_sha256': hashlib.sha256(decoded).hexdigest(),
              'corrected_patch_sha256': hashlib.sha256(final_patch).hexdigest(),
              'decoded_tab_escapes': tab_escapes,
              'collapsed_line_continuations': continuations,
              'corrections': [
                  'explicit GDScript duplicate types',
                  'historical random-forced preparation replay before explicit-cell replay',
                  'registered canonical worksheet host in panel projection',
              ],
              'paths': paths,
              'publication': 'disabled diagnostic',
          }
          (output / 'candidate-origin.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact Godot standard engine
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Engine archive hash mismatch' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive $archive $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -cne '4.6.3.stable.official.7d41c59c4') { throw "Unexpected engine: $version" }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{ version=$version; archive_sha256=$expected; console_sha256=(Get-FileHash $console -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content .godot/ci/engine.json -Encoding utf8

      - name: Import and freeze exact candidate
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Candidate import script error' }
          git restore --worktree -- project.godot
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Diagnose atomic first Challenge Reveal'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            source=(git rev-parse HEAD)
            tree=(git rev-parse 'HEAD^{tree}')
            parent=(git rev-parse HEAD^)
          } | ConvertTo-Json | Set-Content .godot/ci/candidate-commit.json -Encoding utf8

      - name: Focused owner and physical-save regression tests
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = 'Stop'
          $runner = './tools/testing/Invoke-IsolatedGodot.ps1'
          $failed = $false
          $tests = @(
            @('first-reveal','tests/unit/test_scene_first_reveal.gd'),
            @('absence','tests/unit/test_scene_absence.gd'),
            @('playable-preparation','tests/unit/test_scene_playable_preparation.gd'),
            @('checkpoint','tests/unit/test_scene_checkpoint_ack.gd')
          )
          foreach ($entry in $tests) {
            $name = $entry[0]
            $script = $entry[1]
            $args = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://$script",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$name.xml")
            & $runner -SuiteId "scene-$name" -LogName "$name.log" -GodotArgs $args -EvidenceLogPath ".godot/ci/$name.jsonl" -TimeoutSeconds 300
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          foreach ($mode in @('normal','dropped_ack','native_refusal')) {
            $child = if ($mode -eq 'normal') { 'create' } else { $mode }
            $create = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',"-gtest=res://tests/integration/test_scene_playable_$child.gd",'-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$mode-create.xml")
            $load = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/integration/test_scene_playable_load.gd','-gexit','-glog=2',"-gjunit_xml_file=res://.godot/ci/$mode-load.xml")
            & $runner -SuiteId "playable-$mode" -LogName "$mode-create.log" -GodotArgs $create -NextLogName "$mode-load.log" -NextGodotArgs $load -EvidenceLogPath ".godot/ci/$mode.jsonl" -TimeoutSeconds 240 -KeepRoot
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'One or more focused engine children failed' }

      - name: Verify executed census and source identity
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections
          import json
          import pathlib
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          out = pathlib.Path('.godot/ci')
          suites = {
              'first-reveal':'tests/unit/test_scene_first_reveal.gd',
              'absence':'tests/unit/test_scene_absence.gd',
              'playable-preparation':'tests/unit/test_scene_playable_preparation.gd',
              'checkpoint':'tests/unit/test_scene_checkpoint_ack.gd',
          }
          for mode in ['normal','dropped_ack','native_refusal']:
              suites[mode+'-create'] = 'tests/integration/test_scene_playable_'+('create' if mode=='normal' else mode)+'.gd'
              suites[mode+'-load'] = 'tests/integration/test_scene_playable_load.gd'
          counts = {}
          for lane, script in suites.items():
              expected = re.findall(r'^func (test_\w+)\(', pathlib.Path(script).read_text(encoding='utf-8'), re.M)
              root = ET.parse(out/(lane+'.xml')).getroot()
              rows = list(root.iter('testcase'))
              assert collections.Counter(r.attrib['name'] for r in rows) == collections.Counter(expected), (lane, 'census')
              assert rows and all(r.attrib.get('classname') == script and r.attrib.get('status') == 'pass' and int(r.attrib.get('assertions','0')) > 0 for r in rows), lane
              assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped']), lane
              log = pathlib.Path('.godot/phase2r_logs')/(lane+'.log')
              text = log.read_text(encoding='utf-8-sig')
              assert not re.search(r'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character', text), lane
              counts[lane] = {'cases':len(rows), 'assertions':sum(int(r.attrib['assertions']) for r in rows)}
          assert not subprocess.check_output(['git','diff','--name-only'], text=True).strip()
          assert not subprocess.check_output(['git','diff','--cached','--name-only'], text=True).strip()
          result = {
              'status':'passed',
              'source':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'lanes':counts,
              'total_cases':sum(v['cases'] for v in counts.values()),
              'total_xml_assertions':sum(v['assertions'] for v in counts.values()),
              'scope':'diagnostic owner first-Reveal transaction plus prior real-file playable save/Load regressions; no publication and no rendered fixed-panel acceptance',
          }
          (out/'gate.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain evidence on every outcome
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import json
          import pathlib
          import subprocess
          out = pathlib.Path('.godot/ci')
          out.mkdir(parents=True, exist_ok=True)
          (out/'final-status.txt').write_text(subprocess.run(['git','status','--porcelain'],capture_output=True,text=True).stdout, encoding='utf-8')
          files = {}
          for root in [out, pathlib.Path('.godot/phase2r_logs')]:
              if root.exists():
                  for p in root.rglob('*'):
                      if p.is_file() and p.name != 'retained-hashes.json' and 'import-user' not in p.parts:
                          files[p.as_posix()] = {'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          (out/'retained-hashes.json').write_text(json.dumps(files, indent=2), encoding='utf-8')
          '@ | python -

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-first-reveal-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/import-user
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
