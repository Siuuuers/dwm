name: Windows automated tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-scope:
    name: Select current change coverage
    runs-on: ubuntu-24.04
    outputs:
      dtl_first: ${{ steps.scope.outputs.dtl_first }}
      dtl_content: ${{ steps.scope.outputs.dtl_content }}
      inline_audio: ${{ steps.scope.outputs.inline_audio }}
      reading_layout: ${{ steps.scope.outputs.reading_layout }}
      readability: ${{ steps.scope.outputs.readability }}
      bilingual_reading: ${{ steps.scope.outputs.bilingual_reading }}
      dialogue_library: ${{ steps.scope.outputs.dialogue_library }}
      focused: ${{ steps.scope.outputs.focused }}
      comparison: ${{ steps.scope.outputs.comparison }}
      playtest_polish: ${{ steps.scope.outputs.playtest_polish }}
      self_talk: ${{ steps.scope.outputs.self_talk }}
      shop_cosmetics: ${{ steps.scope.outputs.shop_cosmetics }}
      save_ink: ${{ steps.scope.outputs.save_ink }}
      scene_transition: ${{ steps.scope.outputs.scene_transition }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # Coverage selection needs trees and a few lazily read source blobs, not assets.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/windows-tests.yml
            /tools/testing/test_windows_coverage.py
            /tools/testing/Invoke-CloudTests.ps1
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Verify coverage selection
        run: python tools/testing/test_windows_coverage.py
      - name: Select narrow runtime coverage or full validation
        id: scope
        shell: python
        run: |
          import io, json, os, re, subprocess, zipfile
          with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
              event = json.load(event_file)
          base = event.get("pull_request", {}).get("base", {}).get("sha") or event.get("before", "")
          allowed = {
              "scripts/narrative/DialogicRuntimeAdapter.gd",
              "scripts/ui/BackupApp.gd",
              "autoload/ProfileManager.gd",
              "tests/unit/test_profile_parse_reuse.gd",
              "tests/unit/test_scene_compiler_cache.gd",
              "tests/unit/test_backup_presentation.gd",
              "tests/unit/test_production_pause_controller.gd",
              "tools/testing/Invoke-CloudTests.ps1",
              "tools/testing/Invoke-StartupLoadComparison.ps1",
              ".github/workflows/windows-tests.yml",
          }
          methods = {
              "scripts/narrative/DialogicRuntimeAdapter.gd": "_compile_scene_programme_observed_body",
              "scripts/ui/BackupApp.gd": "_on_projection_changed",
              "autoload/ProfileManager.gd": "_profile_text_validator",
          }
          def unchanged_outside_method(path, method):
              bodies = []
              pattern = rb"(?ms)^(?:static )?func " + method.encode() + rb"\([^\n]*\n.*?(?=^(?:static )?func |\Z)"
              for ref in (base, "HEAD"):
                  source = subprocess.run(["git", "show", ref + ":" + path], capture_output=True)
                  if source.returncode != 0:
                      return False
                  rest, count = re.subn(pattern, b"", source.stdout)
                  if count != 1:
                      return False
                  if path == "autoload/ProfileManager.gd":
                      state = (b'const _PROFILE_PARSE_MAX_BYTES := 1024 * 1024\n'
                               b'var _profile_parsed_text := ""\n'
                               b'var _profile_parsed_document: Dictionary = {}\n\n')
                      if rest.count(state) > 1:
                          return False
                      rest = rest.replace(state, b"")
                  bodies.append(rest)
              return bodies[0] == bodies[1]
          dtl_first = False
          dtl_content = False
          inline_audio = False
          reading_layout = False
          readability = False
          bilingual_reading = False
          dialogue_library = False
          playtest_polish = False
          self_talk = False
          shop_cosmetics = False
          save_ink = False
          scene_transition = False
          focused = False
          comparison = False
          previous = ""
          if os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch" and base and set(base) != {"0"}:
              diff = subprocess.run(["git", "diff", "--name-only", "-z", base, "HEAD"], capture_output=True)
              if diff.returncode == 0:
                  paths = set(diff.stdout.decode().strip("\0").split("\0"))
                  # DTL authoring changes cross compiler, save and renderer owners.
