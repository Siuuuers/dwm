name: Composed scene app and desktop proof
on:
  pull_request:
permissions:
  contents: write
  actions: read
concurrency:
  group: scene-runtime-integration-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  apps:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve immutable checkout bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: true
      - uses: actions/checkout@v7
        with:
          ref: 665971ffc25bf6acd5e393ac37c6cf627a33c545
          path: source
          fetch-depth: 0
          persist-credentials: true
      - name: Compose exact reviewed C26 delta on current A without moving product
        run: |
          $ErrorActionPreference = 'Stop'
          python ../controller/tools/cloud/scene_app_composition.py compose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -cne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'Godot archive checksum mismatch.' }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          $exeHash = (Get-FileHash -LiteralPath $console -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($exeHash -cne '63b3b2208819714c9677fbfdd8217c5b7dee8ecf5f383502e826bc9e2227ff5a') { throw 'Godot console checksum mismatch.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $version = (& $console --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -cne '4.6.3.stable.official.7d41c59c4') { throw 'Wrong engine version.' }
          [ordered]@{archive_sha256=$archiveHash; console_sha256=$exeHash; version=$version} | ConvertTo-Json | Set-Content '.godot/ci/engine-receipt.json' -Encoding utf8
      - name: Import exact composed source
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $output = Join-Path $root '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $root --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -LiteralPath "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Import script error.' }
      - name: Restore committed project settings
        if: always()
        run: |
          git restore --source=HEAD --worktree -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain only the four normal engine-imported test UID companions
        run: |
          python ../controller/tools/cloud/scene_app_composition.py uids
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run the exact ten app and eight desktop cases together
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue
          $tests = 'res://tests/integration/test_scene_app_preparation.gd,res://tests/integration/test_scene_desktop_consumer.gd'
          $args = @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', "-gtest=$tests", '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/apps.xml')
          & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'scene-app-composed' -LogName 'scene-app-composed.log' -EvidenceLogPath '.godot/ci/apps.jsonl' -TimeoutSeconds 600 -GodotArgs $args
          $result = $LASTEXITCODE
          $log = '.godot/phase2r_logs/scene-app-composed.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
          if ($result -ne 0) { exit $result }
          if (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Test script error.' }
      - name: Check exact XML census and source, publish isolated candidate only
        run: |
          python ../controller/tools/cloud/scene_app_composition.py census
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Hash original evidence
        if: always()
        run: |
          python ../controller/tools/cloud/scene_app_composition.py manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload original logs, JUnit and composed source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-app-composed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci/*.log
            source/.godot/ci/*.json
            source/.godot/ci/*.jsonl
            source/.godot/ci/*.xml
            source/.godot/ci/*.patch
            source/.godot/ci/*.zip
            source/.godot/phase2r_logs/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Prepare disposable indexes for checkout cleanup
        if: always()
        run: |
          foreach ($repo in @('.', '../controller')) {
            if (-not (Test-Path -LiteralPath "$repo/.git")) { continue }
            git -C $repo update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $repo submodule foreach --recursive 'true'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  retain:
    needs: apps
    if: needs.apps.result == 'success'
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: evidence
    steps:
      - name: Preserve exact bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: true
      - uses: actions/checkout@v7
        with:
          ref: c8fa301d5888d83c021a9963bc78b2f8e03cdbe4
          path: evidence
          persist-credentials: true
      - name: Retain original ZIP and verify every manifest member without rerunning engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ../controller/tools/cloud/scene_app_composition.py retain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent retention receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-app-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/evidence/scene_app_composed_2026_10_10/retention-verification.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare disposable indexes for checkout cleanup
        if: always()
        run: |
          foreach ($repo in @('.', '../controller')) {
            if (-not (Test-Path -LiteralPath "$repo/.git")) { continue }
            git -C $repo update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $repo submodule foreach --recursive 'true'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
