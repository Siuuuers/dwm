                      'evidence/phase_2r/runtime/game_state_surface.json',
                      'evidence/phase_2r/runtime/save_manager_surface.json',
                      'scripts/application/narrative/SaveManagerNarrativeCheckpointPort.gd',
                      'scripts/application/restore/NarrativeRestoreParticipant.gd',
                      'scripts/data/ArtManifest.gd',
