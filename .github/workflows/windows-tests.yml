                  focused = bool(paths) and "" not in paths and paths <= allowed
                  if focused:
                      focused = all(unchanged_outside_method(path, method)
                                    for path, method in methods.items() if path in paths)
          # The archived benchmark is valid only for its exact saved member contract.
          # Current native Save/Load and terminal fixtures qualify incompatible schemas;
          # skipping this old-input measurement does not establish a speedup.
          comparison = comparison or (focused and not previous)
          if dtl_content or dtl_first or reading_layout or readability or bilingual_reading or dialogue_library or playtest_polish or self_talk or shop_cosmetics or scene_transition or save_ink: comparison = False
