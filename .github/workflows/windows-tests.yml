          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_font_choices.gd
          grep 'FONT_CHOICES_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 30, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 30 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload font-choice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-choices-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/font-choices/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Audit all UI literal ownership
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          output="$GITHUB_WORKSPACE/.godot/ci/ui-literal-audit"
          mkdir -p "$output"
          status=0
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" \
            --log-file "$output/audit.log" --script res://tools/localization/UiLiteralAudit.gd || status=$?
          cp evidence/phase_2r/localization/{ui_literal_disposition,script_ui_disposition}.json "$output/"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$output/audit.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['GITHUB_WORKSPACE']) / '.godot/ci/ui-literal-audit'
          for name in ('ui_literal_disposition.json', 'script_ui_disposition.json'):
              report = json.loads((output / name).read_text())
              assert not report['failures'], report['failures']
              assert report['records'], name
          print('UI_LITERAL_AUDIT_VERIFIED')
          PY
      - name: Upload UI literal audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-literal-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/ui-literal-audit/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
