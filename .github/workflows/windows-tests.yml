name: Verify original scene app teardown evidence
on:
  pull_request:
permissions:
  contents: write
  actions: read
concurrency:
  group: scene-runtime-integration-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-and-retain:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: evidence
    steps:
      - name: Preserve original bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
          persist-credentials: true
      - uses: actions/checkout@v7
        with:
          ref: 69a5cdd70261692b7f1b1e2d4550155141ca6375
          path: source
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/checkout@v7
        with:
          ref: codex/scene-runtime-evidence-20261009
          path: evidence
          persist-credentials: true
      - name: Verify original artifacts, exact source, census and settled snapshots without engine execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          python ../controller/tools/cloud/scene_app_teardown_retain.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload independent verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-app-teardown-independent-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/evidence/scene_app_teardown_2026_10_10/*/retention-verification.json
            evidence/evidence/scene_app_teardown_2026_10_10/*/independent-census.json
            evidence/evidence/scene_app_teardown_2026_10_10/*/retained-file-hashes.json
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare disposable indexes for checkout cleanup
        if: always()
        run: |
          foreach ($repo in @('.', '../source', '../controller')) {
            if (-not (Test-Path -LiteralPath "$repo/.git")) { continue }
            git -C $repo update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $repo submodule foreach --recursive 'true'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
