name: Cold board-null Load layout diagnostic
'on':
  push:
    branches:
    - codex/cold-layout-cloud-20261002
permissions:
  contents: read
concurrency:
  group: cold-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cold-layout-journey:
    name: Rendered cold board-null Load / reading journey and UI literal audit
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/playable-journeys
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        ref: 638f2aab3cbceaa13729793760dfc85dc8842e93
        fetch-depth: 0
    - name: Prepare disposable checkout for credential cleanup
      run: 'git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        git submodule foreach --recursive ''true''

        '
    - name: Install Godot and software display
      timeout-minutes: 12
      run: 'sudo apt-get update

        sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2
        speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng

        archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"

        curl --fail --location --retry 3 ''https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip''
        --output "$archive"

        printf ''%s  %s\n'' ''d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3'' "$archive" | sha256sum --check

        unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"

        editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"

        chmod +x "$editor"

        echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"

        "$editor" --version

        '
    - name: Start and verify native Linux speech service
      timeout-minutes: 2
      run: bash tools/testing/start_cloud_speech.sh
    - name: Upload native speech environment evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/cloud-speech/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Import project
      timeout-minutes: 8
      run: "mkdir -p \"$DWM_RENDER_OUTPUT\" \"$XDG_DATA_HOME\" \"$DWM_TEST_ROOT\"\n\"$GODOT_CONSOLE_PATH\" --headless --path\
        \ \"$GITHUB_WORKSPACE\" --import --log-file \"$DWM_RENDER_OUTPUT/import.log\"\nif grep -E 'SCRIPT ERROR:|ERROR: Failed\
        \ to load|Unicode parsing error|Unexpected NUL character' \"$DWM_RENDER_OUTPUT/import.log\"; then\n  exit 1\nfi\n\
        # Dialogic's editor scan rewrites its timeline lookup during import.\ngit restore -- project.godot\n"
    - name: Exercise real Solo reading Save and fresh-process Load
      timeout-minutes: 25
      run: python3 tools/testing/run_reading_rail_journey.py
    - name: Upload Solo reading reports, exact save bytes and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reading-rail-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/reading-rail/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Upload project import evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playable-journeys-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/playable-journeys/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Audit all UI literal ownership
      if: ${{ !cancelled() }}
      timeout-minutes: 3
      run: "output=\"$GITHUB_WORKSPACE/.godot/ci/ui-literal-audit\"\nmkdir -p \"$output\"\nstatus=0\n\"$GODOT_CONSOLE_PATH\"\
        \ --headless --path \"$GITHUB_WORKSPACE\" \\\n  --log-file \"$output/audit.log\" --script res://tools/localization/UiLiteralAudit.gd\
        \ || status=$?\ncp evidence/phase_2r/localization/{ui_literal_disposition,script_ui_disposition}.json \"$output/\"\
        \nif [ \"$status\" -ne 0 ]; then exit \"$status\"; fi\nif grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing\
        \ error|Unexpected NUL character' \"$output/audit.log\"; then\n  exit 1\nfi\npython3 - <<'PY'\nimport json, os\nfrom\
        \ pathlib import Path\noutput = Path(os.environ['GITHUB_WORKSPACE']) / '.godot/ci/ui-literal-audit'\nfor name in ('ui_literal_disposition.json',\
        \ 'script_ui_disposition.json'):\n    report = json.loads((output / name).read_text())\n    assert not report['failures'],\
        \ report['failures']\n    assert report['records'], name\nprint('UI_LITERAL_AUDIT_VERIFIED')\nPY\n"
    - name: Upload UI literal audit evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-literal-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/ui-literal-audit/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
