        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then
            exit 1
          fi
          # Dialogic's editor scan rewrites its timeline lookup during import.
          git restore -- project.godot
      - name: Render witnessed-version register fixtures
        timeout-minutes: 5
        env:
          DWM_GALLERY_REGISTER_OUTPUT: ${{ github.workspace }}/.godot/ci/gallery-version-register
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/gallery-version-register/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/gallery-version-register/test-root
        run: |
          mkdir -p "$DWM_GALLERY_REGISTER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          timeout 240s xvfb-run -a "$GODOT_CONSOLE_PATH" --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility --audio-driver Dummy --log-file "$DWM_GALLERY_REGISTER_OUTPUT/render.log" --script res://tests/ui/render_gallery_version_register.gd
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_GALLERY_REGISTER_OUTPUT/render.log"; then
            exit 1
          fi
          grep -E '^GALLERY_VERSION_REGISTER_RENDER_VERIFIED tuples=18 evidence=' "$DWM_GALLERY_REGISTER_OUTPUT/render.log"
      - name: Upload witnessed-version register evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-version-register-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/gallery-version-register/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Render admitted Gallery caption collection
        timeout-minutes: 5
        env:
          DWM_GALLERY_COLLECTION_OUTPUT: ${{ github.workspace }}/.godot/ci/gallery-caption-collection
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/gallery-caption-collection/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/gallery-caption-collection/test-root
        run: |
          mkdir -p "$DWM_GALLERY_COLLECTION_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          timeout 240s xvfb-run -a "$GODOT_CONSOLE_PATH" --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility --audio-driver Dummy --log-file "$DWM_GALLERY_COLLECTION_OUTPUT/render.log" --script res://tests/ui/render_gallery_caption_collection.gd -- --phase2r-bootstrap-mode=final
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_GALLERY_COLLECTION_OUTPUT/render.log"; then
            exit 1
          fi
          grep -E '^GALLERY_CAPTION_COLLECTION_RENDER_VERIFIED' "$DWM_GALLERY_COLLECTION_OUTPUT/render.log"
      - name: Upload Gallery caption collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-caption-collection-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/gallery-caption-collection/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  rendered-desktop:
    needs: test-scope
    if: needs.test-scope.outputs.focused != 'true' && needs.test-scope.outputs.inline_audio != 'true'
    name: Rendered desktop and dialogue / Linux software OpenGL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/render-user/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/render-user/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/desktop-scaling
    steps:
      - uses: actions/checkout@v7
        with:
          # Same disposable-index workaround as the Windows jobs above.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Install Godot and software display
        timeout-minutes: 12
        run: |
          # The runner Azure mirror repeatedly exceeded this install budget.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$archive"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"
          editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$editor"
          echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"
          "$editor" --version
      - name: Start and verify native Linux speech service
        timeout-minutes: 2
        run: bash tools/testing/start_cloud_speech.sh
      - name: Upload native speech environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/cloud-speech/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Import project
        id: desktop-import
        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then
            exit 1
          fi
          # Dialogic's editor scan rewrites its timeline lookup during import.
          git restore -- project.godot
      - name: Render and verify desktop scaling
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_desktop_scaling.gd
          grep 'DESKTOP_SCALING_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 38, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 38 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-scaling-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/desktop-scaling/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Render and verify delivery and dialogue
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' }}
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/delivery-dialogue-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/delivery-dialogue-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/delivery-dialogue
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_delivery_dialogue.gd
          grep 'DELIVERY_DIALOGUE_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 25, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 25 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload delivery and dialogue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-dialogue-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/delivery-dialogue/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Render and verify HUD retirement and retained shell
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' }}
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/angela-overlay-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/angela-overlay-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/angela-overlay
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_angela_overlay.gd
          grep 'HUD_RETIREMENT_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 10, report
          expected = {'wide-en100', 'narrow-en100', 'narrow-en150', 'narrow-en150-high-contrast', 'narrow-zh-CN150-high-contrast', 'narrow-zh-HK150', 'wide-zh-HK150', 'wide-en100-day1', 'wide-en100-day7', 'wide-en100-day7-high-contrast'}
          assert {sample['name'] for sample in report['evidence']} == expected, report
          assert all(sample['hud_absent'] is True for sample in report['evidence']), report
          captures = list(output.glob('*.png'))
          assert len(captures) == 10 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload HUD retirement and retained shell evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angela-overlay-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/angela-overlay/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Japanese and Korean catalogs
        id: desktop-catalogs
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' }}
        run: python3 tools/localization/validate_japanese_korean_catalogs.py
      - name: Render and verify Japanese and Korean UI
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' && steps.desktop-catalogs.outcome == 'success' }}
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/japanese-korean-ui-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/japanese-korean-ui-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/japanese-korean-ui
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$GODOT_CONSOLE_PATH" \
            --path "$GITHUB_WORKSPACE" --rendering-method gl_compatibility \
            --rendering-driver opengl3 --audio-driver Dummy \
            --log-file "$DWM_RENDER_OUTPUT/render.log" \
            --script res://tests/ui/render_japanese_korean_ui.gd
          grep 'JAPANESE_KOREAN_UI_RENDER_VERIFIED' "$DWM_RENDER_OUTPUT/render.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/render.log"; then
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          output = Path(os.environ['DWM_RENDER_OUTPUT'])
          report = json.loads((output / 'results.json').read_text())
          assert report['ok'] is True and not report['failures'], report
          assert report['renderer'] != 'headless', report
          assert report['samples'] == report['captures'] == 30, report
          captures = list(output.glob('*.png'))
          assert len(captures) == 30 and all(path.stat().st_size > 0 for path in captures)
          PY
      - name: Upload Japanese and Korean UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-korean-ui-render-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/japanese-korean-ui/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Render and verify font choices
        if: ${{ !cancelled() && steps.desktop-import.outcome == 'success' && steps.desktop-catalogs.outcome == 'success' }}
        timeout-minutes: 5
        env:
          XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/font-choices-user/data
          DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/font-choices-user/test-root
          DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/font-choices
        run: |
