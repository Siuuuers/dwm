# TEMPORARY WORKER B DIAGNOSTIC. Never merge this configuration into integration.
# Coordinator release: PR1 comment 5992027200. Dispatch requires a later exact run release.
# Restore .github/workflows/windows-tests.yml from cf58d436c897587813975274472061cdf7e4f8e2
# and verify Git blob 643ff7794f8f602fb261df583705e4475d5c9ee4 before a strict child PR.
name: Worker B inventory and native diagnostic (temporary)

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact diagnostic commit approved for this run (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-b-native-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker-b-diagnostic:
    name: Worker B / diagnostic only (not strict acceptance)
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      DWM_EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - name: Checkout the dispatched commit
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Retain existing cleanup ordering for the two legacy gitlinks.
          persist-credentials: true

      - name: Bind exact checkout and frozen sources; retain canonical workflow bytes
        id: identity
        shell: python {0}
        run: |
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path.cwd()
          out = root / '.godot/ci/worker-b-diagnostic'
          out.mkdir(parents=True, exist_ok=False)
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root)
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          base = 'cf58d436c897587813975274472061cdf7e4f8e2'
          workflow = '.github/workflows/windows-tests.yml'
          canonical = '643ff7794f8f602fb261df583705e4475d5c9ee4'
          head = git('rev-parse', 'HEAD').decode().strip()
          expected = os.environ.get('DWM_EXPECTED_HEAD', '')
          if (not re.fullmatch('[0-9a-f]{40}', expected) or head != expected
                  or head != os.environ['GITHUB_SHA']
                  or os.environ['GITHUB_REF'] != 'refs/heads/codex/parallel-reading-evidence'
                  or os.environ['GITHUB_REPOSITORY'] != 'Siuuuers/dwm'
                  or os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'):
              raise SystemExit('B_DIAGNOSTIC_CHECKOUT_NOT_RELEASED_TARGET')
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', base, head])
          changed = git('diff', '--name-only', base, head).decode().splitlines()
          if changed != [workflow]:
              raise SystemExit('B_DIAGNOSTIC_NON_WORKFLOW_COMMIT_DELTA: ' + repr(changed))
          frozen = {
              'tests/manual/verify_caption_native_accept.gd': '856c9b4a970dd15c53b0eb3a765f46e445df6b77',
              'tools/testing/Invoke-CaptionNativeAccept.ps1': 'a68c8fe5a2b1aba4cb8b5c28471409a4e6a2f43e',
              'tools/testing/Invoke-PublicSurfaceValidation.ps1': 'ad46c78cd5be9da80b650feae95b892d7798415d',
          }
          for name in [workflow, 'project.godot']:
              frozen[name] = git('rev-parse', head + ':' + name).decode().strip()
          records = {}
          for name, expected_blob in frozen.items():
              committed = git('rev-parse', head + ':' + name).decode().strip()
              data = (root / name).read_bytes()
              if committed != expected_blob or blob(data) != expected_blob:
                  raise SystemExit('B_DIAGNOSTIC_SOURCE_MISMATCH: ' + name)
              records[name] = {'git_blob': committed, 'sha256': hashlib.sha256(data).hexdigest()}
          restored = git('cat-file', 'blob', base + ':' + workflow)
          if blob(restored) != canonical:
              raise SystemExit('B_DIAGNOSTIC_CANONICAL_WORKFLOW_MISMATCH')
          (out / 'canonical-windows-tests.yml').write_bytes(restored)
          report = {
              'checkout': head, 'source_candidate': base, 'commit_changed_paths': changed,
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'ref': os.environ['GITHUB_REF'], 'event': os.environ['GITHUB_EVENT_NAME'],
              'frozen_files': records, 'canonical_workflow_blob': canonical,
              'canonical_workflow_sha256': hashlib.sha256(restored).hexdigest(),
              'scope': 'Temporary diagnostic; not a strict gate or an integration candidate',
          }
          (out / 'source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print('B_DIAGNOSTIC_SOURCE_BOUND ' + head)

      - name: Prepare disposable checkout for credential cleanup
        id: cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/worker-b-diagnostic'
          git status --porcelain --untracked-files=no | Set-Content "$output/status-before-cleanup.txt" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --raw | Set-Content "$output/index-after-cleanup.txt" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install pinned Godot 4.6.3 standard
        id: install
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version | Tee-Object -FilePath '.godot/ci/worker-b-diagnostic/godot-version.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Import project with isolated data roots and strict log checks
        id: import
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script or Unicode errors; inspect import.log.'
          }

      - name: Restore committed project settings after attempted import
        id: restore
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.import.outcome != 'skipped' }}
        run: |
          # Restoration is cleanup, not evidence that an unsuccessful import passed.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Regenerate and check BOTH runtime surface inventories
        id: inventories
        if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # Reuse the complete existing wrapper, including both generators/checks,
          # retirement audit, isolated processes, strict logs and recoverable payloads.
          pwsh -NoProfile -File ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads *>&1 |
            Tee-Object -FilePath '.godot/ci/worker-b-diagnostic/inventory-driver.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recheck frozen sources after generation and before native delivery
        id: pre_native
        if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
        shell: python {0}
        run: |
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          out = root / '.godot/ci/worker-b-diagnostic'
          source = json.loads((out / 'source.json').read_text(encoding='utf-8'))
          def git(*args):
              return subprocess.check_output(['git', *args], cwd=root)
          allowed = {'evidence/phase_2r/runtime/game_state_surface.json',
                     'evidence/phase_2r/runtime/save_manager_surface.json'}
          working = git('diff', '--name-only').decode().splitlines()
          staged = git('diff', '--cached', '--name-status').decode().splitlines()
          cleanup = ['D\t.claude/skills/godot-prompter/1.10.0', 'D\t.claude/skills/superpowers/6.1.1']
          changed_frozen = [name for name, record in source['frozen_files'].items()
                            if hashlib.sha256((root / name).read_bytes()).hexdigest() != record['sha256']]
          valid = set(working) <= allowed and sorted(staged) == cleanup and not changed_frozen
          report = {'ok': valid, 'working_changed_paths': working, 'staged_changes': staged,
                    'changed_frozen_files': changed_frozen,
                    'status_porcelain': git('status', '--porcelain', '--untracked-files=no').decode()}
          (out / 'pre-native-source.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          if not valid:
              raise SystemExit('B_DIAGNOSTIC_UNEXPECTED_SOURCE_MUTATION')

      - name: Run existing native-caption diagnostic once
        id: native
        # A generator failure stays a failed step/job. Native can independently
        # diagnose the frozen fixture only after successful import/restoration/custody.
        if: ${{ !cancelled() && steps.pre_native.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tools/testing/Invoke-CaptionNativeAccept.ps1 *>&1 |
            Tee-Object -FilePath '.godot/ci/worker-b-diagnostic/native-driver.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain independent outcomes and raw artifact hashes
        id: outcomes
        if: ${{ always() }}
        timeout-minutes: 2
        shell: python {0}
        env:
          DWM_STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          out = root / '.godot/ci/worker-b-diagnostic'
          out.mkdir(parents=True, exist_ok=True)
          steps = json.loads(os.environ['DWM_STEPS_JSON'])
          required = ['checkout', 'identity', 'cleanup', 'install', 'import', 'restore',
                      'inventories', 'pre_native', 'native']
          complete = all(steps.get(name, {}).get('outcome') == 'success' for name in required)
          report = {'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'dispatch_sha': os.environ['GITHUB_SHA'], 'expected_head': os.environ.get('DWM_EXPECTED_HEAD'),
                    'steps': steps, 'required_steps': required, 'all_diagnostic_steps_succeeded': complete,
                    'classification': 'DIAGNOSTIC_ONLY' if complete else 'FAILED_OR_INCOMPLETE_DIAGNOSTIC',
                    'strict_acceptance': False, 'scope': 'Step snapshot before artifact upload and post-job cleanup'}
          (out / 'outcomes.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          # Raw working inventories may be old/partial after failure. Keep that label;
          # only the wrapper's checked copies/payloads describe completed generation.
          snapshots = out / 'raw-working-inventories'
          snapshots.mkdir(exist_ok=True)
          for target in ['game_state', 'save_manager']:
              path = root / ('evidence/phase_2r/runtime/' + target + '_surface.json')
              if path.is_file():
                  (snapshots / path.name).write_bytes(path.read_bytes())
          files = set()
          for folder in [out, root / '.godot/ci/public-surfaces', root / '.godot/ci/caption-native']:
              if folder.is_dir():
                  files.update(path for path in folder.rglob('*') if path.is_file())
          files.update(root.glob('.godot/phase2r_logs/cloud-public-surface-*.log*'))
          import_log = root / '.godot/ci/import.log'
          if import_log.is_file():
              files.add(import_log)
          manifest = [{'path': path.relative_to(root).as_posix(), 'bytes': path.stat().st_size,
                       'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
                      for path in sorted(files) if path.name != 'artifact-files.sha256.json']
          (out / 'artifact-files.sha256.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'classification': report['classification'], 'strict_acceptance': False}))
          if not complete:
              raise SystemExit('B_DIAGNOSTIC_FAILED_OR_INCOMPLETE; retained outcomes are not acceptance')

      - name: Upload diagnostic evidence even after failure
        id: artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: worker-b-native-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/import.log
            .godot/ci/worker-b-diagnostic/
            .godot/ci/public-surfaces/
            .godot/ci/caption-native/
            .godot/phase2r_logs/cloud-public-surface-*.log*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
