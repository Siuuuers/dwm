name: Scene playable repaired physical save and fresh Load
on:
  pull_request:
    paths:
      - 'tools/cloud/scene-playable-candidate.json'
      - 'tools/cloud/scene-playable-diagnostics.patch'
      - '.github/workflows/windows-tests.yml'
permissions:
  contents: write
concurrency:
  group: scene-runtime-integration-controller-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  playable:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm' && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      BASE_SHA: 69a5cdd70261692b7f1b1e2d4550155141ca6375
      CONTROLLER_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_SHA: ${{ github.sha }}
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller
      - uses: actions/checkout@v7
        with:
          ref: 69a5cdd70261692b7f1b1e2d4550155141ca6375
          path: source
          fetch-depth: 0
      - name: Apply pinned original and evidenced route repair
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base=os.environ['BASE_SHA']
          assert git('rev-parse','HEAD')==base
          assert git('ls-remote','origin','refs/heads/codex/scene-runtime-integration-20261009').split()[0]==base, 'A advanced; reconcile'
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          payload=json.loads(pathlib.Path('../controller/tools/cloud/scene-playable-candidate.json').read_text())
          patch=gzip.decompress(base64.b64decode(payload['patch_gzip_base64'],validate=True))
          assert payload['base']==base
          assert hashlib.sha256(patch).hexdigest()==payload['patch_sha256']=='1d6cb95788894ef8a95f8525c500b95f97c004f0305c95e1f86f9b428ca63335'
