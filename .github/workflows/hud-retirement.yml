name: Isolated HUD retirement
'on':
  push:
    branches:
    - codex/hud-retirement-controller-20261008
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        ref: 5269dc80a1b66bebd49f13482ee5d13a0a986d98
        persist-credentials: true
    - name: Prepare disposable checkout for credential cleanup
      run: '$ErrorActionPreference = ''Stop''

        # These legacy tooling gitlinks have no .gitmodules URLs. Git''s

        # submodule foreach reads the index even with sparse checkout.

        # The source commit and working files remain unchanged.

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git submodule foreach --recursive ''true''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri\
        \ 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile\
        \ $archive\n# SHA256 published with the official 4.6.3-stable release asset.\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\n\
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot\
        \ archive checksum mismatch.'\n}\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\nif (-not\
        \ (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }\n\"GODOT_CONSOLE_PATH=$console\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n$executableHash = (Get-FileHash -LiteralPath $console\
        \ -Algorithm SHA256).Hash.ToLowerInvariant()\nif ($executableHash -cne '63b3b2208819714c9677fbfdd8217c5b7dee8ecf5f383502e826bc9e2227ff5a')\
        \ { throw 'Godot executable checksum mismatch.' }\n& $console --version\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE\
        \ }\n"
    - name: Record and verify source engine controller run identity BEFORE import
      run: '$ErrorActionPreference = ''Stop''

        New-Item -ItemType Directory -Force -Path .godot/ci | Out-Null

        if ((git rev-parse HEAD) -cne ''5269dc80a1b66bebd49f13482ee5d13a0a986d98'') { throw ''source mismatch'' }

        if ((git rev-parse ''HEAD^{tree}'') -cne ''571323aec818f4c620e9fc59fe8eccd0bbc60c00'') { throw ''tree mismatch'' }

        if (git diff --name-only) { throw ''tracked source differs before import'' }

        [ordered]@{source=(git rev-parse HEAD); tree=(git rev-parse ''HEAD^{tree}''); controller=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID;
        attempt=$env:GITHUB_RUN_ATTEMPT; executable=$env:GODOT_CONSOLE_PATH; executable_sha256=(Get-FileHash $env:GODOT_CONSOLE_PATH
        -Algorithm SHA256).Hash.ToLowerInvariant(); version=(& $env:GODOT_CONSOLE_PATH --version)} | ConvertTo-Json | Set-Content
        .godot/ci/identity.json

        Get-Content .godot/ci/identity.json

        '
    - name: Import project
      timeout-minutes: 8
      run: "$ErrorActionPreference = 'Stop'\n$output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'\n$env:APPDATA = Join-Path\
        \ $output 'import-user/appdata'\n$env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'\n$env:DWM_TEST_ROOT\
        \ = Join-Path $output 'import-user/test-root'\nNew-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA,\
        \ $env:DWM_TEST_ROOT | Out-Null\n& $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file\
        \ \"$output/import.log\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nif (Select-String -Path \"$output/import.log\"\
        \ -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {\n  throw\
        \ 'Project import reported script errors; inspect import.log.'\n}\n"
    - name: Restore committed project settings after editor import
      run: '# Dialogic''s editor scan rewrites its timeline lookup during import.

        # Execute the committed configuration with the freshly imported assets.

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Run affected desktop integration and shell suites
      timeout-minutes: 12
      run: './tools/testing/Invoke-CloudTests.ps1 -Suite desktop

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Check committed public inventories without regeneration
      run: './tools/testing/Invoke-PublicSurfaceValidation.ps1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Verify source changes limited to declared generated outputs
      run: '$allowed = @(''evidence/phase_2r/runtime/game_state_surface.json'',''evidence/phase_2r/runtime/save_manager_surface.json'')

        $changed = @(git diff --name-only)

        foreach ($path in $changed) { if ($path -notin $allowed) { throw "unexpected tracked change: $path" } }

        if (''check'' -eq ''check'' -and $changed.Count -ne 0) { throw ''final tracked source changed'' }

        '
    - name: Hash original evidence even on failure
      if: always()
      run: '$ErrorActionPreference = ''Stop''

        New-Item -ItemType Directory -Force -Path .godot/ci | Out-Null

        $paths = @(''.godot/ci'', ''.godot/phase2r_logs'', ''.godot/phase2r_tests'', ''evidence/phase_2r/runtime/game_state_surface.json'',
        ''evidence/phase_2r/runtime/save_manager_surface.json'')

        $files = @($paths | Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem -File -Recurse -Force $_ } | Sort-Object
        FullName)

        $manifest = @($files | ForEach-Object { [ordered]@{path=[IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE,$_.FullName).Replace(''\'',''/'');
        bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })

        $manifest | ConvertTo-Json -Depth 4 | Set-Content .godot/ci/original-file-hashes.json

        '
    - name: Retain original logs reports and hashes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hud-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/

          .godot/phase2r_logs/

          .godot/phase2r_tests/

          evidence/phase_2r/runtime/game_state_surface.json

          evidence/phase_2r/runtime/save_manager_surface.json

          '
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
  render:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/import-user/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/import-user/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/angela-overlay
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        ref: 5269dc80a1b66bebd49f13482ee5d13a0a986d98
        fetch-depth: 0
    - name: Prepare disposable checkout for credential cleanup
      run: 'git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        git submodule foreach --recursive ''true''

        '
    - name: Record exact product and controller identity
      run: 'mkdir -p .godot/ci

        python3 - <<''CHECK''

        import subprocess,json,os,pathlib

        source=subprocess.check_output([''git'',''rev-parse'',''HEAD''],text=True).strip()

        tree=subprocess.check_output([''git'',''rev-parse'',''HEAD^{tree}''],text=True).strip()

        assert source == "5269dc80a1b66bebd49f13482ee5d13a0a986d98" and tree == "571323aec818f4c620e9fc59fe8eccd0bbc60c00"

        assert not subprocess.check_output([''git'',''diff'',''--name-only''],text=True)

        pathlib.Path(''.godot/ci/identity.json'').write_text(json.dumps(dict(source=source,tree=tree,controller=os.environ[''GITHUB_SHA''],run=os.environ[''GITHUB_RUN_ID''],attempt=os.environ[''GITHUB_RUN_ATTEMPT'']),indent=2))

        CHECK

        '
    - name: Install Godot and software display
      timeout-minutes: 12
      run: 'sudo apt-get update

        sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2
        speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng

        archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"

        curl --fail --location --retry 3 ''https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip''
        --output "$archive"

        printf ''%s  %s\n'' ''d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3'' "$archive" | sha256sum --check

        unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"

        editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"

        chmod +x "$editor"

        echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"

        "$editor" --version

        '
    - name: Import project
      timeout-minutes: 8
      run: "mkdir -p \"$DWM_RENDER_OUTPUT\" \"$XDG_DATA_HOME\" \"$DWM_TEST_ROOT\"\n\"$GODOT_CONSOLE_PATH\" --headless --path\
        \ \"$GITHUB_WORKSPACE\" --import --log-file \"$DWM_RENDER_OUTPUT/import.log\"\nif grep -E 'SCRIPT ERROR:|ERROR: Failed\
        \ to load|Unicode parsing error|Unexpected NUL character' \"$DWM_RENDER_OUTPUT/import.log\"; then\n  exit 1\nfi\n\
        # Dialogic's editor scan rewrites its timeline lookup during import.\ngit restore -- project.godot\n"
    - name: Render and verify HUD retirement and retained shell
      timeout-minutes: 5
      env:
        XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/angela-overlay-user/data
        DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/angela-overlay-user/test-root
        DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/angela-overlay
      run: "mkdir -p \"$DWM_RENDER_OUTPUT\" \"$XDG_DATA_HOME\" \"$DWM_TEST_ROOT\"\nxvfb-run -a -s '-screen 0 1920x1080x24'\
        \ \"$GODOT_CONSOLE_PATH\" \\\n  --path \"$GITHUB_WORKSPACE\" --rendering-method gl_compatibility \\\n  --rendering-driver\
        \ opengl3 --audio-driver Dummy \\\n  --log-file \"$DWM_RENDER_OUTPUT/render.log\" \\\n  --script res://tests/ui/render_angela_overlay.gd\n\
        grep 'HUD_RETIREMENT_RENDER_VERIFIED' \"$DWM_RENDER_OUTPUT/render.log\"\nif grep -E 'SCRIPT ERROR:|ERROR: Failed to\
        \ load|Unicode parsing error|Unexpected NUL character' \"$DWM_RENDER_OUTPUT/render.log\"; then\n  exit 1\nfi\npython3\
        \ - <<'PY'\nimport json, os\nfrom pathlib import Path\noutput = Path(os.environ['DWM_RENDER_OUTPUT'])\nreport = json.loads((output\
        \ / 'results.json').read_text())\nassert report['ok'] is True and not report['failures'], report\nassert report['renderer']\
        \ != 'headless', report\nassert report['samples'] == report['captures'] == 10, report\nexpected = {'wide-en100', 'narrow-en100',\
        \ 'narrow-en150', 'narrow-en150-high-contrast', 'narrow-zh-CN150-high-contrast', 'narrow-zh-HK150', 'wide-zh-HK150',\
        \ 'wide-en100-day1', 'wide-en100-day7', 'wide-en100-day7-high-contrast'}\nassert {sample['name'] for sample in report['evidence']}\
        \ == expected, report\nassert all(sample['hud_absent'] is True for sample in report['evidence']), report\ncaptures\
        \ = list(output.glob('*.png'))\nassert len(captures) == 10 and all(path.stat().st_size > 0 for path in captures)\n\
        PY\n"
    - name: Upload HUD retirement and retained shell evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: angela-overlay-render-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/angela-overlay/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Verify tracked source remains unchanged
      run: test -z "$(git diff --name-only)"
    - name: Hash original render files
      if: always()
      run: 'python3 - <<''HASH''

        from pathlib import Path

        import hashlib,json

        base=Path(''.godot/ci'');base.mkdir(parents=True,exist_ok=True)

        rows=[dict(path=p.as_posix(),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(base.rglob(''*''))
        if p.is_file()]

        (base/''original-file-hashes.json'').write_text(json.dumps(rows,indent=2))

        HASH

        '
    - name: Retain source identity and original render reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hud-render-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 14
