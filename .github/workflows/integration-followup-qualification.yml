name: Integration followup qualification
on:
  pull_request:
    paths:
      - '.github/workflows/integration-followup-qualification.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: integration-followup-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  authority-audit:
    name: Windows / Integration followup qualification
    if: github.head_ref == 'codex/story-day-qualification-20261023'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: a8d9838207db24a7837417eb895a5b1ed656262b
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne 'a8d9838207db24a7837417eb895a5b1ed656262b') { throw 'Candidate mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -cne '0b50482e5881c92511354dead9f1db629a8b7e28') { throw 'Candidate tree mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='a8d9838207db24a7837417eb895a5b1ed656262b'; tree=(git rev-parse 'HEAD^{tree}'); controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; event='${{ github.sha }}'; run_id='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          $importExit = $LASTEXITCODE
          @{exit_code=$importExit} | ConvertTo-Json | Set-Content "$output/import-process.json"
          if ($importExit -ne 0) { exit $importExit }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record imported UID provenance
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,pathlib,subprocess
          paths=['tests/unit/test_witnessed_transport_rail.gd', 'tests/unit/test_minesweeper_view_controls.gd', 'tests/unit/test_gallery_typography.gd', 'tests/unit/test_font_styles.gd', 'tests/integration/test_application_bootstrap.gd', 'tests/integration/test_cold_run_rollback.gd', 'tests/unit/test_witnessed_reading_rail.gd', 'tests/integration/test_witnessed_caption_runtime.gd', 'tests/integration/test_hospital_dating_adapter_negative_contract.gd', 'tests/integration/test_scene_pause_load.gd', 'tests/integration/test_scene_pause_quick_load.gd', 'tests/integration/test_scene_pause_write_refusal.gd', 'tests/integration/test_current_title_scene_create.gd', 'tests/integration/test_current_title_scene_load.gd', 'tests/integration/current_title_scene_child.gd', 'tests/ui/render_gallery_caption_collection.gd']
          records=[]
          for source in paths:
              p=pathlib.Path(source+'.uid');assert p.is_file(),str(p)
              tracked=subprocess.run(['git','ls-files','--error-unmatch','--',str(p)],capture_output=True).returncode==0
              records.append({'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'provenance':'candidate_tracked' if tracked else 'cloud_editor_import'})
          pathlib.Path('.godot/ci/uid-sidecar-provenance.json').write_text(json.dumps(records,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify geometry
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'geometry' -LogName 'geometry.log' -EvidenceLogPath '.godot/ci/geometry.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_witnessed_transport_rail.gd,res://tests/unit/test_minesweeper_view_controls.gd,res://tests/unit/test_gallery_typography.gd,res://tests/unit/test_font_styles.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/geometry.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify fixture-scope
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'fixture-scope' -LogName 'fixture-scope.log' -EvidenceLogPath '.godot/ci/fixture-scope.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_application_bootstrap.gd,res://tests/integration/test_cold_run_rollback.gd,res://tests/integration/test_scene_controls_localization.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/fixture-scope.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify display
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'display' -LogName 'display.log' -EvidenceLogPath '.godot/ci/display.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_witnessed_reading_rail.gd,res://tests/integration/test_witnessed_caption_runtime.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/display.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify negative
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'negative' -LogName 'negative.log' -EvidenceLogPath '.godot/ci/negative.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_hospital_dating_adapter_negative_contract.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/negative.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify pause-load
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'pause-load' -LogName 'pause-load.log' -EvidenceLogPath '.godot/ci/pause-load.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_pause_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/pause-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify pause-quick-load
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'pause-quick-load' -LogName 'pause-quick-load.log' -EvidenceLogPath '.godot/ci/pause-quick-load.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_pause_quick_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/pause-quick-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify pause-write-refusal
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'pause-write-refusal' -LogName 'pause-write-refusal.log' -EvidenceLogPath '.godot/ci/pause-write-refusal.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_pause_write_refusal.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/pause-write-refusal.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render actual authored-story localization and glyph coverage
        continue-on-error: true
        timeout-minutes: 15
        run: |
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'story-localization' -LogName 'story-localization.log' -EvidenceLogPath '.godot/ci/story-localization.jsonl' -TimeoutSeconds 800 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_story_localization.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/story-localization.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render current title creator and fresh loader in shared isolated root
        continue-on-error: true
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue
          Remove-Item Env:DWM_RETAINED_CONTRACT_FIXTURE -ErrorAction SilentlyContinue
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'current-title' -LogName 'current-title-create.log' -NextLogName 'current-title-load.log' -EvidenceLogPath '.godot/ci/current-title.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_current_title_scene_create.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/current-title-create.xml') -NextGodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_current_title_scene_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/current-title-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render Gallery caption collection and locale geometry
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DWM_GALLERY_COLLECTION_OUTPUT = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/gallery-caption-collection'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'gallery-render' -LogName 'gallery-render.log' -EvidenceLogPath '.godot/ci/gallery-render.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('--script', 'res://tests/ui/render_gallery_caption_collection.gd', '--', '--phase2r-bootstrap-mode=final')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact source census, processes and rendered evidence
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          suites={'geometry': ['tests/unit/test_witnessed_transport_rail.gd', 'tests/unit/test_minesweeper_view_controls.gd', 'tests/unit/test_gallery_typography.gd', 'tests/unit/test_font_styles.gd'], 'fixture-scope': ['tests/integration/test_application_bootstrap.gd', 'tests/integration/test_cold_run_rollback.gd', 'tests/integration/test_scene_controls_localization.gd'], 'display': ['tests/unit/test_witnessed_reading_rail.gd', 'tests/integration/test_witnessed_caption_runtime.gd'], 'negative': ['tests/integration/test_hospital_dating_adapter_negative_contract.gd'], 'pause-load': ['tests/integration/test_scene_pause_load.gd'], 'pause-quick-load': ['tests/integration/test_scene_pause_quick_load.gd'], 'pause-write-refusal': ['tests/integration/test_scene_pause_write_refusal.gd'], 'story-localization': ['tests/integration/test_story_localization.gd'], 'current-title-create': ['tests/integration/test_current_title_scene_create.gd'], 'current-title-load': ['tests/integration/test_current_title_scene_load.gd']}
          def effective_tests(script):
              text=pathlib.Path(script).read_text(encoding='utf-8')
              own=re.findall(r'^func (test_\w+)\(',text,re.M)
              inherited=re.search(r'^extends "res://(tests/[^"\n]+)"',text,re.M)
              if inherited: own.extend(n for n in effective_tests(inherited[1]) if n not in own)
              return own
          reports=[]
          for suite,scripts in suites.items():
              root=ET.parse(out/(suite+'.xml')).getroot();rows=list(root.iter('testcase'));wanted=[]
              for script in scripts:
                  actual=effective_tests(script)
                  assert actual,(script,actual)
                  wanted.extend((script,n) for n in actual)
              assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter(wanted),(suite,rows)
              assert not any(list(root.iter(t)) for t in ['failure','error','skipped']),suite
              assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows),suite
              reports.append({'suite':suite,'tests':len(rows),'assertions':sum(int(r.attrib['assertions']) for r in rows)})
          processes={}
          for suite,count in {'geometry': 1, 'fixture-scope': 1, 'display': 1, 'negative': 1, 'pause-load': 1, 'pause-quick-load': 1, 'pause-write-refusal': 1, 'story-localization': 1, 'current-title': 2, 'gallery-render': 1}.items():
              events=[json.loads(x) for x in (out/(suite+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if x.strip()]
              assert len(events)==count and all(e['exit_code']==0 for e in events),(suite,events)
              processes[suite]=events
          pair=processes['current-title']
          assert pair[0]['test_root']==pair[1]['test_root'] and pair[0]['user_dir']==pair[1]['user_dir']
          assert len({events[0]['test_root'] for events in processes.values()})==len(processes),'suites must use separate fresh roots'
          created=json.loads((out/'current-title-scene-create-proof.json').read_text(encoding='utf-8-sig'))
          loaded=json.loads((out/'current-title-scene-load-proof.json').read_text(encoding='utf-8-sig'))
          for proof in [created,loaded]:
              assert proof['scope']=='current_shipped_title_authored_day1' and proof['entry_id']=='Day1' and proof['line_id']=='line.Day1.one'
              assert proof['ready_count']==1 and proof['visible_text'].strip()
              assert proof['reading']['reading_session']['entry_id']=='Day1' and proof['reading']['reading_session']['frontier']['line_id']=='line.Day1.one'
              assert re.fullmatch(r'[0-9a-f]{64}',proof['slot_sha256']) and re.fullmatch(r'[0-9a-f]{64}',proof['registration_sha256'])
          for key in ['registration_sha256','visible_text','reading','gameplay','scene','command_receipts','profile','slot_sha256','source_run','user_dir']:
              assert loaded[key]==created[key],key
          assert loaded['creator_process_id']==created['process_id'] and loaded['process_id']!=created['process_id']
          assert loaded['source_branch']==created['source_branch'] and loaded['destination_branch']!=created['source_branch']
          assert created['visible_text']==json.loads(pathlib.Path('localization/story/en.json').read_text(encoding='utf-8'))['line.Day1.one']
          import struct,zlib
          pngs=[]
          def check_png(path, expected_dimensions=(1280,720)):
              data=path.read_bytes();assert len(data)>1000 and data[:8]==b'\x89PNG\r\n\x1a\n',str(path)
              cursor=8;chunks=[];compressed=b'';dimensions=None
              while cursor<len(data):
                  length=struct.unpack('>I',data[cursor:cursor+4])[0];kind=data[cursor+4:cursor+8];payload=data[cursor+8:cursor+8+length]
                  crc=struct.unpack('>I',data[cursor+8+length:cursor+12+length])[0]
                  assert zlib.crc32(kind+payload)&0xffffffff==crc,str(path)
                  chunks.append(kind)
                  if kind==b'IHDR':
                      dimensions=struct.unpack('>II',payload[:8]);assert dimensions==expected_dimensions,(str(path),dimensions)
                  if kind==b'IDAT':compressed+=payload
                  cursor+=12+length
              assert chunks[0]==b'IHDR' and chunks[-1]==b'IEND' and cursor==len(data) and zlib.decompress(compressed),str(path)
              pngs.append({'path':str(path),'dimensions':dimensions,'bytes':len(data)})
          for label in ['menu','day1','computer','save','loaded-day1','loaded-computer']:
              proof=loaded if label.startswith('loaded-') else created
              assert len(proof['window_size'])==2 and all(0 < n <= limit for n,limit in zip(proof['window_size'],[1280,720]))
              check_png(out/('computer-current-title-'+label+'.png'),tuple(proof['window_size']))
          gallery=out/'gallery-caption-collection'
          measurements=json.loads((gallery/'measurements.json').read_text(encoding='utf-8-sig'))
          assert measurements['ok'] is True and not measurements['failures'] and measurements['checks']>0
          expected={'status-%s-%s-%d-%s.png'%(style,locale,percent,status) for style in ['pixel','readable'] for locale in ['en','zh_CN','zh_HK','ja','ko'] for percent in [100,125,150] for status in ['added','failed','uncertain']}
          expected.update(['first-visible.png','second-visible-not-collectable.png','restarted-visible.png','failed-real.png','uncertain-real.png'])
          assert len(measurements['samples'])==95 and collections.Counter(s['file'] for s in measurements['samples'])==collections.Counter(expected)
          assert {p.name for p in gallery.glob('*.png')}==expected
          for name in sorted(expected):check_png(gallery/name)
          assert 'GALLERY_CAPTION_COLLECTION_RENDER_VERIFIED captures=95' in pathlib.Path('.godot/phase2r_logs/gallery-render.log').read_text(encoding='utf-8-sig')
          assert json.loads((out/'import-process.json').read_text(encoding='utf-8-sig'))['exit_code']==0
          for p in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',p.read_text(encoding='utf-8-sig')),str(p)
          allowed={'.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1'}
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert not changed-allowed,changed
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','--','autoload','scripts','scenes','tests'],text=True).splitlines()
          assert not [p for p in untracked if pathlib.Path(p).suffix in {'.gd','.tscn'}],untracked
          for script in ['tests/integration/test_story_localization.gd', 'tests/integration/test_scene_controls_localization.gd', 'tests/unit/test_witnessed_transport_rail.gd', 'tests/unit/test_minesweeper_view_controls.gd', 'tests/unit/test_gallery_typography.gd', 'tests/unit/test_font_styles.gd', 'tests/integration/test_application_bootstrap.gd', 'tests/integration/test_cold_run_rollback.gd', 'tests/unit/test_witnessed_reading_rail.gd', 'tests/integration/test_witnessed_caption_runtime.gd', 'tests/integration/test_hospital_dating_adapter_negative_contract.gd', 'tests/integration/test_scene_pause_load.gd', 'tests/integration/test_scene_pause_quick_load.gd', 'tests/integration/test_scene_pause_write_refusal.gd', 'tests/integration/test_current_title_scene_create.gd', 'tests/integration/test_current_title_scene_load.gd', 'tests/integration/current_title_scene_child.gd', 'tests/ui/render_gallery_caption_collection.gd']:
              uid=pathlib.Path(script+'.uid');assert uid.is_file(),str(uid)
              assert re.fullmatch(r'uid://[a-z0-9]+\s*',uid.read_text()),str(uid)
          report={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'reports':reports,'tests':sum(x['tests'] for x in reports),'processes':processes,'gallery_captures':len(measurements['samples']),'pngs':pngs,'changed':sorted(changed)}
          (out/'followup-gate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original bounded evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,sys,zipfile
          sys.stdout.reconfigure(encoding="utf-8", errors="backslashreplace")
          sys.stderr.reconfigure(encoding="utf-8", errors="backslashreplace")
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          missing=[]
          omitted_assets=[]
          pending=['tests/integration/test_story_localization.gd', 'tests/integration/test_scene_controls_localization.gd', 'tests/unit/test_witnessed_transport_rail.gd', 'tests/unit/test_minesweeper_view_controls.gd', 'tests/unit/test_gallery_typography.gd', 'tests/unit/test_font_styles.gd', 'tests/integration/test_application_bootstrap.gd', 'tests/integration/test_cold_run_rollback.gd', 'tests/unit/test_witnessed_reading_rail.gd', 'tests/integration/test_witnessed_caption_runtime.gd', 'tests/integration/test_hospital_dating_adapter_negative_contract.gd', 'tests/integration/test_scene_pause_load.gd', 'tests/integration/test_scene_pause_quick_load.gd', 'tests/integration/test_scene_pause_write_refusal.gd', 'tests/integration/test_current_title_scene_create.gd', 'tests/integration/test_current_title_scene_load.gd', 'tests/integration/current_title_scene_child.gd', 'tests/ui/render_gallery_caption_collection.gd', 'tools/testing/Invoke-IsolatedGodot.ps1', 'project.godot']
          sources=set()
          while pending:
              source=pending.pop()
              if source in sources: continue
              sources.add(source)
              path=pathlib.Path(source)
              if path.is_file() and path.suffix=='.gd':
                  import re
                  pending.extend(re.findall(r'(?:preload\(|load\(|extends\s+)["\']res://([^"\']+)',path.read_text(encoding='utf-8')))
                  if pathlib.Path(source+'.uid').is_file(): sources.add(source+'.uid')
          for source in sorted(sources):
              original=pathlib.Path(source)
              if not original.is_file():
                  missing.append(source); continue
              if original.suffix not in {'.gd','.uid','.ps1','.godot','.tscn','.tres','.json','.dtl','.cfg'}:
                  omitted_assets.append({'path':source,'bytes':original.stat().st_size,'sha256':hashlib.sha256(original.read_bytes()).hexdigest()});continue
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(original.read_bytes())
          (out/'omitted-assets.json').write_text(json.dumps(omitted_assets,indent=2))
          (out/'missing-retained-sources.json').write_text(json.dumps(missing,indent=2))
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          (out/'original-evidence.zip').write_bytes(data)
          for log in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              print('DWM_LOG_TAIL_BEGIN '+str(log))
              print('\n'.join(log.read_text(encoding='utf-8-sig',errors='replace').splitlines()[-250:]))
              print('DWM_LOG_TAIL_END '+str(log))
          if len(data)>8*1024*1024:
              print('DWM_EVIDENCE_ARTIFACT_ONLY '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}));raise SystemExit(0)
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-followup-qualification-evidence
          path: .godot/ci/original-evidence.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
