name: Preserve verified timed-hold evidence
on:
  push:
    branches: [codex/timed-hold-publication-20261003]
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch publication source
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --depth 2 --branch codex/timed-hold-publication-20261003 https://github.com/Siuuuers/dwm.git repo
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
          git -C repo config user.name 'github-actions[bot]'
          git -C repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Preserve exact audited artifacts and publish verified tree
        working-directory: repo
        run: python3 .publication/publish.py
