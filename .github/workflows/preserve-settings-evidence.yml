name: Preserve qualified independent Settings evidence
on:
  push:
    branches: [codex/preserve-settings-evidence-20261024]
permissions:
  actions: read
  contents: write
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: eb5a0e84439df3a22522b515d5777476831d7b62
          persist-credentials: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),crypto=require('crypto');
            const items=[{"run":39986286408,"id":12515682818,"phase":"refusal","sha":"f4a0470f034c4278eee573216ef88d21bb424c54fcf9387374ef0ab90837c4c6","size":5808144},{"run":39986286408,"id":12515792286,"phase":"manual","sha":"109862af46f5cd8689fe8c104f1ceb411f1839f3edf2e9f53785aaba907d2ec4","size":3148077},{"run":39986286408,"id":12515876837,"phase":"render","sha":"fa4b7fbfe09963f804e4eae467b9c52eb82a81be90e924d84a00521e46a75709","size":3386627}];
            fs.mkdirSync('.godot/ci/preserve-settings',{recursive:true});
            for(const item of items){
              const meta=await github.rest.actions.getArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:item.id});
              if(meta.data.workflow_run.id!==item.run || meta.data.expired || meta.data.size_in_bytes!==item.size) throw new Error('Artifact metadata mismatch '+item.id);
              const a=await github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:item.id,archive_format:'zip'});
              const bytes=Buffer.from(a.data);
              if(bytes.length!==item.size || crypto.createHash('sha256').update(bytes).digest('hex')!==item.sha) throw new Error('Artifact bytes mismatch '+item.id);
              fs.writeFileSync('.godot/ci/preserve-settings/'+item.id+'.zip',bytes);
            }
            fs.writeFileSync('.godot/ci/preserve-settings/items.json',JSON.stringify(items));
      - name: Verify original archives and retain qualified reports
        run: |
          python - <<'PYCODE'
          import base64,hashlib,json,pathlib,shutil,subprocess,zipfile
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='eb5a0e84439df3a22522b515d5777476831d7b62'
          tmp=pathlib.Path('.godot/ci/preserve-settings')
          out=pathlib.Path('evidence/phase_2r/current_ci_20261023/run39986286408')
          assert not out.exists(), 'Evidence destination already exists'
          out.mkdir(parents=True)
          items=json.loads((tmp/'items.json').read_text())
          for item in items:
              archive=tmp/(str(item['id'])+'.zip')
              assert archive.stat().st_size==item['size']
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==item['sha']
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None
                  proof=json.loads(z.read('ci/settings-independent/source-proof.json'))
                  assert proof['source_sha']=='e5cf80a5417c05bd0bb7fa2f60f59e8905e839a6'
                  assert proof['source_tree']=='6afbf06d54923667a9faed51ec198b6496c1dbd8'
                  assert proof['controller_sha']=='07834edc087e44546f1451f30bdac8baa6051be9'
                  assert proof['phase']==item['phase']
                  for n in z.namelist():
                      if n.endswith(('.json','.jsonl','.xml')) and '/shader_cache/' not in n:
                          target=(out/str(item['id'])/n).resolve()
                          assert target.is_relative_to((out/str(item['id'])).resolve())
                          target.parent.mkdir(parents=True,exist_ok=True)
                          target.write_bytes(z.read(n))
              shutil.copyfile(archive,out/('original-'+str(item['id'])+'.zip'))
          (out/'artifacts.json').write_text(json.dumps(items,indent=2)+'\n')
          qualification=base64.b64decode('')
          assert hashlib.sha256(qualification).hexdigest()=='bc0fb93879da2ae1ac363f90a469aa9f11b6b5c9f6ca22cc3136b3c636c8ed32'
          (out/'qualification.json').write_bytes(qualification)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/phase_2r/current_ci_20261023/run39986286408
          python - <<'PYCODE'
          import subprocess
          changes=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert changes and all(p.startswith('evidence/phase_2r/current_ci_20261023/run39986286408/') for p in changes)
          PYCODE
          git commit -m 'Retain qualified independent Settings evidence [skip ci]'
          git push origin HEAD:refs/heads/codex/settings-evidence-result-20261024
