name: Preserve final qualified cloud evidence
'on':
  push:
    branches:
    - codex/final-evidence-controller-20261024
permissions:
  actions: read
  contents: write
env:
  SOURCE_SHA: 1ca4b17e49dd487fd57aa80b4a8d7fb3b2c17d1e
  SOURCE_TREE: 7b509b012731491f92af53cef292b16c3ad173e2
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.SOURCE_SHA }}
        persist-credentials: true
    - name: Verify source and prepare disposable checkout
      run: 'test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$SOURCE_TREE"

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1'
    - name: Download and authenticate original evidence
      uses: actions/github-script@v7
      with:
        script: "const fs=require('fs'),crypto=require('crypto');\nconst items=[{\"run\":39989387087,\"id\":12516783463,\"controller\":\"15f55f3569467fdcbfc3ebac3f4cf9d8887c6b16\"\
          ,\"sha\":\"6d3f4f27869f0befdf63c764b8ecce9185403ec9564e211c6b5d223a6f1fb61d\",\"size\":2958631,\"reports\":[\"ci/manual-witness-revision-storage.jsonl\"\
          ,\"ci/settings.jsonl\",\"ci/settings.xml\",\"ci/storage-refusal/empty/repository-after.json\",\"ci/storage-refusal/empty/repository-before.json\"\
          ,\"ci/storage-refusal/empty/tests.xml\",\"ci/storage-refusal/results.json\",\"ci/storage-refusal/whitespace/repository-after.json\"\
          ,\"ci/storage-refusal/whitespace/repository-before.json\",\"ci/storage-refusal/whitespace/tests.xml\",\"ci/targeted-source-proof.json\"\
          ]},{\"run\":39989387087,\"id\":12517690807,\"controller\":\"15f55f3569467fdcbfc3ebac3f4cf9d8887c6b16\",\"sha\":\"4d73b83023ba9923afbd8c4b979ec41acb0cd916a2bbc117a02dd456dcf4269b\"\
          ,\"size\":19904,\"reports\":[\"ci/scene-desktop-first-reveal-load-proof.json\",\"ci/scene-desktop-first-reveal-create-proof.json\",\"\
          ci/scene_desktop_first_reveal-load.xml\",\"ci/scene_desktop_first_reveal.jsonl\",\"ci/scene_desktop_first_reveal.xml\",\"ci/targeted-source-proof.json\"\
          ]},{\"run\":39988834004,\"id\":12516632644,\"controller\":\"0cb92e4b9356e06d0aae1beccd1d80c2f19244a7\",\"sha\":\"5fd0cf26a311dcc13c9d662274b44730a44cb620ae8782ff70b4137188aeb067\"\
          ,\"size\":3432023,\"reports\":[\".godot/ci/audit-origin.json\",\".godot/ci/import-process.json\",\".godot/ci/public-surfaces/game_state-check.jsonl\"\
          ,\".godot/ci/public-surfaces/game_state-generate.jsonl\",\".godot/ci/public-surfaces/game_state_surface.json\",\".godot/ci/public-surfaces/retirement-audit.json\"\
          ,\".godot/ci/public-surfaces/save_manager-check.jsonl\",\".godot/ci/public-surfaces/save_manager-generate.jsonl\",\".godot/ci/public-surfaces/save_manager_surface.json\"\
          ,\".godot/ci/public_surfaces.jsonl\",\".godot/ci/public_surfaces.xml\",\".godot/ci/scene-seed-legacy.xml\",\".godot/ci/scene-seed-scene.jsonl\"\
          ,\".godot/ci/scene-seed-legacy.jsonl\",\".godot/ci/scene-seed-scene.xml\",\"evidence/phase_2r/runtime/game_state_surface.json\",\"evidence/phase_2r/runtime/save_manager_surface.json\"\
          ]},{\"run\":39988834004,\"id\":12517208437,\"controller\":\"0cb92e4b9356e06d0aae1beccd1d80c2f19244a7\",\"sha\":\"c49053565e4b9430f2e9f0157eea9c1602898156de13df2837ca714235279670\"\
          ,\"size\":6079431,\"reports\":[\"audit-origin.json\",\"authored-week-terminal-pair.json\",\"comparison-origin.json\",\"helper-hashes.json\"\
          ,\"import-process.json\",\"terminal-candidate.jsonl\",\"terminal-candidate.xml\",\"terminal-pair.json\",\"terminal-root-hashes.json\"\
          ]},{\"run\":39986683788,\"id\":12516600493,\"controller\":\"10e575924a794cc790e98ae55371ee8e579f0c83\",\"sha\":\"9d045c1cfefc3ab9884531606196d8045f3efddcbf7886282e8a1ac7c21978b5\"\
          ,\"size\":4168614,\"reports\":[\"ci/settings-phases/source-proof.json\",\"ci/settings-supervised/exit-status.json\",\"ci/settings-supervised/pwsh-probe.json\"\
          ,\"ci/settings-supervised/supervisor-result.json\",\"ci/settings.jsonl\",\"ci/settings.xml\"]},{\"run\":39987157781,\"id\":12516316488,\"\
          controller\":\"01410d6fad798680dc6bc2963e56e0308ef2bb23\",\"sha\":\"8d34da6116d1e8d905d18e7dd4c833cfea1341ab95c2f9d72cb5118e2b95f78c\"\
          ,\"size\":3193245,\"reports\":[\"ci/settings-phases/source-proof.json\",\"ci/settings-supervised/exit-status.json\",\"ci/settings-supervised/pwsh-probe.json\"\
          ,\"ci/settings-supervised/supervisor-result.json\",\"ci/settings.jsonl\",\"ci/settings.xml\"]}];\nfs.mkdirSync('.godot/ci/final-retention',{recursive:true});\n\
          for(const item of items){\n  const meta=await github.rest.actions.getArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:item.id});\n\
          \  if(meta.data.workflow_run.id!==item.run || meta.data.workflow_run.head_sha!==item.controller || meta.data.expired || meta.data.size_in_bytes!==item.size\
          \ || (meta.data.digest && meta.data.digest!=='sha256:'+item.sha)) throw new Error('Artifact metadata mismatch '+item.id);\n  const archive=await\
          \ github.rest.actions.downloadArtifact({owner:context.repo.owner,repo:context.repo.repo,artifact_id:item.id,archive_format:'zip'});\n\
          \  const bytes=Buffer.from(archive.data);\n  if(bytes.length!==item.size || crypto.createHash('sha256').update(bytes).digest('hex')!==item.sha)\
          \ throw new Error('Artifact bytes mismatch '+item.id);\n  fs.writeFileSync('.godot/ci/final-retention/'+item.id+'.zip',bytes);\n}\n\
          fs.writeFileSync('.godot/ci/final-retention/items.json',JSON.stringify(items));\n"
    - name: Retain verified archives and summaries
      run: "python - <<'PYCODE'\nimport base64, hashlib, json, os, pathlib, shutil, subprocess, zipfile\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['SOURCE_SHA']\n\
        assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==os.environ['SOURCE_TREE']\ntmp=pathlib.Path('.godot/ci/final-retention')\n\
        out=pathlib.Path('evidence/phase_2r/current_ci_20261023/final_retention')\nassert not out.exists(), 'Final evidence destination already\
        \ exists'\nout.mkdir(parents=True)\nitems=json.loads((tmp/'items.json').read_text())\nfor item in items:\n    archive=tmp/(str(item['id'])+'.zip')\n\
        \    assert archive.stat().st_size==item['size']\n    assert hashlib.sha256(archive.read_bytes()).hexdigest()==item['sha']\n    target=out/('run'+str(item['run']))\n\
        \    target.mkdir(exist_ok=True)\n    with zipfile.ZipFile(archive) as z:\n        assert z.testzip() is None\n        for name in item['reports']:\n\
        \            destination=(target/str(item['id'])/name).resolve()\n            assert destination.is_relative_to((target/str(item['id'])).resolve())\n\
        \            destination.parent.mkdir(parents=True,exist_ok=True)\n            destination.write_bytes(z.read(name))\n    shutil.copyfile(archive,target/('original-'+str(item['id'])+'.zip'))\n\
        (out/'artifacts.json').write_text(json.dumps(items,indent=2)+'\\n')\nembedded={'settings-qualified-39989387087-summary.json': {'sha':\
        \ '5b57b7fe315439669a0973ee0e9c552a8d722f6e2f77e11f1e1f1c5c0d715382', 'base64': ''},\
        \ 'scene-first-reveal-39989387087-summary.json': {'sha': '3b2825ab1792bb4ef7894e5f318beec439ae3c56ed25abf1af753a79c1c3a114', 'base64':\
        \ ''},\
        \ 'settings-quiet-log-comparison.json': {'sha': '35d3ecac06a5f2a993cff37c353c93f39a9f97d389b444054bdfba9f46eb5568', 'base64': ''},\
        \ 'seed-native-qualification.json': {'sha': 'efe4c9c7a267898cff36f5e15d982ba150163dfc996a91c417ca6f28a107f96e', 'base64': ''}}\n\
        for name, item in embedded.items():\n    data=base64.b64decode(item['base64'])\n    assert hashlib.sha256(data).hexdigest()==item['sha']\n\
        \    (out/name).write_bytes(data)\n(out/'retention-origin.json').write_text(json.dumps({'source':os.environ['SOURCE_SHA'],'tree':os.environ['SOURCE_TREE'],'controller':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID']},indent=2)+'\\\
        n')\nPYCODE\n"
    - name: Commit evidence only
      run: 'git reset --mixed HEAD

        git config user.name ''github-actions[bot]''

        git config user.email ''41898282+github-actions[bot]@users.noreply.github.com''

        git add evidence/phase_2r/current_ci_20261023/final_retention

        python - <<''PYCODE''

        import subprocess

        changes=subprocess.check_output([''git'',''diff'',''--cached'',''--name-only''],text=True).splitlines()

        assert changes and all(p.startswith(''evidence/phase_2r/current_ci_20261023/final_retention/'') for p in changes)

        PYCODE

        git commit -m ''Retain final qualified cloud evidence [skip ci]''

        git push origin HEAD:refs/heads/codex/final-evidence-result-20261024

        '
    - name: Restore disposable index for checkout cleanup
      if: always()
      run: git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
