name: Scene event registry matched comparison
on:
  push:
    branches: [codex/event-registry-reuse]
permissions:
  contents: read
  actions: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Prepare checkout and renderer
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip --output "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64"
          echo "GODOT_CONSOLE_PATH=$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Start native Linux speech service
        run: bash tools/testing/start_cloud_speech.sh
      - name: Import once
        env:
          DWM_TEST_ROOT: ${{ runner.temp }}/dtl-import/test
          XDG_DATA_HOME: ${{ runner.temp }}/dtl-import/data
        run: |
          mkdir -p "$DWM_TEST_ROOT" "$XDG_DATA_HOME" .godot/ci/retirement
          "$GODOT_CONSOLE_PATH" --headless --path . --import > .godot/ci/retirement/import.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' .godot/ci/retirement/import.log; then exit 1; fi
          git restore -- project.godot
      - uses: actions/download-artifact@v4
        with:
          name: late-transition-profile
          run-id: 41839936778
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/late-evidence
      - name: Render focused journeys in fresh processes
        shell: python
        run: |
          import os, pathlib, subprocess, xml.etree.ElementTree as ET, json, statistics, shutil
          root = pathlib.Path.cwd()
          output = root / '.godot/ci/retirement'
          root.joinpath('.godot/ci/late-transition').mkdir(parents=True, exist_ok=True)
          paths = ['scripts/application/narrative/SceneEventCommandPort.gd']
          candidate = {p: root.joinpath(p).read_bytes() for p in paths}
          baseline = {p: subprocess.check_output(['git', 'show', 'HEAD^:' + p]) for p in paths}
          cases = [
              ('B1', 'late_transition_measure', ''),
              ('C1', 'late_transition_measure', ''),
              ('C2', 'late_transition_measure', ''),
              ('B2', 'late_transition_measure', ''),
              ('B3', 'late_transition_measure', ''),
              ('C3', 'late_transition_measure', ''),
              ('caption', 'test_scene_caption_challenge', ''),
              ('caption', 'test_scene_caption_challenge_load', ''),
              ('computer', 'test_scene_computer_create', ''),
              ('computer', 'test_scene_computer_load', ''),
          ]
          failed = []
          for group, suite, method in cases:
              for p, content in (baseline if group.startswith('B') else candidate).items():
                  root.joinpath(p).write_bytes(content)
              env = os.environ.copy()
              env['DWM_MATCH_CASE'] = group
              for key, folder in [('DWM_TEST_ROOT', 'test'), ('XDG_DATA_HOME', 'data')]:
                  path = root / '.godot/phase2r_tests/retirement' / group / folder
                  path.mkdir(parents=True, exist_ok=True)
                  env[key] = str(path)
              if suite == 'late_transition_measure':
                  shutil.copytree(pathlib.Path(env['RUNNER_TEMP']) / 'late-evidence/late-transition/seed', pathlib.Path(env['XDG_DATA_HOME']) / 'godot/app_userdata/DWM')
              report = output / (group + '-' + suite + '.xml')
              command = ['xvfb-run', '-a', '-s', '-screen 0 1920x1080x24', env['GODOT_CONSOLE_PATH'], '--path', str(root), '--rendering-method', 'gl_compatibility', '--audio-driver', 'Dummy', '-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/' + suite + '.gd', '-gexit', '-glog=1', '-gjunit_xml_file=' + str(report)]
              if method:
                  command.append('-gunit_test_name=' + method)
              with (output / (group + '-' + suite + '.log')).open('w') as log:
                  result = subprocess.run(command, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=600)
              cases_run = ET.parse(report).findall('.//testcase') if report.exists() else []
              good = result.returncode == 0 and len(cases_run) == 1 and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None for c in cases_run)
              print(suite, 'PASS' if good else 'FAIL', flush=True)
              if not good:
                  failed.append(suite)
                  print((output / (group + '-' + suite + '.log')).read_text()[-12000:], flush=True)
          rows = {}
          for variant in ['B', 'C']:
              rows[variant] = [next(t['elapsed_ms'] for t in json.loads(root.joinpath('.godot/ci/late-transition/' + variant + str(n) + '.json').read_text())['timings'] if t['line_id'] == 'line.Day7.A.001') for n in range(1, 4)]
          print('RESULT_TRANSITION_MS', json.dumps(rows), flush=True)
          output.joinpath('summary.json').write_text(json.dumps(rows, indent=2))
          if failed:
              raise SystemExit('Failed: ' + ', '.join(failed))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-registry-matched
          path: .godot/ci/
          include-hidden-files: true
          retention-days: 7

