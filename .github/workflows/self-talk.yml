name: Paired self-talk acceptance

on:
  push:
    branches: [feat/self-talk-paired-reading]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-talk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reading:
    name: Self-talk / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [self_talk_unit, self_talk_runtime, self_talk_ui, self_talk_skip, self_talk_journey, self_talk_review, scene_day_history, scene_direct_controls]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/ci/import-user/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/ci/import-user/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/self-talk-render
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Prepare disposable checkout
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
      - name: Install Godot and software display
        timeout-minutes: 12
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri libspeechd2
          archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$archive"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"
          editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"
          chmod +x "$editor"
          echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"
      - name: Import project
        timeout-minutes: 8
        run: |
          mkdir -p "$DWM_RENDER_OUTPUT" "$XDG_DATA_HOME" "$DWM_TEST_ROOT"
          "$GODOT_CONSOLE_PATH" --headless --path "$GITHUB_WORKSPACE" --import --log-file "$DWM_RENDER_OUTPUT/import.log"
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' "$DWM_RENDER_OUTPUT/import.log"; then exit 1; fi
          git restore -- project.godot
      - name: Run isolated player behavior checks
        timeout-minutes: 10
        env:
          DWM_CI_SUITE: ${{ matrix.suite }}
        run: xvfb-run -a pwsh -NoProfile -File tools/testing/Invoke-CloudTests.ps1 -Suite "$DWM_CI_SUITE"
      - name: Upload results and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-talk-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/
            .godot/phase2r_logs/
          include-hidden-files: true
          retention-days: 7
