name: Scene Apps and localization qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-apps-qualification.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-apps-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  authority-audit:
    if: false # Earlier pinned diagnostics are retained; this push prepares the day candidate.
    name: Windows / Scene Apps and localization qualification
    runs-on: windows-2022
    timeout-minutes: 105
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 29018e5e9876ea16a210de1568300c25c038dfe1
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '29018e5e9876ea16a210de1568300c25c038dfe1') { throw 'Candidate mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -cne 'aa16882d37884f2e992c420095a4a8d57f60c74b') { throw 'Candidate tree mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='29018e5e9876ea16a210de1568300c25c038dfe1'; tree='aa16882d37884f2e992c420095a4a8d57f60c74b'; controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; event='${{ github.sha }}'; run_id='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'; base='d7d0faf84941d0e5dc6f8a90d0896b6da47236d7'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          $importExit = $LASTEXITCODE
          @{exit_code=$importExit} | ConvertTo-Json | Set-Content "$output/import-process.json"
          if ($importExit -ne 0) { exit $importExit }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record imported UID provenance
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,pathlib,subprocess
          paths=['tests/integration/scene_apps_connected_child.gd','tests/integration/test_scene_apps_connected_create.gd','tests/integration/test_scene_apps_connected_load.gd','tests/scene/test_shop_blank_rendered.gd']
          records=[]
          for source in paths:
              p=pathlib.Path(source+'.uid');assert p.is_file(),str(p)
              tracked=subprocess.run(['git','ls-files','--error-unmatch','--',str(p)],capture_output=True).returncode==0
              records.append({'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'provenance':'candidate_tracked' if tracked else 'cloud_editor_import'})
          pathlib.Path('.godot/ci/uid-sidecar-provenance.json').write_text(json.dumps(records,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify scene-shell
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'scene-shell' -LogName 'scene-shell.log' -EvidenceLogPath '.godot/ci/scene-shell.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_desktop_app_host_state.gd,res://tests/unit/test_scene_desktop_host_restore.gd,res://tests/integration/test_scene_app_preparation.gd,res://tests/integration/test_scene_desktop_consumer.gd,res://tests/integration/test_scene_backup_desktop_entry.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/scene-shell.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify computer-custody-eight
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'computer-custody-eight' -LogName 'computer-custody-eight.log' -EvidenceLogPath '.godot/ci/computer-custody-eight.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_scene_computer_suspension.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/computer-custody-eight.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify scene-localization
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'scene-localization' -LogName 'scene-localization.log' -EvidenceLogPath '.godot/ci/scene-localization.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_localization.gd,res://tests/unit/test_pause_surface.gd,res://tests/integration/test_artwork_gallery.gd,res://tests/integration/test_scene_controls_localization.gd,res://tests/unit/tooling/test_ui_literal_audit.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/scene-localization.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify shop-fixtures
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'shop-fixtures' -LogName 'shop-fixtures.log' -EvidenceLogPath '.godot/ci/shop-fixtures.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/scene/test_shop_card.gd,res://tests/scene/test_shop_plate.gd,res://tests/integration/test_shop_desktop_host.gd,res://tests/integration/test_minesweeper_shop_transaction.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/shop-fixtures.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify dating-regression
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'dating-regression' -LogName 'dating-regression.log' -EvidenceLogPath '.godot/ci/dating-regression.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_frozen_presentation_context.gd,res://tests/unit/test_dating_narrative_playback.gd,res://tests/unit/test_dating_attempt_runtime.gd,res://tests/integration/test_ordered_ending_real_runtime.gd,res://tests/unit/test_scene_challenge.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/dating-regression.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render dedicated Supportz blank regression
        continue-on-error: true
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'shop-blank-render' -LogName 'shop-blank-render.log' -EvidenceLogPath '.godot/ci/shop-blank-render.jsonl' -TimeoutSeconds 240 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/scene/test_shop_blank_rendered.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/shop-blank-render.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render Apps creator and fresh loader in shared isolated root
        continue-on-error: true
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'apps-render' -LogName 'apps-render-create.log' -NextLogName 'apps-render-load.log' -EvidenceLogPath '.godot/ci/apps-render.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_apps_connected_create.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/apps-render-create.xml') -NextGodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_apps_connected_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/apps-render-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact source census, processes and rendered evidence
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          expected={'tests/unit/test_desktop_app_host_state.gd': ['test_reset_clears_active_and_cache', 'test_open_app_first_instantiate_true_and_focus', 'test_open_app_switch_returns_previous_and_reopen_not_instantiate', 'test_open_app_unknown_rejects', 'test_close_app_returns_focus_icon_and_clears_active', 'test_change_day_rejects_nonpositive_and_backward', 'test_change_day_returns_exact_eviction_command_in_registry_order', 'test_capture_persistent_state_returns_registered_id_or_null', 'test_prepare_restore_round_trips_null_and_registered_id', 'test_registry_focus_targets_resolve_for_all_seven', 'test_logout_action_never_enters_workspace_cache_or_restore', 'test_all_six_content_workspaces_still_capture_and_restore'], 'tests/unit/test_scene_desktop_host_restore.gd': ['test_scene_restore_has_no_calendar_and_rejects_retired_producers', 'test_scene_restore_rejects_retired_app_and_malformed_cache_without_mutation', 'test_scene_navigation_reuses_board_suspension_and_cache_without_day'], 'tests/integration/test_scene_app_preparation.gd': ['test_teardown_probe_distinguishes_queued_children_from_unqueued_survivor', 'test_contacts_scene_refresh_reopen_and_preference_reflow', 'test_mines_scene_refresh_resize_information_and_reopen', 'test_shop_scene_catalog_refresh_reflow_preserves_port_and_cards', 'test_settings_scene_presentation_uses_real_content_and_preferences', 'test_backup_scene_records_keep_explicit_families_and_fallback_times', 'test_backup_scene_invalid_setup_is_nonmutating_and_valid_rebind_detaches_old_sources', 'test_backup_scene_prepared_fallback_confirmation_preserves_pending_custody', 'test_backup_scene_title_fallback_uses_real_neutral_confirmation', 'test_backup_scene_action_refusal_retry_and_malformed_preparation_never_bypass_port', 'test_backup_scene_preferences_reopen_and_legacy_guards_keep_dayless_theme'], 'tests/integration/test_scene_desktop_consumer.gd': ['test_scene_launcher_uses_ids_without_schedule', 'test_titles_and_cached_home_use_real_scene_host'