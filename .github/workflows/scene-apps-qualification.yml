          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-apps-qualification-evidence
          path: .godot/ci/original-evidence.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
