concurrency:
  cancel-in-progress: false
  group: authored-profile-${{ github.event.pull_request.number }}
jobs:
  authored-profile:
    defaults:
      run:
        shell: pwsh
    if: github.head_ref == 'codex/story-day-qualification-20261023'
    name: Windows / Bounded authored progression profile
    runs-on: windows-2022
    steps:
    - name: Preserve source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
        persist-credentials: true
        ref: a1f2062e24312502aaaecc74bd92d173b50137ad
    - name: Record pinned source
      run: '$ErrorActionPreference = ''Stop''

        if ((git rev-parse HEAD) -cne ''a1f2062e24312502aaaecc74bd92d173b50137ad'') { throw ''Candidate
        mismatch'' }

        if ((git rev-parse ''HEAD^{tree}'') -cne ''e619b4600a96e7ece26547777d526874061c274c'') { throw
        ''Candidate tree mismatch'' }

        New-Item -ItemType Directory -Force ''.godot/ci'' | Out-Null

        @{candidate=''a1f2062e24312502aaaecc74bd92d173b50137ad''; tree=(git rev-parse ''HEAD^{tree}'');
        controller=''${{ github.event.pull_request.head.sha }}''; workflow=''${{ github.workflow_sha }}'';
        event=''${{ github.sha }}''; run_id=''${{ github.run_id }}''; attempt=''${{ github.run_attempt
        }}''} | ConvertTo-Json | Set-Content ''.godot/ci/audit-origin.json''

        '
    - name: Prepare disposable checkout for credential cleanup
      run: '$ErrorActionPreference = ''Stop''

        # These legacy tooling gitlinks have no .gitmodules URLs. Git''s

        # submodule foreach reads the index even with sparse checkout.

        # The source commit and working files remain unchanged.

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git submodule foreach --recursive ''true''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\n\
        Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip'\
        \ -OutFile $archive\n# SHA256 published with the official 4.6.3-stable release asset.\n$expected\
        \ = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\nif ((Get-FileHash -LiteralPath\
        \ $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot archive\
        \ checksum mismatch.'\n}\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\n\
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }\n\"\
        GODOT_CONSOLE_PATH=$console\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n& $console\
        \ --version\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
    - name: Import project
      run: "$ErrorActionPreference = 'Stop'\n$output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'\n$env:APPDATA\
        \ = Join-Path $output 'import-user/appdata'\n$env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'\n\
        $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'\nNew-Item -ItemType Directory -Force\
        \ -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null\n& $env:GODOT_CONSOLE_PATH\
        \ --headless --path $env:GITHUB_WORKSPACE --import --log-file \"$output/import.log\"\n$importExit\
        \ = $LASTEXITCODE\n@{exit_code=$importExit} | ConvertTo-Json | Set-Content \"$output/import-process.json\"\
        \nif ($importExit -ne 0) { exit $importExit }\nif (Select-String -Path \"$output/import.log\"\
        \ -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character'\
        \ -Quiet) {\n  throw 'Project import reported script errors; inspect import.log.'\n}\n"
      timeout-minutes: 8
    - name: Restore committed project settings after editor import
      run: '# Dialogic''s editor scan rewrites its timeline lookup during import.

        # Execute the committed configuration with the freshly imported assets.

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Verify receipt contract regressions
      timeout-minutes: 12
      run: './tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''receipt-contract'' -LogName ''receipt-contract.log''
        -EvidenceLogPath ''.godot/ci/receipt-contract.jsonl'' -TimeoutSeconds 600 -KeepRoot -GodotArgs
        @(''-s'', ''res://addons/gut/gut_cmdln.gd'', ''-gconfig='', ''-gtest=res://tests/unit/test_scene_event_contract.gd,res://tests/unit/test_scene_receipt_validation.gd'',
        ''-gexit'', ''-glog=2'', ''-gjunit_xml_file=res://.godot/ci/receipt-contract.xml'')

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Verify initial-admission
      timeout-minutes: 12
      run: './tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''initial-admission'' -LogName ''initial-admission.log''
        -EvidenceLogPath ''.godot/ci/initial-admission.jsonl'' -TimeoutSeconds 600 -KeepRoot -GodotArgs
        @(''-s'', ''res://addons/gut/gut_cmdln.gd'', ''-gconfig='', ''-gtest=res://tests/integration/test_scene_initial_admission.gd'',
        ''-gexit'', ''-glog=2'', ''-gjunit_xml_file=res://.godot/ci/initial-admission.xml'')

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Verify initial-candidate
      timeout-minutes: 12
      run: './tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''initial-candidate'' -LogName ''initial-candidate.log''
        -EvidenceLogPath ''.godot/ci/initial-candidate.jsonl'' -TimeoutSeconds 600 -KeepRoot -GodotArgs
        @(''-s'', ''res://addons/gut/gut_cmdln.gd'', ''-gconfig='', ''-gtest=res://tests/integration/test_scene_initial_candidate.gd'',
        ''-gexit'', ''-glog=2'', ''-gjunit_xml_file=res://.godot/ci/initial-candidate.xml'')

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Verify joint-creation
      timeout-minutes: 12
      run: './tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''joint-creation'' -LogName ''joint-creation.log''
        -EvidenceLogPath ''.godot/ci/joint-creation.jsonl'' -TimeoutSeconds 600 -KeepRoot -GodotArgs @(''-s'',
        ''res://addons/gut/gut_cmdln.gd'', ''-gconfig='', ''-gtest=res://tests/integration/test_scene_joint_new_run.gd'',
        ''-gexit'', ''-glog=2'', ''-gjunit_xml_file=res://.godot/ci/joint-creation.xml'')

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Profile first 32 authored captions
      env:
        DWM_SCENE_VALIDATION_PROFILE: '1'
      timeout-minutes: 12
      run: './tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''authored-profile'' -LogName ''authored-profile.log''
        -EvidenceLogPath ''.godot/ci/authored-profile.jsonl'' -TimeoutSeconds 600 -KeepRoot -Rendered
        -GodotArgs @(''-s'', ''res://addons/gut/gut_cmdln.gd'', ''-gconfig='', ''-gprefix=authored_week_'',
        ''-gtest=res://tests/integration/authored_week_profile.gd'', ''-gexit'', ''-glog=2'', ''-gjunit_xml_file=res://.godot/ci/authored-profile.xml'')

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Verify bounded diagnostic census
      run: "$ErrorActionPreference = 'Stop'\n@'\nimport json,pathlib,xml.etree.ElementTree as ET\np=pathlib.Path('.godot/ci')\n\
        r=ET.parse(p/'authored-profile.xml').getroot(); rows=list(r.iter('testcase'))\nassert len(rows)==1\
        \ and rows[0].attrib['name']=='test_profile_first_32_authored_captions'\nassert rows[0].attrib['status']=='pass'\
        \ and not any(list(r.iter(t)) for t in ['failure','error','skipped'])\nevents=[json.loads(s) for\
        \ s in (p/'authored-profile.jsonl').read_text(encoding='utf-8-sig').splitlines() if s.strip()]\n\
        assert len(events)==1 and events[0]['exit_code']==0\nproof=json.loads((p/'authored-profile.json').read_text(encoding='utf-8-sig'))\n\
        assert proof['scope']=='fresh_title_first_32_captions' and len(proof['observed_lines'])==32 and\
        \ len(proof['timings'])==31\nlog=pathlib.Path('.godot/phase2r_logs/authored-profile.log').read_text(encoding='utf-8-sig')\n\
        assert log.count('DWM_SCENE_VALIDATION_PROFILE {')==31\nassert log.count('AUTHORED_MEMORY_TIMING\
        \ {')==2\nassert not any(s in log for s in ['SCRIPT ERROR:', 'ERROR: Failed to load'])\nunit=ET.parse(p/'receipt-contract.xml').getroot();\
        \ cases=list(unit.iter('testcase'))\nassert len(cases)==40 and all(c.attrib['status']=='pass'\
        \ for c in cases)\nassert not any(list(unit.iter(t)) for t in ['failure','error','skipped'])\n\
        unit_events=[json.loads(s) for s in (p/'receipt-contract.jsonl').read_text(encoding='utf-8-sig').splitlines()\
        \ if s.strip()]\nassert len(unit_events)==1 and unit_events[0]['exit_code']==0\nunit_log=pathlib.Path('.godot/phase2r_logs/receipt-contract.log').read_text(encoding='utf-8-sig')\n\
        assert not any(s in unit_log for s in ['SCRIPT ERROR:', 'ERROR: Failed to load'])\nfor suite in\
        \ ['initial-admission','initial-candidate','joint-creation']:\n    report=ET.parse(p/(suite+'.xml')).getroot();\
        \ cases=list(report.iter('testcase'))\n    assert len(cases)==4 and all(c.attrib['status']=='pass'\
        \ for c in cases),suite\n    assert not any(list(report.iter(t)) for t in ['failure','error','skipped']),suite\n\
        \    events=[json.loads(s) for s in (p/(suite+'.jsonl')).read_text(encoding='utf-8-sig').splitlines()\
        \ if s.strip()]\n    assert len(events)==1 and events[0]['exit_code']==0,suite\n    log=pathlib.Path('.godot/phase2r_logs',suite+'.log').read_text(encoding='utf-8-sig')\n\
        \    assert not any(s in log for s in ['SCRIPT ERROR:', 'ERROR: Failed to load','[Failed]']),suite\n\
        print('Receipt regressions and bounded profile passed; not whole-week acceptance')\n'@ | python\
        \ -\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"
    - if: always()
      name: Retain native evidence from isolated roots
      run: "$ErrorActionPreference = 'Stop'\n@'\nimport json,pathlib,shutil\nout=pathlib.Path('.godot/ci')\n\
        for p in sorted(out.glob('*.jsonl')):\n    events=[json.loads(x) for x in p.read_text(encoding='utf-8-sig').splitlines()\
        \ if x.strip()]\n    for i,event in enumerate(events):\n        source=pathlib.Path(event['test_root']).resolve()\n\
        \        assert source.is_relative_to(pathlib.Path('.godot').resolve()),str(source)\n        if\
        \ source.is_dir():\n            destination=out/'native'/p.stem/str(i)\n            if i and events[i-1]['test_root']==event['test_root']:\
        \ continue\n            shutil.copytree(source,destination,dirs_exist_ok=True)\n'@ | python -\n\
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
    - if: always()
      name: Retain original evidence and native UID provenance
      run: "$ErrorActionPreference = 'Stop'\n@'\nimport hashlib,json,pathlib,subprocess,zipfile\nout=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)\n\
        records=[]\nfor p in pathlib.Path('tests/integration').glob('authored_week*.gd.uid'):\n    target=out/'native-uids'/p.name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(p.read_bytes())\n\
        \    tracked=subprocess.run(['git','ls-files','--error-unmatch','--',str(p)],capture_output=True).returncode==0\n\
        \    records.append({'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'provenance':'candidate_tracked'\
        \ if tracked else 'cloud_editor_import','source':'a1f2062e24312502aaaecc74bd92d173b50137ad','source_tree':'e619b4600a96e7ece26547777d526874061c274c'})\n\
        (out/'uid-provenance.json').write_text(json.dumps(records,indent=2))\n(out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))\n\
        manifest_source=subprocess.check_output(['git','ls-tree','-r','HEAD'],text=True)\n(out/'source-tree.txt').write_text(manifest_source)\n\
        files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts and p.name not\
        \ in ['original-evidence.zip','retained-hashes.json']]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))\n\
        manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}\
        \ for p in files}\nretained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)\n\
        archive=out/'original-evidence.zip'\nwith zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED) as\
        \ z:\n    for p in files:z.write(p,p.relative_to('.godot').as_posix())\nwith zipfile.ZipFile(archive)\
        \ as z:assert z.testzip() is None\nprint(json.dumps({'bytes':archive.stat().st_size,'sha256':hashlib.sha256(archive.read_bytes()).hexdigest()}))\n\
        '@ | python -\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
    - if: always()
      name: Upload original evidence
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        include-hidden-files: true
        name: authored-profile-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/original-evidence.zip
        retention-days: 30
    timeout-minutes: 25
name: Bounded authored progression profile
'on':
  workflow_dispatch: null
  pull_request:
    types:
    - synchronize
    paths:
    - .github/workflows/authored-receipts-profile.yml
permissions:
  actions: read
  contents: read
