name: Diagnostic independent Settings obligations
'on':
  push:
    branches:
    - codex/settings-independent-diagnostic-20261023
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: settings-independent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  settings-refusal:
    name: Settings independent / refusal
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      SETTINGS_SOURCE_SHA: e5cf80a5417c05bd0bb7fa2f60f59e8905e839a6
      SETTINGS_PHASE: refusal
    steps:
    - uses: actions/checkout@v7
      with:
        ref: e5cf80a5417c05bd0bb7fa2f60f59e8905e839a6
        fetch-depth: 1
        persist-credentials: true
    - name: Prepare disposable checkout for credential cleanup
      run: |
        $ErrorActionPreference = 'Stop'
        # These legacy tooling gitlinks have no .gitmodules URLs. Git's
        # submodule foreach reads the index even with sparse checkout.
        # The source commit and working files remain unchanged.
        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git submodule foreach --recursive 'true'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install Godot 4.6.3 standard
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
        Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
        # SHA256 published with the official 4.6.3-stable release asset.
        $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Godot archive checksum mismatch.'
        }
        $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
        Expand-Archive -LiteralPath $archive -DestinationPath $editor
        $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
        "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & $console --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Import project
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
        $env:APPDATA = Join-Path $output 'import-user/appdata'
        $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
        $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
          throw 'Project import reported script errors; inspect import.log.'
        }
    - name: Restore committed project settings after editor import
      run: |
        # Dialogic's editor scan rewrites its timeline lookup during import.
        # Execute the committed configuration with the freshly imported assets.
        git restore -- project.godot
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Authenticate exact phase source and extraction
      env:
        DIAGNOSTIC_CONTROLLER_SHA: ${{ github.sha }}
      run: |
        $ErrorActionPreference = 'Stop'
        @'
        import hashlib,json,os,pathlib,subprocess
        root=pathlib.Path.cwd();out=root/'.godot/ci/settings-independent';out.mkdir(parents=True,exist_ok=True)
        source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        assert source==os.environ['SETTINGS_SOURCE_SHA']
        paths=['tools/testing/Invoke-CloudTests.ps1','tools/testing/Invoke-StorageRefusalChecks.ps1',
         'tests/backup_storage/test_manual_witness_revision_storage.gd','tests/ui/render_settings_shared.gd']
        proof={'source_sha':source,'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
         'controller_sha':os.environ['DIAGNOSTIC_CONTROLLER_SHA'],'phase':os.environ['SETTINGS_PHASE'],
         'source_hashes':{p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}}
        if os.environ['SETTINGS_PHASE']=='manual':
         original=(root/paths[0]).read_bytes();text=original.decode().replace('\r\n','\n')
         start_anchor='    # The diagnostic uses the real revision protocol with deterministic FileOps'
         end_anchor='\n    Get-Content -LiteralPath $witnessLog\n}'
         assert text.count(start_anchor)==1 and text.count(end_anchor)==1,'manual phase anchors changed'
         start=text.index(start_anchor);end=text.index(end_anchor,start)+len(end_anchor)-2
         body=text[start:end]
         assert '-TimeoutSeconds 180' in body and 'MANUAL_WITNESS_REVISION_STORAGE_PASS' in body
         header="$ErrorActionPreference = 'Stop'\n$repositoryRoot = [IO.Path]::GetFullPath((Join-Path $PSScriptRoot '../..'))\n"
         target=root/'tools/testing/Invoke-SettingsManualDiagnostic.ps1';assert not target.exists()
         target.write_text(header+body+'\n',encoding='utf-8',newline='\n')
         (out/'original-Invoke-CloudTests.ps1').write_bytes(original)
         (out/'manual-phase.ps1').write_bytes(target.read_bytes())
         proof['manual_body_sha256']=hashlib.sha256(body.encode()).hexdigest()
         proof['manual_script_sha256']=hashlib.sha256(target.read_bytes()).hexdigest()
         proof['extraction_anchor_counts']=[text.count(start_anchor),text.count(end_anchor)]
         # No tracked source or primary dispatcher is changed for these independent phases.
         assert (root/paths[0]).read_bytes()==original
        (out/'source-proof.json').write_text(json.dumps(proof,indent=2)+'\n')
        print(json.dumps(proof))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Missing-root storage refusals and repository snapshots
      timeout-minutes: 10
      run: ./tools/testing/Invoke-StorageRefusalChecks.ps1
    - name: Retain independent refusal evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: settings-independent-refusal-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          .godot/ci/
          .godot/phase2r_logs/
        include-hidden-files: true
        if-no-files-found: error
