name: Temporary cloud inspection

on:
  push:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspection-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: Remove unrelated orphan gitlinks from the temporary checkout index
        run: git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
      - name: Prepare source for inspection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dwm-inspection"
          git archive --format=zip --output="$RUNNER_TEMP/dwm-inspection/dwm-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dwm-inspection-${{ github.sha }}
          path: ${{ runner.temp }}/dwm-inspection/*
          retention-days: 1
          if-no-files-found: error
