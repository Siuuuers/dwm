name: Cold load and Supportz diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/cold-load-supportz-diagnostics.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: cold-load-supportz-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  authority-audit:
    if: ${{ false }} # Already qualified separately; this controller runs only authored-day diagnostics.
    name: Windows / Cold load and Supportz diagnostics
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: 103f7ad2e8c7acaf110abcd37232741de15fe811
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Record pinned source
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne '103f7ad2e8c7acaf110abcd37232741de15fe811') { throw 'Candidate mismatch' }
          New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
          @{candidate='103f7ad2e8c7acaf110abcd37232741de15fe811'; tree=(git rev-parse 'HEAD^{tree}'); controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; event='${{ github.sha }}'; run_id='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          $importExit = $LASTEXITCODE
          @{exit_code=$importExit} | ConvertTo-Json | Set-Content "$output/import-process.json"
          if ($importExit -ne 0) { exit $importExit }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record imported UID provenance
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,json,pathlib,subprocess
          paths=['tests/integration/test_cold_run_rollback.gd','tests/integration/scene_same_day_supportz_child.gd','tests/integration/test_scene_same_day_supportz_create.gd','tests/integration/test_scene_same_day_supportz_load.gd','tests/integration/scene_apps_connected_child.gd','tests/integration/test_scene_apps_connected_create.gd','tests/integration/test_scene_apps_connected_load.gd','tests/scene/test_shop_blank_rendered.gd']
          records=[]
          for source in paths:
              p=pathlib.Path(source+'.uid');assert p.is_file(),str(p)
              tracked=subprocess.run(['git','ls-files','--error-unmatch','--',str(p)],capture_output=True).returncode==0
              records.append({'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'provenance':'candidate_tracked' if tracked else 'cloud_editor_import'})
          pathlib.Path('.godot/ci/uid-sidecar-provenance.json').write_text(json.dumps(records,indent=2))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify scene-remap
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'scene-remap' -LogName 'scene-remap.log' -EvidenceLogPath '.godot/ci/scene-remap.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_scene_runtime_remap.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/scene-remap.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render Apps creator and fresh loader in shared isolated root
        continue-on-error: true
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DWM_APPS_COLD_LOAD_PROFILE = '1'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'apps-render' -LogName 'apps-render-create.log' -NextLogName 'apps-render-load.log' -EvidenceLogPath '.godot/ci/apps-render.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_apps_connected_create.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/apps-render-create.xml') -NextGodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_apps_connected_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/apps-render-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Qualify same-day round owners
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'same-day-owners' -LogName 'same-day-owners.log' -EvidenceLogPath '.godot/ci/same-day-owners.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_scene_round_completion.gd,res://tests/integration/test_scene_round_checkpoint_transaction.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/same-day-owners.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render same-day Supportz and fresh Load
        continue-on-error: true
        timeout-minutes: 22
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'supportz-render' -LogName 'supportz-render-create.log' -NextLogName 'supportz-render-load.log' -EvidenceLogPath '.godot/ci/supportz-render.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_same_day_supportz_create.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/supportz-render-create.xml') -NextGodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_same_day_supportz_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/supportz-render-load.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact source census, processes and rendered evidence
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import collections,json,pathlib,re,subprocess,xml.etree.ElementTree as ET
          out=pathlib.Path('.godot/ci')
          suites={'same-day-owners': ['tests/unit/test_scene_round_completion.gd','tests/integration/test_scene_round_checkpoint_transaction.gd'], 'supportz-render-create': ['tests/integration/test_scene_same_day_supportz_create.gd'], 'supportz-render-load': ['tests/integration/test_scene_same_day_supportz_load.gd'], 'scene-remap': ['tests/unit/test_scene_runtime_remap.gd'], 'apps-render-create': ['tests/integration/test_scene_apps_connected_create.gd'], 'apps-render-load': ['tests/integration/test_scene_apps_connected_load.gd']}
          def effective_tests(script):
              text=pathlib.Path(script).read_text(encoding='utf-8')
              own=re.findall(r'^func (test_\w+)\(',text,re.M)
              inherited=re.search(r'^extends "res://(tests/[^"\n]+)"',text,re.M)
              if inherited: own.extend(n for n in effective_tests(inherited[1]) if n not in own)
              return own
          reports=[]
          for suite,scripts in suites.items():
              root=ET.parse(out/(suite+'.xml')).getroot();rows=list(root.iter('testcase'));wanted=[]
              for script in scripts:
                  actual=effective_tests(script)
                  assert actual,(script,actual)
                  wanted.extend((script,n) for n in actual)
              assert collections.Counter((r.attrib['classname'],r.attrib['name']) for r in rows)==collections.Counter(wanted),(suite,rows)
              assert not any(list(root.iter(t)) for t in ['failure','error','skipped']),suite
              assert all(r.attrib.get('status')=='pass' and int(r.attrib.get('assertions','0'))>0 for r in rows),suite
              reports.append({'suite':suite,'tests':len(rows),'assertions':sum(int(r.attrib['assertions']) for r in rows)})
          processes={}
          for suite,count in [('same-day-owners',1),('supportz-render',2),('scene-remap',1),('apps-render',2)]:
              events=[json.loads(x) for x in (out/(suite+'.jsonl')).read_text(encoding='utf-8-sig').splitlines() if x.strip()]
              assert len(events)==count and all(e['exit_code']==0 for e in events),(suite,events)
              processes[suite]=events
          supportz=processes['supportz-render'];assert supportz[0]['test_root']==supportz[1]['test_root'] and supportz[0]['user_dir']==supportz[1]['user_dir']
          render=processes['apps-render'];assert render[0]['test_root']==render[1]['test_root'] and render[0]['user_dir']==render[1]['user_dir']
          created=json.loads((out/'scene-apps-create-proof.json').read_text(encoding='utf-8-sig'))
          loaded=json.loads((out/'scene-apps-load-proof.json').read_text(encoding='utf-8-sig'))
          assert loaded['process_id']==created['process_id'] and loaded['loader_process_id']!=created['process_id']
          assert loaded['slot_sha256']==created['slot_sha256'] and re.fullmatch(r'[0-9a-f]{64}',created['slot_sha256'])
          assert loaded['shop_receipts']==created['shop_receipts'] and len(created['shop_receipts'])==1
          for label in ['apps-ordinary-caption', 'apps-shop-before-buy', 'apps-shop-purchased', 'apps-contacts', 'apps-home', 'apps-same-caption-return', 'apps-challenge-before-switch', 'apps-shop-during-challenge', 'apps-challenge-return', 'apps-fresh-load-board', 'apps-fresh-load-shop']:
              p=out/('computer-'+label+'.png');assert p.is_file() and p.stat().st_size>1000,str(p)
              assert p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'),str(p)
          supportz_created=json.loads((out/'same-day-supportz-create-proof.json').read_text(encoding='utf-8-sig'))
          supportz_loaded=json.loads((out/'same-day-supportz-load-proof.json').read_text(encoding='utf-8-sig'))
          assert supportz_created['process_id']==supportz_loaded['creator_process_id'] and supportz_loaded['process_id']!=supportz_created['process_id']
          assert re.fullmatch(r'[0-9a-f]{64}',supportz_created['slot_sha256'])
          before=supportz_created['run'];after=supportz_loaded['run']
          assert supportz_loaded['reading']==supportz_created['reading']
          assert before['gameplay']['minesweeper_app_rounds_finished_today']==after['gameplay']['minesweeper_app_rounds_finished_today']==2
          assert before['gameplay']['minesweeper_rounds_left']==after['gameplay']['minesweeper_rounds_left']==0
          assert after['gameplay']['money']==before['gameplay']['money']-45 and after['gameplay']['minesweeper_round_floor']==-1
          assert before['desktop']['consequence']['shop_ledger']['supportz_branch_purchase_count']==0
          assert after['desktop']['consequence']['shop_ledger']['supportz_branch_purchase_count']==1
          assert len(before['desktop']['consequence']['shop_ledger']['base_completion_receipts'])==2
          assert after['desktop']['consequence']['shop_ledger']['supportz_last_purchase_causal_day_instance']==after['lifecycle']['causal_day_instance']
          completions=lambda run:{k:v for k,v in run['command_receipts'].items() if v.get('kind')=='scene_round_completion'}
          assert len(completions(before))==2 and completions(after)==completions(before)
          assert sum(r.get('kind')=='scene_shop_purchase' for r in after['command_receipts'].values())==1
          for label in ['ordinary-round-1-complete','ordinary-round-2-complete','same-day-supportz-eligible-before-save','same-day-fresh-load-settled-board','same-day-fresh-load-supportz-eligible','same-day-fresh-load-supportz-purchased']:
              p=out/('computer-'+label+'.png');assert p.is_file() and p.stat().st_size>1000 and p.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'),str(p)
          timing=json.loads((out/'scene-apps-cold-load-timing.json').read_text(encoding='utf-8-sig'))
          assert timing['process_id']==loaded['loader_process_id'] and timing['slot_sha256']==created['slot_sha256']
          assert all(isinstance(timing[k],int) and timing[k]>=0 for k in ['prepare_us','commit_us','ready_us','total_us'])
          assert timing['total_us']==sum(timing[k] for k in ['prepare_us','commit_us','ready_us']) and timing['total_us']>0
          create_log=pathlib.Path('.godot/phase2r_logs/apps-render-create.log').read_text(encoding='utf-8-sig')
          load_log=pathlib.Path('.godot/phase2r_logs/apps-render-load.log').read_text(encoding='utf-8-sig')
          assert 'DWM_SAVE_LOAD_PROFILE ' not in create_log
          profiles=[json.loads(line.split('DWM_SAVE_LOAD_PROFILE ',1)[1]) for line in load_log.splitlines() if line.startswith('DWM_SAVE_LOAD_PROFILE ')]
          assert profiles and all(p['context']=='scene-apps-cold-load' for p in profiles)
          assert {'backup_prepare','backup_commit','restore_prepare'} <= {p['scope'] for p in profiles}
          commits=[p for p in profiles if p['scope']=='backup_commit' and p['action']=='load']
          assert len(commits)==1 and commits[0]['code']=='scene_activation_pending' and type(commits[0].get('restore_commit_us')) is int and commits[0]['restore_commit_us']>=0
          assert json.loads((out/'import-process.json').read_text(encoding='utf-8-sig'))['exit_code']==0
          for p in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              assert not re.search(r'SCRIPT ERROR:|ERROR:|Unicode parsing error|Unexpected NUL character',p.read_text(encoding='utf-8-sig')),str(p)
          allowed={'.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1'}
          changed=set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())
          assert not changed-allowed,changed
          untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','--','autoload','scripts','scenes','tests'],text=True).splitlines()
          assert not [p for p in untracked if pathlib.Path(p).suffix in {'.gd','.tscn'}],untracked
          for script in {p for paths in suites.values() for p in paths}:
              uid=pathlib.Path(script+'.uid');assert uid.is_file(),str(uid)
              assert re.fullmatch(r'uid://[a-z0-9]+\s*',uid.read_text()),str(uid)
          report={'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'timing':timing,'profiles':profiles,'reports':reports,'tests':sum(x['tests'] for x in reports),'processes':processes,'changed':sorted(changed)}
          (out/'apps-gate.json').write_text(json.dumps(report,indent=2));print(json.dumps(report))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain original bounded evidence
        if: always()
        run: |
          @'
          import base64,hashlib,io,json,pathlib,subprocess,sys,zipfile
          sys.stdout.reconfigure(encoding="utf-8", errors="backslashreplace")
          sys.stderr.reconfigure(encoding="utf-8", errors="backslashreplace")
          out=pathlib.Path('.godot/ci');out.mkdir(parents=True,exist_ok=True)
          missing=[]
          omitted_assets=[]
          pending=['tests/unit/test_scene_runtime_remap.gd','tests/integration/test_cold_run_rollback.gd','tests/integration/test_restore_transaction.gd','tests/unit/test_fatal_diagnostic_projector.gd','tests/unit/test_scene_round_completion.gd','tests/integration/test_scene_round_checkpoint_transaction.gd','tests/integration/test_scene_same_day_supportz_create.gd','tests/integration/test_scene_same_day_supportz_load.gd','tests/unit/test_scene_challenge.gd','tests/unit/test_desktop_app_host_state.gd', 'tests/unit/test_scene_desktop_host_restore.gd', 'tests/integration/test_scene_app_preparation.gd', 'tests/integration/test_scene_desktop_consumer.gd', 'tests/integration/test_scene_backup_desktop_entry.gd', 'tests/unit/test_scene_computer_suspension.gd', 'tests/unit/test_localization.gd', 'tests/unit/test_pause_surface.gd', 'tests/integration/test_artwork_gallery.gd', 'tests/integration/test_scene_controls_localization.gd', 'tests/unit/tooling/test_ui_literal_audit.gd', 'tests/scene/test_shop_card.gd', 'tests/scene/test_shop_plate.gd', 'tests/integration/test_shop_desktop_host.gd', 'tests/integration/test_minesweeper_shop_transaction.gd', 'tests/unit/test_frozen_presentation_context.gd', 'tests/unit/test_dating_narrative_playback.gd', 'tests/unit/test_dating_attempt_runtime.gd', 'tests/integration/test_ordered_ending_real_runtime.gd', 'tests/scene/test_shop_blank_rendered.gd', 'tests/integration/test_scene_apps_connected_create.gd', 'tests/integration/test_scene_apps_connected_load.gd', 'tests/integration/scene_apps_connected_child.gd', 'autoload/GameState.gd', 'autoload/ApplicationBootstrap.gd', 'scripts/ui/SceneHost.gd', 'scripts/ui/ComputerDesktop.gd', 'scripts/application/shop/ShopPresentationPort.gd', 'scripts/ui/GalleryScene.gd', 'scripts/ui/gallery/ArtworkGallery.gd', 'scripts/ui/pause/PauseSurface.gd', 'tools/localization/UiLiteralAudit.gd', 'tools/testing/Invoke-IsolatedGodot.ps1', 'project.godot', 'localization/ui/en.json', 'localization/ui/zh_CN.json', 'localization/ui/zh_HK.json', 'localization/ui/ja.json', 'localization/ui/ko.json']
          sources=set()
          while pending:
              source=pending.pop()
              if source in sources: continue
              sources.add(source)
              path=pathlib.Path(source)
              if path.is_file() and path.suffix=='.gd':
                  import re
                  pending.extend(re.findall(r'(?:preload\(|load\(|extends\s+)["\']res://([^"\']+)',path.read_text(encoding='utf-8')))
                  if pathlib.Path(source+'.uid').is_file(): sources.add(source+'.uid')
          for source in sorted(sources):
              original=pathlib.Path(source)
              if not original.is_file():
                  missing.append(source); continue
              if original.suffix not in {'.gd','.uid','.ps1','.godot','.tscn','.tres','.json','.dtl','.cfg'}:
                  omitted_assets.append({'path':source,'bytes':original.stat().st_size,'sha256':hashlib.sha256(original.read_bytes()).hexdigest()});continue
              p=out/'source'/source;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(original.read_bytes())
          (out/'omitted-assets.json').write_text(json.dumps(omitted_assets,indent=2))
          (out/'missing-retained-sources.json').write_text(json.dumps(missing,indent=2))
          (out/'final-status.txt').write_text(subprocess.check_output(['git','status','--porcelain'],text=True))
          files=[p for p in out.rglob('*') if p.is_file() and 'import-user' not in p.parts]+list(pathlib.Path('.godot/phase2r_logs').glob('*.log'))
          manifest={p.relative_to('.godot').as_posix():{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in files}
          retained=out/'retained-hashes.json';retained.write_text(json.dumps(manifest,indent=2));files.append(retained)
          payload=io.BytesIO()
          with zipfile.ZipFile(payload,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files:z.write(p,p.relative_to('.godot').as_posix())
          data=payload.getvalue()
          (out/'original-evidence.zip').write_bytes(data)
          for log in pathlib.Path('.godot/phase2r_logs').glob('*.log'):
              print('DWM_LOG_TAIL_BEGIN '+str(log))
              print('\n'.join(log.read_text(encoding='utf-8-sig',errors='replace').splitlines()[-250:]))
              print('DWM_LOG_TAIL_END '+str(log))
          if len(data)>8*1024*1024:
              print('DWM_EVIDENCE_ARTIFACT_ONLY '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}));raise SystemExit(0)
          print('DWM_EVIDENCE_BEGIN '+json.dumps({'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}))
          encoded=base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):print('DWM_EVIDENCE_CHUNK '+encoded[i:i+4096])
          print('DWM_EVIDENCE_END')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload bounded original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-load-supportz-diagnostics-evidence
          path: .godot/ci/original-evidence.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
