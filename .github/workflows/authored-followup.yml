        capture_owners={'Day2':a,'Day3':a,'Day4':a,'Day5':c,'Day6':c,'Day7':c,'day4':a,'restored-slot-1':c,'ending':b,'load-completed-title':c,'restored-slot-2':d,'replay-completed-title':d,'fresh-day1':d}
        assert {p.name for p in out.glob('computer-authored-*.png')}=={'computer-authored-'+label+'.png' for label in capture_owners}
        pngs=[png(out/('computer-authored-'+label+'.png'),p['window_size']) for label,p in capture_owners.items()]
