          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise round-physical
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'round-physical' -LogName 'round-physical.log' -EvidenceLogPath '.godot/ci/round-physical.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_round_checkpoint_transaction.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/round-physical.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise day-physical
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'day-physical' -LogName 'day-physical.log' -EvidenceLogPath '.godot/ci/day-physical.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_day_commit_ordering.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/day-physical.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise fixture-maintenance
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'fixture-maintenance' -LogName 'fixture-maintenance.log' -EvidenceLogPath '.godot/ci/fixture-maintenance.jsonl' -TimeoutSeconds 600 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_contacts_frozen_context.gd,res://tests/integration/test_ui_art_placements.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/fixture-maintenance.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify four-validation baseline derivation
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib,importlib.util,json,pathlib
          path=pathlib.Path('tools/testing/derive_save_admission_baseline.py')
          spec=importlib.util.spec_from_file_location('admission',path); module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          source=pathlib.Path('autoload/SaveManager.gd').read_bytes();baseline=module.derive_baseline(source)
          assert baseline.count(b'SAVE_DOCUMENT_SCHEMA.validate(')-source.count(b'SAVE_DOCUMENT_SCHEMA.validate(')==4
          assert module.derive_baseline(source.replace(b'\r\n',b'\n').replace(b'\n',b'\r\n')).replace(b'\r\n',b'\n')==baseline.replace(b'\r\n',b'\n')
          for changed in [source.replace(b'# Admission already returned the validated, detached document.',b'# changed',1),source.replace(b'func _reconstruct_restore_materials(',b'func _changed_restore_materials(',1)]:
              try: module.derive_baseline(changed)
              except ValueError: pass
              else: raise AssertionError('source drift accepted')
          out=pathlib.Path('.godot/ci');(out/'admission-baseline.gd.txt').write_bytes(baseline)
          (out/'admission-baseline-check.json').write_text(json.dumps({'ok':True,'added_validations':4,'candidate_sha256':hashlib.sha256(source).hexdigest(),'baseline_sha256':hashlib.sha256(baseline).hexdigest()}))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render maintained desktop scaling journey
        continue-on-error: true
        timeout-minutes: 12
        run: |
          $env:DWM_RENDER_OUTPUT = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/desktop-scaling'
          New-Item -ItemType Directory -Force $env:DWM_RENDER_OUTPUT | Out-Null
          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'desktop-scaling' -LogName 'desktop-scaling.log' -EvidenceLogPath '.godot/ci/desktop-scaling.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('-s', 'res://tests/ui/render_desktop_scaling.gd')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render real ordinary rounds day renewal and fresh Load
        continue-on-error: true
