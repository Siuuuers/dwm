          $ErrorActionPreference = 'Stop'
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'ordinary-render' -LogName 'ordinary-render.log' -EvidenceLogPath '.godot/ci/ordinary-render.jsonl' -TimeoutSeconds 600 -Rendered -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_ordinary_day_create.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/ordinary-render-create.xml') -NextLogName 'ordinary-render-load.log' -NextGodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/test_scene_ordinary_day_load.gd', '-gexit', '-glog=2', '-gjunit_xml_file=res://.godot/ci/ordinary-render-load.xml')
