name: Verify Quick Backup fixture signatures and current Settings
'on':
  push:
    branches:
    - codex/quick-fixture-check-20261024
permissions:
  contents: read
concurrency:
  group: quick-fixture-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused-tests:
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
        - settings
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Preserve committed source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        fetch-depth: ${{ (matrix.suite == 'new_account' || matrix.suite == 'desktop')
          && '0' || '1' }}
        persist-credentials: true
        ref: 69cca3f965e065c708eac87b5723d744e2be7787
    - name: Verify pinned source and record hashes
      run: "$ErrorActionPreference = 'Stop'\n@'\nimport hashlib,json,pathlib,subprocess\n\
        root=pathlib.Path.cwd()\nsource=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()\n\
        tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()\n\
        assert source=='69cca3f965e065c708eac87b5723d744e2be7787' and tree=='b1b980b548e88e424f356b96bcdd06fb998f6af6'\npaths=['tests/unit/test_backup_quick_actions.gd','.github/workflows/windows-tests.yml','tools/testing/Invoke-CloudTests.ps1','tools/testing/Invoke-IsolatedGodot.ps1','tools/testing/Invoke-StorageRefusalChecks.ps1','tools/testing/Invoke-PublicSurfaceValidation.ps1','tools/testing/canonical-test-disposition.json','tests/unit/test_bootstrap_window_output.gd','tests/unit/test_checkpoint_journal.gd','tests/integration/test_restore_production_adapters.gd','tests/scene/test_settings_localization_scene.gd']\n\
        hashes={}\nfor name in paths:\n    data=(root/name).read_bytes()\n    assert\
        \ data==subprocess.check_output(['git','show','HEAD:'+name]), name+' differs\
        \ from committed source'\n    hashes[name]=hashlib.sha256(data).hexdigest()\n\
        p=root/'.godot/ci/targeted-source-proof.json';p.parent.mkdir(parents=True,exist_ok=True)\n\
        p.write_text(json.dumps({'source':source,'tree':tree,'controller':'${{ github.sha\
        \ }}','workflow':'${{ github.workflow_sha }}','run_id':'${{ github.run_id\
        \ }}','sha256':hashes},indent=2)+'\\n')\n'@ | python -\nif ($LASTEXITCODE\
        \ -ne 0) { exit $LASTEXITCODE }\n"
    - name: Prepare disposable checkout for credential cleanup
      run: '$ErrorActionPreference = ''Stop''

        # These legacy tooling gitlinks have no .gitmodules URLs. Git''s

        # submodule foreach reads the index even with sparse checkout.

        # The source commit and working files remain unchanged.

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git submodule foreach --recursive ''true''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP\
        \ 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip'\
        \ -OutFile $archive\n# SHA256 published with the official 4.6.3-stable release\
        \ asset.\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\n\
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()\
        \ -ne $expected) {\n  throw 'Godot archive checksum mismatch.'\n}\n$editor\
        \ = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\n\
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable\
        \ missing.' }\n\"GODOT_CONSOLE_PATH=$console\" | Out-File -FilePath $env:GITHUB_ENV\
        \ -Append -Encoding utf8\n& $console --version\nif ($LASTEXITCODE -ne 0) {\
        \ exit $LASTEXITCODE }\n"
    - name: Import project
      timeout-minutes: 8
      run: "$ErrorActionPreference = 'Stop'\n$output = Join-Path $env:GITHUB_WORKSPACE\
        \ '.godot/ci'\n$env:APPDATA = Join-Path $output 'import-user/appdata'\n$env:LOCALAPPDATA\
        \ = Join-Path $output 'import-user/localappdata'\n$env:DWM_TEST_ROOT = Join-Path\
        \ $output 'import-user/test-root'\nNew-Item -ItemType Directory -Force -Path\
        \ $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null\n\
        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import\
        \ --log-file \"$output/import.log\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE\
        \ }\nif (Select-String -Path \"$output/import.log\" -Pattern 'SCRIPT ERROR:|ERROR:\
        \ Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {\n\
        \  throw 'Project import reported script errors; inspect import.log.'\n}\n"
    - name: Restore committed project settings after editor import
      run: '# Dialogic''s editor scan rewrites its timeline lookup during import.

        # Execute the committed configuration with the freshly imported assets.

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Verify committed inventories without regeneration
      run: './tools/testing/Invoke-PublicSurfaceValidation.ps1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - name: Run focused regression suite
      timeout-minutes: 10
      env:
        DWM_CI_SUITE: ${{ matrix.suite }}
      run: ./tools/testing/Invoke-CloudTests.ps1 -Suite $env:DWM_CI_SUITE
    - name: Render Settings uncertain-write journey
      if: matrix.suite == 'settings'
      timeout-minutes: 3
      run: '$ErrorActionPreference = ''Stop''

        $output = Join-Path $env:GITHUB_WORKSPACE ''.godot/ci/settings-failure-render''

        $env:APPDATA = Join-Path $output ''appdata''

        $env:LOCALAPPDATA = Join-Path $output ''localappdata''

        $env:DWM_TEST_ROOT = Join-Path $output ''test-root''

        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA,
        $env:DWM_TEST_ROOT | Out-Null

        & $env:GODOT_CONSOLE_PATH --path $env:GITHUB_WORKSPACE --rendering-method
        gl_compatibility --audio-driver Dummy --log-file "$output/render.log" --script
        res://tests/ui/render_settings_shared.gd -- --settings-write-failure

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        if (Select-String -Path "$output/render.log" -Pattern ''SCRIPT ERROR:|ERROR:
        Failed to load|Unicode parsing error|Unexpected NUL character'' -Quiet) {
        throw ''Settings journey reported script errors.'' }

        if (-not (Select-String -Path "$output/render.log" -Pattern ''SETTINGS_SHARED_RENDER_VERIFIED
        captures=3'' -Quiet)) { throw ''Settings failure journey did not complete.''
        }

        '
    - name: Upload logs and test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt
          }}
        path: '.godot/ci/*.log

          .godot/ci/*.jsonl

          .godot/ci/*.json

          .godot/ci/*.xml

          .godot/ci/storage-refusal/

          .godot/ci/settings-failure-render/

          .godot/phase2r_logs/cloud-*.log

          '
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7

