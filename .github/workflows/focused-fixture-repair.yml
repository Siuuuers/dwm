name: Backup repair exact inventory generation
'on':
  push:
    branches:
    - codex/final-fixture-repair-controller-20261006
    paths:
    - .github/workflows/focused-fixture-repair.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Checkout the released push commit
      id: checkout
      uses: actions/checkout@v7
      with:
        ref: 7ea3a6a1968f35d7bfd1f1d2e1bf64a5bdca20ea
        fetch-depth: 0
        persist-credentials: 'true'
    - name: Bind frozen repair source and all non-generated tracked bytes
      id: identity
      shell: python {0}
      run: 'import hashlib, json, os, pathlib, subprocess

        root=pathlib.Path.cwd();out=root/''.godot/ci/worker-a-verification'';out.mkdir(parents=True,exist_ok=False)

        def git(*a):return subprocess.check_output([''git'',*a])

        def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()

        source=''7ea3a6a1968f35d7bfd1f1d2e1bf64a5bdca20ea''

        assert git(''rev-parse'',''HEAD'').decode().strip()==source

        assert git(''rev-parse'',''HEAD^{tree}'').decode().strip()==''e04d1871395ce424bf13e95d294c7e3be5ad4a0f''

        assert not git(''status'',''--porcelain'',''--untracked-files=all'')

        workflow=''.github/workflows/windows-tests.yml''

        assert git(''rev-parse'',''HEAD:''+workflow).decode().strip()==''643ff7794f8f602fb261df583705e4475d5c9ee4''

        allowed={''evidence/phase_2r/runtime/game_state_surface.json'',''evidence/phase_2r/runtime/save_manager_surface.json'',''evidence/phase_2r/localization/ui_literal_disposition.json'',''evidence/phase_2r/localization/script_ui_disposition.json''}

        files=git(''ls-files'',''-z'').decode().split(''\0'')[:-1]

        frozen={p:{''sha256'':sha(root/p)} for p in files if (root/p).is_file() and p not in allowed}

        report={''checkout'':source,''tree'':git(''rev-parse'',''HEAD^{tree}'').decode().strip(),''controller'':os.environ[''GITHUB_SHA''],''ref'':os.environ[''GITHUB_REF''],''run_id'':os.environ[''GITHUB_RUN_ID''],''attempt'':os.environ[''GITHUB_RUN_ATTEMPT''],''frozen_files'':frozen,''allowed_outputs'':sorted(allowed)}

        (out/''source.json'').write_text(json.dumps(report,indent=2)+''\n'',encoding=''utf-8'')

        '
    - name: Prepare disposable checkout for credential cleanup
      id: cleanup
      run: '$ErrorActionPreference = ''Stop''

        $output = Join-Path $env:GITHUB_WORKSPACE ''.godot/ci/worker-a-verification''

        git status --porcelain --untracked-files=no | Set-Content "$output/status-before-cleanup.txt" -Encoding utf8

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git submodule foreach --recursive ''true''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git diff --cached --raw | Set-Content "$output/index-after-cleanup.txt" -Encoding utf8

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Install pinned Godot 4.6.3 standard
      id: install
      timeout-minutes: 5
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri\
        \ 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile\
        \ $archive\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\nif ((Get-FileHash -LiteralPath\
        \ $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot archive checksum mismatch.'\n\
        }\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath $archive -DestinationPath $editor\n\
        $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\nif (-not (Test-Path -LiteralPath $console))\
        \ { throw 'Godot console executable missing.' }\n\"GODOT_CONSOLE_PATH=$console\" | Out-File -FilePath $env:GITHUB_ENV\
        \ -Append -Encoding utf8\n& $console --version | Tee-Object -FilePath '.godot/ci/worker-a-verification/godot-version.log'\n\
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
    - name: Record clean nonignored baseline before import
      id: pre_import
      shell: python {0}
      run: 'import json, pathlib, subprocess

        root = pathlib.Path.cwd()

        out = root / ''.godot/ci/worker-a-verification''

        untracked = subprocess.check_output([''git'',''ls-files'',''--others'',''--exclude-standard'',''-z''],cwd=root).decode(''utf-8'').split(''\0'')[:-1]

        report = {''ok'': not untracked, ''untracked_nonignored'': sorted(untracked)}

        (out/''pre-import-untracked.json'').write_text(json.dumps(report,indent=2)+''\n'',encoding=''utf-8'')

        if untracked: raise SystemExit(''A_UNEXPLAINED_PRE_IMPORT_FILES'')

        '
    - name: Import project with isolated data roots and strict log checks
      id: import
      timeout-minutes: 8
      run: "$ErrorActionPreference = 'Stop'\n$output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'\n$env:APPDATA = Join-Path\
        \ $output 'import-user/appdata'\n$env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'\n$env:DWM_TEST_ROOT\
        \ = Join-Path $output 'import-user/test-root'\nNew-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA,\
        \ $env:DWM_TEST_ROOT | Out-Null\n& $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file\
        \ \"$output/import.log\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nif (Select-String -Path \"$output/import.log\"\
        \ -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {\n  throw\
        \ 'Project import reported script or Unicode errors; inspect import.log.'\n}\n"
    - name: Restore committed project settings after attempted import
      id: restore
      if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.import.outcome != 'skipped' }}
      run: '# Restoration is cleanup, not evidence that an unsuccessful import passed.

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Validate and retain exact import sidecar custody
      id: sidecars
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' }}
      shell: python {0}
      run: "import hashlib, json, os, pathlib, re, stat, subprocess\nroot = pathlib.Path.cwd().resolve()\nout = root / '.godot/ci/worker-a-verification'\n\
        def git(*args): return subprocess.check_output(['git',*args],cwd=root)\ndef digest(data): return hashlib.sha256(data).hexdigest()\n\
        def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\\0'+data).hexdigest()\ndef regular(name):\n\
        \    parts = pathlib.PurePosixPath(name).parts\n    if not parts or '/'.join(parts) != name or any(x in ('.','..')\
        \ or ':' in x or '\\\\' in x for x in parts):\n        raise ValueError('unsafe path: '+name)\n    p = root\n    for\
        \ i, part in enumerate(parts):\n        p = p / part\n        st = p.lstat()\n        if stat.S_ISLNK(st.st_mode)\
        \ or getattr(st,'st_file_attributes',0) & 0x400:\n            raise ValueError('symlink/reparse path: '+name)\n  \
        \      if i < len(parts)-1 and not stat.S_ISDIR(st.st_mode): raise ValueError('non-directory parent')\n    if not\
        \ stat.S_ISREG(st.st_mode) or not p.resolve().is_relative_to(root): raise ValueError('non-regular/escaping path')\n\
        \    return p\nbaseline = json.loads((out/'pre-import-untracked.json').read_text(encoding='utf-8'))\nif baseline !=\
        \ {'ok':True,'untracked_nonignored':[]}: raise SystemExit('A_INVALID_INITIAL_BASELINE')\ntracked = {}\nfor item in\
        \ git('ls-tree','-r','-z','HEAD').split(b'\\0'):\n    if not item: continue\n    info,name = item.split(b'\\t',1)\n\
        \    mode,kind,sha = info.decode().split()\n    tracked[name.decode('utf-8')] = (mode,kind,sha)\nuntracked = sorted(git('ls-files','--others','--exclude-standard','-z').decode('utf-8').split('\\\
        0')[:-1])\nrecords, failures = {}, []\nparams = set('compress/mode compress/high_quality compress/lossy_quality compress/uastc_level\
        \ compress/rdo_quality_loss compress/hdr_compression compress/normal_map compress/channel_pack mipmaps/generate mipmaps/limit\
        \ roughness/mode roughness/src_normal process/channel_remap/red process/channel_remap/green process/channel_remap/blue\
        \ process/channel_remap/alpha process/fix_alpha_border process/premult_alpha process/normal_map_invert_y process/hdr_as_srgb\
        \ process/hdr_clamp_exposure process/size_limit detect_3d/compress_to'.split())\nfor name in untracked:\n    try:\n\
        \        side = regular(name)\n        data = side.read_bytes()\n        if len(data) > 65536: raise ValueError('oversized\
        \ sidecar')\n        # Preserve safe candidate bytes even if content validation below rejects them.\n        retained\
        \ = out/'import-sidecar-bytes'/name\n        retained.parent.mkdir(parents=True,exist_ok=True)\n        retained.write_bytes(data)\n\
        \        if name.endswith('.gd.uid'): base = name[:-4]\n        elif name.endswith('.png.import'): base = name[:-7]\n\
        \        else: raise ValueError('unsupported sidecar form')\n        entry = tracked.get(base)\n        if not entry\
        \ or entry[0] not in ('100644','100755') or entry[1] != 'blob' or name in tracked:\n            raise ValueError('base\
        \ is not a tracked regular file/new sidecar')\n        base_data = regular(base).read_bytes()\n        if blob(base_data)\
        \ != entry[2]: raise ValueError('base differs from committed blob')\n        text = data.decode('utf-8')\n       \
        \ if name.endswith('.uid'):\n            if not re.fullmatch(r'uid://[a-z0-9]{1,13}\\r?\\n?',text): raise ValueError('invalid\
        \ UID content')\n        else:\n            if base_data[:8] != b'\\x89PNG\\r\\n\\x1a\\n': raise ValueError('base\
        \ is not PNG')\n            # Bounded Godot texture ConfigFile grammar; no evaluation of Variant text.\n         \
        \   text = text.replace('\\r\\n','\\n')\n            pattern = (r'\\[remap\\]\\s+importer=\"texture\"\\s+type=\"CompressedTexture2D\"\
        \\s+'\n                       r'uid=\"uid://[a-z0-9]{1,13}\"\\s+path=(\"[^\"\\n]+\")\\s+'\n                      \
        \ r'metadata=\\{\\s*\"vram_texture\": false\\s*\\}\\s+'\n                       r'\\[deps\\]\\s+source_file=(\"[^\"\
        \\n]+\")\\s+dest_files=(\\[[^\\n]+\\])\\s+'\n                       r'\\[params\\]\\s+([\\s\\S]+)')\n            match\
        \ = re.fullmatch(pattern,text.strip())\n            if not match: raise ValueError('unsupported texture import structure')\n\
        \            dest, source, destinations = [json.loads(v) for v in match.groups()[:3]]\n            expected_source\
        \ = 'res://'+base\n            expected_dest = 'res://.godot/imported/'+pathlib.PurePosixPath(base).name+'-'+hashlib.md5(expected_source.encode()).hexdigest()+'.ctex'\n\
        \            if source != expected_source or dest != expected_dest or destinations != [expected_dest]:\n         \
        \       raise ValueError('texture source/destination binding mismatch')\n            regular(dest.removeprefix('res://'))\n\
        \            seen = set()\n            for line in match.group(4).splitlines():\n                if not line.strip():\
        \ continue\n                key,sep,value = line.partition('=')\n                if not sep or key not in params or\
        \ key in seen: raise ValueError('unsupported/duplicate texture parameter')\n                seen.add(key)\n      \
        \          if key == 'roughness/src_normal':\n                    if value != '\"\"': raise ValueError('external normal\
        \ source unsupported')\n                elif not re.fullmatch(r'(?:true|false|-?\\d+(?:\\.\\d+)?)',value): raise ValueError('unsupported\
        \ parameter value')\n            if seen != params: raise ValueError('missing texture parameters')\n        records[name]\
        \ = {'bytes':len(data),'sha256':digest(data),'base':base,'base_blob':entry[2],\n                         'retained_path':retained.relative_to(root).as_posix()}\n\
        \    except (ValueError,OSError,UnicodeError) as exc:\n        failures.append({'path':name,'reason':str(exc)})\n\
        report = {'ok':not failures,'untracked_nonignored':untracked,'records':records,'failures':failures}\nraw = (json.dumps(report,indent=2)+'\\\
        n').encode()\n(out/'import-sidecars.json').write_bytes(raw)\nif failures: raise SystemExit('A_INVALID_IMPORT_SIDECARS:\
        \ '+repr(failures))\nwith open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:\n    output.write('manifest_sha256='+digest(raw)+'\\\
        n')\n"
    - name: Regenerate and check BOTH runtime surface inventories
      id: inventories
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' && steps.sidecars.outcome
        == 'success' }}
      timeout-minutes: 10
      run: "$ErrorActionPreference = 'Stop'\n$PSNativeCommandUseErrorActionPreference = $false\n# Reuse the complete existing\
        \ wrapper, including both generators/checks,\n# retirement audit, isolated processes, strict logs and recoverable\
        \ payloads.\npwsh -NoProfile -File ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads *>&1\
        \ |\n  Tee-Object -FilePath '.godot/ci/worker-a-verification/inventory-driver.log'\nif ($LASTEXITCODE -ne 0) { exit\
        \ $LASTEXITCODE }\n"
    - name: Audit UI literal ownership and retain generated reports
      id: literals
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' && steps.sidecars.outcome
        == 'success' }}
      timeout-minutes: 4
      run: "$ErrorActionPreference = 'Stop'\n$PSNativeCommandUseErrorActionPreference = $false\n$output = Join-Path $env:GITHUB_WORKSPACE\
        \ '.godot/ci/ui-literal-audit'\nNew-Item -ItemType Directory -Force -Path $output | Out-Null\n# Existing isolated\
        \ runner supplies headless/path/log and fresh user roots.\n& ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId 'worker-a-ui-literals'\
        \ -LogName 'worker-a-ui-literals.log' -EvidenceLogPath '.godot/ci/ui-literal-audit/process.jsonl' -TimeoutSeconds\
        \ 180 -GodotArgs @('--script','res://tools/localization/UiLiteralAudit.gd') *>&1 | Tee-Object -FilePath \"$output/driver.log\"\
        \n$result = $LASTEXITCODE\nforeach ($name in @('ui_literal_disposition','script_ui_disposition')) {\n  $source = \"\
        evidence/phase_2r/localization/$name.json\"\n  if (Test-Path -LiteralPath $source) { Copy-Item -LiteralPath $source\
        \ -Destination \"$output/$name.json\" }\n}\nif ($result -ne 0) { exit $result }\n$log = '.godot/phase2r_logs/worker-a-ui-literals.log'\n\
        if (Select-String -LiteralPath $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected\
        \ NUL character' -Quiet) { throw 'UI literal audit reported errors.' }\nforeach ($name in @('ui_literal_disposition','script_ui_disposition'))\
        \ {\n  $report = Get-Content -LiteralPath \"$output/$name.json\" -Raw | ConvertFrom-Json\n  if (@($report.failures).Count\
        \ -ne 0 -or @($report.records).Count -eq 0) { throw \"UI literal audit failed: $name\" }\n}\nWrite-Host 'UI_LITERAL_AUDIT_VERIFIED'\n"
    - name: Verify unchanged source and import sidecars after generation
      id: pre_tests
      if: ${{ !cancelled() && steps.import.outcome == 'success' && steps.restore.outcome == 'success' && steps.sidecars.outcome
        == 'success' }}
      shell: python {0}
      run: "import hashlib, json, os, pathlib, stat, subprocess\nroot = pathlib.Path.cwd()\nout = root / '.godot/ci/worker-a-verification'\n\
        source = json.loads((out / 'source.json').read_text(encoding='utf-8'))\ndef git(*args):\n    return subprocess.check_output(['git',\
        \ *args], cwd=root)\nallowed = {'evidence/phase_2r/runtime/game_state_surface.json',\n           'evidence/phase_2r/runtime/save_manager_surface.json',\n\
        \           'evidence/phase_2r/localization/ui_literal_disposition.json',\n           'evidence/phase_2r/localization/script_ui_disposition.json'}\n\
        working = git('diff', '--name-only').decode().splitlines()\nstaged = git('diff', '--cached', '--name-status').decode().splitlines()\n\
        cleanup = ['D\\t.claude/skills/godot-prompter/1.10.0', 'D\\t.claude/skills/superpowers/6.1.1']\nchanged_frozen = [name\
        \ for name, record in source['frozen_files'].items()\n                  if not (root / name).is_file() or hashlib.sha256((root\
        \ / name).read_bytes()).hexdigest() != record['sha256']]\nuntracked = git('ls-files', '--others', '--exclude-standard',\
        \ '-z').decode('utf-8').split('\\0')[:-1]\nmanifest_bytes = (out/'import-sidecars.json').read_bytes()\nif hashlib.sha256(manifest_bytes).hexdigest()\
        \ != os.environ['DWM_SIDECAR_MANIFEST_SHA256']:\n    raise SystemExit('A_SIDECAR_MANIFEST_MUTATED')\nmanifest = json.loads(manifest_bytes)\n\
        sidecar_changes = []\nfor name, entry in manifest['records'].items():\n    try:\n        path = root\n        for\
        \ part in pathlib.PurePosixPath(name).parts:\n            path = path/part\n            info = path.lstat()\n    \
        \        if stat.S_ISLNK(info.st_mode) or getattr(info,'st_file_attributes',0) & 0x400: raise ValueError('link')\n\
        \        data = path.read_bytes()\n        if not stat.S_ISREG(info.st_mode) or len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest()\
        \ != entry['sha256']:\n            raise ValueError('changed bytes')\n        retained = (root/entry['retained_path']).read_bytes()\n\
        \        if retained != data: raise ValueError('retained evidence changed')\n    except (OSError,ValueError): sidecar_changes.append(name)\n\
        sidecars_ok = manifest['ok'] is True and set(untracked) == set(manifest['records']) and not sidecar_changes\nvalid\
        \ = set(working) <= allowed and sorted(staged) == cleanup and not changed_frozen and sidecars_ok\nreport = {'ok':\
        \ valid, 'working_changed_paths': working, 'staged_changes': staged,\n          'sidecar_changes': sidecar_changes,\
        \ 'sidecars_ok': sidecars_ok,\n          'changed_frozen_files': changed_frozen, 'untracked_nonignored': untracked,\n\
        \          'status_porcelain': git('status', '--porcelain', '--untracked-files=no').decode()}\n(out / 'pre-tests-source.json').write_text(json.dumps(report,\
        \ indent=2) + '\\n', encoding='utf-8')\nif not valid:\n    raise SystemExit('A_DIAGNOSTIC_UNEXPECTED_SOURCE_MUTATION')\n"
      env:
        DWM_SIDECAR_MANIFEST_SHA256: ${{ steps.sidecars.outputs.manifest_sha256 }}
    - name: Retain exact generated outputs and independent outcomes
      id: outcomes
      if: ${{ always() }}
      shell: python {0}
      env:
        DWM_STEPS_JSON: ${{ toJSON(steps) }}
      run: "import hashlib,json,os,pathlib,shutil\nroot=pathlib.Path.cwd();out=root/'.godot/ci/worker-a-verification';out.mkdir(parents=True,exist_ok=True)\n\
        source=json.loads((out/'source.json').read_text())\nfor name in source['allowed_outputs']:\n p=root/name\n if p.is_file():\n\
        \  q=out/'generated'/name;q.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(p,q)\nsteps=json.loads(os.environ['DWM_STEPS_JSON'])\n\
        required=['checkout','identity','cleanup','install','pre_import','import','restore','sidecars','inventories','literals','pre_tests']\n\
        complete=all(steps.get(k,{}).get('outcome')=='success' for k in required)\n(out/'outcomes.json').write_text(json.dumps({'complete':complete,'steps':steps},indent=2)+'\\\
        n',encoding='utf-8')\nfiles=[p for directory in [root/'.godot/ci',root/'.godot/phase2r_logs'] for p in directory.rglob('*')\
        \ if p.is_file()]\n(out/'artifact-files.sha256.json').write_text(json.dumps([{'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}\
        \ for p in sorted(files)],indent=2)+'\\n',encoding='utf-8')\nif not complete:raise SystemExit('INVENTORY_GENERATION_INCOMPLETE')\n"
    - name: Upload all diagnostic evidence even after failure
      id: artifacts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: backup-repair-generated-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/

          .godot/phase2r_logs/

          '
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
