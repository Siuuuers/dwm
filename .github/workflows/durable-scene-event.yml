name: Isolated scene-event receipt preparation
on:
  push:
    branches: [codex/durable-scene-event-controller-20261007]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          # The schedule-gate contract inspects its immutable historical seals.
          fetch-depth: 0
          ref: f28ff205f9ed303c99ed88d44e1fd41316ce996b
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record immutable identity before import
        run: |
          New-Item -ItemType Directory -Force -Path .godot/ci | Out-Null
          [ordered]@{source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); controller=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT} | ConvertTo-Json | Tee-Object .godot/ci/pre-import-identity.json
          if ((git rev-parse HEAD) -cne 'f28ff205f9ed303c99ed88d44e1fd41316ce996b' -or (git rev-parse 'HEAD^{tree}') -cne '71deb423b43fb38fc3d8ff069f33e20c51bf9fb2') { throw 'pre-import identity mismatch' }
      - name: Import project
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact product source and record executable identity
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne 'f28ff205f9ed303c99ed88d44e1fd41316ce996b') { throw 'source mismatch' }
          if ((git rev-parse 'HEAD^{tree}') -cne '71deb423b43fb38fc3d8ff069f33e20c51bf9fb2') { throw 'tree mismatch' }
          if (git diff --name-only) { throw 'tracked source changed during import' }
          [ordered]@{source=(git rev-parse HEAD); tree=(git rev-parse 'HEAD^{tree}'); controller=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; executable=$env:GODOT_CONSOLE_PATH; executable_sha256=(Get-FileHash $env:GODOT_CONSOLE_PATH -Algorithm SHA256).Hash.ToLowerInvariant(); version=(& $env:GODOT_CONSOLE_PATH --version)} | ConvertTo-Json | Set-Content .godot/ci/identity.json
      - name: Execute explicit new suites and retained dependency contracts
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('res://tests/unit/test_scene_event_receipt_state.gd','res://tests/integration/test_scene_event_durable_contract.gd')
          $allResults = @()
          $index = 0
          foreach ($path in $paths) {
            $index += 1
            $base = "scene-event-$index"
            $xmlPath = ".godot/ci/$base.xml"
            $arguments = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=',("-gtest=" + $path),'-gexit','-glog=2',("-gjunit_xml_file=res://" + $xmlPath))
            ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId $base -LogName "$base.log" -EvidenceLogPath ".godot/ci/$base.jsonl" -TimeoutSeconds 120 -GodotArgs $arguments
            $result = $LASTEXITCODE
            $log = ".godot/phase2r_logs/$base.log"
            if ($result -ne 0) { Get-Content $log -Tail 160; throw "focused suite failed: $path ($result)" }
            if (Select-String -Path $log -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw "invalid engine output: $path" }
            [xml]$xml = Get-Content $xmlPath -Raw
            if ($xml.SelectNodes('//failure | //error | //skipped').Count -ne 0) { throw "failed or skipped tests: $path" }
            $results = @($xml.SelectNodes('//testsuite') | ForEach-Object { [ordered]@{name=$_.GetAttribute('name'); cases=$_.SelectNodes('./testcase').Count} })
            $relative = $path.Replace('res://','')
            $matching = @($results | Where-Object { $_.name.Replace('res://','') -ceq $relative })
            if ($matching.Count -ne 1 -or $matching[0].cases -eq 0) { throw "requested suite not executed: $path" }
            $allResults += $results
            $allResults | ConvertTo-Json | Set-Content .godot/ci/executed-suites.json
          }
          Get-Content .godot/ci/executed-suites.json
      - name: Verify persistence and actual historical alias controls
        timeout-minutes: 10
        run: |
          ./tools/testing/Invoke-CloudTests.ps1 -Suite persistence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$xml = Get-Content .godot/ci/persistence.xml -Raw
          if ($xml.SelectNodes('//failure | //error | //skipped').Count -ne 0) { throw 'persistence failures or skips' }
          if ($xml.SelectNodes('//testcase').Count -ne 235) { throw 'unexpected persistence case census' }
          $marker = 'RESTORE_ALIAS_CONTROL: six historical directions observed; nested dictionary/array aliases reproduced'
          $markers = @(Get-Content .godot/phase2r_logs/cloud-persistence.log | Where-Object { $_ -ceq $marker })
          if ($markers.Count -ne 1) { throw 'historical alias controls not observed exactly once' }
          Write-Host $markers[0]
      - name: Validate committed inventories without regeneration
        run: |
          ./tools/testing/Invoke-PublicSurfaceValidation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git restore -- evidence/phase_2r/runtime/game_state_surface.json evidence/phase_2r/runtime/save_manager_surface.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git diff --name-only) { throw 'tracked product source changed' }
      - name: Verify tracked source remains clean
        run: |
          if (git diff --name-only) { throw 'tracked product source changed during proof' }
      - name: Retain original logs reports and generated bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-event-durable-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/
            .godot/phase2r_logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
