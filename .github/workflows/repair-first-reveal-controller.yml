name: Materialize corrected first-Reveal controller
on:
  push:
    branches:
      - codex/scene-runtime-integration-controller-20261009
    paths:
      - '.github/workflows/repair-first-reveal-controller.yml'
permissions:
  contents: read
concurrency:
  group: repair-first-reveal-controller
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/scene-runtime-integration-controller-20261009
      - name: Decode embedded GDScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/windows-tests.yml')
          text = workflow.read_text(encoding='utf-8')
          old = "'''.replace('          ', '')"
          new = "'''.replace('          ', '').replace(r'\\t', '\t').replace(r'\\\\', '\\')"
          count = text.count(old)
          if count != 6:
              raise SystemExit(f'expected 6 embedded raw blocks, found {count}')
          workflow.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY
          git diff --check -- .github/workflows/windows-tests.yml
          mkdir -p corrected-controller/.github/workflows
          cp .github/workflows/windows-tests.yml corrected-controller/.github/workflows/windows-tests.yml
          sha256sum corrected-controller/.github/workflows/windows-tests.yml | tee corrected-controller/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-first-reveal-controller-${{ github.run_id }}
          path: corrected-controller
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
