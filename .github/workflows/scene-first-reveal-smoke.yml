name: Scene first Reveal smoke

on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-smoke.yml'

permissions:
  contents: read
  actions: read

jobs:
  first-reveal-smoke:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.ref == 'codex/scene-runtime-integration-controller-20261009'
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
        working-directory: source
    steps:
      - name: Preserve source bytes
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: controller

      - uses: actions/checkout@v7
        with:
          ref: 8ead20846f830d7e4227b6650c5bd24b9038d5d7
          path: source

      - name: Recover corrected owner patch
        uses: actions/download-artifact@v4
        with:
          name: scene-first-reveal-diagnostic-38096004796-1
          path: inherited
          github-token: ${{ github.token }}
          repository: Siuuuers/dwm
          run-id: 38096004796

      - name: Apply exact Profile admission repair
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import hashlib
          import pathlib
          import subprocess

          def replace_exact(path, old, new):
              text = path.read_text(encoding='utf-8')
              assert text.count(old) == 1
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')

          patches = list(pathlib.Path('../inherited').rglob('candidate-corrected.patch'))
          assert len(patches) == 1
          patch = patches[0].read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'da9dee3a23cc3229516822cbe916de0da85733958f01c50e8d1bb636496b45c5'
          pathlib.Path('.godot/ci').mkdir(parents=True, exist_ok=True)
          pathlib.Path('.godot/ci/candidate-owner.patch').write_bytes(patch)
          subprocess.run(['git','apply','--index','--binary','.godot/ci/candidate-owner.patch'], check=True)

          ledger = pathlib.Path('scripts/profile/DatingAttemptLedger.gd')
          replace_exact(ledger,
              '\telif mode == "fresh":\n\t\tif record.board != null or (record.phase not in ["ready", "preparing", "preparation_failed"] if scene else record.phase != "challenge"):\n\t\t\treturn _fail(&"dating_fresh_entry_required")\n',
              '\telif mode == "fresh":\n\t\tif scene:\n\t\t\tif not _valid_fresh_scene_entry(record, first_cell_index):\n\t\t\t\treturn _fail(&"dating_fresh_entry_required")\n\t\telif record.board != null or record.phase != "challenge":\n\t\t\treturn _fail(&"dating_fresh_entry_required")\n')
          helper = '''static func _valid_fresh_scene_entry(record: Dictionary, first_cell: int) -> bool:\n\tif record.board == null:\n\t\treturn first_cell == -1 and record.phase in ["ready", "preparing", "preparation_failed"]\n\tif first_cell < 0 or record.phase not in ["active", "terminal"]:\n\t\treturn false\n\tif int(record.envelope.forced_cell) >= 0 and first_cell != int(record.envelope.forced_cell):\n\t\treturn false\n\tvar initial: Dictionary = REDUCER.first_reveal(_layout(record.board), first_cell, record.envelope.shell)\n\tif not initial.get("ok", false): return false\n\tvar plain: Dictionary = ENVELOPE.plain_frontier(initial.value.board)\n\treturn plain.get("ok", false) and plain.value == record.board\n\n'''
          replace_exact(ledger,
              'static func _prepare_scene_flat(ledger: Dictionary, run_id: String, slot_id: String, branch_id: String,\n',
              helper + 'static func _prepare_scene_flat(ledger: Dictionary, run_id: String, slot_id: String, branch_id: String,\n')

          test = pathlib.Path('tests/unit/test_scene_first_reveal.gd')
          replace_exact(test,
              'const FIXTURE := preload("res://tests/support/SceneChallengeFixture.gd")\n',
              'const FIXTURE := preload("res://tests/support/SceneChallengeFixture.gd")\nconst LEDGER := preload("res://scripts/profile/DatingAttemptLedger.gd")\nconst REDUCER := preload("res://scripts/domain/minesweeper/MinesweeperBoardReducer.gd")\n')
          replace_exact(test,
              'func before_each() -> void:\n\tf = FIXTURE.new()\n\tassert_true(f.setup("TEST.scene.first_reveal").ok)\n\tassert_true(f.begin().ok)\n',
              'func _arm_unfinished_layout() -> void:\n\tvar mines: Array = []\n\tfor index in 33: mines.append(index)\n\tmines.append_array([288, 289, 307])\n\tf.generation.arm_materialize({"schema_version": 1, "width": 18, "height": 18,\n\t\t"mine_indices": mines, "mine_count": 36})\n\nfunc before_each() -> void:\n\tf = FIXTURE.new()\n\tassert_true(f.setup("TEST.scene.first_reveal").ok)\n\t_arm_unfinished_layout()\n\tassert_true(f.begin().ok)\n')
          with test.open('a', encoding='utf-8', newline='') as handle:
              handle.write('''\nfunc test_fresh_profile_entry_refuses_a_prebuilt_second_action() -> void:\n\tassert_true(_reveal(323).ok)\n\tvar attempt: Dictionary = f.attempt().value.duplicate(true)\n\tvar record: Dictionary = attempt.record.duplicate(true)\n\tvar covered := -1\n\tfor index in int(record.board.width) * int(record.board.height):\n\t\tif not record.board.revealed_indices.has(index) and not record.board.flagged_indices.has(index):\n\t\t\tcovered = index\n\t\t\tbreak\n\tassert_gte(covered, 0)\n\tif covered < 0: return\n\tvar marked: Dictionary = REDUCER.set_flag(record.board, covered, true, "extra.after-first-reveal")\n\tassert_true(marked.ok, str(marked))\n\tif not marked.ok: return\n\trecord.board = marked.value.board\n\tassert_true(LEDGER.validate_record(record))\n\tvar rejected: Dictionary = LEDGER.prepare_update({}, str(attempt.run_id), str(attempt.slot_id),\n\t\tstr(attempt.branch_id), record, 0, int(attempt.materialization_receipt.first_cell_index), {}, {"mode": "fresh"})\n\tassert_false(rejected.ok, str(rejected))\n\tassert_eq(rejected.get("code"), &"dating_fresh_entry_required")\n''')
          subprocess.run(['git','add','--all'], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install exact engine
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90') { throw 'engine hash mismatch' }
          $dir = Join-Path $env:RUNNER_TEMP 'godot'
          Expand-Archive $archive $dir
          $console = Join-Path $dir 'Godot_v4.6.3-stable_win64_console.exe'
          "GODOT_CONSOLE_PATH=$console" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import and execute first-Reveal suite
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path (Get-Location) '.godot/ci'
          $env:APPDATA = Join-Path $out 'appdata'
          $env:LOCALAPPDATA = Join-Path $out 'localappdata'
          $env:DWM_TEST_ROOT = Join-Path $out 'root'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA,$env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path (Get-Location) --import --log-file "$out/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String "$out/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'import error' }
          $args = @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gtest=res://tests/unit/test_scene_first_reveal.gd','-gexit','-glog=2','-gjunit_xml_file=res://.godot/ci/first-reveal.xml')
          & './tools/testing/Invoke-IsolatedGodot.ps1' -SuiteId 'first-reveal-smoke' -LogName 'first-reveal.log' -GodotArgs $args -EvidenceLogPath '.godot/ci/first-reveal.jsonl' -TimeoutSeconds 240
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify exact smoke census
        run: |
          @'
          import collections, pathlib, re, xml.etree.ElementTree as ET
          script = pathlib.Path('tests/unit/test_scene_first_reveal.gd')
          expected = re.findall(r'^func (test_\w+)\(', script.read_text(encoding='utf-8'), re.M)
          root = ET.parse('.godot/ci/first-reveal.xml').getroot()
          rows = list(root.iter('testcase'))
          assert collections.Counter(x.attrib['name'] for x in rows) == collections.Counter(expected)
          assert rows and all(x.attrib.get('status') == 'pass' and int(x.attrib.get('assertions','0')) > 0 for x in rows)
          assert not any(list(root.iter(tag)) for tag in ['failure','error','skipped'])
          pathlib.Path('.godot/ci/smoke-result.txt').write_text(f'{len(rows)} cases, {sum(int(x.attrib["assertions"]) for x in rows)} assertions\n', encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-first-reveal-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/.godot/ci
            source/.godot/phase2r_logs
            !source/.godot/ci/appdata
            !source/.godot/ci/localappdata
            !source/.godot/ci/root
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7