name: Native audio comparison

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gd-libvgm-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/audio_prototype
            scripts/audio
          persist-credentials: true
      - name: Prepare disposable checkout cleanup
        run: git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build tools
        run: python -m pip install scons==4.11.1
      - name: Build pinned gd_libvgm debug and release
        run: python tools/audio_prototype/build_gd_libvgm.py
      - name: Compare playback and launch Windows export
        run: python tools/audio_prototype/compare_gd_libvgm.py
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gd-libvgm-Windows
          path: |
            tools/audio_prototype/reports/gd_libvgm/*.log
            tools/audio_prototype/reports/gd_libvgm/*.json
            tools/audio_prototype/reports/gd_libvgm/version.txt
          if-no-files-found: error
          retention-days: 7
