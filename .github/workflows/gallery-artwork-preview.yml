name: Gallery artwork preview
on:
  pull_request:
    paths:
      - 'art/pictures/**'
      - 'data/manifests/art_placements.json'
      - 'scripts/ui/gallery/ArtworkGallery.gd'
      - 'tests/ui/render_release_artwork.gd'
      - '.github/workflows/gallery-artwork-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-artwork-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/gallery-release/test-root
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/gallery-release/data
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prepare disposable checkout
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          git submodule foreach --recursive 'true'
          mkdir -p .godot/ci/gallery-release "$DWM_TEST_ROOT" "$XDG_DATA_HOME"
          git rev-parse HEAD > .godot/ci/gallery-release/candidate-sha.txt
      - name: Install pinned Godot and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri libspeechd2
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' --output "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' 'd0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3' "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_CONSOLE_PATH=$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: |
          "$GODOT_CONSOLE_PATH" --headless --path . --import --log-file .godot/ci/gallery-release/import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error' .godot/ci/gallery-release/import.log; then exit 1; fi
          git restore -- project.godot
      - name: Verify display discoveries and capture all five artworks
        run: |
          xvfb-run -a -s '-screen 0 1280x1008x24' "$GODOT_CONSOLE_PATH" --path . --rendering-method gl_compatibility --audio-driver Dummy --log-file .godot/ci/gallery-release/capture.log -s res://tests/ui/render_release_artwork.gd
          python -c "import json,pathlib; p=pathlib.Path('.godot/ci/gallery-release'); assert json.loads((p/'checks.json').read_text())['ok']; assert len(list(p.glob('*.png'))) == 19"
      - name: Run artwork and settings regression tests with rendering
        run: |
          xvfb-run -a -s '-screen 0 1280x1008x24' "$GODOT_CONSOLE_PATH" --path . --rendering-method gl_compatibility --audio-driver Dummy -s res://addons/gut/gut_cmdln.gd -gconfig= -gtest=res://tests/integration/test_artwork_gallery.gd,res://tests/scene/test_settings_localization_scene.gd -gexit -glog=1 -gjunit_xml_file=res://.godot/ci/gallery-release/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-artwork-${{ github.run_id }}-${{ github.run_attempt }}
          path: .godot/ci/gallery-release/
          include-hidden-files: true
          retention-days: 7
