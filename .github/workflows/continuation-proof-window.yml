name: Continuation proof window verification
on:
  push:
    branches: [codex/continuation-proof-window-checks-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: continuation-proof-window-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        lane: [focused, comparison]
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # Defer credential removal until the post-job cleanup, after the
          # malformed gitlinks are removed from this disposable runner's index.
          persist-credentials: true
      - name: Prepare disposable checkout for credential cleanup
        run: |
          $ErrorActionPreference = 'Stop'
          # These legacy tooling gitlinks have no .gitmodules URLs. Git's
          # submodule foreach reads the index even with sparse checkout.
          # The source commit and working files remain unchanged.
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule foreach --recursive 'true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Godot 4.6.3 standard
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
          # SHA256 published with the official 4.6.3-stable release asset.
          $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Godot archive checksum mismatch.'
          }
          $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
          Expand-Archive -LiteralPath $archive -DestinationPath $editor
          $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
          if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
          "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $console --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import project
        if: matrix.lane == 'focused'
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
          $env:APPDATA = Join-Path $output 'import-user/appdata'
          $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
          $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
          New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
          & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
            throw 'Project import reported script errors; inspect import.log.'
          }
      - name: Restore committed project settings after editor import
        if: matrix.lane == 'focused'
        run: |
          # Dialogic's editor scan rewrites its timeline lookup during import.
          # Execute the committed configuration with the freshly imported assets.
          git restore -- project.godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify journal cache and storage retry contracts
        if: matrix.lane == 'focused'
        timeout-minutes: 20
        run: |
          ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId continuation-proof-window -LogName continuation-proof-window.log -EvidenceLogPath .godot/ci/continuation-proof-window.jsonl -TimeoutSeconds 1100 -GodotArgs @('-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/unit/test_continuation_serialization_cache.gd,res://tests/unit/test_scene_restore_journal.gd,res://tests/unit/test_new_run_durability_journal.gd,res://tests/unit/test_json_file_storage.gd,res://tests/unit/test_desktop_continuation_operation_journal.gd', '-gexit', '-glog=1', '-gjunit_xml_file=res://.godot/ci/continuation-proof-window.xml')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify focused case census
        if: matrix.lane == 'focused'
        shell: python {0}
        run: |
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('.godot/ci/continuation-proof-window.xml').getroot()
          cases = list(root.iter('testcase'))
          assert len(cases) == 75, f'Expected 75 cases, got {len(cases)}'
          assert all(c.get('status') == 'pass' for c in cases)
          assert not list(root.iter('failure')) + list(root.iter('error')) + list(root.iter('skipped'))
          result = {'tests': len(cases), 'assertions': sum(int(c.get('assertions', 0)) for c in cases)}
          Path('.godot/ci/focused-result.json').write_text(json.dumps(result, indent=2) + '\n')
          print('CONTINUATION_FOCUSED_VERIFIED ' + json.dumps(result))
      - name: Compare fresh Save9 and fresh-process Load
        if: matrix.lane == 'comparison'
        timeout-minutes: 45
        run: ./tools/testing/Invoke-FreshSaveLoadComparison.ps1 -BaseRef 9db0b69f49266c26776dedd29e3b61a410c46002
      - name: Preserve preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-proof-window-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .godot/ci/
            .godot/phase2r_logs/
            evidence/phase_2r/runtime/game_state_surface.json
            evidence/phase_2r/runtime/save_manager_surface.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
