name: Aged transition attribution
on:
  push:
    branches: [codex/aged-transition-profile]
permissions:
  contents: read
jobs:
  journey:
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Prepare checkout and renderer
        run: |
          git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2 speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng
          curl --fail --location --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip --output "$RUNNER_TEMP/godot.zip"
          printf '%s  %s\n' d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3 "$RUNNER_TEMP/godot.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64"
          echo "GODOT_CONSOLE_PATH=$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Start native Linux speech service
        run: bash tools/testing/start_cloud_speech.sh
      - name: Import once
        env:
          DWM_TEST_ROOT: ${{ runner.temp }}/dtl-import/test
          XDG_DATA_HOME: ${{ runner.temp }}/dtl-import/data
        run: |
          mkdir -p "$DWM_TEST_ROOT" "$XDG_DATA_HOME" .godot/ci/retirement
          "$GODOT_CONSOLE_PATH" --headless --path . --import > .godot/ci/retirement/import.log 2>&1
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load' .godot/ci/retirement/import.log; then exit 1; fi
          git restore -- project.godot
      - name: Select source and install observation overlay
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = baseline ]; then
            git show HEAD^:scripts/application/narrative/SceneEventCommandPort.gd > scripts/application/narrative/SceneEventCommandPort.gd
          fi
          python tools/testing/aged_transition_profile.py "$PWD"
      - name: Naturally reach and measure aged Day7 result
        shell: python
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          import os, pathlib, subprocess, json, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          output = root / '.godot/ci/late-transition'
          output.mkdir(parents=True, exist_ok=True)
          env = os.environ.copy()
          folder = root / '.godot/phase2r_tests/aged-transition' / env['VARIANT']
          env['DWM_TEST_ROOT'] = str(folder / 'test')
          env['XDG_DATA_HOME'] = str(folder / 'data')
          pathlib.Path(env['DWM_TEST_ROOT']).mkdir(parents=True)
          pathlib.Path(env['XDG_DATA_HOME']).mkdir(parents=True)
          report = output / 'aged.xml'
          command = ['xvfb-run', '-a', '-s', '-screen 0 1920x1080x24', env['GODOT_CONSOLE_PATH'], '--path', str(root), '--rendering-method', 'gl_compatibility', '--audio-driver', 'Dummy', '-s', 'res://addons/gut/gut_cmdln.gd', '-gconfig=', '-gtest=res://tests/integration/late_transition_seed.gd', '-gexit', '-glog=1', '-gjunit_xml_file=' + str(report)]
          with (output / 'aged.log').open('w') as log:
              result = subprocess.run(command, env=env, stdout=log, stderr=subprocess.STDOUT, timeout=1200)
          cases = ET.parse(report).findall('.//testcase') if report.exists() else []
          good = result.returncode == 0 and len(cases) == 1 and all(c.find('failure') is None and c.find('error') is None and c.find('skipped') is None and int(c.get('assertions', '0')) > 0 for c in cases)
          print(env['VARIANT'], 'PASS' if good else 'FAIL', flush=True)
          if not good:
              print((output / 'aged.log').read_text()[-12000:], flush=True)
              raise SystemExit(1)
          observed = json.loads((output / 'aged.json').read_text())
          assert [r['line_id'] for r in observed['timings']] == ['line.Day7.A.001', 'line.Day7.A.002']
          assert all(r.get('costs') and 'spans' in r for r in observed['timings'])
          print(env['VARIANT'], [(r['line_id'], r['elapsed_ms']) for r in observed['timings']], flush=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aged-transition-${{ matrix.variant }}
          path: .godot/ci/
          include-hidden-files: true
          retention-days: 7
