name: Steam private upload
run-name: Steam ${{ inputs.mode || 'upload' }} - playtest self-talk and UI corrections 554bfd5 - game.exe
permissions:
  contents: read
  actions: read
concurrency:
  group: steam-app-5199120
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Upload verified playtest build 554bfd5'
    name: Export playtest self-talk and UI corrections build
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: true
        ref: 554bfd5f9a2bcb97c940b25c04c899b60729199e
    - name: Prepare disposable checkout for credential cleanup
      run: |
        $ErrorActionPreference = 'Stop'
        # These legacy tooling gitlinks have no .gitmodules URLs. Git's
        # submodule foreach reads the index even with sparse checkout.
        # The source commit and working files remain unchanged.
        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git submodule foreach --recursive 'true'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify authored story catalogs
      run: |-
        python tools/localization/validate_story_catalogs.py
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install Godot 4.6.3 standard
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
        Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
        # SHA256 published with the official 4.6.3-stable release asset.
        $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Godot archive checksum mismatch.'
        }
        $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
        Expand-Archive -LiteralPath $archive -DestinationPath $editor
        $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
        "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & $console --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Import project
      timeout-minutes: 8
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
        $env:APPDATA = Join-Path $output 'import-user/appdata'
        $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
        $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
          throw 'Project import reported script errors; inspect import.log.'
        }
    - name: Restore committed project settings after editor import
      run: |
        # Dialogic's editor scan rewrites its timeline lookup during import.
        # Execute the committed configuration with the freshly imported assets.
        git restore -- project.godot
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Cache pinned export templates
      id: export-templates-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/dwm-godot-templates/Godot_v4.6.3-stable_export_templates.tpz
        key: godot-4.6.3-export-templates-3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8
    - name: Download verified Godot export templates
      timeout-minutes: 10
      run: |
        $ErrorActionPreference = 'Stop'
        $folder = Join-Path $env:RUNNER_TEMP 'dwm-godot-templates'
        New-Item -ItemType Directory -Force -Path $folder | Out-Null
        $archive = Join-Path $folder 'Godot_v4.6.3-stable_export_templates.tpz'
        if (-not (Test-Path -LiteralPath $archive)) {
          Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz' -OutFile $archive
        }
        $expected = '3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Godot export templates checksum mismatch.'
        }
        "GODOT_EXPORT_TEMPLATES_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Retain verified export templates for subsequent runs
      if: steps.export-templates-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/dwm-godot-templates/Godot_v4.6.3-stable_export_templates.tpz
        key: godot-4.6.3-export-templates-3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8
    - name: Extend package audit for the selected media
      shell: python
      run: |
        from pathlib import Path
        p = Path('tools/testing/Invoke-WindowsExportValidation.ps1')
        s = p.read_text(encoding='utf-8-sig')
        # Export and smoke-test the final Steam filenames together.
        assert "'DWM.exe'" in s and "'DWM.pck'" in s
        s = s.replace('DWM.exe', 'game.exe').replace('DWM.pck', 'game.pck')
        marker = '$expected | ConvertTo-Json -Depth 3'
        assert s.count(marker) == 1
        music_import = Path('audio/bgm/menu_theme.ogg.import').read_text(encoding='utf-8')
        import re
        imported_path = re.search(r'^path="(res://\.godot/imported/[^"]+)"$', music_import, re.M)
        assert imported_path, 'Title music imported-resource path missing'
        resource = imported_path[1]
        assert Path(resource.removeprefix('res://')).is_file()
        s = s.replace(marker, "$expected['" + resource + "'] = (Get-FileHash -LiteralPath (Join-Path $repositoryRoot '" + resource.removeprefix('res://') + "') -Algorithm SHA256).Hash.ToLowerInvariant()\n    " + marker)
        marker = '    var license_directory: String = OS.get_cmdline_user_args()[1]'
        assert s.count(marker) == 1
        probe = '''    for resource: String in ["res://art/pictures/picture1.jpg", "res://art/pictures/picture2.jpg", "res://art/pictures/picture3.jpg", "res://art/pictures/picture4.jpg", "res://art/pictures/picture5.jpg", "res://assets/ui/contacts/fonts/dejavu-sans-fallback.ttf"]:
                if ResourceLoader.load(resource) == null:
                    push_error("Required localized media resource cannot load: " + resource)
                    quit(1)
                    return
        '''
        probe += '''    var title_music := ResourceLoader.load("res://audio/bgm/menu_theme.ogg") as AudioStreamOggVorbis
            if title_music == null or not title_music.loop or absf(title_music.get_length() - 104.6) > 0.1:
                push_error("Title music missing, wrong duration, or loop disabled")
                quit(1)
                return
        '''
        s = s.replace(marker, probe + marker)
        s = s.replace('["tools", "docs", "evidence",', '[".agents", ".beads", ".claude", ".codex", ".github", "story", "handoff", "game-build", "builds", "tools", "docs", "evidence",')
        p.write_text(s, encoding='utf-8')
        print('Extended package audit only: both music files, five paintings, new font, and development-folder exclusions.')
    - name: Export and launch isolated Windows executable
      timeout-minutes: 12
      run: |-
        ./tools/testing/Invoke-WindowsExportValidation.ps1
    - name: Stage verified runtime package
      shell: python
      run: |
        import hashlib, json, pathlib, shutil, zipfile
        root = pathlib.Path('.godot/ci/windows-export')
        receipt = json.loads((root / 'validation.json').read_text(encoding='utf-8-sig'))
        assert receipt['ok'] and receipt['commit'] == '554bfd5f9a2bcb97c940b25c04c899b60729199e'
        dest = pathlib.Path('steam-package')
        dest.mkdir()
        with zipfile.ZipFile(root / 'DWM-windows-x86_64-validation.zip') as archive:
            archive.extractall(dest)
        (dest / 'validation.json').unlink()
        actual = {p.relative_to(dest).as_posix() for p in dest.rglob('*') if p.is_file()}
        assert {'game.exe', 'game.pck'} <= actual
        assert not {'DWM.exe', 'DWM.pck'} & actual
        expected = {entry['path'] for entry in receipt['files']}
        assert actual == expected
        for entry in receipt['files']:
            p = dest / entry['path']
            assert hashlib.sha256(p.read_bytes()).hexdigest() == entry['sha256']
        assert (dest / 'licenses/audio/bgm/CLASSICAL_MUSIC_NOTICES.txt').is_file()
        assert any(p.name == 'DEJAVU-LICENSE.txt' for p in dest.rglob('*'))
        shutil.copy2(root / 'validation.json', 'steam-package-receipt.json')
        print('Clean runtime package matches every file in the successful export receipt.')
    - name: Retain clean game build
      uses: actions/upload-artifact@v4
      with:
        name: steam-localized-package
        path: steam-package/
        if-no-files-found: error
        retention-days: 7
    - name: Retain package receipt
      uses: actions/upload-artifact@v4
      with:
        name: steam-localized-receipt
        path: steam-package-receipt.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload Windows validation build and evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-export-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/import.log

          .godot/ci/windows-export/

          '
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
  steam:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - name: Download the selected run’s verified runtime package
      uses: actions/download-artifact@v4
      with:
        name: steam-localized-package
        path: game-build
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Download the selected run’s export receipt
      uses: actions/download-artifact@v4
      with:
        name: steam-localized-receipt
        path: receipt
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
    - name: Validate package, preview mappings, and optionally upload
      shell: python
      env:
        STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
        STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        UPLOAD_MODE: ${{ inputs.mode || 'upload' }}
      run: |
        import base64, json, hashlib, os, pathlib, re, shutil, subprocess, sys, urllib.request, zipfile
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dwm-steam'
        root.mkdir()
        sdk = root / 'steamcmd'
        sdk.mkdir()
        content = root / 'content'
        content.mkdir()
        output = root / 'output'
        output.mkdir()
        summary = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
        def report(message):
            print(message)
            with summary.open('a', encoding='utf-8') as f:
                f.write(message + '\n\n')
        def stop(message):
            report(message)
            sys.exit(1)
        username = os.environ.pop('STEAM_USERNAME', '')
        encoded = os.environ.pop('STEAM_CONFIG_VDF', '')
        if not username or not encoded:
            stop('Missing STEAM_USERNAME or STEAM_CONFIG_VDF repository secret.')
        try:
            config = base64.b64decode(re.sub(r'\s+', '', encoded), validate=True)
        except Exception:
            stop('STEAM_CONFIG_VDF is not valid Base64. Remove certificate wrapper lines and encode the original file again.')
        if b'InstallConfigStore' not in config:
            stop('Decoded configuration is not a Steam config.vdf. Check the source file privately.')
        source = pathlib.Path('game-build')
        receipt = json.loads(pathlib.Path('receipt/steam-package-receipt.json').read_text(encoding='utf-8-sig'))
        if not receipt['ok'] or receipt['commit'] != '554bfd5f9a2bcb97c940b25c04c899b60729199e':
            stop('Export receipt does not identify the requested validated source.')
        expected = {entry['path'] for entry in receipt['files']}
        actual = {p.relative_to(source).as_posix() for p in source.rglob('*') if p.is_file()}
        if not {'game.exe', 'game.pck'} <= actual or {'DWM.exe', 'DWM.pck'} & actual:
            stop('Package must contain game.exe and game.pck with no old DWM pair.')
        if expected != actual:
            stop('Downloaded package does not match the export receipt file list.')
        for entry in receipt['files']:
            p = source / entry['path']
            if hashlib.sha256(p.read_bytes()).hexdigest() != entry['sha256']:
                stop('Downloaded runtime file hash mismatch.')
        shutil.copytree(source, content, dirs_exist_ok=True)
        files = sorted(p for p in content.rglob('*') if p.is_file())
        report('Runtime source: 554bfd5f9a2bcb97c940b25c04c899b60729199e. Accepted playtest corrections from PR 145; 15 temporary production thought bindings, enclosed choice row, compact computer controls and expanded save ink. Fresh Windows export verified; broader deferred features remain outside this claim.')
        report('AppID 5199120; DepotID 5199121. No SetLive directive. This is an upload test, not release approval.')
        for p in files:
            report(p.relative_to(content).as_posix() + ' — SHA256 ' + hashlib.sha256(p.read_bytes()).hexdigest())
        archive = root / 'steamcmd.zip'
        urllib.request.urlretrieve('https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip', archive)
        with zipfile.ZipFile(archive) as z:
            z.extractall(sdk)
        executable = str(sdk / 'steamcmd.exe')
        def invoke(args, limit, stage):
            report('SteamCMD stage: ' + stage)
            try:
                result = subprocess.run([executable] + args, cwd=sdk, stdin=subprocess.DEVNULL,
                    stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=limit)
            except subprocess.TimeoutExpired:
                stop('SteamCMD ' + stage + ' timed out. A fresh private SteamCMD login may be needed; no raw authentication logs were published.')
            text = result.stdout.decode('utf-8', errors='replace')
            if stage == 'bootstrap':
                print(text[-6000:])  # No account or configuration has been supplied yet.
                # Observed Windows updater returned 7 after completing its update.
                # Retry only this unauthenticated stage once; never accept 7 as success.
                if result.returncode == 7 and re.search(r'Update complete, launching', text, re.I):
                    report('SteamCMD completed its self-update with exit 7; checking the updated client once.')
                    try:
                        result = subprocess.run([executable] + args, cwd=sdk, stdin=subprocess.DEVNULL,
                            stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=limit)
                    except subprocess.TimeoutExpired:
                        stop('Updated SteamCMD bootstrap timed out before authentication.')
                    text = result.stdout.decode('utf-8', errors='replace')
                    print(text[-6000:])
            if result.returncode != 0 or re.search(r'ERROR!|Login Failure|FAILED \(', text, re.I):
                reasons = [label for pattern, label in [
                    (r'Invalid Password|InvalidPassword', 'invalid cached login'),
                    (r'Access Denied|AccessDenied|insufficient privilege', 'account permissions rejected'),
                    (r'Steam Guard|two.factor|auth.*code', 'Steam Guard authentication required'),
                    (r'needs to be online|download failed|connection failed', 'Steam service connection failed'),
                    (r'Invalid App|Invalid Depot', 'app or depot configuration rejected')
                ] if re.search(pattern, text, re.I)]
                stop('SteamCMD ' + stage + ' failed (exit ' + str(result.returncode) + '): ' + (', '.join(reasons) or 'unclassified SteamCMD error') + '. Raw logs are withheld to protect authentication material.')
            return text
        try:
            invoke(['+quit'], 180, 'bootstrap')
            (sdk / 'config').mkdir(exist_ok=True)
            (sdk / 'config' / 'config.vdf').write_bytes(config)
            config = b''
            encoded = ''
            script = root / 'app_build_5199120.vdf'
            def build(preview):
                script.write_text('"AppBuild" { "AppID" "5199120" "Desc" "DWM playtest self-talk and UI corrections source 554bfd5" '
                    + '"ContentRoot" "' + content.as_posix() + '" "BuildOutput" "' + output.as_posix()
                    + '" "Preview" "' + str(preview) + '" "Depots" { "5199121" { '
                    + '"FileMapping" { "LocalPath" "*" "DepotPath" "." "Recursive" "1" } } } }', encoding='utf-8')
                return invoke(['+@ShutdownOnFailedCommand', '1', '+@NoPromptForPassword', '1',
                    '+login', username, '+run_app_build', str(script), '+quit'], 480, 'preview' if preview else 'upload')
            build(1)
            manifests = list(output.glob('*manifest*'))
            if not any(p.is_file() and p.stat().st_size > 0 for p in manifests):
                stop('Preview returned without a nonempty manifest. Upload was not attempted.')
            report('SteamPipe preview completed and produced a nonempty manifest. Only the staged runtime files are mapped.')
            if os.environ['UPLOAD_MODE'] == 'upload':
                text = build(0)
                match = re.search(r'Successfully finished AppID 5199120 build \(BuildID (\d+)\)', text, re.I)
                if not match:
                    stop('No confirmed BuildID was returned. Check Steamworks Builds before retrying; an upload may have completed.')
                report('Uploaded BuildID: ' + match.group(1) + '. No Steam branch was set live.')
            else:
                report('Preview only: no content uploaded. Run again with mode upload when ready.')
        finally:
            shutil.rmtree(root, ignore_errors=True)
    - name: Remove temporary authentication and upload data
      if: always()
      shell: pwsh
      run: |-
        Remove-Item -LiteralPath "$env:RUNNER_TEMP/dwm-steam" -Recurse -Force -ErrorAction SilentlyContinue
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
'on':
  push:
    branches: [build/playtest-ui-20261028]
  workflow_dispatch:
    inputs:
      mode:
        description: Preview only, or preview then upload (never sets a branch live)
        type: choice
        options:
        - preview
        - upload
        default: preview
        required: true
