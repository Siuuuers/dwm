name: P-L source archive (temporary PR 3 helper)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pl-source-export.yml'

permissions:
  contents: write

jobs:
  archive:
    if: github.repository == 'Siuuuers/dwm' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'story/pl-workspace-foundation-2026-10-01'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retain exact original and uploaded source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DELTA_COMMIT: 4f00a13b3fb16ee6be411192fc881595224299b9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          base = 'c8a67a221f45ab37ad318dfacc7c204d68590b7c'
          branch = 'archive/pl-narrative-sources-2026-10-01'
          path = 'docs/story-auditions/Our_PL.md'
          token = base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env = os.environ.copy()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+token,
              GIT_AUTHOR_NAME='github-actions[bot]', GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_NAME='github-actions[bot]', GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','init','source-git'],check=True)
          def git(*args, data=None):
              return subprocess.run(['git','-C','source-git',*args],input=data,stdout=subprocess.PIPE,check=True,env=env).stdout
          git('remote','add','origin','https://github.com/Siuuuers/dwm.git')
          git('fetch','--no-tags','origin',base,os.environ['EXPECTED_DELTA_COMMIT'],'refs/heads/'+branch)
          current = git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]
          raw = git('show',base+':'+path)
          assert git('hash-object','--stdin',data=raw).decode().strip() == '0b508f8f674a749ca9dbe7fce0d1885e635baf08'
          delta = json.loads(git('show',os.environ['EXPECTED_DELTA_COMMIT']+':.github/pl-upload-delta.json'))
          lines = raw.decode().splitlines(keepends=True)
          lines[0] = delta['line_1']
          lines[2] = delta['line_3']
          lines[21] = delta['lines_22_24']
          uploaded = ''.join(lines).encode()
          assert uploaded.endswith(b'\n')
          uploaded = uploaded[:-1]
          assert len(uploaded) == 1115494
          assert hashlib.sha256(uploaded).hexdigest() == '9dd985c686b5a2b9c3f01184f738eef05d7db49d63afa3999213390e5406b8a6'
          uploaded_blob = git('hash-object','-w','--stdin',data=uploaded).decode().strip()
          assert uploaded_blob == '9e20a006afc8cb094284f510766d8db78b122b75'
          existing = git('show',current+':'+path)
          if existing == uploaded:
              commit = current
          else:
              assert current == base, 'Archive branch changed; refusing to overwrite it'
              git('read-tree',base)
              git('update-index','--add','--cacheinfo','100644,'+uploaded_blob+','+path)
              tree = git('write-tree').decode().strip()
              commit = git('commit-tree',tree,'-p',base,data=b'docs(archive): retain exact supplied Our_PL snapshot; original remains in parent\n').decode().strip()
              git('push','origin',commit+':refs/heads/'+branch)
          assert git('show',commit+':'+path) == uploaded
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0] == commit
          Path('receipt').mkdir()
          Path('receipt/archive.json').write_text(json.dumps({'original_commit':base,'uploaded_commit':commit,'retained_branch':branch,'uploaded_blob':uploaded_blob,'uploaded_sha256':hashlib.sha256(uploaded).hexdigest(),'uploaded_bytes':len(uploaded),'original_blob':'0b508f8f674a749ca9dbe7fce0d1885e635baf08'},indent=2)+'\n')
          print('ARCHIVE_COMMIT='+commit)
          print('Both exact snapshots verified; PR source files and master remain unchanged.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pl-source-archive-receipt
          path: receipt/
          if-no-files-found: error
          retention-days: 7
