name: P-L consolidation verification (temporary PR 3 helper)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pl-source-export.yml'

permissions:
  contents: write

jobs:
  consolidate:
    if: github.repository == 'Siuuuers/dwm' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'story/pl-workspace-foundation-2026-10-01'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify exact-source migration and fast-forward only PR 3
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ast,base64,hashlib,json,os,shutil,subprocess,sys,tarfile,io
          from pathlib import Path
          base='c8a67a221f45ab37ad318dfacc7c204d68590b7c'
          archive='62fd8bf3966e4df7e03bf52952c6905284845284'
          scripts='abdd6d9d586dc666c802a730c504cfd414830fd4'
          branch='story/pl-workspace-foundation-2026-10-01'
          archive_branch='archive/pl-narrative-sources-2026-10-01'
          head=os.environ['EXPECTED_PR_HEAD']
          token=base64.b64encode(('x-access-token:'+os.environ['GH_TOKEN']).encode()).decode()
          env=os.environ.copy()
          env.update(GIT_CONFIG_COUNT='1',GIT_CONFIG_KEY_0='http.https://github.com/.extraheader',GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+token,
              GIT_AUTHOR_NAME='github-actions[bot]',GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com',
              GIT_COMMITTER_NAME='github-actions[bot]',GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          subprocess.run(['git','init','objects'],check=True)
          def git(*args,data=None):
              return subprocess.run(['git','-C','objects',*args],input=data,stdout=subprocess.PIPE,check=True,env=env).stdout
          git('remote','add','origin','https://github.com/Siuuuers/dwm.git')
          git('fetch','--no-tags','origin',base,archive,scripts,head)
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]==head, 'PR branch moved'
          assert git('ls-remote','origin','refs/heads/'+archive_branch).decode().split()[0]==archive, 'Archive reference changed'
          changed_since=git('diff','--name-only',base,head).decode().splitlines()
          assert all(p.startswith('.github/pl-migration/') or p in ['.github/pl-upload-delta.json','.github/workflows/pl-source-export.yml'] for p in changed_since), changed_since
          Path('source').mkdir()
          tar=git('archive',base,'story','docs','CLAUDE.md')
          with tarfile.open(fileobj=io.BytesIO(tar)) as tf:tf.extractall('source',filter='data')
          Path('source/TRACKED-TREE.txt').write_bytes(git('ls-tree','-r',base))
          upload=git('show',archive+':docs/story-auditions/Our_PL.md')
          assert hashlib.sha256(upload).hexdigest()=='9dd985c686b5a2b9c3f01184f738eef05d7db49d63afa3999213390e5406b8a6'
          Path('Our_PL.md').write_bytes(upload)
          Path('runner').mkdir()
          for name in ['build_consolidation.py','finalize_consolidation.py','verify_consolidation.py','run_migration.py','expected-output.json']:
              Path('runner',name).write_bytes(git('show',scripts+':.github/pl-migration/'+name))
          plan=json.loads(Path('runner/expected-output.json').read_text())
          assert plan['source_commit']==base and plan['archive_commit']==archive
          class StripDocs(ast.NodeTransformer):
              def visit_Expr(self,node):
                  return None if isinstance(node.value,ast.Constant) and isinstance(node.value.value,str) else self.generic_visit(node)
          ast_hash=hashlib.sha256(ast.dump(StripDocs().visit(ast.parse(Path('runner/verify_consolidation.py').read_text())),include_attributes=False).encode()).hexdigest()
          assert ast_hash==plan['verifier_ast_sha256'], 'Verifier semantics differ from locally tested version'
          shutil.copytree('source','candidate')
          Path('receipt').mkdir()
          subprocess.run([sys.executable,'runner/run_migration.py','--root','candidate','--source-dir','source','--upload','Our_PL.md','--report','receipt/verification.json'],check=True)
          report=json.loads(Path('receipt/verification.json').read_text())
          assert report['failed_count']==0 and report['exchanges']==50 and report['source_units']==153 and not report['warnings']
          original={p.relative_to('source').as_posix():p.read_bytes() for p in Path('source').rglob('*') if p.is_file()}
          output={p.relative_to('candidate').as_posix():p.read_bytes() for p in Path('candidate').rglob('*') if p.is_file()}
          verifier='story/maintenance/verify_consolidation.py'
          actual={p:hashlib.sha256(v).hexdigest() for p,v in sorted(output.items()) if v!=original.get(p) and p!=verifier}
          mismatches={p:{'expected':plan['generated_files'].get(p),'actual':actual.get(p)} for p in set(actual)|set(plan['generated_files']) if actual.get(p)!=plan['generated_files'].get(p)}
          if mismatches:
              Path('receipt/output-mismatches.json').write_text(json.dumps(mismatches,indent=2))
              raise AssertionError(mismatches)
          assert sorted(set(original)-set(output))==plan['deleted_sources']
          generated=sorted(actual)+[verifier]
          assert all(p.startswith('story/') or p.startswith('docs/design/') or p=='AGENTS.md' for p in generated)
          assert all(p.startswith('docs/story-auditions/') for p in plan['deleted_sources'])
          git('read-tree',head)
          for p in generated:
              h=git('hash-object','-w','--stdin',data=output[p]).decode().strip()
              git('update-index','--add','--cacheinfo','100644,'+h+','+p)
          for p in plan['deleted_sources']:git('update-index','--force-remove','--',p)
          helpers=git('ls-tree','-r','--name-only',head,'.github/pl-migration/').decode().splitlines()+['.github/pl-upload-delta.json']
          for p in helpers:git('update-index','--force-remove','--',p)
          assert not git('ls-files','--','docs/story-auditions/').strip()
          tree=git('write-tree').decode().strip()
          allowed=set(generated)|set(plan['deleted_sources'])|set(helpers)
          assert set(git('diff','--name-only',head,tree).decode().splitlines())==allowed
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]==head, 'PR changed during verification'
          commit=git('commit-tree',tree,'-p',head,data=b'docs(story): consolidate all supplied narrative sources and retire legacy workspace\n\nPreserve all 50 exchanges and 13 source files with exact archived originals, repair live routes, transfer unchanged pair guidance, and retain unselected status. No runtime or master changes.\n').decode().strip()
          git('push','origin',commit+':refs/heads/'+branch)
          assert git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]==commit
          receipt={'source_commit':base,'archive_commit':archive,'publication_commit':commit,'tree':tree,'branch':branch,'generated_files':generated,'deleted_sources':plan['deleted_sources'],'temporary_workflow_cleanup_pending':True,'checks':report['passed_count'],'links':report['active_links_checked'],'no_merge':True,'no_runtime_changes':True}
          Path('receipt/publication.json').write_text(json.dumps(receipt,indent=2)+'\n')
          Path('receipt/TRACKED-TREE.txt').write_bytes(git('ls-tree','-r',commit))
          for p in generated:
              target=Path('receipt/overlay',p);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(output[p])
          print('PUBLICATION_COMMIT='+commit)
          print('Verified migration pushed to PR 3; master untouched; temporary workflow still needs explicit removal.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pl-consolidation-verification
          path: receipt/
          if-no-files-found: warn
          retention-days: 14
