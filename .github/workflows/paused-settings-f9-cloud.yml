name: Paused Settings F9 focused candidate
'on':
  push:
    branches:
    - codex/paused-settings-f9-cloud-20261002
permissions:
  contents: read
concurrency:
  group: paused-settings-f9-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-surfaces:
    name: Windows / public API surface contracts
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        ref: 4b951a555202be25d231448797e8eb8b7bc99019
        fetch-depth: 0
    - name: Prepare disposable checkout for credential cleanup
      run: '$ErrorActionPreference = ''Stop''

        # These legacy tooling gitlinks have no .gitmodules URLs. Git''s

        # submodule foreach reads the index even with sparse checkout.

        # The source commit and working files remain unchanged.

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git submodule foreach --recursive ''true''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Record fixture and schema version census
      run: "@'\nimport json, pathlib, re, subprocess\nroot = pathlib.Path.cwd()\npaths = subprocess.check_output([\n    \"\
        git\", \"ls-files\", \"-z\", \"--\", \"autoload/\", \"scripts/\", \"tests/\",\n    \"tools/testing/\", \".github/workflows/\"\
        \n]).decode(\"utf-8\").split(\"\\0\")\npatterns = {\n    \"legacy_prepared_fixture\": r\"\\bv[1-6]_desktop_prepared\\\
        .json\\b\",\n    \"historical_day3_seed\": r\"valid_day3\\.json\",\n    \"backup_fixture_helper\": r\"BackupSnapshotFixture\"\
        ,\n    \"run_document_version\": r\"\\b(?:schema_version|SCHEMA_VERSION|DOCUMENT_VERSION)\\b\",\n    \"empty_contacts_literal\"\
        : r\"\\bcontacts\\b[\\\"']?\\s*[:=]\\s*\\{\\s*\\}\",\n}\ncompiled = {key: re.compile(value) for key, value in patterns.items()}\n\
        records = []\nscanned = 0\nfor name in sorted(paths):\n    path = root / name\n    if path.suffix not in {\".gd\"\
        , \".ps1\", \".py\", \".yml\", \".yaml\"} or not path.is_file():\n        continue\n    scanned += 1\n    for number,\
        \ line in enumerate(path.read_text(encoding=\"utf-8-sig\").splitlines(), 1):\n        families = [key for key, pattern\
        \ in compiled.items() if pattern.search(line)]\n        if families:\n            records.append({\"path\": name,\
        \ \"line\": number, \"families\": families, \"text\": line})\nreport = {\n    \"checkout_ref\": subprocess.check_output([\"\
        git\", \"rev-parse\", \"HEAD\"], text=True).strip(),\n    \"policy\": \"Observational census only; historical, refusal\
        \ and Profile references require review, not automatic failure.\",\n    \"scanned_files\": scanned, \"patterns\":\
        \ patterns, \"matches\": records,\n}\noutput = root / \".godot/ci/public-surfaces/fixture-version-census.json\"\n\
        output.parent.mkdir(parents=True, exist_ok=True)\noutput.write_text(json.dumps(report, ensure_ascii=False, indent=2)\
        \ + \"\\n\", encoding=\"utf-8\")\nfor record in records:\n    print(\"FIXTURE_VERSION_CENSUS_MATCH: \" + json.dumps(record))\n\
        print(\"FIXTURE_VERSION_CENSUS_SUMMARY: \" + json.dumps({\n    \"checkout_ref\": report[\"checkout_ref\"], \"scanned_files\"\
        : scanned,\n    \"matching_lines\": len(records), \"logged_lines\": len(records),\n    \"complete_artifact\": \".godot/ci/public-surfaces/fixture-version-census.json\"\
        ,\n    \"policy\": report[\"policy\"],\n}))\n'@ | python -\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n"
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri\
        \ 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile\
        \ $archive\n# SHA256 published with the official 4.6.3-stable release asset.\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\n\
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot\
        \ archive checksum mismatch.'\n}\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\nif (-not\
        \ (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }\n\"GODOT_CONSOLE_PATH=$console\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n& $console --version\nif ($LASTEXITCODE -ne 0) { exit\
        \ $LASTEXITCODE }\n"
    - name: Import project
      timeout-minutes: 8
      run: "$ErrorActionPreference = 'Stop'\n$output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'\n$env:APPDATA = Join-Path\
        \ $output 'import-user/appdata'\n$env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'\n$env:DWM_TEST_ROOT\
        \ = Join-Path $output 'import-user/test-root'\nNew-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA,\
        \ $env:DWM_TEST_ROOT | Out-Null\n& $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file\
        \ \"$output/import.log\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nif (Select-String -Path \"$output/import.log\"\
        \ -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {\n  throw\
        \ 'Project import reported script errors; inspect import.log.'\n}\n"
    - name: Restore committed project settings after editor import
      run: '# Dialogic''s editor scan rewrites its timeline lookup during import.

        # Execute the committed configuration with the freshly imported assets.

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Verify isolated runner contracts and timeout diagnostics
      timeout-minutes: 4
      run: '$ErrorActionPreference = ''Stop''

        ./tests/tooling/Test-InvokeIsolatedGodot.ps1

        '
    - name: Generate affected public inventories for review
      timeout-minutes: 10
      run: ./tools/testing/Invoke-PublicSurfaceValidation.ps1 -Regenerate -EmitPayloads
    - name: Verify public inventory drift and read-only contracts
      timeout-minutes: 10
      run: ./tools/testing/Invoke-CloudTests.ps1 -Suite public_surfaces
    - name: Upload canonical inventories and retirement evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: public-surfaces-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/import.log

          .godot/ci/public-surfaces/

          .godot/ci/public_surfaces.xml

          .godot/ci/public_surfaces.jsonl

          .godot/ci/isolation-timeout.jsonl

          .godot/phase2r_logs/cloud-isolation-timeout.log*

          .godot/phase2r_logs/cloud-public-surface-*.log

          .godot/phase2r_logs/cloud-public_surfaces.log*

          '
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
  focused-tests:
    needs: public-surfaces
    name: Windows / ${{ matrix.suite }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
        - reading_delivery
        - settings
        - localization
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: true
        ref: 4b951a555202be25d231448797e8eb8b7bc99019
    - name: Prepare disposable checkout for credential cleanup
      run: '$ErrorActionPreference = ''Stop''

        # These legacy tooling gitlinks have no .gitmodules URLs. Git''s

        # submodule foreach reads the index even with sparse checkout.

        # The source commit and working files remain unchanged.

        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        git submodule foreach --recursive ''true''

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri\
        \ 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile\
        \ $archive\n# SHA256 published with the official 4.6.3-stable release asset.\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\n\
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot\
        \ archive checksum mismatch.'\n}\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\nif (-not\
        \ (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }\n\"GODOT_CONSOLE_PATH=$console\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n& $console --version\nif ($LASTEXITCODE -ne 0) { exit\
        \ $LASTEXITCODE }\n"
    - name: Import project
      timeout-minutes: 8
      run: "$ErrorActionPreference = 'Stop'\n$output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'\n$env:APPDATA = Join-Path\
        \ $output 'import-user/appdata'\n$env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'\n$env:DWM_TEST_ROOT\
        \ = Join-Path $output 'import-user/test-root'\nNew-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA,\
        \ $env:DWM_TEST_ROOT | Out-Null\n& $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file\
        \ \"$output/import.log\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nif (Select-String -Path \"$output/import.log\"\
        \ -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {\n  throw\
        \ 'Project import reported script errors; inspect import.log.'\n}\n"
    - name: Restore committed project settings after editor import
      run: '# Dialogic''s editor scan rewrites its timeline lookup during import.

        # Execute the committed configuration with the freshly imported assets.

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Run focused regression suite
      timeout-minutes: 10
      env:
        DWM_CI_SUITE: ${{ matrix.suite }}
      run: ./tools/testing/Invoke-CloudTests.ps1 -Suite $env:DWM_CI_SUITE
    - name: Upload logs and test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/*.log

          .godot/ci/*.jsonl

          .godot/ci/*.json

          .godot/ci/*.xml

          .godot/ci/storage-refusal/

          .godot/phase2r_logs/cloud-*.log

          '
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
  paused-settings-reading:
    name: Rendered paused Settings F9 / original and F5 reading journeys and UI literal audit
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      XDG_DATA_HOME: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/data
      DWM_TEST_ROOT: ${{ github.workspace }}/.godot/phase2r_tests/cloud-journey-import/test-root
      DWM_RENDER_OUTPUT: ${{ github.workspace }}/.godot/ci/playable-journeys
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: true
        ref: 4b951a555202be25d231448797e8eb8b7bc99019
        fetch-depth: 0
    - name: Prepare disposable checkout for credential cleanup
      run: 'git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1

        git submodule foreach --recursive ''true''

        '
    - name: Install Godot and software display
      timeout-minutes: 12
      run: 'sudo apt-get update

        sudo apt-get install --yes --no-install-recommends xvfb xauth libgl1-mesa-dri pulseaudio pulseaudio-utils libspeechd2
        speech-dispatcher speech-dispatcher-audio-plugins speech-dispatcher-espeak-ng

        archive="$RUNNER_TEMP/godot-4.6.3-linux.zip"

        curl --fail --location --retry 3 ''https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip''
        --output "$archive"

        printf ''%s  %s\n'' ''d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3'' "$archive" | sha256sum --check

        unzip -q "$archive" -d "$RUNNER_TEMP/godot-4.6.3-linux"

        editor="$RUNNER_TEMP/godot-4.6.3-linux/Godot_v4.6.3-stable_linux.x86_64"

        chmod +x "$editor"

        echo "GODOT_CONSOLE_PATH=$editor" >> "$GITHUB_ENV"

        "$editor" --version

        '
    - name: Start and verify native Linux speech service
      timeout-minutes: 2
      run: bash tools/testing/start_cloud_speech.sh
    - name: Upload native speech environment evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cloud-speech-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/cloud-speech/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Import project
      timeout-minutes: 8
      run: "mkdir -p \"$DWM_RENDER_OUTPUT\" \"$XDG_DATA_HOME\" \"$DWM_TEST_ROOT\"\n\"$GODOT_CONSOLE_PATH\" --headless --path\
        \ \"$GITHUB_WORKSPACE\" --import --log-file \"$DWM_RENDER_OUTPUT/import.log\"\nif grep -E 'SCRIPT ERROR:|ERROR: Failed\
        \ to load|Unicode parsing error|Unexpected NUL character' \"$DWM_RENDER_OUTPUT/import.log\"; then\n  exit 1\nfi\n\
        # Dialogic's editor scan rewrites its timeline lookup during import.\ngit restore -- project.godot\n"
    - name: Exercise real Solo reading Save and fresh-process Load
      timeout-minutes: 25
      run: python3 tools/testing/run_reading_rail_journey.py
    - name: Upload Solo reading reports, exact save bytes and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reading-rail-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/reading-rail/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Upload project import evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playable-journeys-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/playable-journeys/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    - name: Audit all UI literal ownership
      if: ${{ !cancelled() }}
      timeout-minutes: 3
      run: "output=\"$GITHUB_WORKSPACE/.godot/ci/ui-literal-audit\"\nmkdir -p \"$output\"\nstatus=0\n\"$GODOT_CONSOLE_PATH\"\
        \ --headless --path \"$GITHUB_WORKSPACE\" \\\n  --log-file \"$output/audit.log\" --script res://tools/localization/UiLiteralAudit.gd\
        \ || status=$?\ncp evidence/phase_2r/localization/{ui_literal_disposition,script_ui_disposition}.json \"$output/\"\
        \nif [ \"$status\" -ne 0 ]; then exit \"$status\"; fi\nif grep -E 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing\
        \ error|Unexpected NUL character' \"$output/audit.log\"; then\n  exit 1\nfi\npython3 - <<'PY'\nimport json, os\nfrom\
        \ pathlib import Path\noutput = Path(os.environ['GITHUB_WORKSPACE']) / '.godot/ci/ui-literal-audit'\nfor name in ('ui_literal_disposition.json',\
        \ 'script_ui_disposition.json'):\n    report = json.loads((output / name).read_text())\n    assert not report['failures'],\
        \ report['failures']\n    assert report['records'], name\nprint('UI_LITERAL_AUDIT_VERIFIED')\nPY\n"
    - name: Upload UI literal audit evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-literal-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/ui-literal-audit/
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 7
    needs: public-surfaces
