name: Diagnose restore journal seed cost
'on':
  push:
    branches:
    - codex/seed-diagnostic-controller-20261023
permissions:
  contents: read
concurrency:
  group: seed-diagnostic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    name: Windows / journal seed diagnostic
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    env:
      DWM_SCENE_VALIDATION_PROFILE: '1'
      DWM_SAVE_LOAD_PROFILE: '1'
    steps:
    - name: Preserve source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        fetch-depth: 4
        persist-credentials: true
        ref: c16c7a495f95fa2bdb9a0f72fc7c5c3a799e6747
    - name: Record pinned source
      run: |
        $ErrorActionPreference = 'Stop'
        if ((git rev-parse HEAD) -cne 'c16c7a495f95fa2bdb9a0f72fc7c5c3a799e6747') { throw 'Candidate mismatch' }
        if ((git rev-parse 'HEAD^{tree}') -cne '22a0aa62da52b835468abf49be5175f6a39a8d5f') { throw 'Candidate tree mismatch' }
        New-Item -ItemType Directory -Force '.godot/ci' | Out-Null
        @{candidate='c16c7a495f95fa2bdb9a0f72fc7c5c3a799e6747'; tree=(git rev-parse 'HEAD^{tree}'); controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; event='${{ github.sha }}'; run_id='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'} | ConvertTo-Json | Set-Content '.godot/ci/audit-origin.json'

        git diff e5cf80a5417c05bd0bb7fa2f60f59e8905e839a6 c16c7a495f95fa2bdb9a0f72fc7c5c3a799e6747 -- autoload/SaveManager.gd | Set-Content .godot/ci/instrumentation.patch
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        @{instrumentation_base='e5cf80a5417c05bd0bb7fa2f60f59e8905e839a6'; instrumented_source='c16c7a495f95fa2bdb9a0f72fc7c5c3a799e6747'; helper_source='cc66fd97f4f004d578f4f5208f2f331d0f970397'; comparison_source='3ce24fffcae5f235af935fc484615206f813d99a'; comparison_run='39972595648'} | ConvertTo-Json | Set-Content .godot/ci/diagnostic-origin.json
    - name: Prepare disposable checkout for credential cleanup
      run: |
        $ErrorActionPreference = 'Stop'
        # These legacy tooling gitlinks have no .gitmodules URLs. Git's
        # submodule foreach reads the index even with sparse checkout.
        # The source commit and working files remain unchanged.
        git update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        git submodule foreach --recursive 'true'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Install Godot 4.6.3 standard
      run: |
        $ErrorActionPreference = 'Stop'
        $archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'
        Invoke-WebRequest -Uri 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile $archive
        # SHA256 published with the official 4.6.3-stable release asset.
        $expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Godot archive checksum mismatch.'
        }
        $editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'
        Expand-Archive -LiteralPath $archive -DestinationPath $editor
        $console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'
        if (-not (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }
        "GODOT_CONSOLE_PATH=$console" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & $console --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Import project
      run: |
        $ErrorActionPreference = 'Stop'
        $output = Join-Path $env:GITHUB_WORKSPACE '.godot/ci'
        $env:APPDATA = Join-Path $output 'import-user/appdata'
        $env:LOCALAPPDATA = Join-Path $output 'import-user/localappdata'
        $env:DWM_TEST_ROOT = Join-Path $output 'import-user/test-root'
        New-Item -ItemType Directory -Force -Path $output, $env:APPDATA, $env:LOCALAPPDATA, $env:DWM_TEST_ROOT | Out-Null
        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$output/import.log"
        $importExit = $LASTEXITCODE
        @{exit_code=$importExit} | ConvertTo-Json | Set-Content "$output/import-process.json"
        if ($importExit -ne 0) { exit $importExit }
        if (Select-String -Path "$output/import.log" -Pattern 'SCRIPT ERROR:|ERROR: Failed to load|Unicode parsing error|Unexpected NUL character' -Quiet) {
          throw 'Project import reported script errors; inspect import.log.'
        }
      timeout-minutes: 8
    - name: Restore committed project settings after editor import
      run: |
        # Dialogic's editor scan rewrites its timeline lookup during import.
        # Execute the committed configuration with the freshly imported assets.
        git restore -- project.godot
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/checkout@v7
      with:
        path: .godot/controller
        persist-credentials: true
        ref: cc66fd97f4f004d578f4f5208f2f331d0f970397
        sparse-checkout: tools/testing/terminal-admission
    - name: Stage identical paired helper and authentic ending root
      run: |
        $ErrorActionPreference = 'Stop'
        git -C .godot/controller update-index --force-remove -- .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        Copy-Item .godot/controller/tools/testing/terminal-admission/*.gd .godot/ci/
        @'
        import hashlib,json,pathlib,zipfile
        p=pathlib.Path('evidence/phase_2r/authored_followup_20261023/run39929612232_late_success/genuine-post-replay-root.zip')
        assert hashlib.sha256(p.read_bytes()).hexdigest()=='82251bc333baaccdc4c1de38fb175f72b411466b8c4583d41e8fc7fc09edc029'
        out=pathlib.Path('.godot/ci/terminal-root');out.mkdir(parents=True,exist_ok=True)
        files={}
        with zipfile.ZipFile(p) as z:
         assert z.testzip() is None
         for name in z.namelist():
          target=(out/name).resolve();assert target.is_relative_to(out.resolve())
          data=z.read(name);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          files[name]=hashlib.sha256(data).hexdigest()
        assert len(files)==40
        pathlib.Path('.godot/ci/terminal-root-hashes.json').write_text(json.dumps(files,indent=2))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        @'
        import hashlib,json,pathlib
        expected = {'pair.gd': '387f335b758d06ac1762302423151d47d57aa1df90adc933cdee3855cf04ff65', 'pair-next.gd': 'ebf4e9380066cd769c10c64ae21bddf605c972a5955324c445654d8d959540c7', 'seed.gd': '1eeae3d5a83dc645758def40e371408187bca8009e5ef9c0916b3d489f36be3d', 'replay.gd': '945a7a75a9cae6e14e2e70e9b99866a929ba1cbe36d8249bb9f177f9b3026a20'}
        p=pathlib.Path('.godot/ci')
        assert all(hashlib.sha256((p/n).read_bytes()).hexdigest()==h for n,h in expected.items())
        (p/'helper-hashes.json').write_text(json.dumps(expected,indent=2))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - env:
        DWM_TERMINAL_COMPLETE: '0'
      name: Affected native ending Load and Save
      run: "Remove-Item .godot/ci/terminal-pair.json -ErrorAction SilentlyContinue\n./tools/testing/Invoke-IsolatedGodot.ps1\
        \ -SuiteId 'terminal-candidate' -LogName 'terminal-candidate-seed.log' -EvidenceLogPath '.godot/ci/terminal-candidate.jsonl'\
        \ -TimeoutSeconds 1800 -KeepRoot -Rendered -GodotArgs @('-s','res://.godot/ci/seed.gd') -NextLogName 'terminal-candidate.log'\
        \ -NextGodotArgs @('-s','res://addons/gut/gut_cmdln.gd','-gconfig=','-gprefix=pair','-gtest=res://.godot/ci/pair-next.gd','-gexit','-glog=1','-gjunit_xml_file=res://.godot/ci/terminal-candidate.xml')\
        \ \n$journeyExit = $LASTEXITCODE\nif ($journeyExit -ne 0) { exit $journeyExit }\n"
      timeout-minutes: 33
    - name: Check successful candidate results
      run: |
        @'
        import json,pathlib,xml.etree.ElementTree as ET
        p=pathlib.Path('.godot/ci');r=ET.parse(p/'terminal-candidate.xml').getroot();cases=list(r.iter('testcase'))
        assert len(cases)==1 and all(c.get('status')=='pass' and int(c.get('assertions','0'))>0 for c in cases)
        assert not any(list(r.iter(t)) for t in ['failure','error','skipped'])
        events=[json.loads(s) for s in (p/'terminal-candidate.jsonl').read_text(encoding='utf-8-sig').splitlines() if s.strip()]
        assert len(events)==2 and all(e['exit_code']==0 for e in events)
        r=json.loads((p/'terminal-pair.json').read_text());assert r['complete'] and len(r['phases'])==3 and all(x['ok'] for x in r['phases'])
        text=(p/'../phase2r_logs/terminal-candidate.log').read_text(encoding='utf-8-sig')
        assert not any(s in text for s in ['SCRIPT ERROR:','ERROR: Failed to load','[Failed]'])
        profiles=[json.loads(line.split(' ',1)[1]) for line in text.splitlines() if line.startswith('DWM_SAVE_LOAD_PROFILE ')]
        seed=[x for x in profiles if x['scope']=='restore_journal_seed']
        assert seed and all(x['ok'] and x['bundle_count']>0 and x['elapsed_us']>=0 for x in seed), seed
        (p/'journal-seed-summary.json').write_text(json.dumps({'calls':len(seed),'inclusive_us':sum(x['elapsed_us'] for x in seed),'bundle_counts':[x['bundle_count'] for x in seed]},indent=2))
        print(json.dumps(r,ensure_ascii=False))
        '@ | python -
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Collect evidence
      if: always()
      run: |-
        New-Item -ItemType Directory -Force .godot/ci | Out-Null
        Get-ChildItem .godot/phase2r_logs/*.log -ErrorAction SilentlyContinue | Copy-Item -Destination .godot/ci/
        git diff HEAD -- autoload scripts scenes project.godot | Set-Content .godot/ci/final-runtime.patch
        git status --porcelain | Set-Content .godot/ci/final-status.txt
    - name: Upload evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seed-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/
        include-hidden-files: true
        retention-days: 30
