; Unsigned validation build. Runtime JSON and Dialogic text are read with FileAccess.
; Keep production addons and schemas: these are runtime dependencies, not test tools.
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json,*.dtl,*.dch,*.cfg"
exclude_filter="tools/*,tests/*,docs/*,evidence/*,prompt_docs/*,art_source/*,temp-artifacts/*,addons/gut/*,*.md,*.py,*.ps1,*.cs,*.csproj,*.sln"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc2=false
texture_format/astc=false
codesign/enable=false
application/modify_resources=false
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true
