name: Bounded ending Title timing diagnostic
'on':
  pull_request:
    paths:
    - .github/workflows/scene-first-reveal-profile-diagnostic.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  authority-audit:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: windows-2022
    timeout-minutes: 55
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Preserve source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        ref: 81847d8b1560340a3a7769223cee0b46c6bdc0f9
        fetch-depth: 2
    - uses: actions/checkout@v7
      with:
        ref: 80742ef4308076c8f2f58c7f02fe760f3ee4ba9f
        path: .godot/title-packet
        sparse-checkout: evidence/phase_2r/title_timing_20261019/source
        persist-credentials: true
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.10
        architecture: x64
    - name: Bind exact sources and retained corrected evidence
      run: "$ErrorActionPreference = 'Stop'\nNew-Item -ItemType Directory -Force .godot/ci | Out-Null\nforeach ($repo in @($env:GITHUB_WORKSPACE,(Join-Path\
        \ $env:GITHUB_WORKSPACE '.godot/title-packet'))) {\n git -C $repo update-index --force-remove -- .claude/skills/godot-prompter/1.10.0\
        \ .claude/skills/superpowers/6.1.1\n if ($LASTEXITCODE -ne 0) { throw 'Legacy gitlink cleanup failed' }\n git -C $repo\
        \ submodule foreach --recursive 'true'\n if ($LASTEXITCODE -ne 0) { throw 'Gitlink cleanup verification failed' }\n\
        }\ngit fetch --no-tags --depth=1 origin d37ad1f6d3c0148205c1b4d21444d05d01e7cca6 400d279ff884328b3665e8b97533115aa148a47a\n\
        if ($LASTEXITCODE -ne 0) { throw 'Pinned source fetch failed' }\n$toolRoot = Join-Path $env:GITHUB_WORKSPACE '.godot/title-packet/evidence/phase_2r/title_timing_20261019/source/new-title-tools'\n\
        \"TITLE_TOOLS=$toolRoot\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8\n@'\nimport hashlib,pathlib,subprocess,zipfile,json\n\
        out=pathlib.Path('.godot/ci')\nraw=subprocess.check_output(['git','show','400d279ff884328b3665e8b97533115aa148a47a:evidence/phase_2r/ending_iterator_comparison_20261019/corrected-evidence.zip'])\n\
        assert len(raw)==3642930 and hashlib.sha256(raw).hexdigest()=='434e94bb800e99d702d3322cf067d4deb76a50cd04b4b7b425956c96b923fd72'\n\
        archive=out/'original-corrected-evidence.zip';archive.write_bytes(raw)\nwith zipfile.ZipFile(archive) as z:\n    assert\
        \ not z.testzip()\n    for x in z.infolist():\n        p=pathlib.PurePosixPath(x.filename)\n        assert not p.is_absolute()\
        \ and '..' not in p.parts and ':' not in x.filename and '\\\\' not in x.filename\n    z.extractall(out/'retained-corrected')\n\
        (out/'origin.json').write_text(json.dumps({'game_commit':'81847d8b1560340a3a7769223cee0b46c6bdc0f9','tool_commit':'80742ef4308076c8f2f58c7f02fe760f3ee4ba9f','controller_event':'${{\
        \ github.event.pull_request.head.sha }}','retained_run':39243496974,'retained_package_artifact':12184205891,'engine_rebuilt':False,'diagnostic_only':True,'official_acceptance_established':False},indent=2))\n\
        '@ | python -\nif ($LASTEXITCODE -ne 0) { throw 'Retained evidence pin failed' }\n"
    - name: Download retained Corrected executable package
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: '12184205891'
        run-id: '39243496974'
        github-token: ${{ github.token }}
        repository: Siuuuers/dwm
        path: .godot/corrected-package
    - name: Focused transformation and package tests
      run: 'python -m unittest discover -s "$env:TITLE_TOOLS" -p ''test_*.py'' -v 2>&1 | Tee-Object .godot/ci/python-tests.log

        if ($LASTEXITCODE -ne 0) { throw ''Focused tests failed'' }

        '
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri\
        \ 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile\
        \ $archive\n# SHA256 published with the official 4.6.3-stable release asset.\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\n\
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot\
        \ archive checksum mismatch.'\n}\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\nif (-not\
        \ (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }\n\"GODOT_CONSOLE_PATH=$console\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n& $console --version\nif ($LASTEXITCODE -ne 0) { exit\
        \ $LASTEXITCODE }\n"
    - name: Apply isolated timing overlay and parse PowerShell
      run: "$overlay=Join-Path $env:RUNNER_TEMP 'title-timing-overlay'\npython \"$env:TITLE_TOOLS/prepare_source.py\" --root\
        \ $env:GITHUB_WORKSPACE --output $overlay\nif ($LASTEXITCODE -ne 0) { throw 'Source overlay failed' }\nCopy-Item $overlay\
        \ .godot/ci/source-overlay -Recurse\n$records=@()\nforeach ($p in @('tools/testing/Invoke-ExportedGameplay.ps1',\"\
        $env:TITLE_TOOLS/Smoke-TimingPackage.ps1\")) {\n  $tokens=$null; $errors=$null\n  $null=[Management.Automation.Language.Parser]::ParseFile([IO.Path]::GetFullPath($p),[ref]$tokens,[ref]$errors)\n\
        \  $records+=@{path=$p;errors=@($errors | ForEach-Object {$_.Message})}\n}\n$records | ConvertTo-Json -Depth 5 | Set-Content\
        \ .godot/ci/powershell-parse.json\nif (@($records | Where-Object {$_.errors.Count -gt 0}).Count) { throw 'PowerShell\
        \ parse failed' }\n& pwsh -NoProfile -File tests/tooling/Test-ExportedGameplayDeadline.ps1 -DriverPath tools/testing/Invoke-ExportedGameplay.ps1\
        \ -OutputPath .godot/ci/deadline-tests.json\nif ($LASTEXITCODE -ne 0) { throw 'Deadline checks failed' }\n"
    - name: Import and export diagnostic PCK with official standard editor
      timeout-minutes: 12
      run: "$ErrorActionPreference='Stop'\n$env:APPDATA=Join-Path $env:RUNNER_TEMP 'title-export-user/appdata'\n$env:LOCALAPPDATA=Join-Path\
        \ $env:RUNNER_TEMP 'title-export-user/localappdata'\nNew-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA\
        \ | Out-Null\n& $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file \"$env:GITHUB_WORKSPACE/.godot/ci/import.log\"\
        \nif ($LASTEXITCODE -ne 0) { throw 'Import failed' }\nCopy-Item .godot/ci/source-overlay/project.export.godot project.godot\
        \ -Force\n& $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --export-pack 'Windows Desktop' \"$env:GITHUB_WORKSPACE/.godot/ci/DWM.pck\"\
        \ --log-file \"$env:GITHUB_WORKSPACE/.godot/ci/export.log\"\nif ($LASTEXITCODE -ne 0) { throw 'Diagnostic pack export\
        \ failed' }\nforeach ($log in @('.godot/ci/import.log','.godot/ci/export.log')) {\n  if (Select-String $log -Pattern\
        \ 'SCRIPT ERROR:|^\\s*ERROR:|STARTUP_FAILED|Unicode parsing error|Unexpected NUL character' -Quiet) { throw 'Strict\
        \ editor error gate failed' }\n}\nCopy-Item .godot/ci/source-overlay/project.original.godot project.godot -Force\n\
        @'\nimport hashlib,json,pathlib\nimport subprocess\nout=pathlib.Path('.godot/ci');p=out/'DWM.pck';m=json.loads((out/'source-overlay/timing-inventory.json').read_text())\n\
        for entry in m['files']:\n    assert hashlib.sha256(pathlib.Path(entry['path']).read_bytes()).hexdigest()==entry['after_sha256'],\
        \ 'Instrumented source changed during import/export'\nallowed={e['path'] for e in m['files']}|{'tools/testing/Invoke-ExportedGameplay.ps1','.claude/skills/godot-prompter/1.10.0','.claude/skills/superpowers/6.1.1'}\n\
        assert set(subprocess.check_output(['git','diff','HEAD','--name-only'],text=True).splitlines())<=allowed, 'Unexpected\
        \ tracked source mutation'\nassert pathlib.Path('project.godot').read_bytes()==(out/'source-overlay/project.original.godot').read_bytes()\n\
        m['fresh_pck']={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()};(out/'source-manifest.json').write_text(json.dumps(m,indent=2))\n\
        '@ | python -\nif ($LASTEXITCODE -ne 0) { throw 'Fresh pack source receipt failed' }\n"
    - name: Prepare and smoke reused engine with new diagnostic pack
      id: package
      timeout-minutes: 5
      run: '$packages=@(Get-ChildItem .godot/corrected-package -Recurse -Filter DWM-windows-x86_64-diagnostic.zip -File)

        if ($packages.Count -ne 1) { throw ''Expected one retained corrected package'' }

        python "$env:TITLE_TOOLS/package_timing.py" prepare --original $packages[0].FullName --evidence .godot/ci/retained-corrected
        --pck .godot/ci/DWM.pck --source-manifest .godot/ci/source-manifest.json --output .godot/ci/title-package

        if ($LASTEXITCODE -ne 0) { throw ''Retained engine/package verification failed'' }

        & pwsh -NoProfile -File "$env:TITLE_TOOLS/Smoke-TimingPackage.ps1" -OutputPath .godot/ci/title-package

        if ($LASTEXITCODE -ne 0) { throw ''Fresh diagnostic startup failed'' }

        python "$env:TITLE_TOOLS/package_timing.py" finish --output .godot/ci/title-package --smoke-result .godot/ci/title-package/smoke-result.json

        if ($LASTEXITCODE -ne 0) { throw ''Diagnostic sealing failed'' }

        $receipt=Get-Content .godot/ci/title-package/validation.json -Raw | ConvertFrom-Json

        "DWM_EXPORT_SHA=$($receipt.archive.sha256)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

        '
    - name: Retain diagnostic package before journey
      uses: actions/upload-artifact@v4
      with:
        name: title-timing-package-${{ github.run_id }}-${{ github.run_attempt }}
        path: .godot/ci/title-package/DWM-windows-x86_64-diagnostic.zip
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    - name: Run original capability gates on the diagnostic native package
      id: capability
      continue-on-error: true
      timeout-minutes: 10
      run: '$ErrorActionPreference = ''Stop''

        $PSNativeCommandUseErrorActionPreference = $false

        $watch = [Diagnostics.Stopwatch]::StartNew()

        & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Capability -ArchivePath (Join-Path $env:GITHUB_WORKSPACE
        ''.godot/ci/title-package/DWM-windows-x86_64-diagnostic.zip'') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit
        ''81847d8b1560340a3a7769223cee0b46c6bdc0f9'' -UserRoot (Join-Path $env:RUNNER_TEMP ''dwm-capability-user'') -OutputPath
        (Join-Path $env:GITHUB_WORKSPACE ''.godot/ci/exported-capability'') -Accessibility Always -Audio Dummy

        $code = $LASTEXITCODE; $watch.Stop()

        @{mode=''Capability'';exit_code=$code;elapsed_seconds=$watch.Elapsed.TotalSeconds;diagnostic_native=$true;trace_enabled=$false}
        | ConvertTo-Json | Set-Content ''.godot/ci/capability-process.json''

        if ($code -ne 0) { exit $code }

        $result=Get-Content ''.godot/ci/exported-capability/result.json'' -Raw | ConvertFrom-Json

        if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw
        ''Capability failed its original gate'' }

        '
    - name: Create the original Day4 save on the diagnostic native package
      id: create
      if: ${{ !cancelled() && steps.capability.outcome == 'success' }}
      continue-on-error: true
      timeout-minutes: 10
      run: '$ErrorActionPreference = ''Stop''

        $PSNativeCommandUseErrorActionPreference = $false

        $watch = [Diagnostics.Stopwatch]::StartNew()

        & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1 -Mode Create -ArchivePath (Join-Path $env:GITHUB_WORKSPACE
        ''.godot/ci/title-package/DWM-windows-x86_64-diagnostic.zip'') -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit
        ''81847d8b1560340a3a7769223cee0b46c6bdc0f9'' -UserRoot (Join-Path $env:RUNNER_TEMP ''dwm-journey-user'') -OutputPath
        (Join-Path $env:GITHUB_WORKSPACE ''.godot/ci/exported-create'') -Accessibility Always -Audio Dummy -CapabilityReceipt
        (Join-Path $env:GITHUB_WORKSPACE ''.godot/ci/exported-capability/result.json'')

        $code = $LASTEXITCODE; $watch.Stop()

        @{mode=''Create'';exit_code=$code;elapsed_seconds=$watch.Elapsed.TotalSeconds;diagnostic_native=$true;trace_enabled=$false}
        | ConvertTo-Json | Set-Content ''.godot/ci/create-process.json''

        if ($code -ne 0) { exit $code }

        $result=Get-Content ''.godot/ci/exported-create/result.json'' -Raw | ConvertFrom-Json

        if (-not $result.ok -or -not $result.clean_player_exit -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw
        ''Create failed its original gate'' }

        '
    - name: Capture naturally committed consumer state during the original Load journey
      id: load
      if: ${{ !cancelled() && steps.create.outcome == 'success' }}
      continue-on-error: true
      timeout-minutes: 10
      run: "$ErrorActionPreference = 'Stop'\n$PSNativeCommandUseErrorActionPreference = $false\n$traceRoot = Join-Path $env:GITHUB_WORKSPACE\
        \ '.godot/ci/consumer-trace'\nNew-Item -ItemType Directory -Path $traceRoot | Out-Null\n$env:GODOT_ACCESSKIT_CONSUMER_TRACE_PATH\
        \ = Join-Path $traceRoot 'trace-{pid}.jsonl'\n$queryRoot = Join-Path $env:GITHUB_WORKSPACE '.godot/ci/query-trace'\n\
        New-Item -ItemType Directory -Force $queryRoot | Out-Null\n$env:GODOT_ACCESSKIT_QUERY_TRACE_PATH = Join-Path $queryRoot\
        \ 'trace-{pid}.jsonl'\n$env:DWM_TITLE_TIMING_PATH=Join-Path $env:GITHUB_WORKSPACE '.godot/ci/title-timing.jsonl'\n\
        $watch = [Diagnostics.Stopwatch]::StartNew()\ntry {\n  & pwsh -NoProfile -File ./tools/testing/Invoke-ExportedGameplay.ps1\
        \ -Mode Load -ArchivePath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/title-package/DWM-windows-x86_64-diagnostic.zip')\
        \ -ExpectedArchiveSha256 $env:DWM_EXPORT_SHA -ExpectedCommit '81847d8b1560340a3a7769223cee0b46c6bdc0f9' -UserRoot\
        \ (Join-Path $env:RUNNER_TEMP 'dwm-journey-user') -OutputPath (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-load')\
        \ -Accessibility Always -Audio Dummy -CreatorReceipt (Join-Path $env:GITHUB_WORKSPACE '.godot/ci/exported-create/result.json')\
        \ -ProfileSaveLoad -ContinueAfterQuiet -TraceDay5 -NativeReadyCaptions -TraceEndingActions\n  $code = $LASTEXITCODE\n\
        } finally {\n  Remove-Item Env:DWM_TITLE_TIMING_PATH\n  Remove-Item Env:GODOT_ACCESSKIT_CONSUMER_TRACE_PATH\n  Remove-Item\
        \ Env:GODOT_ACCESSKIT_QUERY_TRACE_PATH\n  $watch.Stop()\n}\n@{mode='Load';exit_code=$code;elapsed_seconds=$watch.Elapsed.TotalSeconds;diagnostic_native=$true;trace_enabled=$true;trace_pattern='consumer-trace/trace-{pid}.jsonl';query_trace_enabled=$true;query_trace_pattern='query-trace/trace-{pid}.jsonl'}\
        \ | ConvertTo-Json | Set-Content '.godot/ci/load-process.json'\nif ($code -ne 0) { exit $code }\n$result=Get-Content\
        \ '.godot/ci/exported-load/result.json' -Raw | ConvertFrom-Json\nif (-not $result.ok -or -not $result.clean_player_exit\
        \ -or $result.forced_cleanup -or $result.exit_code -ne 0) { throw 'Load failed its original gate' }\n"
    - name: Preserve original outcome and timing limitations
      if: always()
      run: "$failures=[Collections.Generic.List[string]]::new()\nforeach ($mode in @('capability','create','load')) {\n $p=\"\
        .godot/ci/exported-$mode/result.json\"\n if (-not (Test-Path $p)) { $failures.Add(\"Missing $mode result\"); continue\
        \ }\n $r=Get-Content $p -Raw | ConvertFrom-Json\n if (-not $r.ok -or -not $r.clean_player_exit -or $r.forced_cleanup\
        \ -or $r.exit_code -ne 0) {$failures.Add(\"$mode original gate failed\")}\n}\n@{ok=($failures.Count -eq 0);diagnostic_only=$true;official_acceptance_established=$false;failures=$failures.ToArray();interpretation='Separate\
        \ game readiness, native acquisition, durable snapshot and clean exit. Missing timing anchors remain inconclusive.'}\
        \ | ConvertTo-Json -Depth 5 | Set-Content .godot/ci/diagnostic-outcome.json\nif ($failures.Count) { throw ($failures\
        \ -join '; ') }\n"
    - name: Seal diagnostic evidence
      if: always()
      run: "@'\nimport hashlib,json,pathlib\nroot=pathlib.Path('.godot/ci'); files=[]\nfor p in sorted(root.rglob('*')):\n\
        \    if p.is_file() and p.name!='timing-evidence-manifest.json' and not any(part in ('package','smoke-user','retained-corrected')\
        \ for part in p.relative_to(root).parts) and p.suffix not in ('.zip','.pck'):\n        files.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})\n\
        (root/'timing-evidence-manifest.json').write_text(json.dumps({'files':files},indent=2))\n'@ | python -\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Evidence seal failed' }\n"
    - name: Retain original timing evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: title-timing-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/

          !.godot/ci/**/package/**

          !.godot/ci/**/smoke-user/**

          !.godot/ci/retained-corrected/**

          !.godot/ci/**/*.zip

          !.godot/ci/**/*.pck'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
