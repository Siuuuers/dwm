name: Ordinary native wait deadline qualification
on:
  pull_request:
    paths:
      - '.github/workflows/scene-first-reveal-profile-diagnostic.yml'
permissions:
  contents: read
concurrency:
  group: ordinary-deadline-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  deadline:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch exact reviewed sources and record custody
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $source = 'f789011a02c1c206d0293c9fd3e61c02bb18d583'
          $hashes = @{
            'Invoke-ExportedGameplay.proposed.ps1' = '38b160fbc625026b6ec30376d9214cda0a4bde17cb932dec4a4e73f3d59c5788'
            'Test-ExportedGameplayDeadline.proposed.ps1' = '59e141352e3e525d44c84ebe66b156fa73991424c9a3fdd0ca8aa0403214c939'
          }
          foreach ($name in $hashes.Keys) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Siuuuers/dwm/$source/evidence/phase_2r/native_delivery_proposal_20261020/$name" -OutFile "evidence/$name"
            if ((Get-FileHash "evidence/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hashes[$name]) { throw "SOURCE_HASH_MISMATCH: $name" }
          }
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'POWERSHELL7_REQUIRED' }
          @{ source=$source; controller='${{ github.event.pull_request.head.sha }}'; workflow='${{ github.workflow_sha }}'; event='${{ github.sha }}'; run_id='${{ github.run_id }}'; attempt='${{ github.run_attempt }}'; powershell=$PSVersionTable.PSVersion.ToString(); os=[Environment]::OSVersion.ToString(); hashes=$hashes; scope='Parser and fake-provider cases only; no driver top-level or game launch' } | ConvertTo-Json -Depth 6 | Set-Content evidence/origin.json -Encoding utf8
      - name: Parse both exact files
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @()
          foreach ($name in @('Invoke-ExportedGameplay.proposed.ps1','Test-ExportedGameplayDeadline.proposed.ps1')) {
            $tokens=$null; $parseErrors=$null
            $null = [Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "evidence/$name"), [ref]$tokens, [ref]$parseErrors)
            $results += @{ name=$name; errors=@($parseErrors | ForEach-Object { $_.ToString() }); ok=($parseErrors.Count -eq 0) }
          }
          @{ results=$results; ok=(@($results | Where-Object { -not $_.ok }).Count -eq 0) } | ConvertTo-Json -Depth 8 | Set-Content evidence/parser.json -Encoding utf8
          if (@($results | Where-Object { -not $_.ok }).Count) { throw 'PARSER_FAILED' }
      - name: Execute four cases in child PowerShell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $command = @('-NoLogo','-NoProfile','-NonInteractive','-File','evidence/Test-ExportedGameplayDeadline.proposed.ps1','-DriverPath','evidence/Invoke-ExportedGameplay.proposed.ps1','-OutputPath','evidence/result.json')
          @{ executable=(Get-Command pwsh).Source; arguments=$command } | ConvertTo-Json -Depth 5 | Set-Content evidence/command.json -Encoding utf8
          & pwsh @command *> evidence/test.log
          $code=$LASTEXITCODE
          @{exit_code=$code} | ConvertTo-Json | Set-Content evidence/process.json -Encoding utf8
          Get-Content evidence/test.log
          if ($code -ne 0) { throw "TEST_PROCESS_FAILED: $code" }
          $result=Get-Content evidence/result.json -Raw | ConvertFrom-Json
          $expected=@('late_root_refused_before_enumeration','late_match_refused','timely_unique_match_accepted','ambiguous_match_refused')
          if ($result.ok -ne $true -or @($result.cases).Count -ne 4) { throw 'RESULT_CENSUS_FAILED' }
          for ($i=0; $i -lt 4; $i++) {
            if ($result.cases[$i].name -cne $expected[$i] -or $result.cases[$i].ok -ne $true) { throw "CASE_FAILED: $i" }
          }
          Write-Output 'ORDINARY_DEADLINE_PASS: 2 parsers; 4 cases; child exit 0'
      - name: Preserve evidence manifest
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $files=@(Get-ChildItem evidence -File | ForEach-Object { @{name=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()} })
          @{files=$files} | ConvertTo-Json -Depth 6 | Set-Content evidence/manifest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-deadline-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
