name: Scene anchor algorithm qualification
'on':
  pull_request:
    paths:
    - .github/workflows/scene-first-reveal-profile-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: scene-first-reveal-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  anchor:
    if: github.event.pull_request.number == 30 && github.event.pull_request.head.repo.full_name == 'Siuuuers/dwm'
    runs-on: windows-2022
    timeout-minutes: 65
    defaults:
      run:
        shell: pwsh
    steps:
    - name: Preserve source bytes
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
      with:
        ref: d06a5f82c92d24d18f3b197f6667b6955e20993b
        fetch-depth: 1
    - uses: actions/setup-python@v6
      with:
        python-version: 3.12.10
        architecture: x64
    - name: Bind candidate and retained benchmark input
      run: "$ErrorActionPreference='Stop'\nNew-Item -ItemType Directory -Force .godot/ci | Out-Null\nif ((git rev-parse HEAD)\
        \ -ne 'd06a5f82c92d24d18f3b197f6667b6955e20993b') { throw 'Wrong candidate' }\ngit update-index --force-remove --\
        \ .claude/skills/godot-prompter/1.10.0 .claude/skills/superpowers/6.1.1\nif ($LASTEXITCODE -ne 0) { throw 'Index cleanup\
        \ failed' }\ngit submodule foreach --recursive 'true'\nif ($LASTEXITCODE -ne 0) { throw 'Index check failed' }\n@'\n\
        import pathlib,subprocess,json,hashlib,zipfile,io\nout=pathlib.Path('.godot/ci')\narchive=pathlib.Path('evidence/phase_2r/title_timing_20261019/run39279335309/original-evidence.zip').read_bytes()\n\
        assert hashlib.sha256(archive).hexdigest()=='477cef168d3c7e76f76d19198050866dfe132cc4003e5e486c2d9e8bfbf405c3'\nwith\
        \ zipfile.ZipFile(io.BytesIO(archive)) as z:\n    matches=[n for n in z.namelist() if n.endswith('exported-load/failure-saves-autosave.json')]\n\
        \    assert len(matches)==1\n    data=z.read(matches[0])\nassert hashlib.sha256(data).hexdigest()=='253bda51ce175b6bad6345a8932aad3dd70b22640c12f2223a8d9ba6dd58871e'\n\
        (out/'benchmark-input.json').write_bytes(data)\nfiles={p:subprocess.check_output(['git','hash-object',p],text=True).strip()\
        \ for p in ['autoload/DialogicBridge.gd', 'scripts/narrative/NarrativeCaptionLedger.gd', 'tests/support/OriginalSceneAnchorBridge.gd',\
        \ 'tests/support/SceneAnchorAlgorithmFixture.gd', 'tests/integration/test_scene_anchor_algorithm.gd', 'tests/performance/test_scene_anchor_algorithm_benchmark.gd',\
        \ 'tools/testing/Invoke-IsolatedGodot.ps1']}\n(out/'origin.json').write_text(json.dumps({'candidate':'d06a5f82c92d24d18f3b197f6667b6955e20993b','base':'8f59bcc76894bef8856dd2f7c62ca99b50f8c8f7','controller':'${{\
        \ github.event.pull_request.head.sha }}','files':files,'input_sha256':hashlib.sha256(data).hexdigest()},indent=2))\n\
        '@ | python -\nif ($LASTEXITCODE -ne 0) { throw 'Source/input custody failed' }\n"
    - name: Install Godot 4.6.3 standard
      run: "$ErrorActionPreference = 'Stop'\n$archive = Join-Path $env:RUNNER_TEMP 'godot-4.6.3.zip'\nInvoke-WebRequest -Uri\
        \ 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_win64.exe.zip' -OutFile\
        \ $archive\n# SHA256 published with the official 4.6.3-stable release asset.\n$expected = 'e39986a178d585ce7ac198fb8de6ea436366dc0cc00e594810c2e3e104c04b90'\n\
        if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {\n  throw 'Godot\
        \ archive checksum mismatch.'\n}\n$editor = Join-Path $env:RUNNER_TEMP 'godot-4.6.3'\nExpand-Archive -LiteralPath\
        \ $archive -DestinationPath $editor\n$console = Join-Path $editor 'Godot_v4.6.3-stable_win64_console.exe'\nif (-not\
        \ (Test-Path -LiteralPath $console)) { throw 'Godot console executable missing.' }\n\"GODOT_CONSOLE_PATH=$console\"\
        \ | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8\n& $console --version\nif ($LASTEXITCODE -ne 0) { exit\
        \ $LASTEXITCODE }\n"
    - name: Strict import
      timeout-minutes: 8
      run: '$ErrorActionPreference=''Stop''

        $env:APPDATA=Join-Path $env:RUNNER_TEMP ''anchor-import/appdata''

        $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP ''anchor-import/localappdata''

        New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null

        & $env:GODOT_CONSOLE_PATH --headless --path $env:GITHUB_WORKSPACE --import --log-file "$env:GITHUB_WORKSPACE/.godot/ci/import.log"

        if ($LASTEXITCODE -ne 0) { throw ''Import failed'' }

        if (Select-String .godot/ci/import.log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character''
        -Quiet) { throw ''Strict import log gate failed'' }

        git restore -- project.godot

        if ($LASTEXITCODE -ne 0) { throw ''Settings restore failed'' }

        (Get-FileHash $env:GODOT_CONSOLE_PATH -Algorithm SHA256).Hash | Set-Content .godot/ci/engine-sha256.txt

        & $env:GODOT_CONSOLE_PATH --version | Set-Content .godot/ci/engine-version.txt

        if ($LASTEXITCODE -ne 0) { throw ''Engine version failed'' }

        '
    - name: Correctness / differential
      timeout-minutes: 10
      run: '$ErrorActionPreference=''Stop''

        Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue

        $env:DWM_SCENE_READING_FIXTURE=''1''

        $arguments=@(''-s'',''res://addons/gut/gut_cmdln.gd'',''-gconfig='',''-gtest=res://tests/integration/test_scene_anchor_algorithm.gd'',''-gexit'',''-glog=2'',''-gjunit_xml_file=res://.godot/ci/anchor-differential.xml'')

        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''anchor-differential'' -LogName ''anchor-differential.log'' -EvidenceLogPath
        ''.godot/ci/anchor-differential.jsonl'' -TimeoutSeconds 480 -GodotArgs $arguments

        if ($LASTEXITCODE -ne 0) { throw ''Suite differential failed'' }

        $log=''.godot/phase2r_logs/anchor-differential.log''

        if (Select-String $log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character'' -Quiet)
        { throw ''Strict suite log gate failed'' }

        [xml]$xml=Get-Content ''.godot/ci/anchor-differential.xml'' -Raw

        if ($xml.SelectNodes(''//failure | //error | //skipped'').Count -ne 0) { throw ''Failed or skipped cases'' }

        foreach ($case in $xml.SelectNodes(''//testcase'')) { if ([int]$case.GetAttribute(''assertions'') -le 0 -or $case.GetAttribute(''status'')
        -ne ''pass'' -or $case.GetAttribute(''classname'') -ne ''tests/integration/test_scene_anchor_algorithm.gd'') { throw
        ''Nonpassing or vacuous test case'' } }

        $expected=@(''test_current_and_historical_occurrences_match_original'',''test_missing_and_mismatched_anchor_fields_match_original'',''test_late_duplicate_conflict_and_malformed_rows_still_refuse_before_membership'',''test_multiple_faults_preserve_first_refusal'',''test_repeated_invocation_does_not_reuse_prior_checkpoint_or_verdict'')

        $actual=@($xml.SelectNodes(''//testcase'') | ForEach-Object { $_.GetAttribute(''name'') })

        if ($actual.Count -ne $expected.Count -or (Compare-Object ($actual | Sort-Object) ($expected | Sort-Object))) { throw
        ''Exact test census mismatch'' }

        Write-Host ''ANCHOR_DIFFERENTIAL_VERIFIED cases=5''

        '
    - name: Correctness / ledger
      timeout-minutes: 10
      run: '$ErrorActionPreference=''Stop''

        Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue

        $arguments=@(''-s'',''res://addons/gut/gut_cmdln.gd'',''-gconfig='',''-gtest=res://tests/unit/test_narrative_caption_ledger.gd'',''-gexit'',''-glog=2'',''-gjunit_xml_file=res://.godot/ci/anchor-ledger.xml'')

        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''anchor-ledger'' -LogName ''anchor-ledger.log'' -EvidenceLogPath
        ''.godot/ci/anchor-ledger.jsonl'' -TimeoutSeconds 480 -GodotArgs $arguments

        if ($LASTEXITCODE -ne 0) { throw ''Suite ledger failed'' }

        $log=''.godot/phase2r_logs/anchor-ledger.log''

        if (Select-String $log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character'' -Quiet)
        { throw ''Strict suite log gate failed'' }

        [xml]$xml=Get-Content ''.godot/ci/anchor-ledger.xml'' -Raw

        if ($xml.SelectNodes(''//failure | //error | //skipped'').Count -ne 0) { throw ''Failed or skipped cases'' }

        foreach ($case in $xml.SelectNodes(''//testcase'')) { if ([int]$case.GetAttribute(''assertions'') -le 0 -or $case.GetAttribute(''status'')
        -ne ''pass'' -or $case.GetAttribute(''classname'') -ne ''tests/unit/test_narrative_caption_ledger.gd'') { throw ''Nonpassing
        or vacuous test case'' } }

        $expected=@(''test_scene_revisit_and_loop_retain_publications_and_exact_live_duplicates'',''test_scene_requires_explicit_occurrence_and_immutable_exact_frame'',''test_scene_restore_rejects_duplicate_rows_and_noncanonical_keys_atomically'',''test_scene_snapshot_cannot_downgrade_or_accept_foreign_row_occurrence'',''test_actual_publication_order_is_independent_of_registry_order'',''test_same_publication_is_idempotent_but_a_new_occurrence_is_retained'',''test_conflicting_publication_refuses_without_changing_the_sequence'',''test_foreign_token_unknown_line_and_foreign_owner_apply_zero_mutation'',''test_inputs_and_returned_snapshots_are_recursively_detached'',''test_initialized_session_cannot_be_rebound_or_recaptured'',''test_registry_requires_explicit_unique_identity_and_declared_entry_membership'',''test_nonprimitive_context_and_signature_are_refused_before_any_session_install'',''test_uninitialized_ledger_and_empty_publication_identity_are_refused'',''test_entry_context_admission_is_causal_immutable_and_detached'',''test_framed_reconstruction_validates_all_contexts_and_occurrences_before_installing'',''test_original_unframed_snapshot_and_restore_contract_remains_available'')

        $actual=@($xml.SelectNodes(''//testcase'') | ForEach-Object { $_.GetAttribute(''name'') })

        if ($actual.Count -ne $expected.Count -or (Compare-Object ($actual | Sort-Object) ($expected | Sort-Object))) { throw
        ''Exact test census mismatch'' }

        Write-Host ''ANCHOR_LEDGER_VERIFIED cases=16''

        '
    - name: Correctness / saved-anchor
      timeout-minutes: 10
      run: '$ErrorActionPreference=''Stop''

        Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue

        $arguments=@(''-s'',''res://addons/gut/gut_cmdln.gd'',''-gconfig='',''-gtest=res://tests/integration/test_scene_saved_event_anchor.gd'',''-gexit'',''-glog=2'',''-gjunit_xml_file=res://.godot/ci/anchor-saved-anchor.xml'')

        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''anchor-saved-anchor'' -LogName ''anchor-saved-anchor.log'' -EvidenceLogPath
        ''.godot/ci/anchor-saved-anchor.jsonl'' -TimeoutSeconds 480 -GodotArgs $arguments

        if ($LASTEXITCODE -ne 0) { throw ''Suite saved-anchor failed'' }

        $log=''.godot/phase2r_logs/anchor-saved-anchor.log''

        if (Select-String $log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character'' -Quiet)
        { throw ''Strict suite log gate failed'' }

        [xml]$xml=Get-Content ''.godot/ci/anchor-saved-anchor.xml'' -Raw

        if ($xml.SelectNodes(''//failure | //error | //skipped'').Count -ne 0) { throw ''Failed or skipped cases'' }

        foreach ($case in $xml.SelectNodes(''//testcase'')) { if ([int]$case.GetAttribute(''assertions'') -le 0 -or $case.GetAttribute(''status'')
        -ne ''pass'' -or $case.GetAttribute(''classname'') -ne ''tests/integration/test_scene_saved_event_anchor.gd'') { throw
        ''Nonpassing or vacuous test case'' } }

        $expected=@(''test_real_issuer_profile_reading_and_storage_pass_full_run_and_save_apis'',''test_rebuilt_authenticated_absent_publication_fails_full_run_and_save_anchor_join'',''test_rebuilt_authenticated_wrong_catalogue_fails_full_run_and_save_anchor_join'',''test_other_occurrence_anchor_is_refused_by_authenticated_source_binding'',''test_warm_scene_splice_preserves_history_and_admits_exact_document_proofs'',''test_scene_splice_still_refuses_missing_or_substituted_history_proofs'',''test_legacy_splice_normalization_keeps_empty_history_shortcut_and_cold_path'')

        $actual=@($xml.SelectNodes(''//testcase'') | ForEach-Object { $_.GetAttribute(''name'') })

        if ($actual.Count -ne $expected.Count -or (Compare-Object ($actual | Sort-Object) ($expected | Sort-Object))) { throw
        ''Exact test census mismatch'' }

        Write-Host ''ANCHOR_SAVED-ANCHOR_VERIFIED cases=7''

        '
    - name: Correctness / receipt
      timeout-minutes: 10
      run: '$ErrorActionPreference=''Stop''

        Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue

        $arguments=@(''-s'',''res://addons/gut/gut_cmdln.gd'',''-gconfig='',''-gtest=res://tests/unit/test_scene_receipt_validation.gd'',''-gexit'',''-glog=2'',''-gjunit_xml_file=res://.godot/ci/anchor-receipt.xml'')

        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''anchor-receipt'' -LogName ''anchor-receipt.log'' -EvidenceLogPath
        ''.godot/ci/anchor-receipt.jsonl'' -TimeoutSeconds 480 -GodotArgs $arguments

        if ($LASTEXITCODE -ne 0) { throw ''Suite receipt failed'' }

        $log=''.godot/phase2r_logs/anchor-receipt.log''

        if (Select-String $log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character'' -Quiet)
        { throw ''Strict suite log gate failed'' }

        [xml]$xml=Get-Content ''.godot/ci/anchor-receipt.xml'' -Raw

        if ($xml.SelectNodes(''//failure | //error | //skipped'').Count -ne 0) { throw ''Failed or skipped cases'' }

        foreach ($case in $xml.SelectNodes(''//testcase'')) { if ([int]$case.GetAttribute(''assertions'') -le 0 -or $case.GetAttribute(''status'')
        -ne ''pass'' -or $case.GetAttribute(''classname'') -ne ''tests/unit/test_scene_receipt_validation.gd'') { throw ''Nonpassing
        or vacuous test case'' } }

        $expected=@(''test_registered_issuer_receipt_and_completion_child_rebuild_exactly'',''test_unissued_command_and_completion_child_forgery_refuse'',''test_shape_scalar_version_registration_and_result_tampering_refuse'',''test_hole_predecessor_and_unknown_receipt_family_refuse'',''test_legacy_partitions_remain_explicit_and_unknown_or_extended_members_refuse'',''test_admission_has_real_root_and_exact_child_bound_request'',''test_second_root_and_missing_admission_refuse_without_guessing_lineage'',''test_triggered_admission_reuses_accepted_transition_and_refuses_changed_preimage'',''test_notification_result_is_exact_and_clear_requires_retained_set'')

        $actual=@($xml.SelectNodes(''//testcase'') | ForEach-Object { $_.GetAttribute(''name'') })

        if ($actual.Count -ne $expected.Count -or (Compare-Object ($actual | Sort-Object) ($expected | Sort-Object))) { throw
        ''Exact test census mismatch'' }

        Write-Host ''ANCHOR_RECEIPT_VERIFIED cases=9''

        '
    - name: Correctness / terminal
      timeout-minutes: 10
      run: '$ErrorActionPreference=''Stop''

        Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue

        $arguments=@(''-s'',''res://addons/gut/gut_cmdln.gd'',''-gconfig='',''-gtest=res://tests/unit/test_scene_terminal_lifecycle.gd'',''-gexit'',''-glog=2'',''-gjunit_xml_file=res://.godot/ci/anchor-terminal.xml'')

        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''anchor-terminal'' -LogName ''anchor-terminal.log'' -EvidenceLogPath
        ''.godot/ci/anchor-terminal.jsonl'' -TimeoutSeconds 480 -GodotArgs $arguments

        if ($LASTEXITCODE -ne 0) { throw ''Suite terminal failed'' }

        $log=''.godot/phase2r_logs/anchor-terminal.log''

        if (Select-String $log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character'' -Quiet)
        { throw ''Strict suite log gate failed'' }

        [xml]$xml=Get-Content ''.godot/ci/anchor-terminal.xml'' -Raw

        if ($xml.SelectNodes(''//failure | //error | //skipped'').Count -ne 0) { throw ''Failed or skipped cases'' }

        foreach ($case in $xml.SelectNodes(''//testcase'')) { if ([int]$case.GetAttribute(''assertions'') -le 0 -or $case.GetAttribute(''status'')
        -ne ''pass'' -or $case.GetAttribute(''classname'') -ne ''tests/unit/test_scene_terminal_lifecycle.gd'') { throw ''Nonpassing
        or vacuous test case'' } }

        $expected=@(''test_authenticated_terminal_roundtrip_retains_source_without_legacy_day'',''test_terminal_tampering_stale_source_and_ordinary_admission_are_refused'',''test_physical_completion_and_gallery_are_ordered_and_persisted'',''test_delayed_duplicate_admission_preserves_ending_reader_and_completed_run'',''test_terminal_route_waits_for_transaction_then_rejects_replaced_session'')

        $actual=@($xml.SelectNodes(''//testcase'') | ForEach-Object { $_.GetAttribute(''name'') })

        if ($actual.Count -ne $expected.Count -or (Compare-Object ($actual | Sort-Object) ($expected | Sort-Object))) { throw
        ''Exact test census mismatch'' }

        Write-Host ''ANCHOR_TERMINAL_VERIFIED cases=5''

        '
    - name: Benchmark only after clean correctness
      timeout-minutes: 10
      run: '$ErrorActionPreference=''Stop''

        Remove-Item Env:DWM_SCENE_READING_FIXTURE -ErrorAction SilentlyContinue

        $env:DWM_ANCHOR_INPUT_PATH=Join-Path $env:GITHUB_WORKSPACE ''.godot/ci/benchmark-input.json''

        $arguments=@(''-s'',''res://addons/gut/gut_cmdln.gd'',''-gconfig='',''-gtest=res://tests/performance/test_scene_anchor_algorithm_benchmark.gd'',''-gexit'',''-glog=2'',''-gjunit_xml_file=res://.godot/ci/anchor-benchmark.xml'')

        & ./tools/testing/Invoke-IsolatedGodot.ps1 -SuiteId ''anchor-benchmark'' -LogName ''anchor-benchmark.log'' -EvidenceLogPath
        ''.godot/ci/anchor-benchmark.jsonl'' -TimeoutSeconds 480 -GodotArgs $arguments

        if ($LASTEXITCODE -ne 0) { throw ''Suite benchmark failed'' }

        $log=''.godot/phase2r_logs/anchor-benchmark.log''

        if (Select-String $log -Pattern ''SCRIPT ERROR:|^\s*ERROR:|Unicode parsing error|Unexpected NUL character'' -Quiet)
        { throw ''Strict suite log gate failed'' }

        [xml]$xml=Get-Content ''.godot/ci/anchor-benchmark.xml'' -Raw

        if ($xml.SelectNodes(''//failure | //error | //skipped'').Count -ne 0) { throw ''Failed or skipped cases'' }

        foreach ($case in $xml.SelectNodes(''//testcase'')) { if ([int]$case.GetAttribute(''assertions'') -le 0 -or $case.GetAttribute(''status'')
        -ne ''pass'' -or $case.GetAttribute(''classname'') -ne ''tests/performance/test_scene_anchor_algorithm_benchmark.gd'')
        { throw ''Nonpassing or vacuous test case'' } }

        $expected=@(''test_complete_anchor_routine_matched_samples'')

        $actual=@($xml.SelectNodes(''//testcase'') | ForEach-Object { $_.GetAttribute(''name'') })

        if ($actual.Count -ne $expected.Count -or (Compare-Object ($actual | Sort-Object) ($expected | Sort-Object))) { throw
        ''Exact test census mismatch'' }

        Write-Host ''ANCHOR_BENCHMARK_VERIFIED cases=1''

        '
    - name: Retain all outcomes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: anchor-algorithm-${{ github.run_id }}-${{ github.run_attempt }}
        path: '.godot/ci/

          .godot/phase2r_logs/anchor-*.log'
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
