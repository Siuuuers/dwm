name: Hospital original export artifact transport
'on':
  push:
    branches:
    - codex/hospital-export-evidence-20261003
permissions:
  contents: read
  actions: read
concurrency:
  group: hospital-export-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  transport-original-export:
    name: Transport verified original Windows export evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      DWM_EXPORT_TRANSPORT_ROOT: ${{ runner.temp }}/hospital-export-evidence
    steps:
    - name: Download original artifact ZIP with read-only workflow token
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p "$DWM_EXPORT_TRANSPORT_ROOT"

        gh api repos/Siuuuers/dwm/actions/artifacts/11244640103 --jq ''{id,name,size_in_bytes,digest,expired,workflow_run:{id:.workflow_run.id,head_sha:.workflow_run.head_sha}}''
        > "$DWM_EXPORT_TRANSPORT_ROOT/source-metadata.json"

        gh api repos/Siuuuers/dwm/actions/artifacts/11244640103/zip > "$DWM_EXPORT_TRANSPORT_ROOT/original.zip"

        '
    - name: Verify original identity and CRC, split raw bytes, and verify reassembly
      run: "set -euo pipefail\npython3 - <<'PY'\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport\
        \ zipfile\n\n\ndef require(condition, detail):\n    if not condition:\n        raise ValueError(detail)\n\n\ndef strict_json(text):\n\
        \    def pairs(values):\n        result = {}\n        for key, value in values:\n            require(key not in result,\
        \ 'DUPLICATE_JSON_KEY')\n            result[key] = value\n        return result\n    return json.loads(text, object_pairs_hook=pairs)\n\
        \n\ndef sha256(path):\n    with path.open('rb') as stream:\n        return hashlib.file_digest(stream, 'sha256').hexdigest()\n\
        \n\ndef verify_split(archive, metadata, destination, expected, chunk_bytes, transport):\n    require(metadata.get('id')\
        \ == expected['artifact_id'], 'SOURCE_ARTIFACT_ID_MISMATCH')\n    require(metadata.get('expired') is False, 'SOURCE_ARTIFACT_EXPIRED')\n\
        \    require(metadata.get('size_in_bytes') == expected['size_in_bytes'], 'SOURCE_API_SIZE_MISMATCH')\n    require(metadata.get('digest')\
        \ == 'sha256:' + expected['sha256'], 'SOURCE_API_DIGEST_MISMATCH')\n    source_run = metadata.get('workflow_run',\
        \ {})\n    require(source_run.get('id') == expected['run_id'], 'SOURCE_RUN_MISMATCH')\n    require(source_run.get('head_sha')\
        \ == expected['workflow_head'], 'SOURCE_WORKFLOW_HEAD_MISMATCH')\n    require(isinstance(metadata.get('name'), str)\
        \ and bool(metadata['name']), 'SOURCE_ARTIFACT_NAME_REQUIRED')\n    require(archive.is_file() and not archive.is_symlink(),\
        \ 'ORIGINAL_ZIP_REQUIRED')\n    require(archive.stat().st_size == expected['size_in_bytes'], 'ORIGINAL_ZIP_SIZE_MISMATCH')\n\
        \    require(sha256(archive) == expected['sha256'], 'ORIGINAL_ZIP_SHA256_MISMATCH')\n    require(type(chunk_bytes)\
        \ is int and 0 < chunk_bytes <= 25 * 1024 * 1024, 'BOUNDED_CHUNK_SIZE_REQUIRED')\n    with zipfile.ZipFile(archive)\
        \ as opened:\n        require(bool(opened.infolist()), 'EMPTY_ORIGINAL_ZIP')\n        require(opened.testzip() is\
        \ None, 'ORIGINAL_ZIP_CRC_MISMATCH')\n        member_count = len(opened.infolist())\n    # No chunk exists until metadata,\
        \ original bytes and every member CRC pass.\n    require(not destination.exists(), 'REFUSE_EXISTING_TRANSPORT_OUTPUT')\n\
        \    destination.mkdir(parents=True)\n    chunks = []\n    with archive.open('rb') as stream:\n        offset = 0\n\
        \        for index in range(1, (expected['size_in_bytes'] + chunk_bytes - 1) // chunk_bytes + 1):\n            data\
        \ = stream.read(chunk_bytes)\n            require(bool(data), 'UNEXPECTED_SHORT_ARCHIVE')\n            name = f'original.zip.part{index:03d}'\n\
        \            path = destination / name\n            with path.open('xb') as output:\n                output.write(data)\n\
        \            chunks.append({'index': index, 'file': name, 'offset': offset,\n                           'bytes': len(data),\
        \ 'sha256': hashlib.sha256(data).hexdigest()})\n            offset += len(data)\n        require(stream.read(1) ==\
        \ b'' and offset == expected['size_in_bytes'], 'SPLIT_BYTE_COUNT_MISMATCH')\n    # Independently stream all written\
        \ chunk files in order; never replace/repack ZIP.\n    combined = hashlib.sha256()\n    combined_bytes = 0\n    for\
        \ chunk in chunks:\n        path = destination / chunk['file']\n        require(path.stat().st_size == chunk['bytes']\
        \ and sha256(path) == chunk['sha256'], 'WRITTEN_CHUNK_MISMATCH')\n        with path.open('rb') as stream:\n      \
        \      while data := stream.read(1024 * 1024):\n                combined.update(data)\n                combined_bytes\
        \ += len(data)\n    require(combined_bytes == expected['size_in_bytes'] and combined.hexdigest() == expected['sha256'],\n\
        \            'REASSEMBLED_ORIGINAL_IDENTITY_MISMATCH')\n    manifest = {\n        'schema_version': 1,\n        'purpose':\
        \ 'Exact original GitHub artifact ZIP transport; no engine execution or evidence reinterpretation.',\n        'source_artifact':\
        \ {\n            'repository': expected['repository'], 'id': metadata['id'], 'name': metadata['name'],\n         \
        \   'size_in_bytes': metadata['size_in_bytes'], 'digest': metadata['digest'],\n            'run_id': source_run['id'],\
        \ 'workflow_head': source_run['head_sha'],\n        },\n        'original_zip': {'bytes': expected['size_in_bytes'],\
        \ 'sha256': expected['sha256'],\n                         'crc_verified': True, 'member_count': member_count},\n \
        \       'chunk_size_limit': chunk_bytes, 'chunk_count': len(chunks), 'chunks': chunks,\n        'ordered_chunk_reassembly_matches_original':\
        \ True,\n        'transport_execution': transport,\n        'reassembly': 'Concatenate raw chunk contents in ascending\
        \ index, verify each chunk and final original size/SHA256, then verify original ZIP CRC before normal extraction/audit.',\n\
        \        'limits': ['Transport success is not original workflow or exported-build acceptance.',\n                \
        \   'Uploaded chunk artifacts are wrappers; use their extracted raw part files for original ZIP reconstruction.'],\n\
        \    }\n    manifest_path = destination / 'transport-manifest.json'\n    manifest_path.write_text(json.dumps(manifest,\
        \ indent=2) + '\\n', encoding='utf-8')\n    require(strict_json(manifest_path.read_text(encoding='utf-8')) == manifest,\
        \ 'MANIFEST_JSON_ROUNDTRIP_MISMATCH')\n    return manifest\n\n\nif __name__ == '__main__':\n    expected = {'repository':\
        \ 'Siuuuers/dwm', 'artifact_id': 11244640103, 'size_in_bytes': 98850774, 'sha256': 'e2739823bc11ab4a336072c1a437af8711f54c3dee248a6e388b42c6947d8cc9',\
        \ 'run_id': 37044894986, 'workflow_head': '1bc4f6afd759e969f82b9c2134eb178479c19d13'}\n    root = Path(os.environ['DWM_EXPORT_TRANSPORT_ROOT'])\n\
        \    metadata = strict_json((root / 'source-metadata.json').read_text(encoding='utf-8'))\n    transport = {key: os.environ.get(key,\
        \ '') for key in\n                 ('GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SHA', 'GITHUB_JOB')}\n\
        \    manifest = verify_split(root / 'original.zip', metadata, root / 'parts', expected, 26214400, transport)\n   \
        \ require(manifest['chunk_count'] == 4, 'EXPECTED_EXACTLY_FOUR_CHUNKS')\n    print(json.dumps({'original_sha256':\
        \ manifest['original_zip']['sha256'],\n                      'original_bytes': manifest['original_zip']['bytes'],\n\
        \                      'chunk_count': manifest['chunk_count'], 'crc_verified': True,\n                      'reassembly_verified':\
        \ True}))\nPY\n"
    - name: Upload original ZIP raw chunk 001
      uses: actions/upload-artifact@v4
      with:
        name: hospital-export-original-part001-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hospital-export-evidence/parts/original.zip.part001
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload original ZIP raw chunk 002
      uses: actions/upload-artifact@v4
      with:
        name: hospital-export-original-part002-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hospital-export-evidence/parts/original.zip.part002
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload original ZIP raw chunk 003
      uses: actions/upload-artifact@v4
      with:
        name: hospital-export-original-part003-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hospital-export-evidence/parts/original.zip.part003
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload original ZIP raw chunk 004
      uses: actions/upload-artifact@v4
      with:
        name: hospital-export-original-part004-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hospital-export-evidence/parts/original.zip.part004
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
    - name: Upload verified original and chunk identity manifest
      uses: actions/upload-artifact@v4
      with:
        name: hospital-export-transport-manifest-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/hospital-export-evidence/parts/transport-manifest.json
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
